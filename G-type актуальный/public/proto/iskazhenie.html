  const p=env.p,fx=env.fx,fl=flatGlyph(env.font,g.ch);
  let polys=clone(fl.polys);
  const seedG=env.mode==='letter'?(env.same?hash(env.seed,g.ch.codePointAt(0)):hash(env.seed,g.idx*7919+1)):env.seed;
  if(off)return place(polys,g,0);
  /* положение: ширина/высота от нулевой точки знака, наклон, поворот-разброс */
  const sx=p.sx/100,sy=p.sy/100,tn=Math.tan(-p.slant*Math.PI/180);
  for(const P of polys)for(const q of P){q[0]*=sx;q[1]*=sy;q[0]+=q[1]*tn;}
  if(p.jit>0&&env.mode==='letter'){const bb=bbox(polys),cx=(bb[0]+bb[2])/2,cy=(bb[1]+bb[3])/2,a=(rnd(seedG,5)*2-1)*p.jit*Math.PI/180,c=Math.cos(a),s=Math.sin(a);
    for(const P of polys)for(const q of P){const dx=q[0]-cx,dy=q[1]-cy;q[0]=cx+dx*c-dy*s;q[1]=cy+dx*s+dy*c;}}
  polys=place(polys,g,sx);
  const warp=fx.twist||fx.lens||fx.wave||fx.noise;
  if(fx.spikes)polys=polys.map(P=>uniform(P,p.spikeP/2));
  else if(warp)polys=polys.map(P=>densify(P,14));
  /* поле: весь текст — координаты текста, по буквам — координаты знака */
  let cx,cy,Rbase,ox=0,oy=0;
  if(env.mode==='letter'){const bb=bbox(polys);cx=(bb[0]+bb[2])/2;cy=(bb[1]+bb[3])/2;Rbase=Math.hypot(bb[2]-bb[0],bb[3]-bb[1])*.62;ox=cx;oy=cy;}
  else{cx=env.cx;cy=env.cy;Rbase=Math.hypot(env.W,env.H)*.45;}
  if(fx.twist){const R=Rbase*p.twistR/100,th=p.twist/100*1.4;
    for(const P of polys)for(const q of P){const dx=q[0]-cx,dy=q[1]-cy,r=Math.hypot(dx,dy);if(r>=R)continue;const f=1-r/R,a=th*f*f,c=Math.cos(a),s=Math.sin(a);q[0]=cx+dx*c-dy*s;q[1]=cy+dx*s+dy*c;}}
  if(fx.lens){const R=Rbase*p.lensR/100,k=p.lens/100*.6;
    for(const P of polys)for(const q of P){const dx=q[0]-cx,dy=q[1]-cy,r=Math.hypot(dx,dy);if(r>=R||r<1e-6)continue;const t=r/R,f=1+k*(1-t*t);q[0]=cx+dx*f;q[1]=cy+dy*f;}}
  if(fx.wave){const A=p.wave/100*70,L=p.waveL,ang=p.waveD*Math.PI/180,tx=Math.cos(ang),ty=Math.sin(ang),phi=env.mode==='letter'?rnd(seedG,11)*6.283:rnd(env.seed,3)*6.283;
    for(const P of polys)for(const q of P){const u=((q[0]-ox)*tx+(q[1]-oy)*ty);const d=A*Math.sin(6.2832*u/L+phi);q[0]+=-ty*d;q[1]+=tx*d;}}
  if(fx.noise){const A=p.noise/100*45,Sx=p.noiseS,s1=hash(seedG,21),s2=hash(seedG,22);
    for(const P of polys)for(const q of P){const u=(q[0]-ox)/Sx,v=(q[1]-oy)/Sx;q[0]+=A*vnoise(u,v,s1);q[1]+=A*vnoise(u,v,s2);}}
  if(fx.spikes){const A=p.spikes/100*80;
    polys=polys.map((P,pi)=>{const n=P.length,o=new Array(n);
      for(let i=0;i<n;i++){const a=P[(i+n-1)%n],b=P[(i+1)%n],tx=b[0]-a[0],ty=b[1]-a[1],l=Math.hypot(tx,ty)||1,nx=ty/l,ny=-tx/l;
        const k=(i%2===1)?A*(.55+.45*rnd(seedG,pi*1000+i)):-A*.12;o[i]=[P[i][0]+nx*k,P[i][1]+ny*k];}
      return o;});}
  if(fx.slice){const N=Math.round(p.sliceN),A=p.slice/100*110;
    let yA,yB;if(env.mode==='letter'){yA=-60;yB=780;}else{yA=-(env.L.nl-1)*env.L.lineH-100;yB=800;}
    const h=(yB-yA)/N,out=[];
    for(let k=0;k<N;k++){const y0=k===0?-Infinity:yA+k*h,y1=k===N-1?Infinity:yA+(k+1)*h;
      const sh=(rnd(seedG,100+k)*2-1)*A;
      for(const P of polys){const c=clipBand(P,y0,y1);if(c)out.push(c.map(q=>[q[0]+sh,q[1]]));}}
    polys=out;}
  if(fx.pix&&p.pix>0)polys=pixelate(polys,cellOf(p.pix),env.mode==='letter'?g.x:0);
  return polys;
}
function place(polys,g,sx){for(const P of polys)for(const q of P){q[0]+=g.x;q[1]+=g.y;}return polys;}
function pixelate(polys,cell,xo){
  const bb=bbox(polys);if(!bb)return polys;
  const out=[],gx0=xo+Math.floor((bb[0]-xo)/cell)*cell,gy0=Math.floor(bb[1]/cell)*cell;
  for(let y=gy0;y<bb[3];y+=cell){const yc=y+cell/2,xs=[];
    for(const P of polys)for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length];if((a[1]<=yc)!==(b[1]<=yc))xs.push(a[0]+(yc-a[1])/(b[1]-a[1])*(b[0]-a[0]));}
    xs.sort((m,n)=>m-n);
    let run=null;
    const cells=Math.ceil((bb[2]-gx0)/cell);
    for(let c=0;c<cells;c++){const xc=gx0+c*cell+cell/2;let inside=false;for(let k=0;k+1<xs.length;k+=2)if(xc>=xs[k]&&xc<xs[k+1]){inside=true;break;}
      if(inside){if(!run)run=[c,c];else run[1]=c;}else if(run){out.push([[gx0+run[0]*cell,y],[gx0+(run[1]+1)*cell,y],[gx0+(run[1]+1)*cell,y+cell],[gx0+run[0]*cell,y+cell]]);run=null;}}
    if(run)out.push([[gx0+run[0]*cell,y],[gx0+(run[1]+1)*cell,y],[gx0+(run[1]+1)*cell,y+cell],[gx0+run[0]*cell,y+cell]]);}
  return out;
}

/* ---------- проверки: пересечения контуров и оценка узлов после подгонки кривых ---------- */
function rdpOpen(P,eps){const n=P.length;if(n<3)return P;
  const keep=new Uint8Array(n);keep[0]=1;keep[n-1]=1;const st=[[0,n-1]];
  while(st.length){const [a,b]=st.pop();let md=0,mi=-1;const A=P[a],B=P[b],dx=B[0]-A[0],dy=B[1]-A[1],l=Math.hypot(dx,dy)||1e-9;
    for(let i=a+1;i<b;i++){const d=Math.abs((P[i][0]-A[0])*dy-(P[i][1]-A[1])*dx)/l;if(d>md){md=d;mi=i;}}
    if(md>eps&&mi>0){keep[mi]=1;st.push([a,mi],[mi,b]);}}
  const o=[];for(let i=0;i<n;i++)if(keep[i])o.push(P[i]);return o;}
/* замкнутый контур: делим в самой дальней от первой точке, затем упрощаем обе половины */
function rdp(P,eps){const n=P.length;if(n<5)return P.concat([P[0]]);
  let k=0,md=-1;for(let i=1;i<n;i++){const d=Math.hypot(P[i][0]-P[0][0],P[i][1]-P[0][1]);if(d>md){md=d;k=i;}}
  const a=rdpOpen(P.slice(0,k+1),eps),b=rdpOpen(P.slice(k).concat([P[0]]),eps);
  return a.concat(b.slice(1));}
function crossings(polys){const E=[];for(let pi=0;pi<polys.length;pi++){const P=polys[pi];for(let i=0;i<P.length;i++)E.push([P[i],P[(i+1)%P.length],pi,i,P.length]);}
  let c=0;const n=E.length;if(n>1400)return -1;
  for(let i=0;i<n;i++){const [a,b,pi,ii,L]=E[i];for(let j=i+1;j<n;j++){const [p,q,pj,jj,M]=E[j];
    if(pi===pj&&(jj===ii+1||(ii===0&&jj===L-1)))continue;
    const d1=(b[0]-a[0])*(p[1]-a[1])-(b[1]-a[1])*(p[0]-a[0]),d2=(b[0]-a[0])*(q[1]-a[1])-(b[1]-a[1])*(q[0]-a[0]),d3=(q[0]-p[0])*(a[1]-p[1])-(q[1]-p[1])*(a[0]-p[0]),d4=(q[0]-p[0])*(b[1]-p[1])-(q[1]-p[1])*(b[0]-p[0]);
    if(((d1>0)!==(d2>0))&&((d3>0)!==(d4>0)))c++;}}
  return c;}

/* ---------- отрисовка ---------- */
const cv=$('#cv'),ctx=cv.getContext('2d'),cvw=$('#cvw');
let cw=600,ch=400,dpr=1;
function fit(){const r=cvw.getBoundingClientRect();dpr=Math.min(3,window.devicePixelRatio||1);cw=Math.max(100,Math.round(r.width));ch=Math.max(100,Math.round(r.height));cv.width=cw*dpr;cv.height=ch*dpr;}
function envNow(){
  const fx={};FX.forEach(f=>fx[f.id]=S.p[f.id]!==0);
  const L=glyphList(S.text,S.font);
  return {p:S.p,fx,font:S.font,mode:S.mode,same:S.same,seed:S.seed,W:L.W,H:L.H,cx:L.W/2,cy:-(L.nl-1)*L.lineH/2+350,L};
}
function render(final){
  const t0=performance.now();
  const env=envNow(),L=env.L,off=S.view==='before';
  const css=getComputedStyle(document.documentElement);
  const ink=css.getPropertyValue('--glyph').trim()||'#000',guide=css.getPropertyValue('--cv-line').trim()||'#ddd',mut=css.getPropertyValue('--cv-muted').trim()||'#666';
  const all=[];let nodes=0,maxN=0,cross=0,crossSkip=false;const simp=[];
  for(const g of L.res){const polys=buildGlyph(g,env,off);all.push(polys);}
  /* масштаб: по раскладке, уменьшается только если искажённый контур выходит за поля */
  const pad=Math.max(18,Math.min(cw,ch)*.07);
  const lay={x0:0,x1:L.W,y0:-(L.nl-1)*L.lineH-90,y1:800};
  const lcx=env.cx,lcy=env.cy;
  let sc=Math.min((cw-2*pad)/Math.max(1,L.W),(ch-2*pad)/Math.max(1,(lay.y1-lay.y0)));
  let ex=1e-9,ey=1e-9;for(const polys of all)for(const P of polys)for(const q of P){ex=Math.max(ex,Math.abs(q[0]-lcx));ey=Math.max(ey,Math.abs(q[1]-lcy));}
  sc=Math.min(sc,(cw/2-pad)/ex,(ch/2-pad)/ey);
  const X=x=>cw/2+(x-lcx)*sc,Y=y=>ch/2-(y-lcy)*sc;
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,cw,ch);
  ctx.strokeStyle=guide;ctx.lineWidth=1;
  for(let li=0;li<L.nl;li++){const y=Y(-li*L.lineH);ctx.beginPath();ctx.moveTo(pad*.5,Math.round(y)+.5);ctx.lineTo(cw-pad*.5,Math.round(y)+.5);ctx.stroke();}
  ctx.fillStyle=ink;ctx.beginPath();
  for(const polys of all)for(const P of polys){ctx.moveTo(X(P[0][0]),Y(P[0][1]));for(let i=1;i<P.length;i++)ctx.lineTo(X(P[i][0]),Y(P[i][1]));ctx.closePath();}
  ctx.fill('nonzero');
  lastStats={ex:ex*sc,ey:ey*sc,cw,ch,pad,sc,glyphs:L.res.length};
  if(final){
    for(const polys of all){let n=0;for(const P of polys){const s=rdp(P,2.5);const m=Math.max(3,s.length-1);n+=m;if(S.nodes)simp.push(s);}
      nodes+=n;maxN=Math.max(maxN,n);
      if(!off&&!S.p.pix){const c=crossings(polys);if(c<0)crossSkip=true;else cross+=c;}}
    if(S.nodes&&!off){ctx.fillStyle=mut;for(const s of simp)for(let i=0;i<s.length-1;i++){const x=X(s[i][0]),y=Y(s[i][1]);ctx.fillRect(x-2,y-2,4,4);}}
  }
  const ms=Math.round(performance.now()-t0);
  if(final)stat({n:L.res.length,nodes,maxN,cross,crossSkip,ms,off});
}
function stat(o){
  const el=$('#stat');const lim=600;
  const fmt=n=>n.toLocaleString('ru-RU');
  let h='<span class="chip">Знаков: '+o.n+'</span>';
  if(o.off)h+='<span class="chip">Исходный шрифт</span>';
  h+='<span class="chip'+(o.maxN>lim?' warn':'')+'" title="Оценка после подгонки кривых">Узлов ≈ '+fmt(o.nodes)+(o.maxN?', максимум '+o.maxN+' на знак (лимит '+lim+')':'')+'</span>';
  if(S.p.pix&&!o.off)h+='<span class="chip ok">Только прямые углы: безопасно</span>';
  else if(o.crossSkip)h+='<span class="chip warn">Контуров слишком много для проверки</span>';
  else if(o.cross===0)h+='<span class="chip ok">Контуры целы</span>';
  else h+='<span class="chip warn" title="При сборке шрифта пересечения склеиваются в один контур (union)">Пересечений: '+o.cross+', склеим при сборке</span>';
  h+='<span class="chip">Пересчёт '+o.ms+' мс</span>';
  el.innerHTML=h;
}
let tmr=0;
function draw(){render(false);clearTimeout(tmr);tmr=setTimeout(()=>render(true),110);}

/* ---------- интерфейс ---------- */
function mkSlider(def,parent,cls){
  const d=document.createElement('div');d.className='ctl'+(cls?' '+cls:'');d.dataset.id=def.id;
  d.innerHTML='<label for="r-'+def.id+'"><span>'+def.name+'</span><output></output></label><input type="range" id="r-'+def.id+'" min="'+def.min+'" max="'+def.max+'" step="1">';
  parent.appendChild(d);
  const inp=d.querySelector('input'),out=d.querySelector('output');
  inp.addEventListener('input',()=>{S.p[def.id]=+inp.value;sync();draw();});
  inp.addEventListener('change',()=>push());
  return d;
}
const subs={};
function build(){
  const sp=$('#s-pos'),sf=$('#s-fx');
  for(const p of POS){const d=mkSlider(p,sp);if(p.letter)d.dataset.letter='1';}
  for(const f of FX){const w=document.createElement('div');w.style.cssText='display:flex;flex-direction:column;gap:6px';sf.appendChild(w);mkSlider(f,w);
    subs[f.id]=f.sub.map(s=>mkSlider(s,w,'sub'));}
  $('#font').innerHTML=FONTS.map(f=>'<option value="'+f.id+'">'+f.label+'</option>').join('');
  $('#presets').innerHTML=PRESETS.map((p,i)=>'<button type="button" class="chip" data-i="'+i+'">'+p.n+'</button>').join('');
  $('#tchips').innerHTML=TEXTS.map(t=>'<button type="button" class="chip sm" data-t="'+t+'">'+t+'</button>').join('');
}
function setRange(d,def,v){const inp=d.querySelector('input');inp.value=v;const lo=def.min<0?Math.min(50,(v-def.min)/(def.max-def.min)*100):0,hi=(v-def.min)/(def.max-def.min)*100;
  const a=def.min<0?Math.min(50,hi):0,b=def.min<0?Math.max(50,hi):hi;inp.style.setProperty('--lo',a+'%');inp.style.setProperty('--hi',b+'%');
  d.querySelector('output').textContent=def.fmt(v);d.classList.toggle('act',v!==def.def);}
function sync(){
  const letter=S.mode==='letter';
  for(const p of ALLP){const d=document.querySelector('.ctl[data-id="'+p.id+'"]');if(!d)continue;setRange(d,p,S.p[p.id]);}
  for(const f of FX)for(const d of subs[f.id]){d.hidden=S.p[f.id]===0;d.style.display=S.p[f.id]===0?'none':'';}
  document.querySelector('.ctl[data-letter]').style.display=letter?'':'none';
  $('#samebox').hidden=!letter;
  $('#modehint').textContent=letter?'У каждой буквы свой узор. Одинаковые буквы можно сделать одинаковыми или разными (в шрифте это варианты calt).':'Одно общее поле на весь текст: волна, вихрь и срез идут через все буквы, как на одном листе.';
  $('#font').value=S.font;$('#text').value=S.text;$('#seed').value=S.seed;
  for(const [id,v] of [['seg-ba',S.view],['seg-mode',S.mode],['seg-same',String(S.same)]])document.querySelectorAll('#'+id+' button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  $('#nodes').classList.toggle('on',S.nodes);$('#nodes').setAttribute('aria-pressed',S.nodes);
  const have=[...new Set(Object.keys(OUT[S.font].gl))].join(' ');
  $('#chars').textContent='В демо есть буквы: '+have+'. Остальные пропускаются.';
}
function snap(){return JSON.stringify({font:S.font,text:S.text,mode:S.mode,same:S.same,seed:S.seed,p:S.p});}
function push(){const s=snap();if(hist[hist.length-1]!==s){hist.push(s);if(hist.length>60)hist.shift();}$('#undo').disabled=hist.length<2;}
function load(s){const o=JSON.parse(s);Object.assign(S,{font:o.font,text:o.text,mode:o.mode,same:o.same,seed:o.seed,p:o.p});sync();draw();}
function undo(){if(hist.length<2)return;hist.pop();load(hist[hist.length-1]);$('#undo').disabled=hist.length<2;}
function wire(){
  $('#font').addEventListener('change',e=>{S.font=e.target.value;sync();draw();push();});
  $('#text').addEventListener('input',e=>{S.text=e.target.value;draw();$('#chars').dataset.x=1;});
  $('#text').addEventListener('change',()=>push());
  $('#tchips').addEventListener('click',e=>{const t=e.target.closest('[data-t]');if(!t)return;S.text=t.dataset.t;sync();draw();push();});
  $('#presets').addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(!b)return;const pr=PRESETS[+b.dataset.i];S.p={...DEF,...pr.p};if(pr.m)S.mode=pr.m;sync();draw();push();});
  $('#seg-mode').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.mode=b.dataset.v;sync();draw();push();});
  $('#seg-same').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.same=+b.dataset.v;sync();draw();push();});
  $('#seg-ba').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.view=b.dataset.v;sync();draw();});
  $('#nodes').addEventListener('click',()=>{S.nodes=!S.nodes;sync();draw();});
  $('#seed').addEventListener('input',e=>{S.seed=Math.max(0,Math.min(9999,+e.target.value|0));draw();});
  $('#seed').addEventListener('change',()=>push());
  $('#reseed').addEventListener('click',()=>{S.seed=Math.floor(Math.random()*9000)+100;sync();draw();push();});
  $('#reset').addEventListener('click',()=>{S.p={...DEF};S.seed=17;sync();draw();push();});
  $('#undo').addEventListener('click',undo);
  $('#apply').addEventListener('click',()=>{const n=$('#applynote');n.hidden=false;n.textContent='В демо шрифт не собирается. В продукте здесь запускается сборка TTF, OTF и WOFF2 с этими настройками: искажение попадает в контуры, у каждого знака свои узлы.';});
  $('#theme').addEventListener('click',()=>{const d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'light':'dark';draw();});
  window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undo();}});
  window.addEventListener('resize',()=>{fit();draw();});
  if(window.ResizeObserver)new ResizeObserver(()=>{fit();draw();}).observe(cvw);
}
build();wire();sync();fit();push();
S.p={...DEF,...PRESETS[7].p};S.mode='letter';sync();draw();push();
window.__demo={S,PRESETS,set(o){Object.assign(S,o);if(o.p)S.p={...DEF,...o.p};sync();draw();render(true);},stats:()=>lastStats,render:()=>render(true)};
})();
</script>
