<!doctype html>
<html lang="ru">
<head>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/design-system/tokens.css">
<link rel="stylesheet" href="/design-system/components/bundle.css">
<link rel="stylesheet" href="/design-system/later.css">
<script>const q=new URLSearchParams(location.search).get("theme"); if(q==="dark"||q==="light") document.documentElement.dataset.theme=q;</script>

<meta charset="utf-8">
<title>Button — превью</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font:400 var(--fs-base)/var(--lh) var(--f-ui);-webkit-font-smoothing:antialiased}
.row{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:center}
.row+.row,.cap+.row,.row+.cap{margin-top:var(--s3)}
.cap{margin:0 0 var(--s2);font:var(--fw-sb) var(--fs-xs)/1.2 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--text-2)}
.row+.cap,.stack+.cap{margin-top:var(--s5)}
.stack{display:grid;gap:var(--s3);max-width:420px}
</style>
</head>
<body>
<p class="cap">Варианты</p>
<div class="row"><button class="btn pri" type="button">Скачать</button><button class="btn ink" type="button">Тёмная</button><button class="btn" type="button">Вторичная</button><button class="btn ghost" type="button">Прозрачная</button><button class="btn danger" type="button">Удалить</button></div>
<p class="cap">Размер и состояния</p>
<div class="row"><button class="btn pri sm" type="button">Малая</button><button class="btn" type="button" disabled>Недоступна</button><button class="btn pri" type="button" style="box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)">Фокус</button><button class="btn pri" type="button"><i class="ico i-download" style="width:18px;height:18px"></i>Скачать .ttf</button></div>
</body>
</html>
