<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Прототип: Искажение в настройках</title>
<style>
  html,body{margin:0;height:100%;background:#efeff1}
  iframe{border:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<iframe id="app" src="/g-type-v96.html" title="G-type"></iframe>
<script>
(function () {
  var frame = document.getElementById("app");
  frame.addEventListener("load", function () { boot(frame.contentWindow, frame.contentDocument); });

  function boot(w, d) {
    var tries = 0;
    var timer = setInterval(function () {
      tries += 1;
      if (tries > 80) { clearInterval(timer); return; }
      if (!w.setTab || !w.dwOpen || !d.getElementById("view-distort") || !d.getElementById("rb-distort") || !d.querySelector("#params .grp")) return;
      clearInterval(timer);
      var skip = d.getElementById("onb-skip");
      if (skip && d.getElementById("onb") && !d.getElementById("onb").hidden) skip.click();
      if (w.S && w.S.tab !== "edit") w.setTab("edit");
      w.dwOpen("edit", "params");
      setTimeout(function () { mount(w, d); }, 400);
    }, 150);
  }

  function mount(w, d) {
    if (d.getElementById("gt-dst-grp")) return;
    var params = d.getElementById("params");
    var side = d.querySelector("#view-distort .dst-side");
    if (!params || !side) return;

    var css = d.createElement("style");
    css.id = "gt-dst-proto";
    css.textContent =
      "#rb-distort{display:none!important}" +
      "#view-distort{position:fixed!important;left:-4000px!important;top:0!important;width:960px;height:480px;display:grid!important;visibility:hidden!important;pointer-events:none!important}" +
      "#gt-dst-grp.shut .gt-dst-body{display:none!important}" +
      "#gt-dst-grp .dst-h{display:none}" +
      "#gt-dst-grp .dst-side{display:flex;flex-direction:column;gap:12px;padding:4px 0 12px;background:transparent;box-shadow:none}" +
      "#gt-dst-grp .dst-art{width:min(168px,70%);aspect-ratio:1303/1416;align-self:center;background:url(\"/art/distort.webp\") center/contain no-repeat}" +
      "#gt-dst-grp .dst-fx{display:flex;flex-wrap:wrap;gap:6px}" +
      "#gt-dst-grp .dst-sec{display:flex;flex-direction:column;gap:8px}" +
      "#gt-dst-grp .dst-sec h3{margin:0;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-2)}" +
      "#gt-dst-grp .dst-sw{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}" +
      "#gt-dst-grp .dst-sw input{accent-color:var(--ink)}" +
      "#gt-dst-grp .dst-ctl{display:flex;flex-direction:column;gap:2px}" +
      "#gt-dst-grp .dst-ctl label{display:flex;justify-content:space-between;gap:8px;font-size:13px}" +
      "#gt-dst-grp .dst-ctl output{font-variant-numeric:tabular-nums;color:var(--text-2)}" +
      "#gt-dst-grp .dst-ctl input[type=range]{width:100%;accent-color:var(--ink)}" +
      "#gt-dst-grp .dst-sub{margin-left:12px;padding-left:12px;border-left:2px solid var(--line)}" +
      "#gt-dst-grp .dst-vars{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}" +
      "#gt-dst-grp .dst-vars canvas{width:100%;background:var(--canvas);border-radius:8px;box-shadow:inset 0 0 0 1px var(--line)}" +
      "#gt-dst-grp .btn.pri-accent{align-self:flex-start;background:var(--accent-press);color:#fff}" +
      "#gt-spec-over,#gt-glyph-over{position:absolute;pointer-events:none;z-index:3}" +
      "#stagebox,#specbox{position:relative}";
    d.head.appendChild(css);

    var grp = d.createElement("div");
    grp.className = "grp shut";
    grp.id = "gt-dst-grp";
    grp.innerHTML = '<h5>Искажение</h5><div class="gt-dst-body"></div>';
    params.appendChild(grp);
    grp.querySelector(".gt-dst-body").appendChild(side);

    var btn = d.getElementById("rb-distort");
    if (btn && btn.getAttribute("aria-pressed") !== "true") btn.click();
    var edit = d.getElementById("view-edit");
    if (edit) edit.hidden = false;
    var view = d.getElementById("view-distort");
    if (view) view.hidden = false;

    var specOver = over(d, d.getElementById("spec"), "gt-spec-over");
    var glyphOver = over(d, d.getElementById("stage"), "gt-glyph-over");
    var art = side.querySelector(".dst-art");
    var busy = false;
    var again = false;
    var skipApply = false;
    var savedSample = (d.getElementById("txt") && d.getElementById("txt").value) || "ЖЕЛЕЗО НОЧИ";

    function idle() {
      return !(w.__GT_DISTORT_API && w.__GT_DISTORT_API.active && w.__GT_DISTORT_API.active());
    }
    function showArt() {
      if (!art) return;
      art.style.display = idle() ? "" : "none";
    }
    function place(dest, canvas) {
      if (!dest || !canvas) return;
      dest.style.left = canvas.offsetLeft + "px";
      dest.style.top = canvas.offsetTop + "px";
      dest.style.width = canvas.offsetWidth + "px";
      dest.style.height = canvas.offsetHeight + "px";
    }
    function park() {
      var view = d.getElementById("view-distort");
      var cvw = d.getElementById("dst-cvw");
      if (!view) return;
      view.style.width = "880px";
      view.style.height = "420px";
      view.style.gridTemplateColumns = "1fr";
      if (cvw) {
        cvw.style.width = "880px";
        cvw.style.height = "380px";
        cvw.style.flex = "none";
      }
    }
    function inkBox(src) {
      var c = src.getContext("2d");
      var im = c.getImageData(0, 0, src.width, src.height).data;
      var minX = src.width, minY = src.height, maxX = 0, maxY = 0, any = false, x, y, a;
      for (y = 0; y < src.height; y += 2) {
        for (x = 0; x < src.width; x += 2) {
          a = im[(y * src.width + x) * 4 + 3];
          if (a > 24) {
            any = true;
            if (x < minX) minX = x;
            if (y < minY) minY = y;
            if (x > maxX) maxX = x;
            if (y > maxY) maxY = y;
          }
        }
      }
      if (!any) return null;
      return { x: minX, y: minY, w: Math.max(1, maxX - minX), h: Math.max(1, maxY - minY) };
    }
    function copy(src, dest, mode) {
      if (!src || !dest) return;
      var ratio = Math.min(2, w.devicePixelRatio || 1);
      var wpx = Math.max(2, Math.round(dest.offsetWidth * ratio));
      var hpx = Math.max(2, Math.round(dest.offsetHeight * ratio));
      dest.width = wpx;
      dest.height = hpx;
      var ctx = dest.getContext("2d");
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, wpx, hpx);
      var box = src.width && src.height ? inkBox(src) : null;
      if (!box) return;
      var pad = mode === "line" ? hpx * 0.08 : Math.min(wpx, hpx) * 0.08;
      var sc = Math.min((wpx - pad * 2) / box.w, (hpx - pad * 2) / box.h);
      var dw = box.w * sc, dh = box.h * sc;
      var dx = mode === "line" ? pad : (wpx - dw) / 2;
      var dy = (hpx - dh) / 2;
      ctx.drawImage(src, box.x, box.y, box.w, box.h, dx, dy, dw, dh);
    }
    function sampleTransform() {
      var slantEl = d.getElementById("dst-r-slant");
      var sxEl = d.getElementById("dst-r-sx");
      var syEl = d.getElementById("dst-r-sy");
      var slant = slantEl ? +slantEl.value : 0;
      var sx = sxEl ? +sxEl.value / 100 : 1;
      var sy = syEl ? +syEl.value / 100 : 1;
      return "skewX(" + (-slant) + "deg) scale(" + sx + "," + sy + ")";
    }
    function paint() {
      showArt();
      var off = idle();
      var spec = d.getElementById("spec");
      var stage = d.getElementById("stage");
      var txt = d.getElementById("txt");
      place(specOver, spec);
      place(glyphOver, stage);
      if (specOver) specOver.hidden = true;
      if (glyphOver) glyphOver.hidden = off;
      if (spec) {
        spec.style.visibility = "";
        spec.style.transformOrigin = "0% 70%";
        spec.style.transform = off ? "" : sampleTransform();
      }
      if (txt) {
        txt.style.color = "";
        txt.style.transformOrigin = "0% 70%";
        txt.style.transform = off ? "" : sampleTransform();
      }
      if (stage) stage.style.visibility = off ? "" : "hidden";
      if (off || busy) { again = !off; return; }
      busy = true;
      var cv = d.getElementById("dst-cv");
      var apply = d.getElementById("dst-apply");
      var ch = (w.S && w.S.sel) || "Ж";
      place(glyphOver, stage);
      park();
      if (txt) txt.value = ch;
      if (apply) { skipApply = true; apply.click(); skipApply = false; }
      setTimeout(function () {
        copy(cv, glyphOver, "glyph");
        if (txt) txt.value = savedSample;
        busy = false;
        if (again) { again = false; paint(); }
      }, 180);
    }

    side.addEventListener("input", paint);
    side.addEventListener("change", paint);
    var applyBtn = d.getElementById("dst-apply");
    if (applyBtn) applyBtn.addEventListener("click", function () { if (!skipApply) setTimeout(paint, 180); });
    showArt();
    if (applyBtn) applyBtn.click();
    setTimeout(function () {
      if (grp.classList.contains("shut")) {
        var h = grp.querySelector("h5");
        if (h) h.click();
      }
    }, 200);
  }

  function over(d, canvas, id) {
    if (!canvas || !canvas.parentElement) return null;
    var c = d.createElement("canvas");
    c.id = id;
    c.hidden = true;
    c.setAttribute("aria-hidden", "true");
    canvas.parentElement.appendChild(c);
    return c;
  }
})();
</script>
</body>
</html>
