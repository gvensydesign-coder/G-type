}

/* prototype toolbar */
.tb{position:fixed;left:0;right:0;top:0;z-index:30;min-height:var(--tb);background:var(--paper);box-shadow:0 1px 0 var(--line);display:flex;align-items:center;gap:var(--s4);padding:8px var(--s4)}
.tb .lab{flex:none;font-weight:700;font-size:12px;color:var(--text-2);letter-spacing:.02em;text-transform:uppercase}
.seg{position:relative;display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--panel);border-radius:var(--r-pill);padding:3px;height:42px;flex:none}
.seg i{position:absolute;top:3px;bottom:3px;left:3px;width:var(--w);background:var(--ink);border-radius:var(--r-pill);transform:translateX(var(--x));transition:transform var(--dur-fast) var(--ease-out),width var(--dur-fast) var(--ease-out)}
.seg button{position:relative;z-index:1;padding:0 18px;font-weight:600;font-size:14px;color:var(--text-2);border-radius:var(--r-pill);white-space:nowrap;transition:color var(--dur-fast) var(--ease-out)}
.seg button[aria-pressed=true]{color:var(--on-ink)}
.seg button[aria-disabled=true]{opacity:.45;cursor:not-allowed}
.tb .step{flex:1;min-width:0;font-size:13px;line-height:1.35;color:var(--ink)}
.tb .step b{font-weight:700}
.tb .reset{flex:none}
.tb .th{flex:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);height:42px;padding:0 var(--s5);border-radius:var(--r-pill);background:var(--paper);box-shadow:var(--sh-1);font-weight:600;font-size:14px;white-space:nowrap;transition:background var(--dur-fast) var(--ease-out),transform var(--dur-instant) var(--ease-out),box-shadow var(--dur-fast) var(--ease-out)}
.btn:hover{background:var(--panel)}
.btn:active{transform:scale(.98)}
.btn.sm{height:34px;padding:0 var(--s4)}
.btn.pri{background:var(--accent-press);color:var(--on-accent);box-shadow:none;font-weight:700}
.btn.pri:hover{background:var(--accent-hover)}
.btn.pri:active{background:var(--accent-press);transform:scale(.99)}
.btn[aria-pressed=true]{background:var(--ink);color:var(--on-ink)}
.rnd{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--panel);color:var(--text-2);transition:background var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out),transform var(--dur-instant) var(--ease-out)}
.rnd:hover{background:var(--line-strong);color:var(--ink)}
.rnd:active{transform:scale(1.06)}
.rnd[disabled]{opacity:.35;cursor:not-allowed}
.rnd .ic{width:18px;height:18px}

/* app */
#app{padding-top:var(--tb)}
.rail{position:fixed;left:14px;top:calc(var(--tb) + 14px);bottom:14px;width:64px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;z-index:5;pointer-events:none}
.rcap{pointer-events:auto;background:var(--rail);border-radius:32px;padding:9px;display:flex;flex-direction:column;gap:6px}
.rtop{display:flex;flex-direction:column;gap:12px;align-items:center}
.rb{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--on-rail);transition:background var(--dur-fast) var(--ease-out),transform var(--dur-instant) var(--ease-out)}
.rb:hover{background:var(--rail-2)}
.rb:active{transform:scale(1.06)}
.rb[aria-current=page]{background:var(--rail-hi);color:var(--rail)}
html[data-theme=dark] .rb[aria-current=page]{color:#232328}
.gmark{pointer-events:auto;width:48px;height:48px;border-radius:50%;background:var(--rail);color:var(--on-rail);display:grid;place-items:center;font-weight:800;font-size:20px}
html[data-theme=dark] .gmark{background:var(--rail-hi);color:#232328}
.pill{display:none}
.page{padding:20px 24px 140px var(--rail-w);min-height:calc(100vh - var(--tb))}
.wrap{max-width:1720px;margin:0 auto}
.scr{display:none}
.scr.on{display:block;animation:scin var(--dur-open) var(--ease-out) both}
.scr.leave{display:block;animation:scout var(--dur-fast) var(--ease-in) both;pointer-events:none}
@keyframes scin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes scout{to{opacity:0}}
.sh{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);margin:4px 0 var(--s4);min-height:44px}
.sh h2{font-size:24px;line-height:1.15;font-weight:800;letter-spacing:-.02em}
.sh .grp{display:flex;align-items:center;gap:var(--s3);min-width:0}

/* library cards */
.lgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s3)}
.lc{position:relative;display:flex;flex-direction:column;gap:var(--s2);padding:var(--s2) var(--s2) var(--s3);min-width:0;isolation:isolate;animation:cin var(--dur-slow) var(--ease-out) both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes cin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.lc::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:var(--r-lg);background:var(--card);
  -webkit-mask:linear-gradient(#000 0 0) 0 0/calc(100% - 56px) 100% no-repeat,linear-gradient(#000 0 0) 100% 56px/56px calc(100% - 56px) no-repeat,radial-gradient(circle at 18px 0,transparent 17.5px,#000 18px) calc(100% - 56px) 38px/18px 18px no-repeat;
  mask:linear-gradient(#000 0 0) 0 0/calc(100% - 56px) 100% no-repeat,linear-gradient(#000 0 0) 100% 56px/56px calc(100% - 56px) no-repeat,radial-gradient(circle at 18px 0,transparent 17.5px,#000 18px) calc(100% - 56px) 38px/18px 18px no-repeat;
  transition:background var(--dur-fast) var(--ease-out)}
.lc:hover::before{background:var(--paper)}
.lplate{position:relative;background:var(--canvas);color:var(--canvas-ink);border-radius:var(--r-md);height:150px;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;transition:box-shadow var(--dur-base) var(--ease-out)}
.lplate b{font-weight:400;font-size:56px;line-height:1;white-space:nowrap}
.lplate .lbadge{position:absolute;left:8px;top:8px;height:24px;min-width:34px;padding:0 10px;border-radius:var(--r-pill);background:var(--ink);color:var(--on-ink);font:600 12px/24px var(--f-ui);text-align:center}
.lplate{-webkit-mask:linear-gradient(#000 0 0) 0 0/calc(100% - 48px) 100% no-repeat,linear-gradient(#000 0 0) 100% 48px/48px calc(100% - 48px) no-repeat,radial-gradient(circle at 10px 0,transparent 9.5px,#000 10px) calc(100% - 48px) 38px/10px 10px no-repeat;mask:linear-gradient(#000 0 0) 0 0/calc(100% - 48px) 100% no-repeat,linear-gradient(#000 0 0) 100% 48px/48px calc(100% - 48px) no-repeat,radial-gradient(circle at 10px 0,transparent 9.5px,#000 10px) calc(100% - 48px) 38px/10px 10px no-repeat}
.dc .lplate{-webkit-mask:none;mask:none}
.lc .plate-wrap{display:block}
.lrow{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);padding:0 var(--s2) 0 var(--s2)}
.lrow .ln{font-weight:700;font-size:16px;letter-spacing:-.01em}
.lmore{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--text-2);transition:background var(--dur-fast) var(--ease-out)}
.lmore:hover,.lmore[aria-expanded=true]{background:var(--panel);color:var(--ink)}
.ltags{display:flex;gap:var(--s2);margin-right:44px;padding:0 0 0 var(--s2);overflow:hidden;flex-wrap:nowrap;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
.tag{flex:none;height:28px;padding:0 var(--s3);border-radius:var(--r-pill);background:var(--panel);font-size:12px;font-weight:500;display:inline-flex;align-items:center}
.heart{position:absolute;right:var(--s3);bottom:var(--s3);width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:var(--text-2);transition:color var(--dur-fast) var(--ease-out),transform var(--dur-instant) var(--ease-out)}
.heart:active{transform:scale(1.06)}
.heart[aria-pressed=true]{color:var(--accent)}
.notch{position:absolute;top:0;right:0;width:56px;height:56px;display:grid;place-items:center}
.nb{width:40px;height:40px;border-radius:50%;background:var(--accent-press);color:#fff;display:grid;place-items:center;transition:background var(--dur-fast) var(--ease-out),transform var(--dur-instant) var(--ease-out)}
.nb:hover{background:var(--accent-hover)}.nb:active{transform:scale(1.06)}
.nb .ic{width:20px;height:20px}
.lc.pick .lplate{box-shadow:inset 0 0 0 2px var(--ink)}
.lc .lbadge.cn{display:none}
.lc.pick .lbadge{display:none}
.lc.pick .lbadge.cn{display:inline-flex;align-items:center;gap:4px;animation:pop var(--dur-base) var(--ease-out) both}
@keyframes pop{from{transform:scale(.7);opacity:0}60%{transform:scale(1.06)}to{transform:none;opacity:1}}
.lc.hasmode .lplate::after,.dc.hasmode .lplate::after{content:"";position:absolute;left:8px;bottom:8px;width:22px;height:22px;border-radius:50%;border:2px solid var(--line-strong);background:transparent}
.lc.pick.hasmode .lplate::after,.dc.pick.hasmode .lplate::after{border-color:transparent}

/* popovers */
.pop{position:fixed;z-index:20;background:var(--paper);border-radius:var(--r-md);box-shadow:var(--sh-3);visibility:hidden;opacity:0;transform:scale(.97) translateY(4px);transform-origin:var(--o,top left);transition:opacity var(--dur-instant) var(--ease-in),transform var(--dur-instant) var(--ease-in),visibility 0s linear var(--dur-instant)}
.pop.on{visibility:visible;opacity:1;transform:none;transition:opacity var(--dur-fast) var(--ease-out),transform var(--dur-fast) var(--ease-out),visibility 0s}
.menu{min-width:228px;padding:var(--s2)}
.menu button{display:flex;align-items:center;gap:var(--s3);width:100%;height:38px;padding:0 var(--s3);border-radius:var(--r-xs);font-weight:500;text-align:left}
.menu button:hover{background:var(--panel)}

  .chipcap{min-width:0;padding-left:var(--s2)}
  .chips{margin:0 -12px;padding:0 12px}
  .grid{--n:1 !important}
  .stage{padding:var(--s5) var(--s4) var(--s3)}
  .stagefoot .gx{display:none}
  .stagefoot .gx.nt{display:block;flex:none}
  .rnd{width:44px;height:44px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms !important;transition-duration:1ms !important;animation-delay:0ms !important}}
</style>
</head>
<body>
<header class="tb" id="tb">
  <span class="lab">Сценарий</span>
  <div class="seg" id="scn" role="group" aria-label="Сценарий входа"><i></i>
    <button data-s="A" aria-pressed="true">A Библиотека</button>
    <button data-s="B" aria-pressed="false">B Редактор</button>
    <button data-s="C" aria-pressed="false">C Черновики</button>
    <button data-s="D" aria-pressed="false">D Избранное</button>
  </div>
  <div class="step" id="step"></div>
  <button class="btn sm reset" id="reset">Сначала</button>
  <button class="rnd th" id="theme" aria-label="Переключить тему"><i class="ic i-moon" id="themeic"></i></button>
</header>

<div id="app" data-scn="A" data-screen="lib">
  <nav class="rail" aria-label="Основная навигация">
    <div class="rtop"><div class="gmark" aria-hidden="true">G</div>
      <div class="rcap">
        <button class="rb" data-nav="home" aria-label="Главная"><i class="ic i-home"></i></button>
        <button class="rb" data-nav="lib" aria-label="Библиотека"><i class="ic i-fonts"></i></button>
        <button class="rb" data-nav="fav" aria-label="Избранное"><i class="ic i-heart"></i></button>
        <button class="rb" data-nav="comm" aria-label="Сообщество"><i class="ic i-comm"></i></button>
        <span id="railtools"></span>
      </div>
    </div>
    <div class="rcap">
      <button class="rb" data-nav="help" aria-label="Подсказки"><i class="ic i-help"></i></button>
      <button class="rb" data-nav="prof" aria-label="Профиль и черновики"><i class="ic i-user"></i></button>
    </div>
  </nav>
  <nav class="pill" aria-label="Основная навигация">
    <button class="rb" data-nav="home" aria-label="Главная"><i class="ic i-home"></i></button>
    <button class="rb" data-nav="lib" aria-label="Библиотека"><i class="ic i-fonts"></i></button>
    <button class="rb" data-nav="fav" aria-label="Избранное"><i class="ic i-heart"></i></button>
    <button class="rb" data-nav="comm" aria-label="Сообщество"><i class="ic i-comm"></i></button>
    <button class="rb" data-nav="theme" aria-label="Тёмная тема"><i class="ic i-moon"></i></button>
    <button class="rb" data-nav="proj" aria-label="Проект"><i class="ic i-folder"></i></button>
    <button class="rb" data-nav="prof" aria-label="Профиль и черновики"><i class="ic i-user"></i></button>
  </nav>

  <main class="page"><div class="wrap">
    <section class="scr on" id="s-lib" aria-label="Библиотека">
      <div class="sh"><h2>Все шрифты</h2>
        <div class="grp hs"><div class="seg seg2" data-seg><i></i><button aria-pressed="true">Популярные</button><button aria-pressed="false">По алфавиту</button><button aria-pressed="false">Новые</button></div></div>
      </div>
      <div class="lgrid" id="lgrid"></div>
    </section>

    <section class="scr" id="s-edit" aria-label="Редактор">
      <div class="etop" id="etop">
        <div class="seg seg2" data-seg><i></i><button aria-pressed="true">Прямой</button><button aria-pressed="false">Италик</button></div>
        <span class="div"></span>
        <div class="seg seg2" data-seg><i></i><button aria-pressed="true">Редактор</button><button aria-pressed="false">Проверка</button><button aria-pressed="false">Кернинг</button></div>
        <span class="div"></span>
        <button class="eb" aria-label="Отменить"><i class="ic s i-undo"></i></button>
        <button class="eb" aria-label="Повторить"><i class="ic s i-redo"></i></button>
        <button class="eb" id="histb" aria-label="История" aria-expanded="false" aria-haspopup="dialog"><i class="ic s i-hist"></i></button>
        <span class="crumb"><b id="crf">Вольт</b><span>›</span><span>Ж</span><span>›</span><span>Прямой</span></span>
        <span class="sp"></span>
        <span class="stt">Шрифт проверен</span>
        <span class="dlb"><i class="ic s i-dl"></i>Скачать шрифт</span>
      </div>
      <div class="srow"><span class="spill">Образец</span><div class="sinp" id="sinp">ЖЕЛЕЗО НОЧИ</div></div>
      <div class="emain">
        <div class="ecv" id="ecv"></div>
        <aside class="epan"><h4>Знаки</h4><div class="egl" id="egl"></div></aside>
      </div>
    </section>

    <section class="scr" id="s-prof" aria-label="Профиль">
      <div class="prof"><div class="ava">АВ</div><div><h1>Анна Ветрова</h1><p>Рисую шрифты для вывесок и афиш</p></div></div>
      <div class="sh"><h2>Черновики</h2>
        <div class="grp"><button class="btn" id="dcmp" aria-pressed="false"><i class="ic s i-cmp"></i>Сравнить</button></div>
      </div>
      <div class="dgrid" id="dgrid"></div>
    </section>

    <section class="scr" id="s-fav" aria-label="Избранное">
      <div class="sh"><h2>Избранное</h2>
        <div class="grp"><button class="btn" id="fcmp" aria-pressed="false"><i class="ic s i-cmp"></i>Сравнить избранное</button>
          <button class="rnd" aria-label="Сеткой"><i class="ic i-grid"></i></button><button class="rnd" aria-label="Списком"><i class="ic i-list"></i></button></div>
      </div>
      <div class="fgrid" id="fgrid"></div>
    </section>

    <section class="scr" id="s-cmp" aria-label="Сравнение шрифтов">
      <div class="ch"><div><h1>Сравнение шрифтов</h1><p>Печатайте прямо в образце, текст одинаков во всех карточках.</p></div>
        <button class="btn" id="cclose"><i class="ic s i-close"></i>Закрыть</button></div>
      <section class="bar" aria-label="Параметры сравнения">
        <div class="seg" id="vseg" role="group" aria-label="Режим"><i></i>
          <button data-v="side" aria-pressed="true">Рядом</button>
          <button data-v="overlay" aria-pressed="false">Наложение</button>
        </div>
        <div class="sz"><label for="size">Размер</label><input class="sl" id="size" type="range" min="16" max="160" step="1" value="72"><output id="sizev" for="size">72 px</output></div>
      </section>
      <div class="chiprow"><div class="chipcap" id="cnt"></div><div class="chips" id="chips" role="group" aria-label="Шрифты"></div></div>
      <div class="stagewrap"><div>
        <section class="stage" id="stage" aria-label="Наложение контуров">
          <div class="field" id="field"></div>
          <div class="catch" id="catch" contenteditable="plaintext-only" spellcheck="false" role="textbox" aria-label="Образец в наложении"></div>
          <div class="stagefoot" id="legend"></div>
        </section>
      </div></div>
      <section class="grid" id="grid" aria-label="Выбранные шрифты"></section>
    </section>
  </div></main>

  <div class="pop menu" id="menu" role="menu"></div>
  <div class="pop hcard" id="hcard" role="dialog" aria-label="Карточка шрифта"></div>
  <div class="pop hist" id="hist" role="dialog" aria-label="История"></div>
  <div class="tray" id="tray"><div class="tin" id="tin"></div></div>
  <div class="toast" id="toast" role="status"></div>
</div>

<script>
const LIB=['volt','kvadra','stroka','propis','renessa','modul','liniya','codex'];
const F={
  volt:{n:'Вольт',kind:'Гротеск',fam:"'GT volt'",xh:.54,word:'Лист',year:'2077',d:'Широкий акцидентный гротеск: тяжёлые вертикали, тонкие горизонтали, острые шпоры.',tags:['Гротески','Широкие','Акцидентные']},
  kvadra:{n:'Квадра',kind:'Новый гротеск',fam:"'GT kvadra'",xh:.53,word:'Музей',year:'2078',d:'Нейтральный новый гротеск, который не спорит с содержанием.',tags:['Новые гротески','Нормальные','Широкие']},
  stroka:{n:'Строка',kind:'Рубленый, нейтральный',fam:"'GT stroka'",xh:.525,word:'Весна',year:'2077',d:'Ровный рубленый шрифт для длинного текста и интерфейсов.',tags:['Новые гротески','Нормальные','Текстовые']},
  propis:{n:'Пропись',kind:'Рукописный, соединённый',fam:"'GT propis'",xh:.45,word:'Журнал',year:'2078',d:'Школьная пропись с остроконечным пером и связными буквами.',tags:['Рукописные','Остроконечное перо','Связные']},
  renessa:{n:'Ренесса',kind:'Антиква с засечками',fam:"'GT renessa'",xh:.45,word:'Север',year:'2078',d:'Книжная антиква с высоким контрастом и мягкими засечками.',tags:['Антиквы','Контрастные','Текстовые']},
  modul:{n:'Модуль',kind:'Сборная геометрия',fam:"'GT modul'",xh:.72,caps:1,word:'СЕВЕР',year:'2078',d:'Знаки собраны из одинаковых модулей. Строчные нарисованы как прописные.',tags:['Геометрические','Только прописные','Акцидентные']},
  liniya:{n:'Линия',kind:'Геометрический, один штрих',fam:"'GT liniya'",xh:.49,word:'Лаваш',year:'2077',d:'Линейный шрифт одной толщины, как у вывесок и схем.',tags:['Геометрические','Неконтрастные','Для логотипа']},
  codex:{n:'Кодекс',kind:'Унциальный',fam:"'GT codex'",xh:.5,word:'Свиток',year:'2078',d:'Унциальное письмо ширококонечным пером для книжных обложек.',tags:['Унциальные','Ширококонечное перо','Для логотипа']},
  mine:{n:'Ваша версия',kind:'Вольт с вашими правками: наклон и ширина',fam:"'GT volt'",xh:.54,xf:{sk:-8,sx:.94},word:'Лист'},
  orig:{n:'Вольт, исходный',kind:'Вольт из библиотеки, как был до правок',fam:"'GT volt'",xh:.54,word:'Лист'},
  v1:{n:'Правка 11:20',kind:'Ваша версия утром: наклон −4°',fam:"'GT volt'",xh:.54,xf:{sk:-4,sx:.97},word:'Лист'},
  d1:{n:'Север',kind:'Черновик, редактор, 14 ноября',fam:"'GT kvadra'",xh:.53,xf:{sk:0,sx:.94},word:'Север',mode:'Редактор',date:'14 ноября',prev:'d1p'},
  d1p:{n:'Север, прошлая версия',kind:'Тот же черновик, 12 ноября',fam:"'GT kvadra'",xh:.53,word:'Север'},
  d2:{n:'Заметки',kind:'Черновик, отрисовка, 12 ноября',fam:"'GT liniya'",xh:.49,word:'Заметки',mode:'Отрисовка',date:'12 ноября'},
  d3:{n:'Печать',kind:'Черновик, импорт, 9 ноября',fam:"'GT renessa'",xh:.45,xf:{sk:-6,sx:1.04},word:'Печать',mode:'Импорт',date:'9 ноября'}
};
const LN=[{c:'#141416',w:1.5,d:''},{c:'#55555d',w:1.5,d:'7 4'},{c:'#85858e',w:1.75,d:'0.1 4',cap:'round'},{c:'#6a6a72',w:1.5,d:'10 3 1 3'}];
const CT=['var(--ink)','var(--g600)','var(--g500)','var(--g500)'];
const MAXN=4,MAXLEN=60;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const st={scn:'A',screen:'lib',from:'lib',sel:[],mode:false,text:matchMedia('(max-width:820px)').matches?'Гармония':'Гармония и ритм',want:72,wantO:null,eff:72,view:'side',cand:[],edFont:'volt',phone:matchMedia('(max-width:820px)').matches};
const FAVS=['volt','stroka','propis','renessa','modul','liniya'];
const DRAFTS=['d1','d2','d3'];

const baseOf=k=>LIB.includes(k)?k:({mine:'volt',orig:'volt',v1:'volt',d1:'kvadra',d1p:'kvadra',d2:'liniya',d3:'renessa'})[k];
function mark(i,card){const l=LN[i];return `<svg class="mk" viewBox="0 0 28 8" aria-hidden="true"><line x1="1" x2="27" y1="4" y2="4" stroke="${card?CT[i]:l.c}" stroke-width="${l.w}" ${l.d?`stroke-dasharray="${l.d}"`:''} stroke-linecap="${l.cap||'butt'}"/></svg>`}
const toast=(()=>{let t;return m=>{const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(t);t=setTimeout(()=>e.classList.remove('on'),5000)}})();
const xfCss=f=>f.xf?`transform:skewX(${f.xf.sk}deg) scaleX(${f.xf.sx})`:'';

/* ---------- indicators for segments ---------- */
function segInd(seg){
  const b=seg.querySelector('[aria-pressed=true]'),i=seg.querySelector('i');if(!b||!i)return;
  i.style.setProperty('--x',b.offsetLeft-3+'px');i.style.setProperty('--w',b.offsetWidth+'px');
}
function allSeg(){$$('.seg').forEach(segInd)}
$$('[data-seg]').forEach(s=>s.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;s.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));segInd(s)}));
addEventListener('resize',()=>{allSeg();applySize();edge();st.phone=matchMedia('(max-width:820px)').matches});

/* ---------- screens ---------- */
const SCR={lib:'s-lib',edit:'s-edit',prof:'s-prof',fav:'s-fav',cmp:'s-cmp'};
function go(screen,instant){
  if(screen===st.screen&&!instant)return;
  const cur=$('#'+SCR[st.screen]),nx=$('#'+SCR[screen]);
  closeAll();
  const show=()=>{cur.classList.remove('on','leave');nx.classList.add('on');st.screen=screen;$('#app').dataset.screen=screen;
    nav();tray();step();allSeg();if(screen==='cmp'){setTimeout(()=>{drawOverlay();applySize();edge()},30)}window.scrollTo(0,0)};
  if(instant||cur===nx){show();return}
  cur.classList.add('leave');
  setTimeout(()=>{show()},180);
}
function nav(){
  const m={lib:'lib',fav:'fav',prof:'prof',edit:'edit',cmp:st.from};
  const act=m[st.screen]||'lib';
  $$('[data-nav]').forEach(b=>{if(b.dataset.nav===act||(act==='edit'&&b.dataset.nav==='tool'))b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  $('#railtools').innerHTML=(st.screen==='edit'||(st.screen==='cmp'&&st.from==='edit'))?'<button class="rb" data-nav="tool" aria-label="Настройки" aria-current="page" style="margin-top:6px"><i class="ic i-sliders"></i></button>':'';
}
$$('[data-nav]').forEach(b=>b.addEventListener('click',()=>{
  const n=b.dataset.nav;
  if(n==='lib')go('lib');else if(n==='fav')go('fav');else if(n==='prof')go('prof');
  else if(n==='theme')setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
}));
document.addEventListener('click',e=>{if(e.target.closest('[data-nav]')){}});

/* ---------- library / favorites cards ---------- */
function lcHTML(k,i,opts={}){
  const f=F[k],n=st.sel.indexOf(k)+1;
  return `<div class="lc${n?' pick':''}${st.mode&&opts.sel?' hasmode':''}" data-k="${k}" style="--i:${i}" tabindex="0" role="button" aria-label="${f.n}">
  <div class="lplate"><span class="lbadge">Aa</span><span class="lbadge cn"><i class="ic xs i-check"></i><span class="no">${n||''}</span></span><b style="font-family:${f.fam}">${f.word}</b></div>
  <div class="lrow"><span class="ln">${f.n}</span><button class="lmore" data-more="${k}" aria-haspopup="menu" aria-expanded="false" aria-label="Действия: «${f.n}»"><i class="ic i-more"></i></button></div>
  <div class="ltags">${f.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
  ${opts.fav?`<button class="heart" aria-pressed="true" aria-label="Убрать из избранного: ${f.n}"><i class="ic s i-heartf"></i></button>`:`<button class="heart" aria-pressed="false" aria-label="В избранное: ${f.n}"><i class="ic s i-heart"></i></button>`}
  <span class="notch"><span class="nb" aria-hidden="true"><i class="ic i-up"></i></span></span></div>`;
}
function renderLib(){$('#lgrid').innerHTML=LIB.map((k,i)=>lcHTML(k,i)).join('')}
function renderFav(){$('#fgrid').innerHTML=FAVS.map((k,i)=>lcHTML(k,i,{fav:1,sel:1})).join('')}
function renderDrafts(){
  $('#dgrid').innerHTML=DRAFTS.map((k,i)=>{
    const f=F[k],n=st.sel.indexOf(k)+1;
    return `<div class="dc${n?' pick':''}${st.mode?' hasmode':''}" data-k="${k}" style="--i:${i}" tabindex="0" role="button" aria-label="Черновик «${f.n}»">
    <div class="lplate"><span class="lbadge cn" style="display:${n?'inline-flex':'none'}"><i class="ic xs i-check"></i><span class="no">${n||''}</span></span><b style="font-family:${f.fam};${xfCss(f)}">${f.word}</b></div>
    <div class="dm"><div class="t"><b>${f.n}</b><small>${f.date}</small></div><span class="mode">${f.mode}</span></div>
    <div class="dact"><button class="btn sm" data-cont="${k}">Продолжить</button></div></div>`}).join('');
}
function refreshMarks(){
  $$('.lc,.dc').forEach(c=>{const k=c.dataset.k,n=st.sel.indexOf(k)+1;c.classList.toggle('pick',!!n);
    const no=c.querySelector('.no');if(no)no.textContent=n||'';
    const cn=c.querySelector('.lbadge.cn');if(cn&&c.classList.contains('dc'))cn.style.display=n?'inline-flex':'none';
    c.classList.toggle('hasmode',!!st.mode&&(c.classList.contains('dc')||!!c.closest('#fgrid')))});
}

/* ---------- selection and tray ---------- */
function addSel(k){
  const i=st.sel.indexOf(k);
  if(i>=0){st.sel.splice(i,1);refreshMarks();tray();step();return}
  if(st.sel.length>=MAXN){toast(`В сравнении уже четыре шрифта. Уберите один, чтобы добавить «${F[k].n}».`);return}
  st.sel.push(k);refreshMarks();tray();step();
}
function selLabel(){return st.scn==='C'?'Черновики':'Сравнение'}
function tray(){
  const t=$('#tray'),tin=$('#tin');
  const eligible=['lib','fav','prof'].includes(st.screen)&&st.scn!=='B'&&((st.scn==='A'&&st.screen==='lib')||(st.scn==='C'&&st.screen==='prof')||(st.scn==='D'&&st.screen==='fav'));
  const n=st.sel.length;
  const show=eligible&&(n>0||st.mode);
  if(!show){t.classList.remove('on');return}
  const names=st.sel.map(k=>`<span class="tc" data-k="${k}">${F[k].n}<button class="tx" data-un="${k}" aria-label="Убрать «${F[k].n}» из сравнения"><i class="ic i-close"></i></button></span>`).join('');
  let lead,extra='',go='';
  if(n===0){lead=`<span class="tl">Сравнение: <em>${st.scn==='C'?'отметьте два черновика':'отметьте от двух до четырёх шрифтов'}</em></span>`}
  else if(n===1){
    lead=`<span class="tl">Сравнение:</span><span class="tchips">${names}</span><span class="tl"><em>· добавьте ещё ${st.scn==='C'?'один черновик':'один'}</em></span>`;
    if(st.scn==='C'&&F[st.sel[0]].prev&&!st.sel.includes(F[st.sel[0]].prev))extra=`<button class="btn sm" id="tprev">С прошлой версией</button>`;
  }else{
    lead=`<span class="tl">Сравнение:</span><span class="tchips">${names}</span>`;
    go=`<button class="btn pri go" id="tgo">Сравнить ${n}</button>`;
  }
  const html=lead+extra+go;
  if(tin.dataset.h!==html){tin.dataset.h=html;tin.innerHTML=html}
  t.classList.add('on');
}
$('#tin').addEventListener('click',e=>{
  const u=e.target.closest('[data-un]');if(u){addSel(u.dataset.un);return}
  if(e.target.closest('#tgo'))openCmp(st.screen);
  if(e.target.closest('#tprev')){st.sel.push(F[st.sel[0]].prev);refreshMarks();tray();step()}
});

/* ---------- menus / popovers ---------- */
let hov=null,hovT=null;
function closeAll(){['#menu','#hcard','#hist'].forEach(s=>$(s).classList.remove('on'));$$('[aria-expanded=true]').forEach(b=>b.setAttribute('aria-expanded','false'));clearTimeout(hovT)}
function place(pop,anchor,pref){
  const r=anchor.getBoundingClientRect(),w=pop.offsetWidth,h=pop.offsetHeight;
  let x=pref==='right'?r.right+12:r.left,y=pref==='right'?r.top:r.bottom+6;
  if(x+w>innerWidth-12)x=pref==='right'?r.left-w-12:innerWidth-w-12;
  if(x<12)x=12;
  if(y+h>innerHeight-12)y=Math.max(12,innerHeight-h-12);
  pop.style.left=x+'px';pop.style.top=y+'px';
}
function openMenu(k,btn){
  closeAll();
  const sel=st.sel.includes(k);
  const m=$('#menu');
  m.setAttribute('aria-label','Действия с «'+F[k].n+'»');
  m.innerHTML=`<button role="menuitem"><i class="ic s i-folder"></i>В подборку<i class="ic s i-chev nx"></i></button>
  <button role="menuitem"><i class="ic s i-heart"></i>В избранное</button>
  <button role="menuitem" data-cmp="${k}" class="newi"><i class="ic s i-cmp"></i>${sel?'Убрать из сравнения':'Сравнить'}</button>
  <button role="menuitem"><i class="ic s i-share"></i>Поделиться</button><hr>

const field=$('#field'),stage=$('#stage'),size=$('#size'),grid=$('#grid'),chips=$('#chips'),app=$('#app');

function renderChips(){

function cardHTML(k,i){
  const f=F[k];

  <div class="fh">${mark(i,1)}<div class="t"><b>${f.n}</b><small>${f.kind}</small></div>

  <div class="samplewrap"><div><div class="sample"><div class="tx2" contenteditable="plaintext-only" spellcheck="false" data-ph="Введите текст" style="font-family:${f.fam};${xfCss(f)}" role="textbox" aria-label="Образец, ${f.n}"></div>${f.caps?`<div class="cnote">Строчные нарисованы как прописные. В паре со строчными этого шрифта сравнивайте высоту и ширину знаков.</div>`:''}</div></div></div>

function renderCards(newK){
  grid.style.setProperty('--n',Math.max(2,st.sel.length));grid.dataset.n=st.sel.length;
  grid.innerHTML=st.sel.map((k,i)=>cardHTML(k,i)).join('')+(st.sel.length<2?`<div class="slot"><b>Добавьте второй шрифт</b><span>Выберите его в ряду выше, и карточки встанут рядом.</span></div>`:'');
  if(newK)grid.querySelector(`[data-k="${newK}"]`)?.classList.add('in');

function renderLayers(){
  field.innerHTML='<svg id="svg" aria-hidden="true"></svg><div class="caret" id="caret"></div>';
  const notes=st.sel.filter(k=>F[k].caps).map(k=>`<span class="gx nt">${F[k].n}: строчные нарисованы как прописные</span>`).join('');
  $('#legend').innerHTML=st.sel.map((k,i)=>`<span class="lg" tabindex="0" data-i="${i}">${mark(i)}${F[k].n}</span>`).join('')+notes+'<span class="gx">Тонкие линии показывают высоту строчных</span>';
  drawOverlay();
}
function cellW(ch){return Math.max(...st.sel.map(k=>textW(F[k].fam,100,ch)*(F[k].xf?F[k].xf.sx:1)))/100}
function drawOverlay(){
  const svg=$('#svg');if(!svg)return;
  const v=st.eff||72,chars=[...st.text],W=field.clientWidth;
  const ws=chars.map(cellW),tot=ws.reduce((a,b)=>a+b,0)*v;
  const x0=Math.max(0,(W-tot)/2),base=Math.round(v*1.0);
  field.style.height=Math.round(v*1.3)+'px';
  let out=`<line class="bl" x1="0" x2="${W}" y1="${base}" y2="${base}"/><text class="bt" x="${W}" y="${base+16}" text-anchor="end">Базовая линия</text>`;
  st.sel.forEach((k,i)=>{
    const f=F[k],l=LN[i];let x=x0,t='';
    chars.forEach((c,j)=>{if(c!==' '){const cx=(x+ws[j]*v/2).toFixed(1);
      t+=`<text transform="translate(${cx} ${base})${f.xf?` skewX(${f.xf.sk}) scale(${f.xf.sx} 1)`:''}" x="0" y="0" text-anchor="middle" style="font-family:${f.fam};font-size:${v}px">${esc(c)}</text>`}x+=ws[j]*v});
    const yx=(base-f.xh*v).toFixed(1);
    out+=`<g class="ly" data-i="${i}" style="--c:${l.c};--w:${l.w}" stroke-dasharray="${l.d}" stroke-linecap="${l.cap||'butt'}"><line class="xl" x1="0" x2="${W}" y1="${yx}" y2="${yx}" stroke="${l.c}" stroke-dasharray="none"/>${t}</g>`;
  });
  svg.innerHTML=out;
  const ct=$('#caret');ct.style.left=(x0+tot+2)+'px';ct.style.top=(base-v*.8)+'px';ct.style.height=v+'px';
  const cc=$('#catch');if(cc.textContent!==st.text)cc.textContent=st.text;
}
function syncTexts(except){
  $$('.tx2').forEach(e=>{if(e!==except&&e.textContent!==st.text)e.textContent=st.text});
  drawOverlay();
}
function fitMax(){
  const t=st.text||'Аа';
  if(st.view==='overlay'&&st.sel.length){
    const W=stage.clientWidth-parseFloat(getComputedStyle(stage).paddingLeft)*2-4;
    const w=[...t].reduce((a,c)=>a+cellW(c),0)*100;return Math.floor(W/Math.max(w,1)*100);
  }
  let cap=999;
  grid.querySelectorAll('.sample').forEach((s,i)=>{
    const f=F[st.sel[i]];if(!f)return;
    const cs=getComputedStyle(s),W=s.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight)-2;
    const lw=Math.max(...t.split(/\s+/).map(w=>textW(f.fam,100,w)),1)*(f.xf?1.15:1);
    cap=Math.min(cap,Math.floor(W/lw*100));
  });
  return cap;
}
function applySize(){
  if(st.screen!=='cmp')return;
  const ov=st.view==='overlay';
  const mx=ov?Math.max(24,Math.min(400,fitMax())):Math.max(24,Math.min(200,fitMax()));
  size.max=mx;
  const w=ov?(st.wantO==null?Math.round(mx*.9):st.wantO):st.want;
  const v=Math.max(16,Math.min(w,mx));
  size.value=v;st.eff=v;$('#sizev').textContent=v+' px';
  size.style.setProperty('--p',((v-size.min)/Math.max(1,mx-size.min)*100)+'%');
  grid.querySelectorAll('.tx2').forEach(e=>e.style.fontSize=v+'px');
  if(ov)drawOverlay();
}
size.addEventListener('input',()=>{if(st.view==='overlay')st.wantO=+size.value;else st.want=+size.value;applySize()});
function toggleFont(k){
  const i=st.sel.indexOf(k);

    const c=grid.querySelector(`[data-k="${k}"]`);
    st.sel.splice(i,1);

    st.sel.push(k);renderChips();renderCards(k);

grid.addEventListener('click',e=>{const r=e.target.closest('[data-rm]');if(r)toggleFont(r.dataset.rm);

/* ---------- scenario ---------- */
const START={A:'lib',B:'edit',C:'prof',D:'fav'};
function setScn(s,instant){
  st.scn=s;app.dataset.scn=s;st.sel=[];st.mode=false;st.from=START[s];
  $$('#scn button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===s));segInd($('#scn'));

function step(){
  const s=st.scn,n=st.sel.length,scr=st.screen,e=$('#step');let t='';
  const P=st.phone;
  if(s==='A'){
    if(scr==='cmp')t=`<b>Шаг 4.</b> Переключайте «Рядом» и «Наложение». «Закрыть» вернёт в библиотеку, выбор останется в плашке.`;
    else if(n===0)t=P?`<b>Шаг 1.</b> Нажмите «…» на карточке и выберите «Сравнить», либо коснитесь образца и нажмите «Сравнить» в карточке шрифта.`:`<b>Шаг 1.</b> Откройте «…» на карточке и выберите «Сравнить». Второй путь: задержите указатель на карточке, и в карточке шрифта будет «Сравнить».`;
    else if(n===1)t=`<b>Шаг 2.</b> Внизу появилась плашка. Добавьте ещё один шрифт тем же действием.`;
    else if(n<4)t=`<b>Шаг 3.</b> Нажмите «Сравнить ${n}». Можно добавить до четырёх, на пятом придёт спокойное сообщение.`;
    else t=`<b>Шаг 3.</b> Выбрано четыре. Попробуйте добавить пятый шрифт или нажмите «Сравнить 4».`;
  }else if(s==='B'){
    if(scr==='cmp')t=`<b>Шаг 3.</b> Ваша версия лежит поверх исходной. «Закрыть» вернёт в редактор.`;
    else if($('#hist').classList.contains('on'))t=`<b>Шаг 2.</b> Нажмите «Сравнить» у исходного состояния или выберите «Сравнить с другим шрифтом».`;
    else t=`<b>Шаг 1.</b> Откройте «История» на верхней панели редактора, значок с часами.`;
  }else if(s==='C'){
    if(scr==='cmp')t=`<b>Шаг 4.</b> Черновик и его прошлая версия. «Закрыть» вернёт в профиль, отметки останутся.`;
    else if(!st.mode)t=`<b>Шаг 1.</b> В разделе «Черновики» нажмите «Сравнить».`;
    else if(n===0)t=`<b>Шаг 2.</b> Отметьте черновик касанием по образцу.`;
    else if(n===1)t=`<b>Шаг 3.</b> Отметьте второй черновик или нажмите «С прошлой версией» в плашке.`;
    else t=`<b>Шаг 4.</b> Нажмите «Сравнить ${n}» в плашке.`;
  }else{
    if(scr==='cmp')t=`<b>Шаг 4.</b> Закройте сравнение: вы вернётесь в «Избранное», отметки сохранятся.`;
    else if(!st.mode)t=`<b>Шаг 1.</b> Нажмите «Сравнить избранное». Если в избранном два–четыре шрифта, сравнение откроется сразу. Здесь шесть.`;
    else if(n<2)t=`<b>Шаг 2.</b> Отметьте от двух до четырёх шрифтов.`;
    else t=`<b>Шаг 3.</b> Нажмите «Сравнить ${n}» в плашке.`;
  }
  e.innerHTML=t;
}

function setTheme(t){
  document.documentElement.dataset.theme=t;
  $('#themeic').className='ic '+(t==='dark'?'i-sun':'i-moon');
  $$('[data-nav=theme] .ic').forEach(i=>i.className='ic '+(t==='dark'?'i-sun':'i-moon'));
  setTimeout(allSeg,50);
}
$('#theme').addEventListener('click',()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'));

/* ---------- init ---------- */
new ResizeObserver(()=>document.documentElement.style.setProperty('--tb',$('#tb').offsetHeight+'px')).observe($('#tb'));
const q=new URLSearchParams(location.search);
if(q.get('theme'))setTheme(q.get('theme'));
setScn(q.get('s')||'A',true);
document.fonts.ready.then(()=>{allSeg();Promise.all(Object.values(F).map(f=>document.fonts.load('40px '+f.fam,'Аа'))).then(()=>{if(st.screen==='cmp'){fillLayers2()}})});
function fillLayers2(){drawOverlay();applySize()}
setTimeout(allSeg,60);
</script>
