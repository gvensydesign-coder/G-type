:root{
  --g0:#ffffff;--g25:#fafafa;--g50:#f6f6f7;--g100:#efeff1;--g150:#e8e8eb;--g200:#e1e1e5;--g300:#cfcfd4;--g400:#a3a3ab;--g500:#6a6a72;--g600:#55555d;
  --ink:#0b0b0c;--on-ink:#fff;
  --bg:var(--g100);--card:var(--g25);--paper:var(--g0);--panel:var(--g100);--line:var(--g150);--line-strong:var(--g300);
  --text-2:var(--g500);
  --accent-press:#DE3931;--accent-hover:#ED3F35;--on-accent:#fff;
  --focus-ring:var(--ink);--focus:rgba(11,11,12,.16);
  --rail:#1c1c1e;--rail-hi:#fff;--on-rail:#fff;--rail-2:#2f2f33;
  --canvas:#fff;--canvas-ink:#141416;--canvas-mut:#6a6a72;--canvas-line:rgba(20,20,22,.14);--canvas-line2:rgba(20,20,22,.3);
  --track:var(--g150);
  --sh-1:0 1px 2px rgba(17,17,26,.04),0 0 0 1px rgba(17,17,26,.04);
  --sh-2:0 6px 24px rgba(17,17,26,.06),0 1px 2px rgba(17,17,26,.04);
  --r-xs:8px;--r-sm:12px;--r-md:16px;--r-lg:22px;--r-xl:28px;--r-pill:999px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s7:32px;--s8:48px;
  --pad:14px;--h-md:34px;--h-lg:42px;
  --dur-instant:90ms;--dur-fast:180ms;--dur-base:300ms;--dur-slow:550ms;
  --ease-out:cubic-bezier(.2,0,0,1);--ease-in:cubic-bezier(.4,0,1,1);--ease-std:cubic-bezier(.4,0,.2,1);
  --f-ui:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ln0:#0b0b0c;--ln1:#7a7a83;--ln2:#4a4a52;--ln3:#a8a8b0;
  color-scheme:light;
}
html[data-theme=dark]{
  --g0:#141416;--g25:#18181b;--g50:#1c1c20;--g100:#232328;--g150:#2a2a30;--g200:#323239;--g300:#42424a;--g400:#6f6f79;--g500:#a3a3ae;--g600:#b9b9c1;
  --ink:#f2f2f4;--on-ink:#0b0b0c;
  --bg:#0f0f11;--card:#18181b;--paper:#232328;--panel:#2c2c32;--line:#32323a;--line-strong:#4a4a53;
  --focus:rgba(242,242,244,.28);
  --rail:#232328;--rail-hi:#f2f2f4;--rail-2:#37373e;
  --canvas:#eceef1;--canvas-ink:#141416;--canvas-mut:#5a5a62;--canvas-line:rgba(20,20,22,.14);--canvas-line2:rgba(20,20,22,.3);
  --track:#3d3d44;
  --sh-1:0 0 0 1px rgba(255,255,255,.05);
  --sh-2:0 8px 28px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.04);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
*{scrollbar-width:none}
*::-webkit-scrollbar{display:none}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 14px/1.4 var(--f-ui);-webkit-font-smoothing:antialiased;transition:background var(--dur-base) var(--ease-std),color var(--dur-base) var(--ease-std)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.ic{display:block;width:24px;height:24px;background:currentColor;-webkit-mask:var(--ic) center/contain no-repeat;mask:var(--ic) center/contain no-repeat}
.ic.sm{width:20px;height:20px}

/* rail */

.stagefoot{position:relative;z-index:4;margin-top:var(--s4);display:flex;gap:var(--s2);flex-wrap:nowrap;overflow-x:auto;font-size:12px;align-items:center}

<script>
const FONTS=[
  {id:'volt',name:'Вольт',kind:'Гротеск',fam:"'GT Volt'",m:{xh:540,c:2.0,w:785,a:22}},

const fmt=n=>String(n).replace('.',',');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=(()=>{let t;return m=>{const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(t);t=setTimeout(()=>e.classList.remove('on'),4000)}})();

function renderChips(){
  chips.innerHTML=FONTS.map(f=>{
    const on=st.sel.includes(f.id),dis=!on&&st.sel.length>=MAXN;
    return `<button class="chip" data-id="${f.id}" aria-pressed="${on}" ${dis?'aria-disabled="true"':''}><span class="ck"><i class="ic i-check"></i></span><span class="nm" style="font-family:${f.fam}">${f.name}</span></button>`
  }).join('');
  $('#cnt').textContent=`Выбрано ${st.sel.length} из ${MAXN}`;
  edgeFade();
}
function edgeFade(){
  const e=chips,l=e.scrollLeft>2,r=e.scrollLeft+e.clientWidth<e.scrollWidth-2;
  e.dataset.hs=(l?'l ':'')+(r?'r':'');
}
chips.addEventListener('scroll',edgeFade);addEventListener('resize',edgeFade);

const LN=[{c:'#141416',w:1.5,d:''},{c:'#55555d',w:1.5,d:'7 4'},{c:'#85858e',w:1.75,d:'0.1 4',cap:'round'},{c:'#6a6a72',w:1.5,d:'10 3 1 3'}];
const ORDER=[0,1,2,3];
const CT=['var(--ink)','var(--g600)','var(--g500)','var(--g500)'];
function mark(i,card){const l=LN[i];return `<svg class="mk" viewBox="0 0 28 8" aria-hidden="true"><line x1="1" x2="27" y1="4" y2="4" stroke="${card?CT[i]:l.c}" stroke-width="${l.w}" ${l.d?`stroke-dasharray="${l.d}"`:''} stroke-linecap="${l.cap||'butt'}"/></svg>`}
function cardHTML(f,i){
  const m=f.m;
  return `<article class="fc" data-id="${f.id}" aria-label="${f.name}">
  <div class="fh">${mark(i,1)}<div class="t"><b>${f.name}</b><small>${f.kind}</small></div>
    <button class="rm" data-rm="${f.id}" aria-label="Убрать «${f.name}» из сравнения" title="Убрать из сравнения"><i class="ic i-close"></i></button></div>
  <div class="samplewrap"><div><div class="sample"><div class="tx" contenteditable="plaintext-only" spellcheck="false" data-ph="Введите текст" style="font-family:${f.fam}" role="textbox" aria-label="Образец, ${f.name}"></div></div></div></div>
  <dl class="met">
    <li><dt>Высота строчных</dt><dd>${m.xh}<small>из 1000</small></dd></li>
    <li><dt>Контраст</dt><dd>${fmt(m.c)}<small>к 1</small></dd></li>
    <li><dt>Ширина</dt><dd>${m.w}<small>из 1000</small></dd></li>
    <li><dt>Апертура</dt><dd>${m.a}<small>%</small></dd></li>
  </dl>
  <button class="pb" data-open="${f.id}">Открыть в редакторе</button>
</article>`;
}
function syncTexts(except){
  document.querySelectorAll('.tx').forEach(e=>{if(e!==except&&e.textContent!==st.text)e.textContent=st.text});
  fillLayers();
}
function renderCards(newId){
  const prev=new Set([...grid.children].map(c=>c.dataset.id));
  grid.dataset.n=st.sel.length;grid.style.setProperty('--n',st.sel.length);
  grid.innerHTML=st.sel.map((id,i)=>cardHTML(by(id),i)).join('');
  grid.querySelectorAll('.fc').forEach(c=>{if(newId===c.dataset.id)c.classList.add('in')});
  grid.querySelectorAll('.rm').forEach(b=>b.disabled=st.sel.length<=MINN);
  renderLayers();syncTexts();applySize();
}
function renderLayers(){
  field.innerHTML='<svg id="svg" aria-hidden="true"></svg><div class="caret" id="caret"></div><span class="ph" id="ph">Введите текст</span>';
  $('#legend').innerHTML=st.sel.map((id,i)=>`<span class="lg" tabindex="0" data-i="${i}">${mark(i)}${by(id).name}</span>`).join('')+'<span class="gx">Тонкие линии показывают высоту строчных</span>';
  drawOverlay();
}
function cellW(ch){return Math.max(...st.sel.map(id=>textW(by(id).fam,100,ch)))/100}
function drawOverlay(){
  const svg=$('#svg');if(!svg)return;
  const v=st.eff||72,chars=[...st.text],W=field.clientWidth;
  const ws=chars.map(cellW),tot=ws.reduce((a,b)=>a+b,0)*v;
  const x0=Math.max(0,(W-tot)/2),base=Math.round(v*1.0);
  field.style.height=Math.round(v*1.3)+'px';
  let out=`<line class="bl" x1="0" x2="${W}" y1="${base}" y2="${base}"/><text class="bt" x="${W}" y="${base+16}" text-anchor="end">Базовая линия</text>`;
  st.sel.forEach((id,i)=>{
    const f=by(id),l=LN[i];let x=x0,t='';
    chars.forEach((c,k)=>{if(c!==' ')t+=`<text x="${(x+ws[k]*v/2).toFixed(1)}" y="${base}" text-anchor="middle" style="font-family:${f.fam};font-size:${v}px">${esc(c)}</text>`;x+=ws[k]*v});
    const yx=(base-f.m.xh/1000*v).toFixed(1);
    out+=`<g class="ly" data-i="${i}" style="--c:${l.c};--w:${l.w}" stroke-dasharray="${l.d}" stroke-linecap="${l.cap||'butt'}"><line class="xl" x1="0" x2="${W}" y1="${yx}" y2="${yx}" stroke="${l.c}" stroke-dasharray="none"/>${t}</g>`;
  });
  svg.innerHTML=out;
  svg.querySelectorAll('.ly text:not(.xl)').forEach(e=>{e.setAttribute('stroke-width',LN[+e.closest('.ly').dataset.i].w)});
  const ct=$('#caret');ct.style.left=(x0+tot+2)+'px';ct.style.top=(base-v*.8)+'px';ct.style.height=(v*1.0)+'px';
  const ph=$('#ph');ph.classList.toggle('on',!chars.length);
  const cc=$('#catch');if(cc&&cc.textContent!==st.text)cc.textContent=st.text;
}
function fillLayers(){drawOverlay()}
let measCtx=document.createElement('canvas').getContext('2d');
function textW(fam,px,t){measCtx.font=`${px}px ${fam}`;return measCtx.measureText(t).width}
function fitMax(){
  const t=st.text||'Аа';
  if(st.view==='overlay'){
    const W=stage.clientWidth-parseFloat(getComputedStyle(stage).paddingLeft)*2-4;
    const w=[...t].reduce((a,c)=>a+cellW(c),0)*100;
    return Math.floor(W/w*100);
  }
  let cap=999;
  grid.querySelectorAll('.sample').forEach((s,i)=>{
    const f=by(st.sel[i]);if(!f)return;
    const cs=getComputedStyle(s),W=s.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight)-2;
    const lw=Math.max(...t.split(/\s+/).map(w=>textW(f.fam,100,w)),1);
    cap=Math.min(cap,Math.floor(W/lw*100));
  });
  return cap;
}
function applySize(){
  const ov=st.view==='overlay';
  const mx=ov?Math.max(24,Math.min(400,fitMax())):Math.max(24,Math.min(200,fitMax()));
  size.max=mx;
  const w=ov?(st.wantO==null?Math.round(mx*.9):st.wantO):st.want;
  const v=Math.max(16,Math.min(w,mx));
  size.value=v;st.eff=v;
  $('#sizev').textContent=v+' px';
  size.style.setProperty('--p',((v-size.min)/(mx-size.min)*100)+'%');
  grid.querySelectorAll('.tx').forEach(e=>e.style.fontSize=v+'px');
  if(ov)drawOverlay();
}
size.addEventListener('input',()=>{if(st.view==='overlay')st.wantO=+size.value;else st.want=+size.value;applySize()});
Promise.all(FONTS.map(f=>document.fonts.load('40px '+f.fam,'Аа'))).then(()=>{fillLayers();applySize()});

function setView(v){
  if(v===st.view)return;st.view=v;app.dataset.view=v;
  $('#seg').dataset.v=v;
  document.querySelectorAll('#seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));
  setTimeout(applySize,30);setTimeout(applySize,360);applySize();
}
$('#seg').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setView(b.dataset.v)});

function toggleFont(id){
  const i=st.sel.indexOf(id);
  if(i>=0){
    if(st.sel.length<=MINN){toast('Для сравнения нужно не меньше двух шрифтов.');return}
    const c=grid.querySelector(`[data-id="${id}"]`);
    st.sel.splice(i,1);renderChips();
    if(c){c.classList.add('out');setTimeout(()=>renderCards(),180)}else renderCards();
  }else{
    if(st.sel.length>=MAXN){toast('В сравнении может быть не больше четырёх шрифтов.');return}
    st.sel.push(id);renderChips();renderCards(id);
  }
}
chips.addEventListener('click',e=>{const b=e.target.closest('.chip');if(b)toggleFont(b.dataset.id)});
grid.addEventListener('click',e=>{
  const r=e.target.closest('[data-rm]');if(r&&!r.disabled){toggleFont(r.dataset.rm);return}
  const o=e.target.closest('[data-open]');if(o){toast(`В прототипе редактор не открывается. В сервисе откроется «${by(o.dataset.open).name}» с этим текстом.`);return}
  const s=e.target.closest('.sample');if(s&&!e.target.closest('.tx'))s.querySelector('.tx').focus();
});
grid.addEventListener('mouseover',e=>{const c=e.target.closest('.fc');setHl(c&&st.view==='overlay'?st.sel.indexOf(c.dataset.id):null)});
stage.addEventListener('click',e=>{if(!e.target.closest('.lg'))$('#catch').focus()});
grid.addEventListener('mouseleave',()=>setHl(null));
grid.addEventListener('focusin',e=>{const c=e.target.closest('.fc');if(st.view==='overlay')setHl(c?st.sel.indexOf(c.dataset.id):null)});
grid.addEventListener('focusout',()=>setHl(null));
const leg=$('#legend');
leg.addEventListener('mouseover',e=>{const l=e.target.closest('.lg');if(l)setHl(+l.dataset.i)});
leg.addEventListener('mouseleave',()=>setHl(null));
leg.addEventListener('focusin',e=>{const l=e.target.closest('.lg');if(l)setHl(+l.dataset.i)});
leg.addEventListener('focusout',()=>setHl(null));
function setHl(i){if(i==null||i<0)delete stage.dataset.hl;else stage.dataset.hl=i}

function onInput(e){
  const el=e.target;if(!el.matches('.tx,.catch'))return;
  let t=el.textContent.replace(/\n/g,' ');
  if(t.length>MAXLEN){t=t.slice(0,MAXLEN);el.textContent=t;const r=document.createRange();r.selectNodeContents(el);r.collapse(false);const s=getSelection();s.removeAllRanges();s.addRange(r)}
  st.text=t;syncTexts(el);applySize();
}
document.addEventListener('input',onInput);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.tx,.catch'))e.preventDefault()});

function setTheme(t){
  document.documentElement.dataset.theme=t;
  ['themeic','themeic2'].forEach(id=>{$('#'+id).className='ic '+(t==='dark'?'i-sun':'i-moon')});
  $('#theme').title=t==='dark'?'Светлая тема':'Тёмная тема';
}
['#theme','#theme2'].forEach(s=>$(s).addEventListener('click',()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark')));
addEventListener('resize',()=>applySize());

renderChips();renderCards();
const q=new URLSearchParams(location.search);
if(q.get('theme'))setTheme(q.get('theme'));
if(q.get('view'))setView(q.get('view'));
if(q.get('n')){st.sel=['volt','stroka','renessa','propis'].slice(0,+q.get('n'));renderChips();renderCards()}
</script>
</body>
</html>
