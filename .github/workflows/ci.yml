name: Font matrix diagnostic

on:
  push:

permissions:
  contents: read

jobs:
  font-matrix:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: G-type актуальный
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-ci.txt
      - run: node tests/v96/run.mjs export --strict
