name: Project recovery diagnostic

on:
  push:

permissions:
  contents: read

jobs:
  project-recovery:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: G-type актуальный
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: timeout 120s node --test tests/audit/project-recovery.test.mjs
