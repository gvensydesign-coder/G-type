name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-regression:
    if: false
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: G-type актуальный
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: G-type актуальный/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r requirements-ci.txt
          command -v patch
          command -v google-chrome
      - name: Rebuild checked-in editor twice
        run: |
          set -o pipefail
          {
            cp public/g-type-v96.html "$RUNNER_TEMP/g-type-v96-committed.html"
            python service/build.py
            cp public/g-type-v96.html "$RUNNER_TEMP/g-type-v96-first.html"
            python service/build.py
            cmp "$RUNNER_TEMP/g-type-v96-first.html" public/g-type-v96.html
            python service/compare_artifacts.py "$RUNNER_TEMP/g-type-v96-committed.html" public/g-type-v96.html
          } 2>&1 | tee "$RUNNER_TEMP/g-type-build-check.log"
      - name: Report build failure
        if: ${{ failure() }}
        run: |
          if [ -f "$RUNNER_TEMP/g-type-build-check.log" ]; then
            message=$(tail -n 8 "$RUNNER_TEMP/g-type-build-check.log")
            echo "::error title=Build check::${message//$'\n'/%0A}"
          fi
      - name: Lint
        run: npm run lint
      - name: Production build
        if: ${{ always() }}
        run: npm run build
      - name: Audit regressions
        if: ${{ always() }}
        run: node --test --test-concurrency=1 tests/audit/*.cjs tests/audit/*.mjs
      - name: Browser regression
        if: ${{ always() }}
        run: npm run test:v96 -- --strict
  dependency-audit:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: G-type актуальный
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Trial patched PostCSS override
        run: |
          npm pkg set "overrides.postcss=8.5.33"
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm ls postcss
          npm audit --omit=dev --json
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: security-lock-trial
          path: |
            G-type актуальный/package.json
            G-type актуальный/package-lock.json
      - run: npm audit --json
