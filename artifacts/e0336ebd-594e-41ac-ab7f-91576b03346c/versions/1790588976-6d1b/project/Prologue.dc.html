<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Пролог</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Ruslan+Display&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0D0A;font-family:'Alegreya Sans',sans-serif;color:#E4DFD2}
a{color:#D9A15A}a:hover{color:#F0C07E}
.frame{animation:frameIn 6s ease-in-out forwards}
@keyframes frameIn{0%{opacity:0;transform:translateY(24px) scale(.97)}15%{opacity:1;transform:translateY(0) scale(1)}85%{opacity:1}100%{opacity:0;transform:translateY(-10px) scale(1.01)}}
.kb{animation:kb 6s linear forwards;transform-origin:50% 50%}
@keyframes kb{from{transform:scale(1.04) translateX(-12px)}to{transform:scale(1.16) translateX(14px)}}
.txt{animation:recede 6s ease-in forwards;transform-origin:50% 50%}
@keyframes recede{
0%{transform:scale(1.7);opacity:0;filter:blur(8px);z-index:3}
16%{transform:scale(1.12);opacity:1;filter:blur(0);z-index:3}
48%{transform:scale(.96) translateY(-20px);opacity:1;filter:blur(0);z-index:3}
54%{z-index:1}
100%{transform:scale(.42) translateY(-560px);opacity:0;filter:blur(3px);z-index:1}}
.bar{animation:grow 6s linear forwards}
@keyframes grow{from{width:0}to{width:100%}}
.fog{animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-50px)}to{transform:translateX(50px)}}
.eyes{animation:blink 2.6s infinite}
@keyframes blink{0%,88%,100%{opacity:1}92%{opacity:0}}
.end{animation:fadeUp 1.4s ease-out forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.skip{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;background:rgba(14,16,13,.6);border:1px solid #3A3F35;font-size:15px;letter-spacing:1px;color:#CFCABB;text-decoration:none}
.skip:hover{color:#F3EDDD;border-color:#C27E32}
.nx{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 24px;background:none;border:1px solid #4A4F43;border-radius:2px;cursor:pointer;font-family:'Alegreya Sans',sans-serif;font-size:17px;letter-spacing:2px;color:#E4DFD2;text-decoration:none}
.nx:hover{border-color:#C27E32;color:#F3EDDD}
</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #0B0D0A; font-family: 'Alegreya Sans', sans-serif; color: #E4DFD2">

<svg width="1280" height="720" viewBox="0 0 1280 720" style="position: absolute; left: 0; top: 0" aria-hidden="true">
<g class="fog"><ellipse cx="640" cy="160" rx="820" ry="120" fill="#7F9681" opacity="0.06"></ellipse><ellipse cx="640" cy="600" rx="820" ry="140" fill="#7F9681" opacity="0.07"></ellipse></g>
</svg>

<sc-for list="{{beats}}" as="b" hint-placeholder-count="1">
<sc-if value="{{b.on}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; left: 0; top: 0; width: 1280px; height: 720px">
<div class="frame" style="position: absolute; left: 280px; top: 150px; width: 720px; height: 405px; z-index: 2; overflow: hidden; border: 1px solid #4A4F43; box-shadow: 0 30px 80px rgba(0,0,0,0.7)">
<div class="kb" style="width: 720px; height: 405px">
<sc-if value="{{b.forest}}" hint-placeholder-val="{{ true }}">
<svg width="720" height="405" viewBox="0 0 720 405" aria-hidden="true">
<rect width="720" height="405" fill="#1B2A22"></rect>
<rect width="720" height="200" fill="#B7C4AF" opacity="0.12"></rect>
<path d="M0 405 V200 L40 110 L80 210 L130 80 L180 220 L230 130 L280 230 L340 90 L400 230 L450 140 L500 220 L560 70 L620 220 L670 130 L720 200 V405 Z" fill="#3F684A"></path>
<path d="M0 405 V290 L60 170 L120 300 L200 190 L270 310 L450 320 L520 180 L600 300 L660 200 L720 290 V405 Z" fill="#1F4032"></path>
</svg>
</sc-if>
<sc-if value="{{b.fog}}" hint-placeholder-val="{{ false }}">
<svg width="720" height="405" viewBox="0 0 720 405" aria-hidden="true">
<rect width="720" height="405" fill="#121A18"></rect>
<path d="M0 405 V230 L50 130 L100 240 L170 110 L240 250 L480 250 L550 120 L620 240 L680 150 L720 230 V405 Z" fill="#101614"></path>
<g opacity="0.9"><rect y="220" width="720" height="70" fill="#B7C4AF" opacity="0.12"></rect><rect y="270" width="720" height="90" fill="#B7C4AF" opacity="0.1"></rect></g>
<g class="eyes"><circle cx="210" cy="250" r="3" fill="#D04A4A"></circle><circle cx="228" cy="250" r="3" fill="#D04A4A"></circle><circle cx="470" cy="275" r="3" fill="#D04A4A"></circle><circle cx="486" cy="275" r="3" fill="#D04A4A"></circle><circle cx="600" cy="232" r="2.5" fill="#D04A4A"></circle><circle cx="613" cy="232" r="2.5" fill="#D04A4A"></circle></g>
</svg>
</sc-if>
<sc-if value="{{b.village}}" hint-placeholder-val="{{ false }}">
<svg width="720" height="405" viewBox="0 0 720 405" aria-hidden="true">
<rect width="720" height="405" fill="#15150F"></rect>
<rect y="290" width="720" height="115" fill="#1E1C16"></rect>
<g fill="#0E0D0A"><path d="M80 300 V230 L140 185 L200 230 V300 Z"></path><path d="M250 300 V220 L320 170 L390 220 V300 Z"></path><path d="M470 300 V240 L520 205 L570 240 V300 Z"></path><path d="M600 300 V225 L650 190 L700 225 V300 Z"></path></g>
<rect x="305" y="240" width="18" height="16" fill="#FFB257"></rect>
<rect x="298" y="233" width="32" height="30" fill="#FFB257" opacity="0.15"></rect>
<path d="M120 300 L150 250 M520 300 L500 262" stroke="#433F39" stroke-width="3"></path>
<rect y="260" width="720" height="60" fill="#B7C4AF" opacity="0.06"></rect>
</svg>
</sc-if>
<sc-if value="{{b.hero}}" hint-placeholder-val="{{ false }}">
<svg width="720" height="405" viewBox="0 0 720 405" aria-hidden="true">
<rect width="720" height="405" fill="#1A1614"></rect>
<rect y="120" width="720" height="120" fill="#C27E32" opacity="0.08"></rect>
<path d="M0 300 C200 280 520 280 720 300 V405 H0 Z" fill="#141A16"></path>
<path d="M0 320 C240 310 480 310 720 320" stroke="#7F9681" stroke-width="1" opacity="0.3"></path>
<path d="M340 130 L360 96 L380 130 Z" fill="#0C0B0A"></path>
<path d="M334 128 H386 V160 H334 Z" fill="#0C0B0A"></path>
<path d="M322 160 H398 L412 300 H308 Z" fill="#0C0B0A"></path>
<path d="M322 164 C290 210 286 270 296 312 L330 300 L336 170 Z" fill="#793838"></path>
<path d="M398 164 C430 210 434 270 424 312 L390 300 L384 170 Z" fill="#793838"></path>
<circle cx="296" cy="236" r="30" fill="#793838" stroke="#0C0B0A" stroke-width="4"></circle>
<circle cx="296" cy="236" r="9" fill="#C27E32"></circle>
<path d="M420 180 L452 94" stroke="#646A61" stroke-width="4"></path>
</svg>
</sc-if>
</div>
</div>
<div class="txt" style="position: absolute; left: 140px; right: 140px; top: 300px; text-align: center; font-family: 'Ruslan Display', serif; font-size: 42px; line-height: 1.3; letter-spacing: 1px; color: #EDE7D8; text-shadow: 0 2px 24px rgba(0,0,0,0.9)">{{b.text}}</div>
<div style="position: absolute; left: 280px; top: 575px; width: 720px; height: 1px; background: #2C312A"><div class="bar" style="height: 1px; background: #C27E32"></div></div>
</div>
</sc-if>
</sc-for>

<sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
<div class="end" style="position: absolute; left: 0; top: 0; width: 1280px; height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px">
<div style="font-size: 15px; letter-spacing: 4px; color: #9A9C8C">ПРОЛОГ</div>
<h1 style="margin: 0; font-family: 'Ruslan Display', serif; font-weight: 400; font-size: 64px; letter-spacing: 3px; color: #E4DFD2">Русская хтонь</h1>
<div style="display: flex; gap: 12px">
<a class="nx" href="Novel.dc.html">НАЧАТЬ</a>
<button class="nx" onClick="{{replay}}">СМОТРЕТЬ СНОВА</button>
</div>
</div>
</sc-if>

<div style="position: absolute; left: 0; top: 0; width: 1280px; height: 56px; background: #050605; z-index: 5"></div>
<div style="position: absolute; left: 0; bottom: 0; width: 1280px; height: 56px; background: #050605; z-index: 5; display: flex; align-items: center; justify-content: center; gap: 10px">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="4">
<span style="{{d.style}}"></span>
</sc-for>
</div>
<div style="position: absolute; top: 6px; right: 24px; z-index: 6">
<a class="skip" href="Novel.dc.html">Пропустить пролог
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 5l7 7-7 7M12 5l7 7-7 7"></path></svg>
</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  componentDidMount() { this.start(); }
  componentWillUnmount() { clearInterval(this.t); }
  start() {
    clearInterval(this.t);
    this.setState({ i: 0 });
    this.t = setInterval(() => {
      const i = ((this.state && this.state.i) || 0) + 1;
      this.setState({ i: i });
      if (i >= 4) clearInterval(this.t);
    }, 6000);
  }
  renderVals() {
    const i = (this.state && this.state.i) || 0;
    const data = [
      { scene: 'forest', text: 'Когда-то лес был просто лесом.' },
      { scene: 'fog', text: 'Потом пришёл туман. А с ним — те, кто в нём живёт.' },
      { scene: 'village', text: 'Деревни пустели одна за другой. Выселки остались последними.' },
      { scene: 'hero', text: 'И тогда из-за реки пришёл богатырь.' }
    ];
    return {
      beats: data.map((b, k) => ({
        on: k === i, text: b.text,
        forest: b.scene === 'forest', fog: b.scene === 'fog',
        village: b.scene === 'village', hero: b.scene === 'hero'
      })),
      done: i >= data.length,
      dots: data.map((b, k) => ({
        style: 'width: 7px; height: 7px; transform: rotate(45deg); ' +
          (k === i ? 'background: #C27E32;' : k < i ? 'background: #6B5A45;' : 'border: 1px solid #4A4F43;')
      })),
      replay: () => this.start()
    };
  }
}
</script>
</body>
</html>
