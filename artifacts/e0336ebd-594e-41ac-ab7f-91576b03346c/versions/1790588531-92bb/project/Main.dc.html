<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Загрузка</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Ruslan+Display&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E100D;font-family:'Alegreya Sans',sans-serif;color:#E4DFD2}
a{color:#D9A15A}a:hover{color:#F0C07E}
.enter{animation:pulse 2.4s ease-in-out infinite;text-decoration:none}
.enter:hover{border-color:#C27E32 !important}
.sigil{animation:breathe 3.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: radial-gradient(ellipse at 50% 42%, #18251E 0%, #0E100D 68%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; font-family: 'Alegreya Sans', sans-serif; color: #E4DFD2">
<svg class="sigil" width="88" height="88" viewBox="0 0 88 88" fill="none" stroke="#C27E32" stroke-width="1.5" aria-hidden="true">
<path d="M44 6 L82 44 L44 82 L6 44 Z"></path>
<path d="M44 6 L44 82 M6 44 L82 44"></path>
<path d="M44 25 L63 44 L44 63 L25 44 Z" stroke="#8E3B3B"></path>
<circle cx="34" cy="34" r="2" fill="#C27E32"></circle>
<circle cx="54" cy="34" r="2" fill="#C27E32"></circle>
<circle cx="34" cy="54" r="2" fill="#C27E32"></circle>
<circle cx="54" cy="54" r="2" fill="#C27E32"></circle>
</svg>
<h1 style="margin: 0; font-family: 'Ruslan Display', serif; font-weight: 400; font-size: 64px; letter-spacing: 3px; color: #E4DFD2">Русская хтонь</h1>
<div style="display: flex; flex-direction: column; align-items: center; gap: 12px; height: 72px">
<sc-if value="{{loading}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
<div style="width: 420px; height: 2px; background: #2C312A; position: relative">
<div style="height: 2px; width: {{pctStr}}; background: #C27E32; box-shadow: 0 0 10px #C27E32"></div>
</div>
<div style="display: flex; justify-content: space-between; width: 420px; font-size: 15px; color: #9A9C8C">
<span>{{stage}}…</span>
<span>{{pctStr}}</span>
</div>
</div>
</sc-if>
<sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
<a class="enter" href="Start.dc.html" style="display: inline-flex; align-items: center; height: 48px; padding: 0 28px; border: 1px solid #4A4F43; border-radius: 2px; font-size: 18px; letter-spacing: 2px; color: #E4DFD2">НАЖМИТЕ, ЧТОБЫ ВОЙТИ</a>
</sc-if>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 40px; text-align: center; font-size: 16px; color: #8B8E80; font-style: italic">Примета: {{tip}}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.tipIdx = Math.floor(Math.random() * 4);
    this.t = setInterval(() => {
      const p = (this.state && this.state.pct) || 0;
      if (p >= 100) { clearInterval(this.t); return; }
      this.setState({ pct: Math.min(100, p + 1 + Math.random() * 3) });
    }, 80);
  }
  componentWillUnmount() { clearInterval(this.t); }
  renderVals() {
    const p = (this.state && this.state.pct) || 0;
    const stages = ['Будим домового', 'Раскладываем обереги', 'Сгущаем туман над болотом', 'Прислушиваемся к лесу'];
    const tips = [
      'ночью у болота лучше не шуметь.',
      'красная тряпица на столбе — место уже занято.',
      'домового кормят с вечера, а не с утра.',
      'если тотем заскрипел — не оборачивайся.'
    ];
    return {
      pctStr: Math.round(p) + '%',
      loading: p < 100,
      done: p >= 100,
      stage: stages[Math.min(3, Math.floor(p / 25))],
      tip: tips[this.tipIdx || 0]
    };
  }
}
</script>
</body>
</html>
