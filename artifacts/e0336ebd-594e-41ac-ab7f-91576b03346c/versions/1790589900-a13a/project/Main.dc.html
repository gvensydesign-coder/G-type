<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Загрузка</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Ruslan+Display&family=Kurale&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0A08;font-family:'Kurale',serif;color:#E8DFC8}
a{color:#E08A3C}a:hover{color:#F2B26A}
.btn{position:relative;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:10px;height:54px;padding:0 40px;border:0;background:linear-gradient(180deg,#7A5334,#2A1B12);clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,16px 100%,0 50%);cursor:pointer;font-family:'Ruslan Display',serif;font-size:18px;letter-spacing:3px;color:#E8DFC8;text-decoration:none;transition:transform .18s,filter .18s,color .2s,background .25s}
.btn::before{content:'';position:absolute;inset:2px;z-index:-1;clip-path:inherit;background:linear-gradient(180deg,#2E2119,#150F0B);transition:background .25s}
.btn::after{content:'';position:absolute;left:30px;right:30px;bottom:10px;height:1px;background:linear-gradient(90deg,transparent,#C8412F,transparent);transform:scaleX(.2);opacity:.5;transition:transform .35s,opacity .35s}
.btn:hover{color:#F6D29A;transform:translateY(-2px);background:linear-gradient(180deg,#E08A3C,#6B2A15)}
.btn:hover::before{background:linear-gradient(180deg,#3B2519,#1A100B)}
.btn:hover::after{transform:scaleX(1);opacity:1}
.btn:active{transform:translateY(1px) scale(.96);filter:brightness(.8)}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.75}50%{opacity:1}}
.spin{animation:spin 60s linear infinite;transform-origin:110px 110px}
.spinr{animation:spin 90s linear infinite reverse;transform-origin:110px 110px}
@keyframes spin{to{transform:rotate(360deg)}}
.core{animation:core 3.2s ease-in-out infinite;transform-origin:110px 110px}
@keyframes core{0%,100%{opacity:.7;transform:scale(.96)}50%{opacity:1;transform:scale(1.04)}}
.ember{position:absolute;bottom:-10px;width:3px;height:3px;border-radius:50%;background:#F2A25A;box-shadow:0 0 6px #E08A3C,0 0 12px #B8392B;animation:rise linear infinite;opacity:0}
@keyframes rise{0%{transform:translate(0,0);opacity:0}10%{opacity:.95}70%{opacity:.6}100%{transform:translate(40px,-700px);opacity:0}}
.fog{animation:drift 20s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-60px)}to{transform:translateX(60px)}}
.fill{position:relative;height:100%;background:repeating-linear-gradient(135deg,#8E2A22 0 6px,#6A1C16 6px 12px);box-shadow:0 0 12px rgba(200,65,47,.6);transition:width .1s linear}
.fill::after{content:'';position:absolute;right:-3px;top:-4px;width:6px;height:18px;background:radial-gradient(#FFD08A,#E08A3C 50%,transparent 70%);filter:blur(1px);animation:pulse .6s infinite}
.appear{animation:appear 1s ease-out}
@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: radial-gradient(ellipse at 50% 42%, #1E2A22 0%, #111411 45%, #0B0A08 80%); font-family: 'Kurale', serif; color: #E8DFC8">
<svg width="0" height="0" style="position: absolute" aria-hidden="true"><defs>
<pattern id="orn" width="28" height="14" patternUnits="userSpaceOnUse"><path d="M14 1.5 L21 7 L14 12.5 L7 7 Z" fill="none" stroke="#A8352A" stroke-width="1.3"></path><path d="M14 4.5 L17 7 L14 9.5 L11 7 Z" fill="#A8352A"></path><path d="M0 7 H5 M23 7 H28 M3 3 L5 7 L3 11 M25 3 L23 7 L25 11" stroke="#A8352A" stroke-width="1" fill="none"></path></pattern>
<filter id="gr"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter>
</defs></svg>

<svg width="1280" height="720" viewBox="0 0 1280 720" style="position: absolute; left: 0; top: 0" aria-hidden="true">
<g class="fog"><ellipse cx="640" cy="640" rx="900" ry="120" fill="#7F9681" opacity="0.08"></ellipse><ellipse cx="300" cy="120" rx="500" ry="80" fill="#7F9681" opacity="0.05"></ellipse></g>
<g stroke="#5A4634" stroke-width="1.2" fill="none" opacity="0.8">
<path d="M32 110 V32 H110 M32 48 H48 V32"></path><path d="M1248 110 V32 H1170 M1248 48 H1232 V32"></path>
<path d="M32 610 V688 H110 M32 672 H48 V688"></path><path d="M1248 610 V688 H1170 M1248 672 H1232 V688"></path>
</g>
<g fill="#A8352A"><path d="M40 40 l5 -5 l5 5 l-5 5z"></path><path d="M1230 40 l5 -5 l5 5 l-5 5z"></path><path d="M40 680 l5 -5 l5 5 l-5 5z"></path><path d="M1230 680 l5 -5 l5 5 l-5 5z"></path></g>
</svg>

<sc-for list="{{embers}}" as="e" hint-placeholder-count="14"><span class="ember" style="{{e.style}}"></span></sc-for>

<div style="position: absolute; left: 0; top: 0; width: 1280px; height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px">
<svg width="220" height="220" viewBox="0 0 220 220" aria-hidden="true">
<g class="spin" fill="none" stroke="#6B5440" stroke-width="1">
<circle cx="110" cy="110" r="100" stroke-dasharray="2 6"></circle>
<circle cx="110" cy="110" r="92"></circle>
</g>
<g class="spinr" fill="none" stroke="#C8702F" stroke-width="1.4">
<rect x="50" y="50" width="120" height="120"></rect>
<rect x="50" y="50" width="120" height="120" transform="rotate(45 110 110)"></rect>
</g>
<g class="core">
<path d="M110 62 L158 110 L110 158 L62 110 Z" fill="#1A120D" stroke="#A8352A" stroke-width="2"></path>
<path d="M110 62 V158 M62 110 H158" stroke="#A8352A" stroke-width="1.2"></path>
<path d="M110 86 L134 110 L110 134 L86 110 Z" fill="#8E2A22"></path>
<g fill="#E8C98A"><circle cx="96" cy="96" r="3"></circle><circle cx="124" cy="96" r="3"></circle><circle cx="96" cy="124" r="3"></circle><circle cx="124" cy="124" r="3"></circle></g>
<path d="M104 104 L116 116 M116 104 L104 116" stroke="#E8C98A" stroke-width="1.5"></path>
</g>
</svg>
<h1 style="margin: 0; font-family: 'Ruslan Display', serif; font-weight: 400; font-size: 76px; letter-spacing: 4px; color: #E8DFC8; text-shadow: 0 0 24px rgba(200,65,47,0.35), 0 3px 0 #000">Русская хтонь</h1>
<svg width="420" height="14" aria-hidden="true"><rect width="420" height="14" fill="url(#orn)"></rect></svg>
<div style="display: flex; flex-direction: column; align-items: center; gap: 12px; height: 86px; margin-top: 8px">
<sc-if value="{{loading}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
<div style="width: 460px; height: 12px; box-sizing: border-box; padding: 2px; background: #0E0A08; border: 1px solid #5A4634; box-shadow: inset 0 0 0 1px #000, 0 0 0 3px #1A120D, 0 0 0 4px #3B2C20">
<div class="fill" style="width: {{pctStr}}"></div>
</div>
<div style="display: flex; justify-content: space-between; width: 460px; font-size: 16px; color: #A89A80">
<span style="font-style: italic">{{stage}}…</span>
<span style="font-family: 'Ruslan Display', serif; color: #E08A3C">{{pctStr}}</span>
</div>
</div>
</sc-if>
<sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
<a class="btn pulse appear" href="Start.dc.html">ВОЙТИ В ТУМАН</a>
</sc-if>
</div>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 48px; display: flex; justify-content: center; align-items: center; gap: 14px; font-size: 17px; color: #8F8570; font-style: italic">
<svg width="10" height="10" viewBox="0 0 10 10"><path d="M5 0 L10 5 L5 10 L0 5 Z" fill="#8E2A22"></path></svg>
<span>Примета: {{tip}}</span>
<svg width="10" height="10" viewBox="0 0 10 10"><path d="M5 0 L10 5 L5 10 L0 5 Z" fill="#8E2A22"></path></svg>
</div>
<svg width="1280" height="720" style="position: absolute; left: 0; top: 0; pointer-events: none; opacity: 0.1; mix-blend-mode: overlay" aria-hidden="true"><rect width="1280" height="720" filter="url(#gr)"></rect></svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.tipIdx = Math.floor(Math.random() * 4);
    this.t = setInterval(() => {
      const p = (this.state && this.state.pct) || 0;
      if (p >= 100) { clearInterval(this.t); return; }
      this.setState({ pct: Math.min(100, p + 1 + Math.random() * 3) });
    }, 80);
  }
  componentWillUnmount() { clearInterval(this.t); }
  renderVals() {
    const p = (this.state && this.state.pct) || 0;
    const stages = ['Будим домового', 'Раскладываем обереги', 'Сгущаем туман над болотом', 'Прислушиваемся к лесу'];
    const tips = [
      'ночью у болота лучше не шуметь.',
      'красная тряпица на столбе — место уже занято.',
      'домового кормят с вечера, а не с утра.',
      'если тотем заскрипел — не оборачивайся.'
    ];
    const embers = Array.from({ length: 14 }, (_, k) => ({
      style: 'left: ' + ((k * 97) % 1260 + 10) + 'px; animation-duration: ' + (7 + (k * 37) % 7) + 's; animation-delay: ' + ((k * 13) % 9) + 's'
    }));
    return {
      embers: embers,
      pctStr: Math.round(p) + '%',
      loading: p < 100,
      done: p >= 100,
      stage: stages[Math.min(3, Math.floor(p / 25))],
      tip: tips[this.tipIdx || 0]
    };
  }
}
</script>
</body>
</html>
