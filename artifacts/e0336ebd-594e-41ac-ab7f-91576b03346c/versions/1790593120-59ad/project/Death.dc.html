<link href="https://fonts.googleapis.com/css2?family=Ruslan+Display&family=Kurale&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#050404;font-family:'Kurale',serif;color:#E8DFC8}
a{color:#E08A3C}a:hover{color:#F2B26A}
.rus{font-family:'Ruslan Display',serif;font-weight:400}
.btn{position:relative;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 36px;border:0;background:linear-gradient(180deg,#7A5334,#2A1B12);clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,16px 100%,0 50%);cursor:pointer;font-family:'Ruslan Display',serif;font-size:15px;letter-spacing:3px;color:#E8DFC8;text-decoration:none;transition:transform .18s,filter .18s,color .2s,background .25s}
.btn::before{content:'';position:absolute;inset:2px;z-index:-1;clip-path:inherit;background:linear-gradient(180deg,#2E2119,#150F0B)}
.btn:hover{color:#F6D29A;transform:translateY(-2px);background:linear-gradient(180deg,#E08A3C,#6B2A15)}
.btn:active{transform:scale(.96);filter:brightness(.8)}
.btn.red{background:linear-gradient(180deg,#C8412F,#5E1914)}
.btn.red::before{background:linear-gradient(180deg,#8E2A22,#4A120E)}
.pulse{animation:pulse 4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:.9}}
.fall{animation:fall 2.4s cubic-bezier(.2,.7,.2,1) both}
@keyframes fall{from{opacity:0;letter-spacing:30px;filter:blur(10px)}to{opacity:1;letter-spacing:4px;filter:none}}
.up1{animation:up .9s ease-out 1.4s both}
.up2{animation:up .9s ease-out 2s both}
.up3{animation:up .9s ease-out 2.6s both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.fog{animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-60px)}to{transform:translateX(60px)}}
.crow{animation:crow 9s linear infinite}
@keyframes crow{from{transform:translate(-80px,0)}to{transform:translate(1400px,-60px)}}
.flap{animation:flap .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(-.4)}}
.hand{animation:hand 6s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
@keyframes hand{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-10px) rotate(3deg)}}
.stat{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 24px;border-left:1px solid #3B2C20}
.stat:first-child{border-left:0}
</style>
</helmet>
