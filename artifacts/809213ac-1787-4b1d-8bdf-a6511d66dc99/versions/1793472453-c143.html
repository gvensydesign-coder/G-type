  g.add(mesh(new TH.IcosahedronGeometry(.07,0),C.azur,0,.68,0));return g;},

  const r=mesh(CO(.34,.2,4),C.cu,0,.37,0);r.rotation.y=Math.PI/4;r.scale.set(1.15,1,.75);g.add(r);return g;},
 hills(){const g=new TH.Group();pad(g,0xBFE4D6);g.add(mesh(CO(.2,.48,6),C.deep,-.18,.27,.02),mesh(CO(.26,.7,6),C.patina,.04,.38,-.04),mesh(CO(.18,.4,6),C.emer,.26,.23,.05));return g;},
 park(){const g=new TH.Group();g.add(mesh(CY(.4,.4,.03,24),C.light,0,.02,0));g.add(mesh(CY(.02,.02,.3,6),C.cu,0,.17,0));
  const t=mesh(new TH.TorusGeometry(.26,.012,6,28),C.gold,0,.05,0);t.rotation.x=Math.PI/2;g.add(t);return g;},
 mosque(){const g=new TH.Group();pad(g);g.add(mesh(B(.36,.2,.36),C.stone,0,.15,0));
  g.add(mesh(new TH.SphereGeometry(.22,14,8,0,Math.PI*2,0,Math.PI/2),C.deep,0,.25,0));
  g.add(mesh(CY(.03,.04,.62,8),C.stone,.3,.34,.2),mesh(CO(.045,.12,8),C.gold,.3,.7,.2));return g;},
 church(){const g=new TH.Group();pad(g);g.add(mesh(B(.3,.26,.3),C.stone,0,.18,0));
  const d=mesh(new TH.SphereGeometry(.14,12,10),C.gold,0,.44,0);d.scale.y=1.45;g.add(d);g.add(mesh(CO(.03,.14,6),C.gold,0,.66,0));return g;},
 dk(){const g=new TH.Group();pad(g);g.add(mesh(B(.62,.2,.3),0xCBD9F6,0,.15,0));g.add(mesh(B(.62,.04,.32),C.azur,0,.27,0));g.add(mesh(B(.16,.3,.16),C.stone,-.2,.2,.2));return g;},
 complex(){const g=new TH.Group();pad(g);g.add(mesh(B(.8,.16,.3),C.stone,0,.13,0),mesh(B(.8,.03,.32),C.cu,0,.22,0),mesh(B(.2,.28,.2),C.stone,.28,.19,.26),mesh(CY(.05,.05,.3,10),C.ore,-.3,.2,.25));return g;},
 plant(){const g=new TH.Group();pad(g);g.add(mesh(B(.5,.18,.24),C.stone,0,.14,0),mesh(B(.22,.3,.22),C.cu,-.18,.2,.2),mesh(CY(.04,.05,.6,8),C.ore,.2,.35,.18),mesh(CY(.04,.05,.5,8),C.ore,.32,.3,.18));return g;},
 rowan(){const g=new TH.Group();g.add(mesh(CY(.03,.04,.3,6),C.ore,0,.17,0));
  [[0,.42,0],[.1,.36,.05],[-.09,.38,.05],[.02,.34,-.1]].forEach((p,i)=>g.add(mesh(new TH.IcosahedronGeometry(.1,0),i?C.rowan:0xE06B58,p[0],p[1],p[2])));return g;},
 obelisk(){const g=new TH.Group();pad(g);g.add(mesh(CY(.04,.08,.55,4),C.ore,0,.32,0),mesh(CO(.05,.09,4),C.gold,0,.64,0));return g;},
 town(){const g=new TH.Group();[[0,.35,0],[.18,.22,.1],[-.16,.28,-.08],[.1,.18,-.16],[-.05,.14,.17]].forEach(p=>g.add(mesh(B(.15,p[1],.15),C.stone,p[0],p[1]/2+.02,p[2])));return g;},
 tower(){const g=new TH.Group();pad(g);const t=new TH.Group();t.add(mesh(B(.3,.3,.3),C.stone,0,.2,0),mesh(B(.24,.28,.24),0xDDD0BD,0,.49,0),mesh(B(.18,.24,.18),C.stone,0,.75,0),mesh(CO(.15,.2,4),C.gold,0,.97,0));t.rotation.z=-.1;g.add(t);return g;},
 tray(){const g=new TH.Group();g.add(mesh(CY(.38,.34,.05,28),C.ore,0,.04,0));
  const r=mesh(new TH.TorusGeometry(.37,.02,6,30),C.cu,0,.065,0);r.rotation.x=Math.PI/2;g.add(r);
  [[0,0,C.rowan],[.14,.06,C.gold],[-.12,.1,C.patina],[.05,-.14,C.azur],[-.1,-.1,C.rose]].forEach(p=>g.add(mesh(new TH.IcosahedronGeometry(.07,0),p[2],p[0],.1,p[1])));return g;},
 gumesh(){const g=new TH.Group();g.add(mesh(CO(.4,.5,7),C.deep,0,.25,0),mesh(CO(.2,.3,6),C.patina,.18,.42,.05));
  [-1,1].forEach(s=>{const l=mesh(B(.03,.4,.03),C.ore,-.28+s*.05,.4,.18);l.rotation.z=-s*.28;g.add(l);});
  const w=mesh(new TH.TorusGeometry(.06,.012,6,14),C.cu,-.28,.6,.18);g.add(w);return g;},
 wood(){const g=new TH.Group();g.add(mesh(B(.14,.14,.14),0xB98C5A,-.12,.09,0),mesh(CO(.12,.12,4),C.gold,-.12,.22,0),mesh(B(.1,.1,.1),0xB98C5A,.12,.07,.08),mesh(CO(.09,.1,4),C.gold,.12,.17,.08));return g;},
 lake(){const g=new TH.Group();g.add(mesh(CY(.4,.4,.025,26),C.light,0,.015,0));
  g.add(mesh(new TH.SphereGeometry(.07,8,6),C.ore,0,.1,0),mesh(new TH.SphereGeometry(.045,8,6),C.ore,.07,.17,0),mesh(CO(.02,.06,6),C.cu,.13,.17,0).rotateZ(-Math.PI/2));return g;}
};

/* ---------- миры ---------- */
function blobRing(r1,r2,k,color,y){
  const N=72,pt=(r,a)=>{const w=1+.045*Math.sin(3*a+k)+.03*Math.sin(5*a+k*2.1);return new TH.Vector2(Math.cos(a)*r*w+.04*r*Math.cos(k),Math.sin(a)*r*w);};
  const sh=new TH.Shape(),ho=new TH.Path();
  for(let i=0;i<=N;i++){const p=pt(r2,i/N*Math.PI*2);i?sh.lineTo(p.x,p.y):sh.moveTo(p.x,p.y);}
  for(let i=0;i<=N;i++){const p=pt(r1,-i/N*Math.PI*2);i?ho.lineTo(p.x,p.y):ho.moveTo(p.x,p.y);}
  sh.holes.push(ho);
  const g=new TH.ShapeGeometry(sh);g.rotateX(-Math.PI/2);
  const m=new TH.Mesh(g,new TH.MeshBasicMaterial({color:color}));m.position.y=y;return m;
}
const worlds={},groundMats=[];
function makeWorld(key,cfg){
  const w=new TH.Group();w.visible=false;scene.add(w);
  const gm=new TH.MeshBasicMaterial({color:0xF1E8DA});groundMats.push(gm);
  const gr=new TH.Mesh(new TH.CircleGeometry(cfg.R,96),gm);gr.rotation.x=-Math.PI/2;gr.position.set(cfg.gc[0],0,cfg.gc[1]);w.add(gr);
  const cols=[C.light,C.patina,C.light,C.deep,C.light,C.patina];
  cfg.rings.forEach((r,i)=>{const m=blobRing(r,r+cfg.rw,i*1.7+1,cols[i%6],.01+i*.002);m.position.x=cfg.rc[0];m.position.z=cfg.rc[1];w.add(m);});
  const rim=blobRing(cfg.rings[cfg.rings.length-1]+cfg.rw+cfg.gap,cfg.rings[cfg.rings.length-1]+cfg.rw+cfg.gap+cfg.rw*.45,9.3,C.cu,.03);rim.position.x=cfg.rc[0];rim.position.z=cfg.rc[1];w.add(rim);
  const objs=[],labs=[];
  cfg.items.forEach(it=>{
    const g=SHAPES[it.shape]();g.scale.setScalar(it.s*cfg.os);g.position.set(it.pos[0],0.03,it.pos[1]);g.rotation.y=(it.id.length*.7)%6;
    g.userData.id=it.id;g.traverse(o=>{o.userData.id=it.id;});w.add(g);
    const el=document.createElement('div');el.className='lbl off';el.textContent=it.name;el.dataset.id=it.id;labelsEl.appendChild(el);
    el.addEventListener('click',()=>select(it.id));
    objs.push({it,g,el,top:(.9)*it.s*cfg.os});
  });
  (cfg.roads||[]).forEach(p=>{const pts=(p.pts||p).map(q=>new TH.Vector3(q[0],.06,q[1]));
    const t=new TH.Mesh(new TH.TubeGeometry(new TH.CatmullRomCurve3(pts),80,cfg.tube,6),mat(C.rose));w.add(t);
    if(p.name){const el=document.createElement('div');el.className='lbl st off';el.textContent=p.name;labelsEl.appendChild(el);labs.push({el,pos:new TH.Vector3(p.lab[0],.1,p.lab[1])});}});
  worlds[key]={g:w,objs,labs,cfg};
}
makeWorld('region',{R:12.5,gc:[0,.3],rc:ll(60.57,56.97),rings:[1.5,2.9,4.3,5.7,7.1,8.5],rw:.55,gap:.2,os:1,items:REGION,roads:ROADS_REGION,tube:.05,
  view:{tx:-.3,tz:.4,r:19,th:.5,ph:.95}});
makeWorld('city',{R:5.6,gc:[0,0],rc:[0,0],rings:[.5,1.1,1.7,2.3,2.9,3.5],rw:.3,gap:.12,os:.62,items:CITY,roads:ROADS_CITY,tube:.022,
  view:{tx:.2,tz:.1,r:6.6,th:.4,ph:.95}});

/* ---------- тема ---------- */
const bgFog=new TH.Color();
function applyTheme(){const cs=getComputedStyle(document.documentElement);
  const bg=cs.getPropertyValue('--map-bg').trim()||'#FBF6EE',gr=cs.getPropertyValue('--ground').trim()||'#F1E8DA';
  scene.background=new TH.Color(bg);bgFog.set(bg);scene.fog=new TH.Fog(bgFog,30,70);groundMats.forEach(m=>m.color.set(gr));}
applyTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

/* ---------- камера ---------- */
let mode='region',world=worlds.region;
const cur={tx:0,tz:0,r:19,th:.5,ph:.95},goal=Object.assign({},cur);
let spin=false,selected=null;
function setView(v,snap){Object.assign(goal,v);if(snap)Object.assign(cur,v);}
function placeCam(){const sp=Math.sin(cur.ph);camera.position.set(cur.tx+cur.r*sp*Math.sin(cur.th),cur.r*Math.cos(cur.ph),cur.tz+cur.r*sp*Math.cos(cur.th));camera.lookAt(cur.tx,0,cur.tz);}
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(stage);resize();

/* ввод */
const ptrs=new Map();let moved=0,lastPinch=0,downAt=null;
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,b:e.button});moved=0;downAt={x:e.clientX,y:e.clientY};cv.classList.add('drag');lastPinch=0;});
cv.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);
  if(!p){hover(e);return;}
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
  if(ptrs.size===2){const a=[...ptrs.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(lastPinch)zoom(lastPinch/d);lastPinch=d;return;}
  if(p.b===2||e.shiftKey){const k=cur.r*.0016;goal.tx-=(dx*Math.cos(cur.th)+dy*Math.sin(cur.th)*Math.cos(cur.ph))*k;goal.tz+=(dx*Math.sin(cur.th)-dy*Math.cos(cur.th)*Math.cos(cur.ph))*k;}
  else{goal.th-=dx*.006;goal.ph=Math.min(1.4,Math.max(.25,goal.ph-dy*.006));}
});
function up(e){ptrs.delete(e.pointerId);cv.classList.remove('drag');lastPinch=0;
  if(e.type==='pointerup'&&moved<6&&downAt){const id=pick(e.clientX,e.clientY);if(id)select(id);}}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();zoom(Math.exp(e.deltaY*.0012));},{passive:false});
function zoom(f){const lim=mode==='region'?[5,30]:[2.2,12];goal.r=Math.min(lim[1],Math.max(lim[0],goal.r*f));}
const ray=new TH.Raycaster(),v2=new TH.Vector2();
function pick(cx,cy){const r=cv.getBoundingClientRect();v2.set((cx-r.left)/r.width*2-1,-((cy-r.top)/r.height)*2+1);ray.setFromCamera(v2,camera);
  const hits=ray.intersectObjects(world.objs.map(o=>o.g),true);for(const h of hits){if(h.object.userData.id)return h.object.userData.id;}return null;}
let hoverT=0;function hover(e){const n=performance.now();if(n-hoverT<60)return;hoverT=n;cv.classList.toggle('hover',!!pick(e.clientX,e.clientY));}

/* ---------- интерфейс ---------- */
const filt={cu:true,faith:true,nat:true,cult:true};
const fEl=document.getElementById('filters'),lEl=document.getElementById('list'),cEl=document.getElementById('card');
Object.keys(CATS).forEach(k=>{const b=document.createElement('button');b.className='chip';b.setAttribute('aria-pressed','true');
  b.innerHTML='<i style="background:'+CATS[k].css+'"></i>'+CATS[k].n;
  b.onclick=()=>{filt[k]=!filt[k];b.setAttribute('aria-pressed',String(filt[k]));refresh();};fEl.appendChild(b);});
function refresh(){
  Object.keys(worlds).forEach(k=>worlds[k].g.visible=(k===mode));
  Object.keys(worlds).forEach(k=>worlds[k].objs.forEach(o=>{o.g.visible=filt[o.it.cat];}));
  lEl.innerHTML='';
  world.objs.forEach(o=>{if(!filt[o.it.cat])return;const b=document.createElement('button');b.className='item';
    b.innerHTML='<i style="background:'+CATS[o.it.cat].css+'"></i><span></span>';b.querySelector('span').textContent=o.it.name;
    b.onclick=()=>select(o.it.id);if(selected===o.it.id)b.setAttribute('aria-current','true');lEl.appendChild(b);});
}
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x)e.textContent=x;return e;}
function renderCard(it){
  cEl.innerHTML='';
  if(!it){cEl.append(el('div','k','Как читать карту'),el('p','',mode==='region'?'Города стоят там, где они на самом деле: по широте и долготе. Кольца расходятся от Верхней Пышмы, как слои малахита в знаке.':'Это схема центра города. Положение объектов условное, названия улиц и сами места настоящие.'),el('p','note','Нажмите на объект или строку в списке.'));return;}
  const k=el('div','k',CATS[it.cat].n),h=el('h2','',it.name),p=el('p','',it.text),w=el('p','why','Для визуала: '+it.why);
  const a=el('a','',it.src[0]+' ↗');a.href=it.src[1];a.target='_blank';a.rel='noopener noreferrer';
  cEl.append(k,h,p,w,a);
  if(it.go){const b=el('button','chip','Открыть город →');b.style.alignSelf='flex-start';b.onclick=()=>setMode(it.go);cEl.appendChild(b);}
}
function select(id){selected=id;const o=world.objs.find(x=>x.it.id===id);if(!o)return;
  world.objs.forEach(x=>x.el.classList.toggle('sel',x.it.id===id));
  setView({tx:o.g.position.x,tz:o.g.position.z});renderCard(o.it);refresh();
  const cur2=lEl.querySelector('[aria-current="true"]');if(cur2)cur2.scrollIntoView({block:'nearest'});}
function setMode(m){mode=m;world=worlds[m];selected=null;world.objs.forEach(x=>x.el.classList.remove('sel'));
  Object.keys(worlds).forEach(k=>{worlds[k].objs.forEach(o=>o.el.classList.add('off'));worlds[k].labs.forEach(l=>l.el.classList.add('off'));});
  document.getElementById('m-region').setAttribute('aria-pressed',String(m==='region'));
  document.getElementById('m-city').setAttribute('aria-pressed',String(m==='city'));
  document.getElementById('sub').textContent=m==='region'?'Средний Урал · схема':'Верхняя ПышмА · схема центра';
  setView(world.cfg.view,false);cur.tx=world.cfg.view.tx;cur.tz=world.cfg.view.tz;cur.r=world.cfg.view.r*1.15;
  renderCard(null);refresh();}
document.getElementById('m-region').onclick=()=>setMode('region');
document.getElementById('m-city').onclick=()=>setMode('city');
document.getElementById('b-in').onclick=()=>zoom(.78);
document.getElementById('b-out').onclick=()=>zoom(1.28);
document.getElementById('b-reset').onclick=()=>{selected=null;world.objs.forEach(x=>x.el.classList.remove('sel'));setView(world.cfg.view);renderCard(null);refresh();};
const bs=document.getElementById('b-spin');bs.onclick=()=>{spin=!spin;bs.setAttribute('aria-pressed',String(spin));};

/* ---------- цикл ---------- */
const pv=new TH.Vector3();
let t0=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-t0)/1000);t0=now;
  if(spin&&!reduce&&!ptrs.size)goal.th+=dt*.18;
  const k=reduce?1:1-Math.pow(.0008,dt);
  ['tx','tz','r','th','ph'].forEach(n=>cur[n]+=(goal[n]-cur[n])*k);
  placeCam();
  world.objs.forEach(o=>{
    const sel=o.it.id===selected;
    if(!reduce)o.g.position.y=.03+(sel?Math.abs(Math.sin(now*.003))*.06*o.it.s:0);
    pv.set(o.g.position.x,o.g.position.y+o.top+.12,o.g.position.z).project(camera);
    const vis=o.g.visible&&pv.z<1&&filt[o.it.cat];
    o.el.classList.toggle('off',!vis);
    if(vis)o.el.style.transform='translate('+((pv.x*.5+.5)*stage.clientWidth)+'px,'+((-pv.y*.5+.5)*stage.clientHeight)+'px) translate(-50%,-100%)';
  });
  world.labs.forEach(l=>{pv.copy(l.pos).project(camera);const vis=pv.z<1&&cur.r<(mode==='city'?9:0);l.el.classList.toggle('off',!vis);
    if(vis)l.el.style.transform='translate('+((pv.x*.5+.5)*stage.clientWidth)+'px,'+((-pv.y*.5+.5)*stage.clientHeight)+'px) translate(-50%,-50%)';});
  renderer.render(scene,camera);requestAnimationFrame(frame);
}
setMode('region');
setView(worlds.region.cfg.view,true);
requestAnimationFrame(frame);
})();
</script>
