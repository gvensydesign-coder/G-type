function blobRing(r1,r2,k,color,y){
  const N=72,pt=(r,a)=>{const w=1+.045*Math.sin(3*a+k)+.03*Math.sin(5*a+k*2.1);return new TH.Vector2(Math.cos(a)*r*w+.04*r*Math.cos(k),Math.sin(a)*r*w);};
  const sh=new TH.Shape(),ho=new TH.Path();
  for(let i=0;i<=N;i++){const p=pt(r2,i/N*Math.PI*2);i?sh.lineTo(p.x,p.y):sh.moveTo(p.x,p.y);}
  for(let i=0;i<=N;i++){const p=pt(r1,-i/N*Math.PI*2);i?ho.lineTo(p.x,p.y):ho.moveTo(p.x,p.y);}
  sh.holes.push(ho);
  const g=new TH.ShapeGeometry(sh);g.rotateX(-Math.PI/2);
  const m=new TH.Mesh(g,new TH.MeshBasicMaterial({color:color}));m.position.y=y;return m;
}

function makeWorld(key,cfg){
  const w=new TH.Group();w.visible=false;scene.add(w);
  const gm=new TH.MeshBasicMaterial({color:0xF1E8DA});groundMats.push(gm);
  const gr=new TH.Mesh(new TH.CircleGeometry(cfg.R,96),gm);gr.rotation.x=-Math.PI/2;gr.position.set(cfg.gc[0],0,cfg.gc[1]);w.add(gr);
  const cols=[C.light,C.patina,C.light,C.deep,C.light,C.patina];
  cfg.rings.forEach((r,i)=>{const m=blobRing(r,r+cfg.rw,i*1.7+1,cols[i%6],.01+i*.002);m.position.x=cfg.rc[0];m.position.z=cfg.rc[1];w.add(m);});
  const rim=blobRing(cfg.rings[cfg.rings.length-1]+cfg.rw+cfg.gap,cfg.rings[cfg.rings.length-1]+cfg.rw+cfg.gap+cfg.rw*.45,9.3,C.cu,.03);rim.position.x=cfg.rc[0];rim.position.z=cfg.rc[1];w.add(rim);
  const objs=[],labs=[];
  cfg.items.forEach(it=>{
    const g=SHAPES[it.shape]();g.scale.setScalar(it.s*cfg.os);g.position.set(it.pos[0],0.03,it.pos[1]);g.rotation.y=(it.id.length*.7)%6;
    g.userData.id=it.id;g.traverse(o=>{o.userData.id=it.id;});w.add(g);
    let ring=null;
    if(cfg.beacon){const cc=CATS[it.cat].c;
      const bm=new TH.Mesh(CY(.012,.012,2.4,6),new TH.MeshBasicMaterial({color:cc,transparent:true,opacity:.55}));bm.position.y=1.2;g.add(bm);
      ring=new TH.Mesh(new TH.TorusGeometry(.5,.025,6,36),new TH.MeshBasicMaterial({color:cc,transparent:true,opacity:.7}));ring.rotation.x=Math.PI/2;ring.position.y=.03;ring.userData.ring=true;g.add(ring);}
    const el=document.createElement('div');el.className='lbl off';el.textContent=it.name;el.dataset.id=it.id;labelsEl.appendChild(el);
    el.addEventListener('click',()=>select(it.id));
    objs.push({it,g,el,ring,alive:true,ph:Math.random(),top:(.9)*it.s*cfg.os});
  });
  (cfg.roads||[]).forEach(p=>{const pts=(p.pts||p).map(q=>new TH.Vector3(q[0],.06,q[1]));
    const t=new TH.Mesh(new TH.TubeGeometry(new TH.CatmullRomCurve3(pts),80,cfg.tube,6),mat(C.rose));w.add(t);
    if(p.name){const el=document.createElement('div');el.className='lbl st off';el.textContent=p.name;labelsEl.appendChild(el);labs.push({el,pos:new TH.Vector3(p.lab[0],.1,p.lab[1])});}});
  worlds[key]={g:w,objs,labs,cfg};
}

const CX=.3,CZ=.1;
const perR=a=>3.7*(1+.1*Math.sin(2*a+1)+.06*Math.sin(3*a+4));
(function(){
  const W=worlds.city,w=W.g;
  const pts=[],N=120;for(let i=0;i<N;i++){const a=i/N*Math.PI*2,r=perR(a);pts.push(new TH.Vector3(CX+Math.cos(a)*r,.07,CZ+Math.sin(a)*r));}
  w.add(new TH.Mesh(new TH.TubeGeometry(new TH.CatmullRomCurve3(pts,true),240,.04,6,true),mat(C.cu)));
  const pos=[],idx=[];pts.forEach((p,i)=>{pos.push(p.x,.0,p.z,p.x,.16,p.z);const j=(i+1)%N;idx.push(i*2,j*2,i*2+1,j*2,j*2+1,i*2+1);});
  const wg=new TH.BufferGeometry();wg.setAttribute('position',new TH.Float32BufferAttribute(pos,3));wg.setIndex(idx);
  w.add(new TH.Mesh(wg,new TH.MeshBasicMaterial({color:C.cu,transparent:true,opacity:.2,side:TH.DoubleSide,depthWrite:false})));
  const lp=pts[Math.floor(N*.62)];
  const el=document.createElement('div');el.className='lbl st off';el.textContent='Периметр · схема';labelsEl.appendChild(el);
  W.labs.push({el,pos:new TH.Vector3(lp.x,.2,lp.z)});
  let s=7;const rnd=()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
  const road=[];ROADS_CITY.forEach(p=>new TH.CatmullRomCurve3(p.pts.map(q=>new TH.Vector3(q[0],0,q[1]))).getPoints(70).forEach(v=>road.push(v)));
  const cand=[];let guard=0;
  while(cand.length<430&&guard++<20000){
    const a=rnd()*Math.PI*2,r=Math.sqrt(rnd())*perR(a)*.94,x=CX+Math.cos(a)*r,z=CZ+Math.sin(a)*r;
    if(CITY.some(c=>Math.hypot(c.pos[0]-x,c.pos[1]-z)<.34))continue;
    if(road.some(v=>Math.hypot(v.x-x,v.z-z)<.12))continue;
    cand.push({x,z,k:Math.hypot(x-CX,z-CZ)+rnd()*.9});}
  cand.sort((p,q)=>p.k-q.k);
  const bg=B(1,1,1);bg.translate(0,.5,0);
  W.bld=cand.map((c,i)=>{
    const col=i<70?0xE6C8B4:i<150?0xEADFCF:i<270?0xEFE7DA:(rnd()<.14?0xCFE9E0:0xF6F1E8);
    const h=(i<150?.05+rnd()*.05:i<270?.07+rnd()*.07:.09+rnd()*.15);
    const m=new TH.Mesh(bg,new TH.MeshStandardMaterial({color:col,roughness:.85,flatShading:true}));
    const bw=.09+rnd()*.09,bd=.09+rnd()*.12;m.position.set(c.x,.03,c.z);m.rotation.y=.47+(rnd()-.5)*.28;
    m.scale.set(bw,.001,bd);m.visible=false;w.add(m);return {m,h,t:0,s:0};});
})();

  if(!it){cEl.append(el('div','k','Как читать карту'),el('p','',mode==='region'?'Города стоят там, где они на самом деле: по широте и долготе. Кольца расходятся от Верхней Пышмы, как слои малахита в знаке.':'Схема города в четырёх измерениях: объём плюс время. Тяните ползунок или нажмите ▶. Периметр, здания и положение объектов условные; места, улицы и даты настоящие.'),el('p','note','Нажмите на объект или строку в списке.'));return;}
  const k=el('div','k',CATS[it.cat].n),h=el('h2','',it.name),p=el('p','',it.text),w=el('p','why','Для визуала: '+it.why);
  const a=el('a','',it.src[0]+' ↗');a.href=it.src[1];a.target='_blank';a.rel='noopener noreferrer';
  cEl.append(k,h,p,w,a);
  if(it.go){const b=el('button','chip','Открыть город →');b.style.alignSelf='flex-start';b.onclick=()=>setMode(it.go);cEl.appendChild(b);}
}
function select(id){const o=world.objs.find(x=>x.it.id===id);if(!o||!o.alive)return;selected=id;
  world.objs.forEach(x=>x.el.classList.toggle('sel',x.it.id===id));
  setView({tx:o.g.position.x,tz:o.g.position.z});renderCard(o.it);refresh();
  const cur2=lEl.querySelector('[aria-current="true"]');if(cur2)cur2.scrollIntoView({block:'nearest'});}
function setMode(m){mode=m;world=worlds[m];selected=null;world.objs.forEach(x=>x.el.classList.remove('sel'));
  Object.keys(worlds).forEach(k=>{worlds[k].objs.forEach(o=>o.el.classList.add('off'));worlds[k].labs.forEach(l=>l.el.classList.add('off'));});
  document.getElementById('m-region').setAttribute('aria-pressed',String(m==='region'));
  document.getElementById('m-city').setAttribute('aria-pressed',String(m==='city'));
  document.getElementById('sub').textContent=m==='region'?'Средний Урал · схема':'Верхняя ПышмА · периметр во времени';
  document.getElementById('time').hidden=(m!=='city');document.getElementById('hint').hidden=(m==='city');
  if(m!=='city')playing=false;
  setView(world.cfg.view,false);cur.tx=world.cfg.view.tx;cur.tz=world.cfg.view.tz;cur.r=world.cfg.view.r*1.15;
  renderCard(null);refresh();}
document.getElementById('m-region').onclick=()=>setMode('region');
document.getElementById('m-city').onclick=()=>setMode('city');
document.getElementById('b-in').onclick=()=>zoom(.78);
document.getElementById('b-out').onclick=()=>zoom(1.28);
document.getElementById('b-reset').onclick=()=>{selected=null;world.objs.forEach(x=>x.el.classList.remove('sel'));setView(world.cfg.view);renderCard(null);refresh();};
/* ---------- время (четвёртое измерение) ---------- */
let year=2026,playing=false;
const yIn=document.getElementById('yr-in'),yEl=document.getElementById('yr'),capEl=document.getElementById('cap'),tPlay=document.getElementById('t-play');
const tk=document.getElementById('ticks');
[1854,1934,1946,2000,2025].forEach(y=>{const b=document.createElement('button');b.textContent=y;b.onclick=()=>{playing=false;tPlay.textContent='▶';setYear(y);};tk.appendChild(b);});
function setYear(y){year=Math.round(y);yIn.value=year;yEl.textContent=year;
  const n=buildCount(year);worlds.city.bld.forEach((b,i)=>{b.t=i<n?1:0;});
  let ev=EVENTS[0];EVENTS.forEach(e=>{if(e[0]<=year)ev=e;});
  capEl.innerHTML='<b>'+ev[0]+'</b> · '+ev[1];
  let changed=false;worlds.city.objs.forEach(o=>{const a=year>=o.it.year;if(a!==o.alive){o.alive=a;changed=true;}});
  if(changed){if(mode==='city'&&selected){const so=world.objs.find(x=>x.it.id===selected);if(so&&!so.alive){selected=null;renderCard(null);}}if(mode==='city')refresh();}}
yIn.addEventListener('input',()=>{playing=false;tPlay.textContent='▶';setYear(+yIn.value);});
tPlay.onclick=()=>{playing=!playing;tPlay.textContent=playing?'❚❚':'▶';if(playing&&year>=2026)setYear(1850);};
const bs=document.getElementById('b-spin');bs.onclick=()=>{spin=!spin;bs.setAttribute('aria-pressed',String(spin));};

/* ---------- цикл ---------- */
const pv=new TH.Vector3();
let t0=performance.now(),playAcc=0;
function frame(now){
  const dt=Math.min(.05,(now-t0)/1000);t0=now;
  if(spin&&!reduce&&!ptrs.size)goal.th+=dt*.18;
  const k=reduce?1:1-Math.pow(.0008,dt);
  ['tx','tz','r','th','ph'].forEach(n=>cur[n]+=(goal[n]-cur[n])*k);
  placeCam();
  if(playing){playAcc+=dt*14;if(playAcc>=1){const st=Math.floor(playAcc);playAcc-=st;if(year>=2026){playing=false;tPlay.textContent='▶';}else setYear(Math.min(2026,year+st));}}
  if(mode==='city')worlds.city.bld.forEach(b=>{b.s+=(b.t-b.s)*(reduce?1:Math.min(1,dt*7));const v=b.s>.03;b.m.visible=v;if(v)b.m.scale.y=b.h*b.s;});
  world.objs.forEach(o=>{
    if(o.ring&&!reduce){const f=(now*.0008+o.ph)%1;o.ring.scale.setScalar(.6+f*.9);o.ring.material.opacity=.7*(1-f);}
    const sel=o.it.id===selected;
    if(!reduce)o.g.position.y=.03+(sel?Math.abs(Math.sin(now*.003))*.06*o.it.s:0);
    pv.set(o.g.position.x,o.g.position.y+o.top+.12,o.g.position.z).project(camera);
    const vis=o.g.visible&&pv.z<1&&filt[o.it.cat];
    o.el.classList.toggle('off',!vis);
    if(vis)o.el.style.transform='translate('+((pv.x*.5+.5)*stage.clientWidth)+'px,'+((-pv.y*.5+.5)*stage.clientHeight)+'px) translate(-50%,-100%)';
  });
  world.labs.forEach(l=>{pv.copy(l.pos).project(camera);const vis=pv.z<1&&cur.r<(mode==='city'?14:0);l.el.classList.toggle('off',!vis);
    if(vis)l.el.style.transform='translate('+((pv.x*.5+.5)*stage.clientWidth)+'px,'+((-pv.y*.5+.5)*stage.clientHeight)+'px) translate(-50%,-50%)';});
  renderer.render(scene,camera);requestAnimationFrame(frame);
}
setYear(2026);
setMode('city');
setView(worlds.city.cfg.view,true);
requestAnimationFrame(frame);
})();
</script>
