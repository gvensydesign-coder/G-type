  return '<path d="M'+f(p[0])+','+f(p[1])+'l0,-'+f(rr*1.2)+'" stroke="'+INK+'" stroke-width="2"/><circle cx="'+f(p[0])+'" cy="'+f(p[1]-rr*1.9)+'" r="'+rr+'" fill="'+(fill||'#7FD9C0')+'" stroke="'+INK+'" stroke-width="1.8"/>';}
function dome(x,y,z,r,h,fill){const c=P(x,y,z),rx=r*K*1.2247,ry=r*K*.7071;
  return '<path d="M'+f(c[0]-rx)+','+f(c[1])+' C'+f(c[0]-rx)+','+f(c[1]-h*1.33)+' '+f(c[0]+rx)+','+f(c[1]-h*1.33)+' '+f(c[0]+rx)+','+f(c[1])+' A'+f(rx)+','+f(ry)+' 0 0 1 '+f(c[0]-rx)+','+f(c[1])+'z" fill="'+fill+'" stroke="'+INK+'" stroke-width="2.2" stroke-linejoin="round"/>';}
function onion(x,y,z,r,h,fill){const c=P(x,y,z),rx=r*K*1.2247,ry=r*K*.7071;
  return '<path d="M'+f(c[0]-rx)+','+f(c[1])+' C'+f(c[0]-rx*1.7)+','+f(c[1]-h*.45)+' '+f(c[0]-rx*.4)+','+f(c[1]-h*.75)+' '+f(c[0])+','+f(c[1]-h*1.35)+' C'+f(c[0]+rx*.4)+','+f(c[1]-h*.75)+' '+f(c[0]+rx*1.7)+','+f(c[1]-h*.45)+' '+f(c[0]+rx)+','+f(c[1])+' A'+f(rx)+','+f(ry)+' 0 0 1 '+f(c[0]-rx)+','+f(c[1])+'z" fill="'+fill+'" stroke="'+INK+'" stroke-width="2.2" stroke-linejoin="round"/>'
   +'<path d="M'+f(c[0])+','+f(c[1]-h*1.35)+'l0,-9M'+f(c[0]-3)+','+f(c[1]-h*1.35-6)+'l6,0" stroke="'+INK+'" stroke-width="2"/>';}
function ring(cx,cy,rx,ry,rot,col,w){return '<ellipse cx="'+f(cx)+'" cy="'+f(cy)+'" rx="'+rx+'" ry="'+ry+'" transform="rotate('+rot+' '+f(cx)+' '+f(cy)+')" fill="none" stroke="'+col+'" stroke-width="'+w+'"/>';}

/* ---------- сборка сцены ---------- */
const objLayer=$('#stage-objs'),slab=$('#slab'),grid=$('#grid'),roads=$('#roads'),names=$('#names'),labels=$('#labels'),svg=$('#map'),stageEl=$('#stage');
const per=[];for(let i=0;i<120;i++){const a=i/120*Math.PI*2,r=perR(a);per.push([CX+Math.cos(a)*r,CZ+Math.sin(a)*r,a]);}
$('#clip-poly').setAttribute('points',pts(per.map(p=>P(p[0],p[1],0))));
(function(){ // плита-периметр
  const T=18,n=per.length;let sides='',edge='';
  for(let i=0;i<n;i++){const j=(i+1)%n,a=per[i],b=per[j],m=(a[2]+b[2])/2,nx=Math.cos(m),ny=Math.sin(m);
    if(nx+ny>0){const fill=ny>nx?'#D8CFC0':'#C4BAA9';
      sides+='<polygon points="'+pts([P(a[0],a[1],0),P(b[0],b[1],0),P(b[0],b[1],-T),P(a[0],a[1],-T)])+'" fill="'+fill+'" stroke="'+fill+'" stroke-width=".8"/>';
      edge+='M'+pts([P(a[0],a[1],-T)]).replace(',',' ')+' L'+pts([P(b[0],b[1],-T)]).replace(',',' ')+' ';}}
  slab.innerHTML=sides+'<polygon points="'+pts(per.map(p=>P(p[0],p[1],0)))+'" fill="#F6F1E8" stroke="'+INK+'" stroke-width="2.6" stroke-linejoin="round"/>'
   +'<path d="'+edge+'" fill="none" stroke="'+INK+'" stroke-width="2.6" stroke-linejoin="round"/>'
   +'<polygon points="'+pts(per.map(p=>P(CX+(p[0]-CX)*.975,CZ+(p[1]-CZ)*.975,0)))+'" fill="none" stroke="#BF6A45" stroke-width="2.6" stroke-dasharray="11 8" stroke-linejoin="round"/>';
})();
(function(){ // мелкая сетка улиц
  let s='';for(let g=-4.5;g<=4.5;g+=.5){s+='<path d="M'+pts([P(g,-4.6,0)]).replace(',',' ')+' L'+pts([P(g,4.6,0)]).replace(',',' ')+' M'+pts([P(-4.6,g,0)]).replace(',',' ')+' L'+pts([P(4.6,g,0)]).replace(',',' ')+'" stroke="#FFFFFF" stroke-width="5" fill="none"/>';}
  grid.innerHTML=s;})();
(function(){ // улицы
  let s='';STREETS.forEach(st=>{const a=P(st.a[0],st.a[1],0),b=P(st.b[0],st.b[1],0),d='M'+f(a[0])+','+f(a[1])+' L'+f(b[0])+','+f(b[1]);
    if(st.main)s+='<path d="'+d+'" stroke="#9E5535" stroke-width="19" stroke-linecap="round" fill="none"/><path d="'+d+'" stroke="#BF6A45" stroke-width="15" stroke-linecap="round" fill="none"/><path d="'+d+'" stroke="#F4C9B3" stroke-width="2" stroke-dasharray="9 9" fill="none"/>';
    else s+='<path d="'+d+'" stroke="#DCD2C2" stroke-width="15" stroke-linecap="round" fill="none"/><path d="'+d+'" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" fill="none"/>';});
  roads.innerHTML=s;
  STREETS.forEach(st=>{const p=P(st.lab[0],st.lab[1],0),ang=st.up?-30:30;
    const t=el('text',{x:f(p[0]),y:f(p[1]+4),'text-anchor':'middle',transform:'rotate('+ang+' '+f(p[0])+' '+f(p[1])+')','class':'stname','data-main':st.main?1:0},st.name);
    if(st.main)t.style.fill='#FBF6EE';names.appendChild(t);});
})();
const distSeg=(px,py,st)=>{const [ax,ay]=st.a,[bx,by]=st.b,dx=bx-ax,dy=by-ay,t=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy)));return Math.hypot(px-(ax+t*dx),py-(ay+t*dy));};
const items=[];let seed=11;const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
// объекты
CITY.forEach(it=>{const r=SHAPES[it.shape](it.pos[0],it.pos[1],it.s);it.r=r;
  const g=el('g',{'class':'obj','data-id':it.id},r.svg);items.push({d:r.c[0]+r.c[1]+.35,g,obj:it});});
// фоновые кварталы
const cells=[];
for(let gx=-4.3;gx<=4.4;gx+=.34)for(let gy=-4.3;gy<=4.4;gy+=.34){
  const x=gx+(rnd()-.5)*.05,y=gy+(rnd()-.5)*.05,a=Math.atan2(y-CZ,x-CX),r=Math.hypot(x-CX,y-CZ);
  if(r>perR(a)*.93)continue;
  if(STREETS.some(st=>distSeg(x+.08,y+.08,st)<.2))continue;
  if(CITY.some(c=>Math.hypot(c.r.c[0]-x,c.r.c[1]-y)<(c.shape==='complex'?.95:c.shape==='hills'||c.shape==='park'?.85:.62)))continue;
  cells.push({x,y,k:Math.hypot(x-3,y-1.4)+rnd()*1.1});}
cells.sort((p,q)=>p.k-q.k);
const NBF=[[1850,0],[1854,.025],[1934,.16],[1946,.34],[2000,.64],[2025,1]];
const bld=cells.map((c,i)=>{const fr=i/cells.length,tall=fr>.64?(rnd()<.1?58:24+rnd()*20):fr>.34?14+rnd()*14:9+rnd()*8;
  const col=fr<.16?['#FBEAE0','#EBCDBB','#D9B39B']:fr>.64&&rnd()<.14?['#E7F6F0','#BDE8D8','#98D3BF']:COL.bgc;
  const w=.15+rnd()*.07,d=.15+rnd()*.07;
  const g=el('g',{'class':'bg off'},box(c.x,c.y,w,d,tall,0,col,{st:'#A89D90',sw:1.1}));items.push({d:c.x+c.y+(w+d)/2,g});return {g,fr};});
items.sort((a,b)=>a.d-b.d).forEach(i=>objLayer.appendChild(i.g));

/* ---------- подписи ---------- */
const labEls={};
function wrap(t){const w=t.split(' '),out=[];let c='';w.forEach(x=>{if((c+' '+x).trim().length>17&&c){out.push(c);c=x;}else c=(c+' '+x).trim();});if(c)out.push(c);return out;}
CITY.forEach(it=>{
  const g=el('g',{'class':'lab','data-id':it.id,display:'none'});
  g.appendChild(el('path',{fill:'none',stroke:'#2A2320','stroke-width':1.3,'stroke-dasharray':'4 4','class':'lead'}));
  g.appendChild(el('circle',{fill:'#2A2320'}));
  g.appendChild(el('g',{fill:CATS[it.cat].css,'class':'ico'},ICON[it.cat]));
  const tl=el('text',{});wrap(it.name).forEach((ln,i)=>{const ts=el('tspan',{},ln);tl.appendChild(ts);});g.appendChild(tl);
  labels.appendChild(g);labEls[it.id]=g;});

/* ---------- вид: масштаб и сдвиг ---------- */
let view={cx:0,cy:30,w:1780},goal=null,scale=1,layoutQ=false;
function rect(){return stageEl.getBoundingClientRect();}
function defaultView(){const r=rect();if(r.width/r.height<1)return {cx:0,cy:40,w:1120};const sc=Math.min(.62,Math.max(.3,(r.width/2-190)/505));return {cx:0,cy:30,w:r.width/sc};}
function applyView(){const r=rect(),h=view.w*r.height/r.width;
  svg.setAttribute('viewBox',f(view.cx-view.w/2)+' '+f(view.cy-h/2)+' '+f(view.w)+' '+f(h));scale=r.width/view.w;scheduleLayout();}
function scheduleLayout(){if(layoutQ)return;layoutQ=true;requestAnimationFrame(()=>{layoutQ=false;layout();});}
function zoomAt(f2,px,py){const r=rect(),h=view.w*r.height/r.width,wx=view.cx-view.w/2+px/scale,wy=view.cy-h/2+py/scale;
  const nw=Math.min(2400,Math.max(420,view.w*f2)),ns=r.width/nw,nh=nw*r.height/r.width;
  view.w=nw;view.cx=wx-px/ns+nw/2;view.cy=wy-py/ns+nh/2;goal=null;applyView();}
const ptrs=new Map();let moved=0,pinch=0;
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;pinch=0;svg.classList.add('drag');});
svg.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
  if(ptrs.size===2){const a=[...ptrs.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),r=rect();if(pinch)zoomAt(pinch/d,(a[0].x+a[1].x)/2-r.left,(a[0].y+a[1].y)/2-r.top);pinch=d;return;}
  if(moved>4){view.cx-=dx/scale;view.cy-=dy/scale;goal=null;applyView();}});
function endp(e){ptrs.delete(e.pointerId);svg.classList.remove('drag');pinch=0;
  if(e.type==='pointerup'&&moved<6){const t=document.elementFromPoint(e.clientX,e.clientY),n=t&&t.closest&&t.closest('[data-id]');if(n)select(n.getAttribute('data-id'));}}
svg.addEventListener('pointerup',endp);svg.addEventListener('pointercancel',endp);
svg.addEventListener('wheel',e=>{e.preventDefault();const r=rect();zoomAt(Math.exp(e.deltaY*.0012),e.clientX-r.left,e.clientY-r.top);},{passive:false});
let firstRO=true;new ResizeObserver(()=>{if(firstRO){firstRO=false;view=defaultView();}applyView();}).observe(stageEl);
function animTick(){if(goal){const k=reduce?1:.16;view.cx+=(goal.cx-view.cx)*k;view.cy+=(goal.cy-view.cy)*k;view.w+=(goal.w-view.w)*k;applyView();
  if(Math.abs(goal.cx-view.cx)+Math.abs(goal.cy-view.cy)+Math.abs(goal.w-view.w)<1)goal=null;}requestAnimationFrame(animTick);}
requestAnimationFrame(animTick);

/* ---------- раскладка подписей ---------- */
function layout(){
  const u=1/scale,showAll=scale>=.38;
  const vis=CITY.filter(it=>it.alive!==false&&filt[it.cat]&&(showAll||it.id===selected));
  CITY.forEach(it=>{if(!vis.includes(it))labEls[it.id].setAttribute('display','none');});
  const X0=510,gap=44*u,rows={L:[],R:[]};
  vis.forEach(it=>{const a=P(it.r.a[0],it.r.a[1],it.r.a[2]);rows[a[0]<0?'L':'R'].push({it,ax:a[0],ay:a[1]});});
  ['L','R'].forEach(side=>{const rs=rows[side].sort((p,q)=>p.ay-q.ay);let prev=-1e9;
    rs.forEach(r=>{r.ly=Math.max(r.ay-20*u,prev+gap);prev=r.ly;});
    const lim=380;if(rs.length&&rs[rs.length-1].ly>lim){const sh=rs[rs.length-1].ly-lim;rs.forEach(r=>r.ly-=sh);}
    let top=-400;rs.forEach(r=>{if(r.ly<top)r.ly=top;top=r.ly+gap;});
    rs.forEach(r=>{const g=labEls[r.it.id],sg=side==='L'?-1:1,lx=sg*X0,ico=22*u;
      g.removeAttribute('display');g.classList.toggle('sel',r.it.id===selected);
      const path=g.querySelector('path'),dot=g.querySelector('circle'),icn=g.querySelector('.ico'),tx=g.querySelector('text');
      path.setAttribute('d','M'+f(r.ax)+','+f(r.ay)+' C'+f(r.ax)+','+f((r.ay+r.ly)/2)+' '+f(lx-sg*40*u)+','+f(r.ly)+' '+f(lx)+','+f(r.ly));
      path.setAttribute('stroke-width',1.3*u);path.setAttribute('stroke-dasharray',(4*u)+' '+(4*u));
      dot.setAttribute('cx',f(r.ax));dot.setAttribute('cy',f(r.ay));dot.setAttribute('r',3.4*u);
      icn.setAttribute('transform','translate('+f(sg>0?lx+6*u:lx-6*u-ico)+','+f(r.ly-ico/2)+') scale('+(ico/24)+')');
      const tsx=f(sg>0?lx+6*u+ico+7*u:lx-6*u-ico-7*u),spans=tx.querySelectorAll('tspan');tx.setAttribute('x',tsx);tx.setAttribute('y',f(r.ly+5*u-(spans.length-1)*7.5*u));spans.forEach((sp,i)=>{sp.setAttribute('x',tsx);sp.setAttribute('dy',i?15*u:0);});
      tx.setAttribute('text-anchor',sg>0?'start':'end');tx.setAttribute('font-size',13.5*u);tx.setAttribute('stroke-width',3.4*u);});});
  names.querySelectorAll('text').forEach(t=>{t.setAttribute('font-size',(t.getAttribute('data-main')==='1'?11:10)*u*(u>1.4?1.15:1));t.style.display=scale<.3?'none':'';});
}

/* ---------- интерфейс ---------- */
const filt={cu:true,faith:true,nat:true,cult:true};let selected=null,year=2026,playing=false,playAcc=0;
const fEl=$('#filters'),lEl=$('#list'),cEl=$('#card');
Object.keys(CATS).forEach(k=>{const b=document.createElement('button');b.className='chip';b.setAttribute('aria-pressed','true');
  b.innerHTML='<i style="background:'+CATS[k].css+'"></i>'+CATS[k].n;
  b.onclick=()=>{filt[k]=!filt[k];b.setAttribute('aria-pressed',String(filt[k]));refresh();};fEl.appendChild(b);});
function mk(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x)e.textContent=x;return e;}
function refresh(){
  CITY.forEach(it=>{const g=objLayer.querySelector('[data-id="'+it.id+'"]');const on=filt[it.cat]&&it.alive!==false;g.classList.toggle('off',!on);g.classList.toggle('sel',on&&it.id===selected);});
  lEl.innerHTML='';
  CITY.forEach(it=>{if(!filt[it.cat])return;const ok=it.alive!==false,b=mk('button','item'+(ok?'':' dim'));if(!ok)b.disabled=true;
    b.innerHTML='<i style="background:'+CATS[it.cat].css+'"></i><span></span>';b.querySelector('span').textContent=it.name;
    b.onclick=()=>select(it.id);if(it.id===selected)b.setAttribute('aria-current','true');lEl.appendChild(b);});
  layout();}
function renderCard(it){cEl.innerHTML='';
  if(!it){cEl.append(mk('div','k','Как читать карту'),mk('p','','Изометрическая схема города. Здания растут вместе со временем: тяните ползунок или нажмите ▶. Цветные постройки — важные места, серые — городская ткань.'),mk('p','note','Периметр, жилые кварталы и положение объектов условные. Места, улицы и даты настоящие.'));return;}
  const a=mk('a','',it.src[0]+' ↗');a.href=it.src[1];a.target='_blank';a.rel='noopener noreferrer';
  cEl.append(mk('div','k',CATS[it.cat].n),mk('h2','',it.name),mk('p','',it.text),mk('p','why','Для визуала: '+it.why),a,mk('p','note',it.note));}
function select(id){const it=CITY.find(x=>x.id===id);if(!it||it.alive===false)return;selected=id;renderCard(it);refresh();
  const a=P(it.r.c[0],it.r.c[1],20);goal={cx:a[0]*.55,cy:a[1]*.55+30,w:Math.min(view.w,1150)};
  const c=lEl.querySelector('[aria-current="true"]');if(c)c.scrollIntoView({block:'nearest'});}
function resetView(){selected=null;renderCard(null);goal=defaultView();refresh();}
$('#b-in').onclick=()=>{const r=rect();zoomAt(.78,r.width/2,r.height/2);};
$('#b-out').onclick=()=>{const r=rect();zoomAt(1.28,r.width/2,r.height/2);};
$('#b-reset').onclick=resetView;

/* время */
const yIn=$('#yr-in'),yEl=$('#yr'),capEl=$('#cap'),tPlay=$('#t-play'),tk=$('#ticks');
[1854,1934,1946,2000,2025].forEach(y=>{const b=mk('button','',String(y));b.onclick=()=>{stop();setYear(y);};tk.appendChild(b);});
function stop(){playing=false;tPlay.textContent='▶';}
function frac(y){for(let i=1;i<NBF.length;i++){if(y<=NBF[i][0]){const a=NBF[i-1],b=NBF[i];return a[1]+(b[1]-a[1])*(y-a[0])/(b[0]-a[0]);}}return 1;}
function setYear(y){year=Math.round(y);yIn.value=year;yEl.textContent=year;
  const fr=frac(year);bld.forEach(b=>b.g.classList.toggle('off',!(b.fr<fr)));
  let ev=EVENTS[0];EVENTS.forEach(e=>{if(e[0]<=year)ev=e;});capEl.innerHTML='<b>'+ev[0]+'</b> · '+ev[1];
  let ch=false;CITY.forEach(it=>{const a=year>=it.year;if((it.alive!==false)!==a){it.alive=a;ch=true;}});
  if(ch){const so=CITY.find(x=>x.id===selected);if(so&&so.alive===false){selected=null;renderCard(null);}refresh();}}
yIn.addEventListener('input',()=>{stop();setYear(+yIn.value);});
tPlay.onclick=()=>{playing=!playing;tPlay.textContent=playing?'❚❚':'▶';if(playing&&year>=2026)setYear(1850);};
let t0=performance.now();
(function loop(now){const dt=Math.min(.05,(now-t0)/1000);t0=now;
  if(playing){playAcc+=dt*14;if(playAcc>=1){const st=Math.floor(playAcc);playAcc-=st;if(year>=2026)stop();else setYear(Math.min(2026,year+st));}}
  requestAnimationFrame(loop);})(t0);

CITY.forEach(it=>{it.alive=true;});
view=defaultView();applyView();setYear(2026);renderCard(null);refresh();
})();
</script>

</body></html>
