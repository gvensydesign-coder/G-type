<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Глазомер</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;700&family=Playfair+Display:wght@700&family=JetBrains+Mono:wght@500&family=Caveat:wght@700&family=Ruslan+Display&display=swap">
<style>
/* Layout concept: одна узкая колонка, крупный Unbounded для заголовков, Onest для текста; белый/серый/чёрный + #FC473C только для действий и «верно». */
:root{
  --bg:#FFFFFF; --surface:#F5F4F4; --line:#E4E2E2; --fg:#151313; --muted:#6F6969;
  --accent:#FC473C; --on-accent:#FFFFFF;
  --f-display:'Unbounded','Arial Black',system-ui,sans-serif;
  --f-body:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#121010;--surface:#1D1A1A;--line:#322E2E;--fg:#F6F3F3;--muted:#A39C9C;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#121010;--surface:#1D1A1A;--line:#322E2E;--fg:#F6F3F3;--muted:#A39C9C;color-scheme:dark}

*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding-block:20px 56px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:44px}
.brand{background:none;border:0;padding:0;font:700 15px var(--f-display);letter-spacing:-.01em;display:inline-flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block}
.meter{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{width:clamp(80px,22vw,160px);height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .6s var(--ease)}
.stage{margin-top:28px}

@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:translateY(-8px)}}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
.enter{animation:rise .5s var(--ease) both}
.leaving{animation:out .19s ease forwards}

.kicker{font:500 12px/1.2 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lead{font-size:18px;color:var(--muted);max-width:44ch;margin:0}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--accent);color:var(--on-accent);border:0;border-radius:14px;padding:16px 26px;font:700 18px/1.1 var(--f-body);transition:transform .2s var(--ease),filter .2s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.05)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 2px var(--line);font-size:16px}
.btn.ghost:hover{box-shadow:inset 0 0 0 2px var(--fg);filter:none}

/* home */
.home{display:grid;gap:36px;grid-template-columns:1fr;align-items:center}
@media(min-width:800px){.home{grid-template-columns:1.1fr .9fr;gap:56px;min-height:480px}}
.home h1{font:700 clamp(36px,10.5vw,72px)/1 var(--f-display);letter-spacing:-.04em;margin:14px 0 20px}
.home .meta{font-size:14px;color:var(--muted);margin:16px 0 0}
.mosaic{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;max-width:420px;justify-self:end}
.mosaic button{aspect-ratio:1;border:0;border-radius:12px;padding:0;animation:pop .5s var(--ease) both;transition:transform .2s var(--ease)}
.mosaic button:hover{transform:scale(1.07)}
.mosaic button.found{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--fg);animation:pulse .6s var(--ease)}
.mosaic button.miss{animation:shake .4s}
.mhint{grid-column:1/-1;margin:6px 0 0;font-size:14px;color:var(--muted);min-height:44px}

/* intro + results */
.intro,.result{max-width:620px;margin:0 auto;display:grid;gap:18px;justify-items:start}
.secs{display:flex;gap:6px}
.secs i{width:28px;height:6px;border-radius:3px;background:var(--line)}
.secs i.done{background:var(--muted)}
.secs i.cur{background:var(--accent)}
.intro h2,.result h2{font:700 clamp(28px,7vw,44px)/1.05 var(--f-display);letter-spacing:-.03em;margin:0;text-wrap:balance}
.big{font:700 clamp(80px,24vw,150px)/.9 var(--f-display);letter-spacing:-.05em;color:var(--accent);font-variant-numeric:tabular-nums}
.big small{font-size:.4em;color:var(--muted);letter-spacing:-.02em}
.rdots{display:flex;gap:8px}
.rdots i{width:22px;height:22px;border-radius:6px;background:var(--line);animation:pop .4s var(--ease) both}
.rdots i.ok{background:var(--accent)}

/* round */
.round{max-width:620px;margin:0 auto}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dots{display:flex;gap:6px}
.dots i{width:12px;height:12px;border-radius:4px;border:2px solid var(--line);transition:background .3s,border-color .3s}
.dots i.cur{border-color:var(--fg)}
.dots i.ok{background:var(--accent);border-color:var(--accent)}
.dots i.bad{background:var(--muted);border-color:var(--muted)}
.task{font:500 clamp(19px,4.6vw,25px)/1.25 var(--f-display);letter-spacing:-.02em;margin:18px 0 22px;text-wrap:balance}
.foot{margin-top:22px;display:grid;gap:14px;justify-items:start}
.fb{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;background:var(--surface);border-radius:14px;width:100%;animation:rise .4s var(--ease) both}
.fb-tag{font:700 12px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;padding:6px 9px;border-radius:6px;white-space:nowrap;margin-top:2px}
.fb.good .fb-tag{background:var(--accent);color:var(--on-accent)}
.fb.bad .fb-tag{background:var(--fg);color:var(--bg)}
.fb-text{display:grid;gap:2px;min-width:0}
.fb-text span{color:var(--muted);font-size:14px}

/* 1 tone */
.grid{display:grid;gap:clamp(5px,1.6vw,10px);width:min(100%,460px);margin-inline:auto;aspect-ratio:1}
.tile{border:0;border-radius:clamp(6px,2vw,12px);padding:0;animation:pop .45s var(--ease) both;transition:transform .2s var(--ease),opacity .3s}
.tile:hover:not(:disabled){transform:scale(1.05)}
.tile:disabled{cursor:default}
.tile.found{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--fg);animation:pulse .6s var(--ease)}
.tile.wrong{animation:shake .4s}
.reveal .tile:not(.found):not(.wrong){opacity:.3}

/* 2-3 type */
.specimen{background:var(--surface);border-radius:18px;padding:clamp(24px,6vw,40px) 16px;text-align:center;overflow-x:auto;display:grid;gap:18px;justify-items:center;min-height:150px;align-content:center}
.sp-word{white-space:nowrap;line-height:1.1}
.kern{display:flex;justify-content:center;font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:min(150px,34vw);line-height:1;font-kerning:none;font-feature-settings:"kern" 0}
.kern span{display:inline-block}
.ideal{display:grid;gap:8px;justify-items:center;border-top:1px dashed var(--muted);padding-top:14px;width:100%;animation:rise .5s var(--ease) both}
.tag{background:var(--accent);color:var(--on-accent);font:700 11px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;padding:5px 8px;border-radius:5px}
.ctl{display:grid;gap:8px;margin-top:20px}
.ctl-row{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.ctl-row output{color:var(--fg);font-weight:700;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:32px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-11px;border-radius:50%;background:var(--accent);border:4px solid var(--bg);box-shadow:0 0 0 2px var(--accent)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--accent);border:4px solid var(--bg);box-shadow:0 0 0 2px var(--accent)}
input[type=range]:disabled{opacity:.45}

/* 4 optical */
.opt{width:min(100%,380px);display:block;margin:0 auto}
.o-circle{fill:var(--surface)}
.o-cross{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 4;opacity:.6}
.o-shape{fill:var(--fg)}
.o-shape.slide{transition:transform .7s var(--ease)}
.o-ghost{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-dasharray:5 4;stroke-linejoin:round;animation:rise .5s var(--ease) both}

/* 5 contrast */
.cpair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ccard{border:0;border-radius:16px;padding:18px 14px;aspect-ratio:3/4;display:grid;align-content:space-between;justify-items:start;text-align:left;animation:pop .5s var(--ease) both;transition:transform .2s var(--ease)}
.ccard:hover:not(:disabled){transform:translateY(-3px)}
.ccard:disabled{cursor:default}
.ccard.found{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--fg)}
.ccard.wrong{animation:shake .4s}
.c-big{font:700 clamp(40px,12vw,64px)/1 var(--f-display)}
.c-txt{font:500 clamp(14px,3.6vw,17px)/1.3 var(--f-body)}
.c-ratio{background:rgba(0,0,0,.55);color:#fff;font:700 13px/1 var(--f-body);padding:6px 9px;border-radius:6px;font-variant-numeric:tabular-nums;animation:rise .4s var(--ease) both}

/* 6 genre */
.sample{background:var(--surface);border-radius:18px;padding:30px 20px;text-align:center;display:grid;gap:10px}
.opts{display:grid;gap:10px;margin-top:16px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.opt-btn{background:transparent;border:0;box-shadow:inset 0 0 0 2px var(--line);border-radius:14px;padding:14px 16px;text-align:left;font:700 16px var(--f-body);animation:rise .4s var(--ease) both;transition:box-shadow .2s,transform .2s var(--ease)}
.opt-btn:hover:not(:disabled){box-shadow:inset 0 0 0 2px var(--fg);transform:translateY(-2px)}
.opt-btn:disabled{cursor:default}
.opt-btn.right{background:var(--accent);color:var(--on-accent);box-shadow:none}
.opt-btn.wrong{box-shadow:inset 0 0 0 2px var(--muted);color:var(--muted);text-decoration:line-through;animation:shake .4s}

/* final */
.final{display:grid;gap:22px;max-width:620px;margin:0 auto}
.card{border:2px solid var(--fg);border-radius:20px;padding:clamp(20px,5vw,32px);display:grid;gap:22px;background:var(--bg)}
.card-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.score{display:flex;align-items:baseline;gap:8px;font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums}
.score b{font-size:clamp(76px,23vw,132px);line-height:.9;letter-spacing:-.05em;color:var(--accent)}
.score span{font-size:clamp(22px,6vw,34px);color:var(--muted)}
.rank{font:700 clamp(21px,5.4vw,29px)/1.18 var(--f-display);letter-spacing:-.02em;margin:0;text-wrap:balance}
.joke{color:var(--muted);margin:8px 0 0;font-size:17px}
.rows{display:grid;border-top:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);animation:rise .45s var(--ease) both}
.row .t{font-weight:500}
.sq{display:flex;gap:5px}
.sq i{width:16px;height:16px;border-radius:4px;background:var(--line)}
.sq i.ok{background:var(--accent)}
.sw{display:grid;gap:8px;font-size:15px}
.sw p{margin:0}
.sw b{font-weight:700}
.card-foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.actions{display:flex;gap:12px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:500;animation:rise .3s var(--ease) both;z-index:20}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>

<div class="wrap">
  <header class="top">
    <button class="brand" id="brand" type="button"><i></i>Глазомер</button>
    <div class="meter" id="meter" hidden><span id="mtxt"></span><div class="bar"><i id="mbar"></i></div></div>
  </header>
  <main class="stage" id="stage"></main>
</div>

<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=n=>Math.floor(Math.random()*n);
const pick=a=>a[ri(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=ri(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const reduced=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const sign=()=>Math.random()<.5?-1:1;

const S={res:[]};
const stage=$('#stage');
let current=null,queue=Promise.resolve();

function show(node){
  queue=queue.then(async()=>{
    if(current){current.classList.add('leaving');await sleep(190);current.remove();}
    current=node;stage.appendChild(node);node.classList.add('enter');window.scrollTo(0,0);
  });
  return queue;
}
function setMeter(done,label){
  $('#meter').hidden=false;$('#mtxt').textContent=label;$('#mbar').style.width=(done/30*100)+'%';
}
function countUp(node,to,ms=900){
  if(reduced()||to===0){node.textContent=to;return;}
  const t0=performance.now();
  (function f(t){const k=clamp((t-t0)/ms,0,1);node.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f);})(t0);
}
function toast(msg){
  const t=el('div','toast',msg);document.body.appendChild(t);setTimeout(()=>t.remove(),1800);
}

/* ---------- helpers: color ---------- */
function hsl2rgb(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return[f(0)*255,f(8)*255,f(4)*255];}
const lum=([r,g,b])=>{const c=[r,g,b].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);});return .2126*c[0]+.7152*c[1]+.0722*c[2];};
const contrast=(a,b)=>{const x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05);};
const rgbCss=([r,g,b])=>`rgb(${Math.round(r)} ${Math.round(g)} ${Math.round(b)})`;

/* ---------- SECTIONS ---------- */
const SECTIONS=[
{
  key:'Цвет',title:'Найди отличие',
  task:'Найди плитку, которая чуть-чуть другого оттенка',
  intro:'Решётка одинаковых плиток, одна из них врёт. С каждым раундом врёт всё тоньше.',
  ok:['Глаз как пипетка.','Колориметр по имени Ты.','Монитор откалиброван. Ты тоже.','Заметил. Страшно.'],
  bad:['Это был другой оттенок. Честно.','Попробуй выкрутить яркость на максимум.','Почти. Но нет.','Плитки над тобой смеются.'],
  tiers:['Все плитки одинаковые? Бывает. Проверь монитор.','Нормальный глаз. В отдел цвета тебя возьмут.','Ты не человек, ты Pantone.'],
  round:toneRound
},
{
  key:'Трекинг',title:'Сделай правильный трекинг',
  task:'Подбери расстояние между буквами, чтобы смотрелось гармонично',
  intro:'Слишком тесно: буквы слипаются. Слишком широко: слово рассыпается. Золотая середина где-то рядом.',
  ok:['Буквы дышат ровно.','Принято без правок.','Арт-директор молчит. Это комплимент.','Чистая работа.'],
  bad:['Это уже не трекинг, а социальная дистанция.','Буквы то слипаются, то разбегаются.','Заказчик одобрил бы. Мы нет.','Слово просит развести его по комнатам.'],
  tiers:['Трекинг «на глаз» пока не твой. Поставь 0 и не трогай.','Буквы почти не ругаются друг с другом.','Шрифтовики шлют тебе открытки.'],
  round:trackingRound
},
{
  key:'Кернинг',title:'Кернинг-мастер',
  task:'Сдвинь вторую букву так, как это задумал сам шрифт',
  intro:'Пары вроде AV мечтают сблизиться. Помоги им, но без фанатизма.',
  ok:['Пара довольна.','Дыра закрыта. Мир спасён.','Кернинг как у шрифтолога.'],
  bad:['Между буквами можно припарковать самокат.','Слиплись, как пельмени.','Паре нужен семейный психолог.'],
  tiers:['Между буквами пока можно проехать на самокате.','Нормально. До логотипа NASA ещё далеко.','Лого студии оставь нам. Серьёзно.'],
  round:kerningRound
},
{
  key:'Оптика',title:'Оптический центр',
  task:'Поставь фигуру по центру круга',
  intro:'Математический центр обманывает. Глаз нет. Двигай, пока не отпустит.',
  ok:['Центр найден. Математики в ярости.','Выглядит ровно, хотя числа врут.','Оптика победила.'],
  bad:['Фигура уехала. Круг в шоке.','Линейка тебе не друг.','Глаз сказал «так», а оптика сказала «нет».'],
  tiers:['Ты центрируешь по линейке. Знакомься: оптика.','Оптику чувствуешь, но не доверяешь.','Ты ставишь иконку Play даже во сне.'],
  round:opticalRound
},
{
  key:'Контраст',title:'Читается?',
  task:'На какой плашке текст читается лучше?',
  intro:'Две плашки, один и тот же фон. Выбери ту, где текст виден отчётливее. Разница будет тонкой.',
  ok:['Контраст оценён верно.','WCAG одобрительно кивает.','Читаемость твоё второе имя.'],
  bad:['Эта надпись не прошла бы проверку AA.','Красиво не значит читаемо.','Читаемость ушла курить.'],
  tiers:['Светло-серый на белом твой любимый стиль.','Читаешь нормально. Уточни у пользователей.','Ни один тендер не пройдёт мимо тебя.'],
  round:contrastRound
},
{
  key:'Шрифты',title:'Угадай жанр шрифта',
  task:'К какому семейству относится этот шрифт?',
  intro:'Антиква, гротеск, рукописный и другие. С каждым раундом вариантов всё больше.',
  ok:['Типограф по вызову.','Засечки чувствуешь кожей.','Тут даже Google Fonts не нужен.'],

/* ---------- 1. TONE ---------- */
function toneRound(r,ui){
  const n=[2,3,4,5,6][r],d=[18,10,6,3.5,2.2][r];
  const h=rnd(0,360),sat=rnd(50,78),L=rnd(42,60),sg=sign(),odd=ri(n*n);
  const base=`hsl(${h.toFixed(1)} ${sat.toFixed(1)}% ${L.toFixed(1)}%)`;
  const diff=`hsl(${h.toFixed(1)} ${sat.toFixed(1)}% ${(L+sg*d).toFixed(1)}%)`;
  const grid=el('div','grid');grid.style.gridTemplateColumns=`repeat(${n},1fr)`;
  const tiles=[];
  for(let i=0;i<n*n;i++){
    const t=el('button','tile');t.type='button';t.setAttribute('aria-label','Плитка '+(i+1));
    t.style.background=i===odd?diff:base;t.style.animationDelay=(i*18)+'ms';
    t.onclick=()=>{
      if(ui.done)return;
      const ok=i===odd;
      tiles.forEach(x=>x.disabled=true);
      tiles[odd].classList.add('found');if(!ok)t.classList.add('wrong');
      grid.classList.add('reveal');
      ui.finish(ok,ok?100:0,`Разница была ${d}% по яркости.`);
    };
    tiles.push(t);grid.appendChild(t);
  }
  ui.play.appendChild(grid);
}

/* ---------- 2. TRACKING ---------- */
const fmtPct=v=>{const p=v*100;return(p>0.04?'+':p<-0.04?'−':'')+Math.abs(p).toFixed(1)+'%';};
function trackingRound(r,ui){
  const C=[

    {w:'ВНИМАНИЕ',f:"'Onest'",wt:500,sz:30,t:.10,tol:.04,note:'Капсу нужен воздух'},
    {w:'Обычный текст',f:"'Onest'",wt:400,sz:26,t:0,tol:.03,note:'Обычный текст лучше не трогать'},
    {w:'ДИЗАЙН',f:"'Playfair Display'",wt:700,sz:50,t:.06,tol:.025,note:'Засечному капсу чуть воздуха'},
    {w:'минимализм',f:"'Unbounded'",wt:500,sz:36,t:-0.02,tol:.02,note:'Широкому гротеску хватает своего воздуха'}
  ][r];
  const min=-0.1,max=0.25;

  const word=el('div','sp-word',C.w);
  const apply=(node,v)=>{node.style.letterSpacing=v+'em';node.style.marginRight=(-v)+'em';};
  const style=n=>{n.style.fontFamily=C.f+',system-ui,sans-serif';n.style.fontWeight=C.wt;n.style.fontSize=fs;};
  style(word);apply(word,start);spec.appendChild(word);
  const ctl=el('div','ctl');
  ctl.innerHTML=`<div class="ctl-row"><label for="trk">Трекинг</label><output id="trkv"></output></div><input id="trk" type="range" min="${min}" max="${max}" step="0.001" value="${start}">`;
  ui.play.append(spec,ctl);
  const input=$('#trk',ctl),out=$('#trkv',ctl);
  out.textContent=fmtPct(start);
  input.oninput=()=>{const v=+input.value;apply(word,v);out.textContent=fmtPct(v);};
  ui.confirm(()=>{
    const v=+input.value,diff=Math.abs(v-C.t),ok=diff<=C.tol;

    const w2=el('div','sp-word',C.w);style(w2);apply(w2,C.t);ideal.appendChild(w2);spec.appendChild(ideal);
    ui.finish(ok,pts,`У тебя ${fmtPct(v)}, идеал ${fmtPct(C.t)}. ${C.note}.`);

/* ---------- 3. KERNING ---------- */
function measureKern(pair){
  try{
    const c=document.createElement('canvas').getContext('2d');
    c.font='700 200px "Playfair Display"';
    c.fontKerning='normal';const a=c.measureText(pair).width;
    c.fontKerning='none';const b=c.measureText(pair).width;
    return(a-b)/200;
  }catch(e){return 0;}
}
async function kerningRound(r,ui){
  const K=[{p:'AV',fb:-0.09,tol:.035},{p:'To',fb:-0.07,tol:.03},{p:'LT',fb:-0.1,tol:.025},{p:'Ту',fb:-0.06,tol:.02},{p:'Yo',fb:-0.09,tol:.016}][r];
  try{await document.fonts.load('700 100px "Playfair Display"',K.p);}catch(e){}
  let t=measureKern(K.p);if(!(t<-0.012))t=K.fb;
  const min=-0.3,max=0.15;
  const start=clamp(t+sign()*rnd(.07,.13),min,max);
  const spec=el('div','specimen');
  const mk=(k,scale)=>{
    const w=el('div','kern',`<span>${K.p[0]}</span><span>${K.p[1]}</span>`);
    w.children[1].style.marginLeft=k+'em';
    if(scale)w.style.fontSize=`min(${150*scale}px,${34*scale}vw)`;
    return w;
  };
  const live=mk(start);spec.appendChild(live);
  const ctl=el('div','ctl');
  ctl.innerHTML=`<div class="ctl-row"><label for="krn">Кернинг</label><output id="krnv"></output></div><input id="krn" type="range" min="${min}" max="${max}" step="0.001" value="${start}">`;
  ui.play.append(spec,ctl);
  const input=$('#krn',ctl),out=$('#krnv',ctl);
  out.textContent=fmtPct(start);
  input.oninput=()=>{const v=+input.value;live.children[1].style.marginLeft=v+'em';out.textContent=fmtPct(v);};
  ui.confirm(()=>{
    const v=+input.value,diff=Math.abs(v-t),ok=diff<=K.tol;
    input.disabled=true;
    const pts=Math.round(clamp(1-diff/(K.tol*3),0,1)*100);
    const ideal=el('div','ideal',`<span class="tag">как надо · ${fmtPct(t)}</span>`);
    ideal.appendChild(mk(t,.5));spec.appendChild(ideal);
    ui.finish(ok,pts,`У тебя ${fmtPct(v)}, у шрифта ${fmtPct(t)}.`);
  });
}

/* ---------- 4. OPTICAL CENTER ---------- */
function polyInfo(p){
  let a=0,cx=0,cy=0;
  for(let i=0;i<p.length;i++){const[x0,y0]=p[i],[x1,y1]=p[(i+1)%p.length],c=x0*y1-x1*y0;a+=c;cx+=(x0+x1)*c;cy+=(y0+y1)*c;}
  a/=2;cx/=6*a;cy/=6*a;
  const xs=p.map(q=>q[0]),ys=p.map(q=>q[1]);
  return{cx,cy,bx:(Math.min(...xs)+Math.max(...xs))/2,by:(Math.min(...ys)+Math.max(...ys))/2,w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys)};
}
function opticalRound(r,ui){
  const O=[
    {name:'Кнопка Play',axis:'x',size:92,tol:7,pts:[[0,0],[0,100],[87,50]]},
    {name:'Знак «Внимание»',axis:'y',size:96,tol:5.5,pts:[[50,0],[100,87],[0,87]]},
    {name:'Стрелка «вперёд»',axis:'x',size:100,tol:4,pts:[[0,30],[55,30],[55,0],[100,50],[55,100],[55,70],[0,70]]},
    {name:'Иконка «Дом»',axis:'y',size:92,tol:3,pts:[[50,0],[100,42],[100,100],[0,100],[0,42]]},
    {name:'Раскрывашка ▾',axis:'y',size:78,tol:2.2,pts:[[0,0],[100,0],[50,62]]}
  ][r];
  ui.task.textContent=`${O.name}: поставь по центру круга так, как видит глаз`;
  const inf=polyInfo(O.pts),k=O.size/Math.max(inf.w,inf.h);
  const pts=O.pts.map(([x,y])=>[120+(x-inf.bx)*k,120+(y-inf.by)*k]);
  const target=O.axis==='x'?-(inf.cx-inf.bx)*k:-(inf.cy-inf.by)*k;
  const min=-40,max=40;
  const start=clamp(target+sign()*rnd(20,30),min,max);
  const str=pts.map(p=>p[0].toFixed(2)+','+p[1].toFixed(2)).join(' ');
  const svg=`<svg class="opt" viewBox="0 0 240 240" role="img" aria-label="${O.name} в круге"><circle class="o-circle" cx="120" cy="120" r="112"/><line class="o-cross" x1="120" y1="8" x2="120" y2="232"/><line class="o-cross" x1="8" y1="120" x2="232" y2="120"/><polygon class="o-shape" points="${str}"/></svg>`;
  const box=el('div','',svg);
  const ctl=el('div','ctl');
  ctl.innerHTML=`<div class="ctl-row"><label for="opt">Сдвиг по ${O.axis==='x'?'горизонтали':'вертикали'}</label><output id="optv"></output></div><input id="opt" type="range" min="${min}" max="${max}" step="0.5" value="${start}">`;
  ui.play.append(box,ctl);
  const shape=$('.o-shape',box),svgEl=$('svg',box),input=$('#opt',ctl),out=$('#optv',ctl);
  const move=(node,v)=>{node.style.transform=O.axis==='x'?`translate(${v}px,0)`:`translate(0,${v}px)`;};
  const fmt=v=>(v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(1)+' px';
  move(shape,start);out.textContent=fmt(start);
  input.oninput=()=>{const v=+input.value;move(shape,v);out.textContent=fmt(v);};
  ui.confirm(()=>{
    const v=+input.value,diff=Math.abs(v-target),ok=diff<=O.tol;
    input.disabled=true;
    const ghost=document.createElementNS('http://www.w3.org/2000/svg','polygon');
    ghost.setAttribute('points',str);ghost.setAttribute('class','o-ghost');move(ghost,target);
    svgEl.appendChild(ghost);
    shape.classList.add('slide');
    if(!ok)requestAnimationFrame(()=>move(shape,target));
    const p=Math.round(clamp(1-diff/(O.tol*3),0,1)*100);
    ui.finish(ok,p,`Промах ${diff.toFixed(1)} px. Оптический центр лежит не там, где геометрический.`);
  });
}

/* ---------- 5. CONTRAST ---------- */
function contrastRound(r,ui){
  const d=[.75,.4,.22,.12,.07][r];
  const h=rnd(0,360),bgRgb=hsl2rgb(h,62,rnd(30,38)),bg=rgbCss(bgRgb);
  const low=rnd(1.9,2.3),high=low*(1+d);
  const solve=ratio=>{let lo=35,hi=100;for(let i=0;i<24;i++){const m=(lo+hi)/2;contrast(bgRgb,hsl2rgb(0,0,m))<ratio?lo=m:hi=m;}return hsl2rgb(0,0,(lo+hi)/2);};
  const cards=shuffle([{ratio:low,win:false},{ratio:high,win:true}]);
  const wrap=el('div','cpair');
  const btns=cards.map((c,i)=>{
    c.rgb=solve(c.ratio);c.real=contrast(bgRgb,c.rgb);
    const b=el('button','ccard',`<span class="c-big">Аа</span><span class="c-txt">Привет, дизайнер. Это читается?</span>`);
    b.type='button';b.style.background=bg;b.style.color=rgbCss(c.rgb);b.style.animationDelay=(i*90)+'ms';
    b.setAttribute('aria-label','Плашка '+(i+1));
    b.onclick=()=>{
      if(ui.done)return;
      btns.forEach((x,j)=>{x.disabled=true;const tag=el('span','c-ratio',cards[j].real.toFixed(2)+' : 1');x.insertBefore(tag,x.firstChild);});
      const ok=c.win;
      btns[cards.findIndex(x=>x.win)].classList.add('found');if(!ok)b.classList.add('wrong');
      ui.finish(ok,ok?100:0,`Контраст ${cards[0].real.toFixed(2)} : 1 против ${cards[1].real.toFixed(2)} : 1.`);
    };
    return b;
  });
  btns.forEach(b=>wrap.appendChild(b));
  ui.play.appendChild(wrap);
}

async function roundScreen(s,r){
  const sec=SECTIONS[s];
  const n=el('section','round');
  n.innerHTML=`<div class="rhead"><span class="kicker">Раздел ${s+1} · ${sec.title}</span><div class="dots"><i></i><i></i><i></i><i></i><i></i></div></div><h2 class="task"></h2><div class="play"></div><div class="foot"></div>`;
  const ui={s,r,play:$('.play',n),foot:$('.foot',n),task:$('.task',n),done:false};
  ui.task.textContent=sec.task;
  const paint=()=>[...n.querySelectorAll('.dots i')].forEach((d,i)=>{const x=S.res[s][i];d.className=x?(x.ok?'ok':'bad'):(i===r?'cur':'');});
  paint();
  setMeter(s*5+r,`Раздел ${s+1}/6 · раунд ${r+1}/5`);
  ui.finish=(ok,pts,detail)=>{
    if(ui.done)return;ui.done=true;
    S.res[s][r]={ok,pts};paint();
    setMeter(s*5+r+1,`Раздел ${s+1}/6 · раунд ${r+1}/5`);
    const last=r===4;
    ui.foot.innerHTML=`<div class="fb ${ok?'good':'bad'}"><span class="fb-tag">${ok?'Верно':'Мимо'}</span><div class="fb-text"><b>${pick(ok?sec.ok:sec.bad)}</b>${detail?`<span>${detail}</span>`:''}</div></div><button class="btn next" type="button">${last?'Итоги раздела':'Дальше'} <span aria-hidden="true">→</span></button>`;
    const nb=$('.next',ui.foot);nb.onclick=()=>last?sectionResult(s):roundScreen(s,r+1);
    nb.focus({preventScroll:true});
    nb.scrollIntoView({block:'nearest',behavior:reduced()?'auto':'smooth'});
  };
  ui.confirm=fn=>{
    ui.foot.innerHTML='<button class="btn ok" type="button">Готово</button>';
    $('.ok',ui.foot).onclick=()=>{if(!ui.done)fn();};
  };
  try{await Promise.race([Promise.resolve(sec.round(r,ui)),sleep(1500)]);}catch(e){console.error(e);}
  show(n);
}

function sectionResult(s){
  const sec=SECTIONS[s],score=S.res[s].filter(x=>x.ok).length;

    <div class="rows">${SECTIONS.map((sec,i)=>`<div class="row" style="animation-delay:${300+i*70}ms"><span class="t">${sec.key}</span><span class="sq">${S.res[i].map(x=>`<i class="${x.ok?'ok':''}"></i>`).join('')}</span></div>`).join('')}</div>
    <div class="sw"><p><b>Сильная сторона.</b> ${STRONG[si]}</p><p><b>Слабое место.</b> ${sc[wi]===5?'Нет такого. Подозрительно.':WEAK[wi]}</p></div>
    <div class="card-foot"><span>Сертификат глазомера</span><span>${date}</span></div>
  </div>
  <div class="actions"><button class="btn" id="again" type="button">Ещё раз</button><button class="btn ghost" id="copy" type="button">Скопировать результат</button></div>`;
  $('#again',n).onclick=home;
  $('#copy',n).onclick=async()=>{
    const text=`Глазомер: ${total}/30 (${pct}%). ${rank.t}. ${rank.j}`;
    try{await navigator.clipboard.writeText(text);toast('Скопировано');}
    catch(e){
      const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();
      let ok=false;try{ok=document.execCommand('copy');}catch(_){}
      ta.remove();toast(ok?'Скопировано':'Не удалось скопировать');
    }
  };
  show(n).then(()=>countUp($('#tot',n),total,1100));
}

$('#brand').onclick=home;
home();
})();
</script>

</body></html>
