<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Select — превью</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font:400 var(--fs-base)/var(--lh) var(--f-ui);-webkit-font-smoothing:antialiased}
.row{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:center}
.row+.row,.cap+.row,.row+.cap{margin-top:var(--s3)}
.cap{margin:0 0 var(--s2);font:var(--fw-sb) var(--fs-xs)/1.2 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--text-2)}
.row+.cap,.stack+.cap{margin-top:var(--s5)}
.stack{display:grid;gap:var(--s3);max-width:420px}
.menu{position:static;width:230px}.xm{position:relative}</style>
</head>
<body>
<p class="cap">Список</p>
<div class="row"><select class="sel" aria-label="Начертание"><option>Regular</option><option>Italic</option></select><select class="sel" aria-label="Формат" disabled><option>Недоступно</option></select></div>
<p class="cap">Меню экспорта</p>
<div class="menu" role="menu" aria-label="Форматы"><button type="button" role="menuitem" class="on">Шрифт .ttf</button><button type="button" role="menuitem">Для сайта .woff</button><button type="button" role="menuitem">Семейство .zip</button><div class="divider"></div><button type="button" role="menuitem">Вариативный .ttf</button><button type="button" role="menuitem">Образец .png</button></div>
</body>
</html>
