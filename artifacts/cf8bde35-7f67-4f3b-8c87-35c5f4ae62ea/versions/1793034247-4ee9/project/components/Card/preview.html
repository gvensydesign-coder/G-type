<!-- @dsCard group="Поверхности" height=380 -->
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Card — превью</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font:400 var(--fs-base)/var(--lh) var(--f-ui);-webkit-font-smoothing:antialiased}
.row{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:center}
.row+.row,.cap+.row,.row+.cap{margin-top:var(--s3)}
.cap{margin:0 0 var(--s2);font:var(--fw-sb) var(--fs-xs)/1.2 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--text-2)}
.row+.cap,.stack+.cap{margin-top:var(--s5)}
.stack{display:grid;gap:var(--s3);max-width:420px}
.grid+.cap{margin-top:var(--s5)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:var(--pad)}
.big{font:800 64px/1 var(--f-ui);letter-spacing:-.04em;display:grid;place-items:center;height:124px;border-radius:var(--r-md);background:var(--canvas);color:#000;margin-bottom:var(--s3)}
.lcard{min-height:230px}.ln{font-size:var(--fs-xl)}</style>
</head>
<body>
<p class="cap">Карточки</p>
<div class="grid"><div class="card"><b>.card</b><br><span style="color:var(--text-2)">Плоская карточка на фоне, лёгкая тень <code>--sh-1</code>.</span></div><div class="surface" style="padding:var(--s4)"><b>.surface</b><br><span style="color:var(--text-2)">Плавающая белая поверхность, тень <code>--sh-2</code>.</span></div></div>
<p class="cap">Карточка с вырезом</p>
<div class="grid"><div class="lcard notchc" tabindex="0" role="link" aria-label="Квадра"><span class="notch"><span class="nb go"><i class="ico i-arrow-r"></i></span></span><div class="big" aria-hidden="true">Аа Gg</div><div class="ln">Квадра</div><div class="lt">Гротеск, 2026</div></div>
<div class="lcard notchc on" tabindex="0" role="link" aria-label="Линия, выбран"><span class="notch"><span class="nb go"><i class="ico i-arrow-r"></i></span></span><div class="big" aria-hidden="true">Аа Gg</div><div class="ln">Линия <em></em></div><div class="lt">Геометрический, 2026</div></div></div>
</body>
</html>
