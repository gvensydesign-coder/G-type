<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>IconButton — превью</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font:400 var(--fs-base)/var(--lh) var(--f-ui);-webkit-font-smoothing:antialiased}
.row{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:center}
.row+.row,.cap+.row,.row+.cap{margin-top:var(--s3)}
.cap{margin:0 0 var(--s2);font:var(--fw-sb) var(--fs-xs)/1.2 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--text-2)}
.row+.cap,.stack+.cap{margin-top:var(--s5)}
.stack{display:grid;gap:var(--s3);max-width:420px}
</style>
</head>
<body>
<p class="cap">Круглые кнопки-иконки</p>
<div class="row"><button class="ibtn" type="button" aria-label="Назад"><i class="ico i-undo"></i></button><button class="ibtn" type="button" aria-label="Вперёд"><i class="ico i-redo"></i></button><button class="ibtn sm" type="button" aria-label="Поиск"><i class="ico i-search"></i></button><button class="ibtn" type="button" disabled aria-label="Скачать"><i class="ico i-download"></i></button></div>
<p class="cap">Плоская</p>
<div class="row"><button class="tbtn" type="button" aria-label="Подсказки"><i class="ico i-help"></i></button><button class="tbtn" type="button" aria-label="Закрыть"><i class="ico i-close"></i></button></div>
</body>
</html>
