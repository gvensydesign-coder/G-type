<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Тихий Архипелаг</title>
<style>html,body{height:100%;background:#1f7fb5;color:#fff}body{margin:0;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#game{position:fixed;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:#1f7fb5}#c{position:absolute;inset:0;width:100%;height:100%;display:block}
/* style.css — интерфейс «Тихого Архипелага»: кремовые круглые кнопки, мягкие тени, тёплый ореол */
.ta-ui {
  --cream: #fbf6e9; --cream2: #f1e8d0; --cream3: #e6dbbd;
  --ink: #4b5160; --ink2: #7d8591; --accent: #5fa83a; --halo: #ffd45e;
  --b: 44px; --gap: 7px; --bar-h: 64px;
  --shadow: 0 3px 9px rgba(24, 66, 84, .30), 0 1px 2px rgba(24, 66, 84, .22);
  --card-bg: rgba(251, 246, 233, .92);
  position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 20;
  font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, sans-serif;
  color: var(--ink); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  font-size: 14px; line-height: 1.3;
}
body > .ta-ui { position: fixed; }
.ta-ui *, .ta-ui *::before, .ta-ui *::after { box-sizing: border-box; }
.ta-ui[data-mood="golden"] { --cream: #fcf1dc; --cream2: #f4e2c0; --card-bg: rgba(252, 241, 220, .92); }
.ta-ui[data-mood="dusk"] { --cream: #f1ecf7; --cream2: #e0d8ee; --cream3: #cfc4e4; --ink: #4a4766; --card-bg: rgba(241, 236, 247, .92); }
.ta-ui[data-mood="mist"] { --cream: #f6f7f3; --cream2: #e9ece6; --card-bg: rgba(246, 247, 243, .92); }
/* мягкая подложка под панелью — кнопки читаются на любом фоне */
.ta-ui::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 130px; background: linear-gradient(to top, rgba(18, 58, 78, .24), rgba(18, 58, 78, 0)); pointer-events: none; transition: opacity .5s; }
.ta-ui.ta-photo::before { opacity: 0; }

/* ---------- нижняя панель ---------- */
.ta-bar { position: absolute; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; align-items: flex-end; gap: 24px; pointer-events: none; white-space: nowrap; transition: opacity .45s, transform .45s; }
.ta-grp { display: flex; align-items: center; gap: var(--gap); pointer-events: auto; }
.ta-btn {
  position: relative; flex: none; width: var(--b); height: var(--b); padding: 0; border: 0; border-radius: 50%; cursor: pointer; outline: none;
  background: radial-gradient(circle at 34% 26%, #ffffff 0%, var(--cream) 52%, var(--cream2) 100%);
  box-shadow: var(--shadow), inset 0 2px 2px rgba(255, 255, 255, .95), inset 0 -3px 4px rgba(176, 152, 104, .28);
  transition: transform .2s cubic-bezier(.3, 1.7, .5, 1), box-shadow .25s, opacity .3s, filter .3s;
  animation: ta-btnin .6s cubic-bezier(.2, 1.5, .4, 1) var(--d, 0s) backwards;
  touch-action: manipulation;
}
.ta-btn:hover { transform: translateY(-2px) scale(1.07); }
.ta-btn:active { transform: translateY(0) scale(.94); transition-duration: .08s; }
.ta-btn:focus-visible { box-shadow: var(--shadow), 0 0 0 3px rgba(79, 182, 216, .8); }
.ta-ico { position: absolute; inset: 2px; display: block; pointer-events: none; filter: drop-shadow(0 1px 1px rgba(60, 50, 30, .22)); }
.ta-ico svg { display: block; width: 100%; height: 100%; overflow: visible; }
.ta-key { position: absolute; left: 7px; bottom: 3px; font-style: normal; font-size: 9px; font-weight: 700; color: #5d6470; opacity: .7; line-height: 1; pointer-events: none; text-shadow: 0 1px 0 rgba(255, 255, 255, .8); }
/* активная: тёплый жёлтый ореол */
.ta-btn.ta-on {
  background: radial-gradient(circle at 34% 26%, #fffbe2 0%, #ffeaa4 50%, #ffd35c 100%);
  box-shadow: 0 0 0 3px rgba(255, 214, 92, .7), 0 0 16px 7px rgba(255, 201, 72, .55), 0 5px 11px rgba(120, 88, 14, .32), inset 0 2px 2px rgba(255, 255, 255, .95), inset 0 -3px 4px rgba(214, 160, 40, .35);
  transform: translateY(-3px) scale(1.08);
  animation: ta-halo 3.2s ease-in-out infinite;
}
.ta-btn.ta-on .ta-key { color: #7a5a12; opacity: .9; }
.ta-btn.ta-open { background: radial-gradient(circle at 34% 26%, #fffdf2, #f6e9c4 60%, #ead8a8); transform: translateY(-2px); }
.ta-btn.ta-dim { opacity: .48; filter: saturate(.55); }
.ta-btn.ta-locked { visibility: hidden; transform: scale(.3); pointer-events: none; }
.ta-btn.ta-appear { animation: ta-btnin .9s cubic-bezier(.2, 1.6, .4, 1) backwards; }
.ta-btn.ta-ping::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid rgba(255, 207, 84, .9); animation: ta-ping 1.2s ease-out 2; }
/* кнопка «фото» и вех — прямоугольная карточка с язычком, как в референсе */
.ta-grp-cam { gap: 4px; }
.ta-btn.ta-b-photo { width: calc(var(--b) * 1.2); border-radius: calc(var(--b) * .3); }
.ta-btn.ta-b-journal { width: calc(var(--b) * .6); border-radius: calc(var(--b) * .24); }
.ta-btn.ta-b-journal .ta-ico { inset: 5px 1px; }
.ta-btn.ta-b-photo .ta-ico { inset: 3px 2px; }
.ta-btn.ta-b-mood { background: radial-gradient(circle at 34% 26%, #ffffff 0%, var(--cream) 60%, var(--cream2) 100%); }

@keyframes ta-btnin { from { transform: translateY(26px) scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes ta-halo { 0%, 100% { box-shadow: 0 0 0 3px rgba(255, 214, 92, .7), 0 0 14px 6px rgba(255, 201, 72, .5), 0 5px 11px rgba(120, 88, 14, .32), inset 0 2px 2px rgba(255, 255, 255, .95), inset 0 -3px 4px rgba(214, 160, 40, .35); } 50% { box-shadow: 0 0 0 3px rgba(255, 214, 92, .85), 0 0 22px 10px rgba(255, 201, 72, .65), 0 5px 11px rgba(120, 88, 14, .32), inset 0 2px 2px rgba(255, 255, 255, .95), inset 0 -3px 4px rgba(214, 160, 40, .35); } }
@keyframes ta-ping { from { transform: scale(.9); opacity: 1; } to { transform: scale(1.7); opacity: 0; } }

/* ---------- тултип ---------- */
.ta-tip { position: absolute; transform: translate(-50%, 6px); display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 8px; max-width: 250px; padding: 8px 12px; border-radius: 14px; background: var(--card-bg); box-shadow: var(--shadow); opacity: 0; transition: opacity .18s, transform .18s; text-align: center; font-size: 12px; pointer-events: none; z-index: 5; }
.ta-tip.ta-show { opacity: 1; transform: translate(-50%, 0); }
.ta-tip b { font-size: 13px; color: #3f4554; }
.ta-tip kbd { font: 700 10px/1 inherit; font-family: inherit; padding: 3px 6px; border-radius: 6px; background: var(--cream3); color: #5d6470; box-shadow: inset 0 -1px 0 rgba(0, 0, 0, .12); }
.ta-tip span { flex-basis: 100%; color: var(--ink2); font-size: 11.5px; }

/* ---------- панель вариантов ---------- */
.ta-pop { position: absolute; transform: translate(-50%, 8px) scale(.9); transform-origin: 50% 100%; display: flex; gap: 6px; padding: 8px 10px; border-radius: 22px; background: var(--card-bg); box-shadow: var(--shadow), 0 0 0 1px rgba(255, 255, 255, .6) inset; opacity: 0; pointer-events: none; transition: opacity .2s, transform .25s cubic-bezier(.3, 1.6, .5, 1); z-index: 6; }
.ta-pop::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 14px; height: 14px; margin-left: -7px; background: var(--card-bg); transform: rotate(45deg); border-radius: 3px; box-shadow: 3px 3px 5px rgba(24, 66, 84, .15); z-index: -1; }
.ta-pop.ta-show { opacity: 1; transform: translate(-50%, 0) scale(1); pointer-events: auto; }
.ta-chip { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 52px; padding: 4px 4px 3px; border: 0; background: none; cursor: pointer; border-radius: 14px; font: inherit; color: var(--ink); transition: background .15s, transform .15s; }
.ta-chip:hover { background: rgba(255, 255, 255, .6); transform: translateY(-1px); }
.ta-chip .ta-sw { width: 30px; height: 30px; border-radius: 50%; box-shadow: inset 0 2px 3px rgba(255, 255, 255, .55), inset 0 -3px 4px rgba(0, 0, 0, .16), 0 2px 4px rgba(24, 66, 84, .25); }
.ta-chip .ta-cl { font-size: 10.5px; font-weight: 600; white-space: nowrap; }
.ta-chip.ta-on { background: rgba(255, 226, 140, .6); }
.ta-chip.ta-on .ta-sw { box-shadow: 0 0 0 2.5px #ffd35c, 0 0 10px 3px rgba(255, 201, 72, .6), inset 0 2px 3px rgba(255, 255, 255, .55), inset 0 -3px 4px rgba(0, 0, 0, .16); }

/* ---------- статистика (тонкая строка) ---------- */
.ta-stats { position: absolute; left: 16px; top: calc(14px + env(safe-area-inset-top, 0px)); display: flex; align-items: center; gap: 7px; padding: 6px 13px; border-radius: 999px; background: rgba(251, 246, 233, .58); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); box-shadow: 0 2px 8px rgba(24, 66, 84, .16); font-size: 12.5px; color: #4a5260; opacity: 0; transform: translateY(-8px); transition: opacity .6s, transform .6s; pointer-events: none; white-space: nowrap; }
.ta-stats.ta-show { opacity: 1; transform: none; }
.ta-stat { display: inline-flex; align-items: center; gap: 4px; transition: opacity .4s; }
.ta-stat svg { width: 13px; height: 13px; color: #6a9a4c; }
.ta-stat b { font-weight: 800; font-variant-numeric: tabular-nums; }
.ta-stat em { font-style: normal; opacity: .75; }
.ta-stat.ta-zero { opacity: .45; }
.ta-stat.ta-bump b { animation: ta-bump .5s cubic-bezier(.3, 1.8, .5, 1); }
.ta-dot { opacity: .4; }
@keyframes ta-bump { 0% { transform: scale(1); } 40% { transform: scale(1.5); color: #d98a1c; } 100% { transform: scale(1); } }

/* ---------- тосты и подсказка ---------- */
.ta-toasts { position: absolute; left: 50%; top: calc(58px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; width: min(92vw, 420px); pointer-events: none; z-index: 8; }
.ta-toast { display: flex; align-items: center; gap: 10px; max-width: 100%; padding: 9px 18px 9px 10px; border-radius: 999px; background: var(--card-bg); box-shadow: var(--shadow), 0 0 0 1px rgba(255, 255, 255, .5) inset; animation: ta-toast-in .6s cubic-bezier(.2, 1.4, .4, 1) both; transition: opacity .55s, transform .55s; }
.ta-toast.ta-out { opacity: 0; transform: translateY(-10px) scale(.96); }
.ta-ti { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, #fff, var(--cream2)); box-shadow: inset 0 -2px 3px rgba(176, 152, 104, .3); }
.ta-ti svg { width: 20px; height: 20px; }
.ta-tt { display: flex; flex-direction: column; min-width: 0; }
.ta-tt b { font-size: 14px; color: #3f4554; }
.ta-tt em { font-style: normal; font-size: 12px; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ta-toast.ta-milestone { background: linear-gradient(135deg, #fffaf0, #fdeec5); box-shadow: 0 4px 16px rgba(180, 130, 30, .35), 0 0 0 1px rgba(255, 224, 140, .8) inset, 0 0 24px 4px rgba(255, 214, 92, .35); }
.ta-toast.ta-milestone .ta-ti { animation: ta-twinkle 1.6s ease-in-out 3; }
@keyframes ta-toast-in { from { opacity: 0; transform: translateY(-14px) scale(.9); } to { opacity: 1; transform: none; } }
@keyframes ta-twinkle { 50% { transform: scale(1.2) rotate(12deg); } }
.ta-hint { position: absolute; left: 50%; bottom: calc(var(--bar-h) + 30px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 8px); padding: 8px 18px; border-radius: 999px; background: rgba(251, 246, 233, .78); -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); box-shadow: 0 2px 10px rgba(24, 66, 84, .2); font-size: 13.5px; color: #475060; opacity: 0; transition: opacity .6s, transform .6s; text-align: center; max-width: 90vw; pointer-events: none; }
.ta-hidehint .ta-hint { opacity: 0 !important; }
.ta-hint.ta-show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- карточки: настройки и журнал ---------- */
.ta-card { position: absolute; left: 50%; width: min(92vw, 330px); transform: translate(-50%, 12px) scale(.96); transform-origin: 50% 100%; padding: 16px 18px 18px; border-radius: 24px; background: var(--card-bg); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: 0 8px 28px rgba(24, 66, 84, .32), 0 0 0 1px rgba(255, 255, 255, .55) inset; opacity: 0; pointer-events: none; transition: opacity .22s, transform .3s cubic-bezier(.3, 1.5, .5, 1); z-index: 7; max-height: calc(100% - var(--bar-h) - 80px); overflow: auto; }
.ta-card.ta-show { opacity: 1; transform: translate(-50%, 0) scale(1); pointer-events: auto; }
.ta-card h3 { margin: 0 0 12px; font-size: 17px; font-weight: 800; color: #3f4554; letter-spacing: .01em; }
.ta-row { display: flex; align-items: center; gap: 10px; margin: 11px 0; }
.ta-row.ta-col { flex-direction: column; align-items: stretch; gap: 8px; }
.ta-lab { flex: none; width: 82px; font-size: 13px; font-weight: 700; color: var(--ink2); }
.ta-row.ta-col .ta-lab { width: auto; }
.ta-row output { flex: none; width: 36px; text-align: right; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--ink2); }
.ta-range { -webkit-appearance: none; appearance: none; flex: 1; min-width: 0; height: 8px; border-radius: 99px; background: linear-gradient(to right, #8fd6d2, #34aecb); outline: none; box-shadow: inset 0 1px 2px rgba(0, 0, 0, .18); cursor: pointer; }
.ta-range::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, var(--cream2)); box-shadow: var(--shadow), 0 0 0 2px rgba(255, 214, 92, .8); border: 0; }
.ta-range::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, var(--cream2)); box-shadow: var(--shadow), 0 0 0 2px rgba(255, 214, 92, .8); border: 0; }
.ta-seg { flex: 1; display: flex; padding: 3px; border-radius: 99px; background: rgba(120, 100, 60, .13); box-shadow: inset 0 1px 2px rgba(0, 0, 0, .1); }
.ta-seg button { flex: 1; border: 0; background: none; padding: 6px 4px; border-radius: 99px; font: 600 12px inherit; font-family: inherit; color: var(--ink2); cursor: pointer; transition: background .2s, color .2s, box-shadow .2s; }
.ta-seg button.ta-on { background: linear-gradient(#fffbe4, #ffe9a0); color: #6a4d0c; box-shadow: 0 1px 4px rgba(150, 110, 20, .4); }
.ta-moods { display: flex; justify-content: space-between; gap: 4px; }
.ta-msw { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 0; border: 0; background: none; cursor: pointer; border-radius: 14px; font-family: inherit; color: var(--ink); }
.ta-msw span { width: 34px; height: 34px; border-radius: 50%; box-shadow: inset 0 2px 3px rgba(255, 255, 255, .6), inset 0 -3px 4px rgba(0, 0, 0, .15), 0 2px 5px rgba(24, 66, 84, .28); transition: transform .2s cubic-bezier(.3, 1.7, .5, 1); }
.ta-msw:hover span { transform: scale(1.1); }
.ta-msw em { font-style: normal; font-size: 10.5px; font-weight: 600; text-align: center; }
.ta-msw.ta-on { background: rgba(255, 226, 140, .55); }
.ta-msw.ta-on span { box-shadow: 0 0 0 2.5px #ffd35c, 0 0 10px 3px rgba(255, 201, 72, .6), inset 0 2px 3px rgba(255, 255, 255, .6), inset 0 -3px 4px rgba(0, 0, 0, .15); }
.ta-actions { display: flex; gap: 8px; margin-top: 16px; }
.ta-pill { flex: 1; border: 0; padding: 10px 8px; border-radius: 99px; font: 700 13px inherit; font-family: inherit; color: #4a4f5c; cursor: pointer; background: linear-gradient(#ffffff, var(--cream2)); box-shadow: var(--shadow), inset 0 1px 1px #fff; transition: transform .15s, background .2s; }
.ta-pill:hover { transform: translateY(-1px); }
.ta-pill:active { transform: scale(.96); }
.ta-pill.ta-warn { background: linear-gradient(#ffe3dc, #f7b9ac); color: #8a2f22; }
.ta-journal { width: min(92vw, 340px); }
.ta-jbar { height: 6px; border-radius: 99px; background: rgba(120, 100, 60, .15); overflow: hidden; }
.ta-jbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ffd35c, #f0a640); border-radius: 99px; transition: width .6s; }
.ta-jcount { margin: 6px 0 10px; font-size: 12px; color: var(--ink2); }
.ta-jlist { display: flex; flex-direction: column; gap: 6px; max-height: 260px; overflow: auto; }
.ta-jrow { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 14px; background: rgba(255, 255, 255, .55); }
.ta-jrow svg { flex: none; width: 22px; height: 22px; }
.ta-jrow div { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.ta-jrow b { font-size: 13.5px; color: #3f4554; }
.ta-jrow small { font-size: 11.5px; color: var(--ink2); }
.ta-jrow time { font-size: 11px; color: var(--ink2); font-variant-numeric: tabular-nums; }
.ta-empty { margin: 8px 0; font-size: 13px; color: var(--ink2); line-height: 1.45; }

/* ---------- заставка ---------- */
.ta-intro { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 14vh 20px calc(var(--bar-h) + 90px); pointer-events: none; opacity: 0; background: radial-gradient(ellipse at 50% 38%, rgba(20, 70, 100, .18), rgba(20, 70, 100, 0) 62%); z-index: 12; }
.ta-intro.ta-show { opacity: 1; animation: ta-fadein 1.6s ease both; }
.ta-intro.ta-out { opacity: 0; transition: opacity 1.3s ease, transform 1.3s ease; transform: scale(1.04); }
.ta-itop { text-align: center; color: #fffdf4; }
.ta-itop h1 { margin: 6px 0 0; font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif; font-weight: 600; font-size: clamp(38px, 8.2vw, 92px); letter-spacing: .035em; line-height: 1.05; text-shadow: 0 2px 0 rgba(31, 100, 130, .35), 0 4px 22px rgba(15, 70, 100, .55), 0 0 44px rgba(255, 255, 255, .35); animation: ta-title 2.4s cubic-bezier(.2, .7, .2, 1) both; }
.ta-sub { margin: 10px 0 0; font-size: clamp(14px, 2vw, 19px); letter-spacing: .12em; text-transform: lowercase; opacity: .9; text-shadow: 0 1px 10px rgba(15, 70, 100, .6); animation: ta-fadein 2.2s ease .8s both; }
.ta-iwave { width: clamp(120px, 18vw, 210px); height: auto; filter: drop-shadow(0 2px 6px rgba(15, 70, 100, .45)); }
.ta-iwave path { stroke-dasharray: 260; stroke-dashoffset: 260; animation: ta-draw 2.2s ease .3s forwards; }
.ta-ihint { padding: 10px 22px; border-radius: 99px; background: rgba(251, 246, 233, .82); box-shadow: 0 4px 16px rgba(15, 70, 100, .3); font-size: clamp(13px, 1.8vw, 16px); font-weight: 600; color: #4a5260; text-align: center; animation: ta-fadein 1.6s ease 1.8s both, ta-breathe 3.4s ease-in-out 3.4s infinite; }
@keyframes ta-fadein { from { opacity: 0; } to { opacity: 1; } }
@keyframes ta-title { from { opacity: 0; letter-spacing: .14em; transform: translateY(14px); filter: blur(8px); } to { opacity: 1; letter-spacing: .035em; transform: none; filter: none; } }
@keyframes ta-draw { to { stroke-dashoffset: 0; } }
@keyframes ta-breathe { 50% { transform: translateY(-4px); box-shadow: 0 8px 22px rgba(15, 70, 100, .3); } }

/* ---------- фоторежим ---------- */
.ta-flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 30; }
.ta-flash.ta-go { animation: ta-flash .7s ease-out; }
@keyframes ta-flash { 0% { opacity: .85; } 100% { opacity: 0; } }
.ta-pbar { position: absolute; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); display: flex; align-items: center; gap: 22px; opacity: 0; pointer-events: none; transition: opacity .4s, transform .4s; z-index: 15; }
.ta-pbar span { position: absolute; left: 50%; bottom: -22px; transform: translateX(-50%); font-size: 11px; color: rgba(255, 255, 255, .9); text-shadow: 0 1px 4px rgba(0, 0, 0, .5); white-space: nowrap; }
.ta-shutter { position: relative; width: 66px; height: 66px; border-radius: 50%; border: 4px solid rgba(255, 255, 255, .95); background: rgba(255, 255, 255, .15); cursor: pointer; box-shadow: 0 3px 14px rgba(0, 0, 0, .3); padding: 0; transition: transform .15s; }
.ta-shutter i { position: absolute; inset: 6px; border-radius: 50%; background: #fff; transition: transform .12s; }
.ta-shutter:active i { transform: scale(.85); }
.ta-pclose { width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(251, 246, 233, .85); color: #4a5260; font-size: 15px; cursor: pointer; box-shadow: var(--shadow); }

      for (let i = -1; i <= 1; i++) { b.push().translate(x + i * w * 0.34, yc - h / 2 - 0.004, 0.032).blob(0.027, 5, 0.25, 0.9).pop(); }
    }
  }

  /* =====================================================================
   * ЧЕРТЁЖ house — фахверковый дом, клетка 1x1 (занимает ~0.94)
   *  цоколь (камень) 0.10 | 1-й этаж: стена y 0.10..0.55 (высота 0.45), 2-4 этаж: по 0.42
   *  стены: полуширина 0.385 + 0.025 на каждый верхний этаж (выступающие этажи, jetty)
   *  окна 0.095x0.15, дверь 0.14x0.24 (арка) на свободной стороне, ящики цветов, ставни
   *  крыша: двускатная, уклон ~48-52°, высота ~0.50-0.56, свес 0.05, провис конька, кривой скат;
   *  фронтоны: штукатурный треугольник + балки + арочное чердачное окно; слуховое окно (этажи>=2)
   *  труба: 0.10x0.10, выступает над коньком на 0.2; сваи (stilts): 8 свай до y=-0.55, помост, лесенка;
   *  причал (dock): настил 0.3x0.55 за границей клетки
   *  neighbors n/e/s/w: стены нет (стена продолжается в соседа до 0.5), крыша общая без свеса
   * ===================================================================== */
  const STYLE = {
    timber: { wall: [MAT.PLASTER, 'plaster', 0.04], beam: [MAT.TIMBER, 'timber'], roof: [MAT.SLATE, 'slateBlue'], roof2: 'slateDark', plinth: 'stoneGray', chim: 'rockDark', shut: ['cloth2', 'cloth4', 'cloth1'] },
    brown: { wall: [MAT.PLASTER, 'plaster', 0.06], beam: [MAT.WOOD_DARK, 'woodDark'], roof: [MAT.SHINGLE, 'shingle'], roof2: 'shingleDark', plinth: 'rockWarm', chim: 'stoneGray', shut: ['cloth4', 'cloth3', 'cloth2'] },
    slate: { wall: [MAT.PLANK, 'slateDark', 0.06], beam: [MAT.TIMBER, 'timber'], roof: [MAT.SLATE, 'slateBlue'], roof2: 'slateDark', plinth: 'rockDark', chim: 'rockDark', shut: ['cloth3', 'cloth1', 'cloth4'] },
    red: { wall: [MAT.PLASTER, 'plaster', 0.05], beam: [MAT.TIMBER, 'woodDark'], roof: [MAT.TILE_RED, 'tileRed'], roof2: 'tilePink', plinth: 'stoneGray', chim: 'rockWarm', shut: ['cloth2', 'cloth4', 'cloth3'] }
  };
  const ANG = { pz: 0, px: PI / 2, nz: PI, nx: -PI / 2 };

  function facade(b, side, F, k, isTop, isDoor, st, rng, nb, flat) {
    const E = F.E; let hw, cx = 0, cz = 0;
    if (side === 'pz' || side === 'nz') { hw = (E.px + E.nx) / 2; cx = (E.px - E.nx) / 2; cz = side === 'pz' ? E.pz : -E.nz; }
    else { hw = (E.pz + E.nz) / 2; cz = (E.pz - E.nz) / 2; cx = side === 'px' ? E.px : -E.nx; }
    // соседи на концах (локальные -x / +x)
    const endNeg = { pz: nb.nx, nz: nb.px, px: nb.pz, nx: nb.nz }[side], endPos = { pz: nb.px, nz: nb.nx, px: nb.nz, nx: nb.pz }[side];
    const y0 = F.y0, y1 = F.y1, h = y1 - y0;
    b.push().translate(cx, 0, cz).rotateY(ANG[side]);
    const bm = st.beam;
    b.setMat(bm[0], bm[1], 0.07);
    const T = 0.014, Z0 = -0.006;
    b.boxAB(-hw, y0, Z0, hw, y0 + 0.036, T, { skip: 'nz ny' });
    if (isTop) b.boxAB(-hw, y1 - 0.03, Z0, hw, y1, T, { skip: 'nz py' });
    const pw = 0.034, posts = [];
    if (!endNeg) posts.push(-hw + pw / 2); if (!endPos) posts.push(hw - pw / 2);
    const wide = hw > 0.3, midPost = wide && !(isDoor && k === 0);
    if (midPost) posts.push(0);
    for (const px of posts) b.boxAB(px - pw / 2, y0, Z0, px + pw / 2, y1, T, { skip: 'nz py ny' });
    // панели
    const panels = midPost ? [[-hw + pw, -pw / 2], [pw / 2, hw - pw]] : [[-hw + pw, hw - pw]];
    const wy = y0 + h * 0.56, ww = 0.095, wh = k === 0 ? 0.15 : 0.14;
    const braceIdx = (!isDoor || k > 0) && rng() < 0.55 ? Math.floor(rng() * panels.length) : -1;
    if (isDoor && k === 0) {
      // дверь: арка-обрамление + полотно + ступень
      const dx = wide ? rng.range(-0.04, 0.04) : 0, dw = 0.17, dh = 0.2, y = y0 + 0.004;
      b.setMat(bm[0], bm[1], 0.06);
      b.push().translate(dx, y, 0.0125); b.fan(archPts(dw + 0.03, dh, 0.09, 6)); b.pop();
      b.setMat(MAT.WOOD_DARK, 'woodDark', 0.1);
      b.push().translate(dx, y, 0.0135); b.fan(archPts(dw, dh, 0.075, 6)); b.pop();
      b.setMat(MAT.GOLD, 'gold', 0.05); b.boxAB(dx + 0.05, y + 0.13, 0.0135, dx + 0.062, y + 0.142, 0.022);
      b.setMat(MAT.STONE_GRAY, st.plinth, 0.08);
      b.boxAB(dx - 0.11, 0, 0.0, dx + 0.11, 0.04 + (y0 > 0.08 ? 0 : 0), 0.085, { skip: 'nz ny' });
      for (const [a, c] of panels) {
        if (c - a < 0.1) continue;
        const wx = (a + c) / 2; if (Math.abs(wx - dx) < 0.21) continue;
        b.setMat(bm[0], bm[1], 0.07);
        windowAt(b, wx, wy, ww, wh, rng, { shutters: rng() < 0.35 ? rng.pick(st.shut) : null });
      }
    } else {
      panels.forEach(([a, c], i) => {
        const wx = (a + c) / 2;
        if (i === braceIdx) {
          b.setMat(bm[0], bm[1], 0.07);
          const dir = rng() < 0.5;
          b.strut(dir ? a : c, y0 + 0.036, 0.004, dir ? c : a, y1 - (isTop ? 0.03 : 0.0), 0.004, 0.02, 0.03);
        } else {
          b.setMat(bm[0], bm[1], 0.07);
          windowAt(b, wx, wy, ww, wh, rng, {
            shutters: rng() < 0.3 ? rng.pick(st.shut) : null,
            flowers: rng() < 0.22 ? rng.pick(['blossom', 'blossomLight', 'lavender', 'gold']) : null
          });
        }
      });
    }
    b.pop();
  }

  function houseRoof(b, ax, ext, yTop, nb, st, rng, o, n, chimney) {
    // ext: {x0,x1,z0,z1} в мировых; ax: 'z' | 'x' — ось конька. Строим в локальной раме «конёк вдоль z», затем поворачиваем.
    let ac0, ac1, al0, al1, nNeg, nPos;
    if (ax === 'z') { ac0 = ext.x0; ac1 = ext.x1; al0 = ext.z0; al1 = ext.z1; nNeg = nb.nz; nPos = nb.pz; }
    else { ac0 = -ext.z1; ac1 = -ext.z0; al0 = ext.x0; al1 = ext.x1; nNeg = nb.nx; nPos = nb.px; }
    const across = (ax === 'z') ? (nb.px || nb.nx) : (nb.pz || nb.nz);
    const oh = across ? 0.0 : 0.055, ohE = 0.055;
    const hw = (ac1 - ac0) / 2, cxm = (ac0 + ac1) / 2, W = hw + oh;
    const hr = W * Math.tan((51 + rng() * 7) * PI / 180) + (n >= 3 ? 0.03 : 0);
    const z0 = al0 - (nNeg ? 0 : ohE), z1 = al1 + (nPos ? 0 : ohE), D = z1 - z0, zc = (z0 + z1) / 2;
    b.push().translate(0, yTop, 0);
    if (ax === 'x') b.rotateY(PI / 2);
    // крыша
    b.mark();
    b.setMat(st.roof[0], st.roof[1], 0.06);
    b.push().translate(cxm, 0, zc);
    b.gable(2 * hw, D, hr, oh, { ohEnd: 0, open: true, segs: 3, sag: 0.022 + rng() * 0.02, curve: 0.012 + rng() * 0.012, th: 0.045 });
    b.pop();
    b.wobble(0.011, (o.seed | 0) + 17);
    // фронтоны: штукатурный треугольник + балки + подкосы + арочное окно
    const hT = hr - 0.075;
    for (const [zz, isN, sgn] of [[al0, nNeg, -1], [al1, nPos, 1]]) {
      if (isN) continue;
      b.push().translate(cxm, 0, 0);
      b.setMat(st.wall[0], st.wall[1], st.wall[2]);
      if (sgn > 0) b.tri([-hw, 0, zz], [hw, 0, zz], [0, hT, zz]); else b.tri([hw, 0, zz], [-hw, 0, zz], [0, hT, zz]);
      b.setMat(st.beam[0], st.beam[1], 0.07);
      const zo = zz + sgn * 0.012, zl = Math.min(zz, zo) - 0.004, zh = Math.max(zz, zo) + 0.004;
      b.boxAB(-hw, 0.0, zl, hw, 0.034, zh, { skip: 'ny' });
      b.boxAB(-0.016, 0.034, zl, 0.016, hT - 0.045, zh, { skip: 'ny py' });
      b.strut(-hw + 0.03, 0.034, zz + sgn * 0.004, -0.016, hT * 0.6, zz + sgn * 0.004, 0.02, 0.026);
      b.strut(hw - 0.03, 0.034, zz + sgn * 0.004, 0.016, hT * 0.6, zz + sgn * 0.004, 0.02, 0.026);
      b.push().translate(0, 0.07, zz).rotateY(sgn > 0 ? 0 : PI);
      b.setMat(MAT.WOOD_DARK, 'woodDark', 0.08); b.push().translate(0, 0, 0.003); b.fan(archPts(0.112, 0.07, 0.056, 6)); b.pop();
      b.setMat(MAT.WINDOW, 'window', 0.06); b.push().translate(0, 0.012, 0.0062); b.fan(archPts(0.082, 0.06, 0.041, 6)); b.pop();
      b.pop();
      b.pop();
    }
    // слуховое окно
    if (n >= 2 && rng() < 0.55) {
      const side = rng() < 0.5 ? 1 : -1, t = 0.04, xd = cxm + side * W * 0.58, ys = t + (hr - t) * (1 - 0.58);
      const zd = zc + rng.range(-0.15, 0.15) * (D * 0.5);
      b.push().translate(xd, 0, zd).rotateY(side > 0 ? PI / 2 : -PI / 2);
      b.setMat(st.wall[0], st.wall[1], 0.05);
      b.boxAB(-0.065, ys - 0.07, -0.1, 0.065, ys + 0.085, 0.04, { skip: 'ny py nz' });
      b.setMat(MAT.WINDOW, 'window', 0.06); b.quad([-0.032, ys - 0.02, 0.0405], [0.032, ys - 0.02, 0.0405], [0.032, ys + 0.062, 0.0405], [-0.032, ys + 0.062, 0.0405]);
      b.setMat(MAT.WOOD_DARK, 'woodDark', 0.08); b.boxAB(-0.042, ys - 0.03, 0.036, 0.042, ys + 0.07, 0.041, { skip: 'nz ny' });
      b.setMat(MAT.WINDOW, 'window', 0.06); b.quad([-0.032, ys - 0.02, 0.0415], [0.032, ys - 0.02, 0.0415], [0.032, ys + 0.062, 0.0415], [-0.032, ys + 0.062, 0.0415]);
      b.setMat(st.roof[0], st.roof[1], 0.07);
      b.push().translate(0, ys + 0.085, -0.03).rotateY(0); b.gable(0.13, 0.17, 0.085, 0.02, { ohEnd: 0.02 }); b.pop();
      b.pop();
    }
    // труба
    if (chimney) {
      const cz = zc + (rng() < 0.5 ? -1 : 1) * Math.max(0, (D / 2 - 0.12)) * (0.5 + rng() * 0.4), cx = cxm + rng.range(-0.02, 0.02);
      b.mark();
      b.setMat(MAT.STONE_GRAY, st.chim, 0.07);
      b.boxAB(cx - 0.05, hr * 0.45, cz - 0.05, cx + 0.05, hr + 0.19, cz + 0.05, { skip: 'ny py' });
      b.setMat(MAT.STONE_GRAY, 'rockDark', 0.06);
      b.boxAB(cx - 0.064, hr + 0.17, cz - 0.064, cx + 0.064, hr + 0.215, cz + 0.064, { skip: 'ny' });
      b.setMat(MAT.WOOD_DARK, 'woodDark', 0.0); b.boxAB(cx - 0.035, hr + 0.2, cz - 0.035, cx + 0.035, hr + 0.222, cz + 0.035, { skip: 'ny' });
      b.wobble(0.004, (o.seed | 0) + 5);
      b.anchor('smoke', cx, hr + 0.25, cz);

    b.pop();
    return hr;
  }

  function buildHouse(b, o, rng) {
    const n = clamp(o.floors | 0 || 1, 1, 4), st = STYLE[o.style] || STYLE.timber, stilts = !!o.stilts;
    const nb = { px: !!o.e, nx: !!o.w, pz: !!o.s, nz: !!o.n };
    const jit = () => rng.range(-0.011, 0.011);
    const pH = stilts ? 0.05 : 0.10;
    const fl = []; let y = pH;
    for (let k = 0; k < n; k++) {
      const y1 = k === 0 ? 0.55 : y + 0.40, E = {};
      for (const s of SIDES) E[s] = nb[s] ? 0.5 : 0.385 + 0.025 * k + jit();
      fl.push({ y0: y, y1, E }); y = y1;
    }
    const free = SIDES.filter(s => !nb[s]);
    let doorSide = null;
    if (free.length) { const pref = ['pz', 'px', 'nx', 'nz'].filter(s => free.includes(s)); doorSide = rng() < 0.3 ? rng.pick(free) : pref[0]; }
    const nX = nb.px || nb.nx, nZ = nb.pz || nb.nz;
    const ax = nX && !nZ ? 'x' : nZ && !nX ? 'z' : (rng() < 0.5 ? 'z' : 'x');

    // --- цоколь / помост со сваями ---
    const E0 = fl[0].E;
    if (!stilts) {
      b.mark();
      b.setMat(MAT.STONE_GRAY, st.plinth, 0.09);
      b.boxAB(-E0.nx - 0.012, -0.03, -E0.nz - 0.012, E0.px + 0.012, pH + 0.002, E0.pz + 0.012, { skip: 'ny py' });
      b.wobble(0.008, (o.seed | 0) + 3);
    } else {
      b.mark();
      b.setMat(MAT.PLANK, 'plank', 0.08);
      b.boxAB(-0.47, -0.075, -0.47, 0.47, 0.0, 0.47, { skip: 'ny' });
      b.setMat(MAT.WOOD_DARK, 'woodDark', 0.08);
      b.boxAB(-E0.nx - 0.01, 0, -E0.nz - 0.01, E0.px + 0.01, pH + 0.003, E0.pz + 0.01, { skip: 'ny py' });
      b.wobble(0.006, (o.seed | 0) + 4);
      const pp = [-0.4, 0.4];
      for (const px of [-0.4, 0, 0.4]) for (const pz of [-0.4, 0, 0.4]) {
        if (px === 0 && pz === 0) continue;
        b.push().translate(px + jit() * 0.5, -0.04, pz + jit() * 0.5).rotateX(PI).rotateZ(rng.range(-0.05, 0.05)).rotateX(rng.range(-0.05, 0.05));
        b.setMat(MAT.PLANK, 'woodDark', 0.1);
        b.setSmooth(true); b.cyl(0.032, 0.042, 0.55, 5, { noTop: true, noBottom: true }); b.setSmooth(false);
        b.pop();
      }
      b.setMat(MAT.PLANK, 'plank', 0.1);
      for (const z of pp) { b.boxAB(-0.41, -0.33, z - 0.022, 0.41, -0.28, z + 0.022, { skip: 'ny' }); b.boxAB(z - 0.022, -0.36, -0.41, z + 0.022, -0.31, 0.41, { skip: 'ny' }); }
      b.strut(-0.4, -0.5, -0.4, 0.4, -0.12, -0.4, 0.03, 0.025); b.strut(0.4, -0.5, 0.4, -0.4, -0.12, 0.4, 0.03, 0.025);
      // лесенка у двери
      if (doorSide) {
        b.push().rotateY(ANG[doorSide]).translate(0.12, 0, 0.47);
        b.setMat(MAT.PLANK, 'plank', 0.1);
        b.strut(-0.04, 0.02, 0.0, -0.04, -0.34, 0.14, 0.025, 0.03); b.strut(0.04, 0.02, 0.0, 0.04, -0.34, 0.14, 0.025, 0.03);
        for (let i = 0; i < 4; i++) { const t = 0.12 + i * 0.23; b.boxAB(-0.045, 0.02 - t * 0.38 - 0.012, t * 0.14 / 0.38 * 0.38 - 0.0, 0.045, 0.02 - t * 0.38 + 0.01, t * 0.14 + 0.02, { skip: 'ny' }); }
        b.pop();
      }
    }
    // --- этажи ---
    for (let k = 0; k < n; k++) {
      const F = fl[k], E = F.E;
      b.mark();
      b.setMat(st.wall[0], st.wall[1], st.wall[2]);
      b.boxAB(-E.nx, F.y0, -E.nz, E.px, F.y1, E.pz, { skip: 'ny py' });
      for (const s of SIDES) if (!nb[s]) facade(b, s, F, k, k === n - 1, doorSide === s && k === 0, st, rng, nb);
      b.wobble(0.0055, (o.seed | 0) * 13 + k);
    }
    // --- вывеска (timber) ---
    if (doorSide && st === STYLE.timber && rng() < 0.4 && n >= 1) {
      b.push().rotateY(ANG[doorSide]);
      const E = fl[0].E, zf = doorSide === 'pz' ? E.pz : doorSide === 'nz' ? E.nz : doorSide === 'px' ? E.px : E.nx;
      b.translate(0.3, 0, zf);
      b.setMat(MAT.WOOD_DARK, 'woodDark', 0.08); b.strut(0, 0.44, 0.0, 0, 0.44, 0.1, 0.02, 0.02); b.boxAB(-0.003, 0.34, 0.07, 0.003, 0.44, 0.1);
      b.setMat(MAT.PLANK, 'plank', 0.1); b.boxAB(-0.012, 0.35, 0.082, 0.012, 0.42, 0.088, { skip: 'ny' });
      b.setMat(MAT.GOLD, 'gold', 0.05); b.boxAB(-0.008, 0.37, 0.0885, 0.008, 0.4, 0.0905);
      b.pop();
    }
    // --- плющ у угла ---
    if (rng() < 0.4) {
      const E = fl[0].E; const s = rng.pick(['pz', 'px', 'nz', 'nx'].filter(q => !nb[q]).concat(['pz']));
      b.mark(); b.setMat(MAT.IVY, 'ivy', 0.12, 0.3);
      const side = rng() < 0.5 ? 1 : -1;
      for (let i = 0; i < 4; i++) {
        const yy = 0.16 + i * 0.1 + rng() * 0.05, r = 0.04 + rng() * 0.025;
        if (s === 'pz' || s === 'nz') { b.push().translate(side * (0.34 - rng() * 0.06), yy, (s === 'pz' ? E.pz : -E.nz) + (s === 'pz' ? 0.012 : -0.012)).scale(1, 1.4, 0.55).blob(r, 5, 0.3, 0.9).pop(); }
        else { b.push().translate((s === 'px' ? E.px : -E.nx) + (s === 'px' ? 0.012 : -0.012), yy, side * (0.34 - rng() * 0.06)).scale(0.55, 1.4, 1).blob(r, 5, 0.3, 0.9).pop(); }
      }
    }
    // --- крыша ---
    const top = fl[n - 1];
    const ext = { x0: -top.E.nx, x1: top.E.px, z0: -top.E.nz, z1: top.E.pz };
    houseRoof(b, ax, ext, top.y1, nb, st, rng, o, n, !!o.chimney);
    // --- причал ---
    if (o.dock) {
      const ds = doorSide || (free.length ? free[0] : null);
      if (ds) {
        b.push().rotateY(ANG[ds]).translate(rng.range(-0.05, 0.05), 0, 0.46);
        const topY = stilts ? -0.025 : -0.05;
        b.setMat(MAT.PLANK, 'plank', 0.1);
        for (let i = 0; i < 6; i++) {
          b.push().translate(rng.range(-0.012, 0.012), topY - 0.03 + rng.range(-0.006, 0.006), 0.02 + i * 0.088).rotateY(rng.range(-0.05, 0.05)).box(0.3 + rng.range(-0.02, 0.02), 0.03, 0.082, { skip: 'ny' }).pop();
        }
        b.setMat(MAT.WOOD_DARK, 'woodDark', 0.1);
        b.boxAB(-0.14, topY - 0.07, 0.0, -0.11, topY - 0.03, 0.56, { skip: 'ny' }); b.boxAB(0.11, topY - 0.07, 0.0, 0.14, topY - 0.03, 0.56, { skip: 'ny' });
        for (const [px, pz] of [[-0.13, 0.5], [0.13, 0.5], [-0.13, 0.1], [0.13, 0.1]]) {
          b.push().translate(px, topY - 0.03, pz).rotateX(PI).rotateZ(rng.range(-0.05, 0.05)); b.setSmooth(true); b.cyl(0.028, 0.036, 0.52 + (pz > 0.3 ? 0 : 0), 5, { noTop: true, noBottom: true }); b.setSmooth(false); b.pop();
          if (pz > 0.3) { b.setMat(MAT.WOOD_DARK, 'woodDark', 0.1); b.boxAB(px - 0.033, topY - 0.03, pz - 0.033, px + 0.033, topY + 0.085, pz + 0.033, { skip: 'ny' }); }
        }
        b.pop();
      }
    }
    if (doorSide) b.anchor('door', doorSide === 'px' ? 0.5 : doorSide === 'nx' ? -0.5 : 0, 0, doorSide === 'pz' ? 0.5 : doorSide === 'nz' ? -0.5 : 0);
  }

  function houseVariants() {
    const v = [], styles = ['timber', 'brown', 'slate', 'red'];
    let c = 0;
    for (const style of styles) for (let floors = 1; floors <= 4; floors++) for (let m = 0; m < 16; m++) {
      c++; v.push({ style, floors, n: !!(m & 1), e: !!(m & 2), s: !!(m & 4), w: !!(m & 8), stilts: (c % 3) === 0, chimney: (c % 2) === 0, dock: (c % 5) === 0, seed: c });
    }
    for (const style of styles) v.push({ style, floors: 2, stilts: true, dock: true, chimney: true, seed: 99 });

  function castleKeep(b, o, rng) {

      for (const [cx, cz] of [[-0.12, 0.05], [0.14, -0.14]]) { b.boxAB(cx - 0.045, Hc + 0.18, cz - 0.045, cx + 0.045, Hc + 0.62, cz + 0.045, { skip: 'ny' }); b.setMat(MAT.STONE_GRAY, 'rockDark', 0.06); b.boxAB(cx - 0.058, Hc + 0.6, cz - 0.058, cx + 0.058, Hc + 0.64, cz + 0.058, { skip: 'ny' }); b.setMat(MAT.STONE_CREAM, 'stoneCreamShade', 0.05); }
      b.anchor('smoke', -0.12, Hc + 0.66, 0.05);

      b.setMat(MAT.WINDOW, 'window', 0.06); b.quad([-0.035, 0.03, 0.0805], [0.035, 0.03, 0.0805], [0.035, 0.14, 0.0805], [-0.035, 0.14, 0.0805]);
      b.setMat(MAT.TILE_RED, 'tilePink', 0.06); b.push().translate(0, 0.17, -0.02).gable(0.14, 0.2, 0.09, 0.02).pop(); b.pop();

  function castleGate(b, o, rng) {
    const Hc = Models.heights.castle(o.height || 2), conn = { px: !!o.e, nx: !!o.w, pz: !!o.s, nz: !!o.n };
    const alongX = (conn.pz || conn.nz) && !(conn.px || conn.nx);   // стены вдоль z => проход вдоль x
    b.push(); if (alongX) b.rotateY(PI / 2);
    const cl = alongX ? { px: conn.nz, nx: conn.pz } : { px: conn.px, nx: conn.nx };
    // (локально проход вдоль z, стены к ±x)
    b.mark();

    b.setMat(MAT.STONE_CREAM, 'stoneCream', 0.045); b.setGrad(0.85, 1);

    b.setMat(MAT.STONE_CREAM, 'stoneCreamShade', 0.05); b.boxAB(-0.52, Hc - 0.05, -0.31, 0.52, Hc + 0.02, 0.31, { skip: 'ny' });
    crenelRun(b, rng, -0.48, 0.48, Hc + 0.02, 0.27, 'x', 6); crenelRun(b, rng, -0.48, 0.48, Hc + 0.02, -0.27, 'x', 6);

      b.boxAB(-0.16, 0.2, 0.006, 0.16, 0.214, 0.014, { skip: 'ny nz' });

  function castleHall(b, o, rng) {
    const Hc = Models.heights.castle(o.height || 2) * 0.82, conn = { px: !!o.e, nx: !!o.w, pz: !!o.s, nz: !!o.n };
    const ax = (conn.pz || conn.nz) && !(conn.px || conn.nx) ? 'z' : 'x';
    b.push(); if (ax === 'z') b.rotateY(-PI / 2);     // локально корпус длинный вдоль x
    const nb = ax === 'x' ? { e: conn.px, w: conn.nx } : { e: conn.nz, w: conn.pz };   // x+ → мир +x или (rot -90) мир -z... маппинг соседей
    // при rotateY(-PI/2): локальный +x -> мировой -z (n); локальный -x -> мировой +z (s)
    const lx0 = nb.w ? -0.5 : -0.45, lx1 = nb.e ? 0.5 : 0.45, hd = 0.275;
    b.mark();
    b.setMat(MAT.STONE_GRAY, 'stoneGray', 0.07); b.boxAB(lx0 - 0.02, 0, -hd - 0.025, lx1 + 0.02, 0.09, hd + 0.025, { skip: 'ny py' });
    b.setMat(MAT.STONE_CREAM, 'stoneCream', 0.045); b.setGrad(0.85, 1);
    b.boxAB(lx0, 0, -hd, lx1, Hc, hd, { skip: 'ny py' }); b.setGrad(1, 1);
    for (const sz of [1, -1]) {
      b.push().rotateY(sz > 0 ? 0 : PI).translate(0, 0, hd);
      const xs = []; for (let x = lx0 + 0.14; x < lx1 - 0.1; x += 0.22) xs.push(sz > 0 ? x : -x);
      b.setMat(MAT.STONE_CREAM, 'stoneCreamShade', 0.05);
      for (const x of xs) { b.boxAB(x - 0.017, 0, 0, x + 0.017, Hc, 0.03, { skip: 'ny nz' }); }
      for (let i = 0; i < xs.length; i++) {
        const x = xs[i] + (sz > 0 ? 0.11 : -0.11); if ((sz > 0 ? x : -x) > lx1 - 0.08) continue;
        b.push().translate(x, 0, 0); archedWindowFace(b, rng, 0.075, Hc * 0.5 + 0.1, 1); b.pop();
      }
      b.setMat(MAT.STONE_CREAM, 'stoneCreamShade', 0.05); b.boxAB(-1 * 0.0 + (sz > 0 ? lx0 : -lx1) - 0.02, Hc - 0.045, 0, (sz > 0 ? lx1 : -lx0) + 0.02, Hc + 0.01, 0.025, { skip: 'ny nz' });
      b.pop();
    }
    // двери на торцах
    for (const sx of [-1, 1]) if (!(sx > 0 ? nb.e : nb.w)) {
      b.push().rotateY(sx > 0 ? PI / 2 : -PI / 2).translate(0, 0, (sx > 0 ? lx1 : -lx0));
      b.setMat(MAT.STONE_CREAM, 'stoneCreamShade', 0.05); b.fan(H.archPts(0.2, 0.14, 0.1, 7).map(p => [p[0], p[1] + 0.06, 0.002]));
      b.setMat(MAT.WOOD_DARK, 'woodDark', 0.08); b.fan(H.archPts(0.15, 0.13, 0.075, 7).map(p => [p[0], p[1] + 0.06, 0.0065]));
      b.pop();
    }
    if (o.roofed !== false) {
      const L = lx1 - lx0, cx = (lx0 + lx1) / 2;
      b.setMat(MAT.TILE_RED, rng() < 0.5 ? 'tileRed' : 'tilePink', 0.06); b.mark();
      b.push().translate(cx, Hc, 0).rotateY(PI / 2).gable(2 * hd, L, 0.4, 0.045, { ohEnd: 0.045, segs: 3, sag: 0.02, curve: 0.012, th: 0.04 }).pop();
      b.wobble(0.011, (o.seed | 0) + 6);
      // торцевые фронтоны
      b.setMat(MAT.STONE_CREAM, 'stoneCream', 0.05);
      for (const [xx, isN, sg] of [[lx0, nb.w, -1], [lx1, nb.e, 1]]) if (!isN) {
        if (sg > 0) b.tri([xx, Hc, hd], [xx, Hc, -hd], [xx, Hc + 0.34, 0]); else b.tri([xx, Hc, -hd], [xx, Hc, hd], [xx, Hc + 0.34, 0]);
      }
      b.setMat(MAT.GOLD, 'gold', 0.04);
      b.push().translate(cx + L * 0.28, Hc + 0.36, 0).sphere(0.026, 5, 3).pop();
      b.setMat(MAT.STONE_CREAM, 'stoneCreamShade', 0.05); b.boxAB(cx + L * 0.28 - 0.045, Hc + 0.18, -0.045, cx + L * 0.28 + 0.045, Hc + 0.5, 0.045, { skip: 'ny' });
      b.setMat(MAT.GOLD, 'gold', 0.04); b.push().translate(cx + L * 0.28, Hc + 0.52, 0).sphere(0.026, 5, 3).pop();
      b.anchor('smoke', cx + L * 0.28, Hc + 0.52, 0);
    } else {
      crenelRun(b, rng, lx0 + 0.02, lx1 - 0.02, Hc, hd - 0.034, 'x', 5); crenelRun(b, rng, lx0 + 0.02, lx1 - 0.02, Hc, -hd + 0.034, 'x', 5);
      b.setMat(MAT.STONE_GRAY, 'stoneGray', 0.07); b.boxAB(lx0, Hc - 0.01, -hd, lx1, Hc + 0.02, hd, { skip: 'ny' });
    }
    b.wobble(0.006, (o.seed | 0) + 2);
    b.anchor('top', 0, Hc, 0);
    b.pop();
  }

  Models.register('castle', {
    footprint: [1, 1], opts: { part: 'wall', height: 2, roofed: true, n: false, e: false, s: false, w: false },
    variants() {
      const v = []; let c = 0;
      for (const part of ['wall', 'tower', 'keep', 'gate', 'hall']) for (const height of [1, 2, 3, 4]) for (const roofed of [true, false]) for (let m = 0; m < 16; m += (part === 'wall' ? 1 : 3)) {
        c++; v.push({ part, height, roofed, n: !!(m & 1), e: !!(m & 2), s: !!(m & 4), w: !!(m & 8), seed: c });
      }
      return v;
    },
    build(b, o, rng) {
      const part = o.part || 'wall';
      if (part === 'wall') castleWall(b, o, rng);
      else if (part === 'tower') {
        const conn = (o.n || o.e || o.s || o.w) ? { px: !!o.e, nx: !!o.w, pz: !!o.s, nz: !!o.n } : null;
        roundTower(b, rng, { R: 0.36, floors: clamp(2 * (o.height | 0 || 2) + 1, 3, 9), roof: o.roofed === false ? 'crenel' : 'cone', ivy: !!o.ivy || rng() < 0.4, conn, seed: o.seed, doorAng: 0, noDoor: !!conn, flag: o.roofed === false });
      }
      else if (part === 'keep') castleKeep(b, o, rng);
      else if (part === 'gate') castleGate(b, o, rng);
      else castleHall(b, o, rng);
    }
  });

  const vec2 PD[8] = vec2[8](vec2(-.94,-.4),vec2(.95,-.77),vec2(-.09,.93),vec2(.34,.29),vec2(-.82,.57),vec2(.44,-.97),vec2(-.38,-.02),vec2(.9,.2));
  int taps = int(uShadowInfo.y);
  for(int i=0;i<8;i++){ if(i>=taps) break;
    vec2 o = R*PD[i]*rad;
    s += texture(uShadow, vec3(sc.xy+o, sc.z)); cnt += 1.; }
  s /= max(cnt,1.);
  s = mix(s, 1., smoothstep(0.82,1.0,edge));
  return mix(1., s, uSunCol.w);
}

float ripple(vec2 p, float k){ return vn(p*k)*0.6+vn(p*k*2.1+7.3)*0.4; }

void main(){
  float fade = uFlags.w;
  vec3 P = vLp;
  float fw = length(fwidth(vLp)); // мир. ед. на пиксель — для LOD фактур
  vec3 Nw = normalize(vN);
  vec3 V = normalize(uEye.xyz - vW);
  vec3 L = normalize(uSunDir.xyz);
  float m = vM;
  // растворение по дабам (рост/исчезновение)
  if(uFlags.z<0.5 && fade<0.999){
    float hh = h31(floor(vLp*22.)+floor(vW*0.0));
    if(hh>fade) discard;
  }
  float mg = m; if(m>0.5 && m<8.5 && abs(Nw.y)<0.55) mg = 4.;   // вертикальные стенки террейна — скала слоями
  bool leaf = (m>19.5 && m<22.5);
  // ступенчатые «пиксельные» края листвы
  if(leaf){
    float rim = 1.-abs(dot(Nw,V));
    float thr = smoothstep(0.50,0.95,rim);
    float hh = h31(floor(vLp*34.)+vec3(3.,7.,1.));
    if(hh < thr*0.8) discard;
  }
  vec3 base = vC;
  vec3 nl = normalize(vNl);
  // gravity-aligned система координат поверхности
  vec3 tt = vec3(nl.z,0.,-nl.x); float tl = length(tt);
  vec3 T = tl>0.05 ? tt/tl : vec3(1.,0.,0.);
  vec3 Bv = cross(nl,T);
  vec2 uv = vec2(dot(P,T), dot(P,Bv));
  vec2 g = vW.xz;
  vec3 c = base; float emis = 0.; float spec = 0.; float alpha = 1.; float rough = 0.;
  vec3 Ns = Nw;
  if(dot(Ns,V)<0.) Ns = -Ns;

  if(m<0.5){
    // NONE: только вертексный цвет
  } else if(m<8.5){
    // ---------- земля ----------
    float det = 1.-smoothstep(0.02,0.07,fw);
    if(mg<1.5){ // GRASS: крупные мягкие пятна (2 октавы), мозаика, штрихи лезвий
      float m1=fbm(g*0.21+3.1), m1b=fbm(g*0.62+7.7), m2=vn(g*2.3);
      float mm = m1*0.62+m1b*0.38;
      float st = mix(mm, floor(mm*4.+0.5)/4., 0.5);          // ступенчатая мозаика
      vec3 gD = vec3(0.25,0.50,0.23), gM = vec3(0.37,0.66,0.23), gY = vec3(0.78,0.84,0.35);
      vec3 pcol = st<0.45 ? mix(gD, gM, smoothstep(0.25,0.45,st)) : mix(gM, gY, smoothstep(0.52,0.82,st));
      float lumB = dot(base, vec3(0.3,0.59,0.11));
      float lum0 = dot(c, vec3(0.3,0.59,0.11));
      c = mix(base, pcol*(0.8+0.5*lumB), 0.5);
      c = mix(vec3(dot(c,vec3(0.3,0.59,0.11))), c, 0.85);   // -15% насыщенности
      c *= 0.86+0.28*smoothstep(0.2,0.8,mm);
      c = mix(c, c*vec3(0.74,0.9,0.92), smoothstep(0.38,0.18,m1)*0.55);  // холодные тёмные пятна
      float bl = vn(vec2(g.x*80., g.y*24.)+m2*3.);
      float bl2 = vn(vec2(g.x*130.+5., g.y*38.));
      c *= mix(1., 0.84+0.28*bl, det);
      c += det*0.07*step(0.80, bl2)*vec3(0.9,1.0,0.5);      // светлые лезвия
      c *= mix(1., 1.-0.14*step(bl2,0.2), det);             // тёмные щели
      vec2 fc = floor(g*17.); float fr = h21(fc);
      if(fr>0.987 && det>0.2){
        vec2 fl = fract(g*17.)-0.5; float fd = length(fl+vec2(h21(fc+4.)-.5,h21(fc+9.)-.5)*0.4);
        vec3 fcol = fr>0.995 ? vec3(0.98,0.55,0.62) : (fr>0.991 ? vec3(1.,0.93,0.55) : vec3(0.95,0.95,0.98));
        c = mix(c, fcol, smoothstep(0.17,0.1,fd)*0.9);
      }
      rough = 0.5;
    } else if(mg<2.5){ // SAND: рябь, крапины, мокрый край
      float rp = fbm(g*3.)*2.;
      float st = sin((g.x*0.8+g.y*1.25+rp)*16.)*0.5+0.5;
      c = base*(0.92+0.12*st*det);
      c *= 0.9+0.2*vn(g*37.);
      float sp = h21(floor(g*30.)); if(sp>0.9) c *= 0.88;
      float wet = smoothstep(0.26,0.02,vW.y)*0.4; c *= 1.-wet; c = mix(c, c*vec3(0.85,0.92,1.),wet);
    } else if(mg<3.5){ // DIRT
      c = base*(0.84+0.3*fbm(g*4.)); c *= 0.92+0.16*vn(g*29.);
      float sp = h21(floor(g*22.)); if(sp>0.93) c = mix(c, c*vec3(1.2,1.15,1.1), 0.5);
    } else if(mg<4.5){ // ROCK: слои, трещины, тёплые прожилки, мох сверху
      vec3 W = vW;
      if(m<3.5 || m>4.5) base = mix(base, vec3(0.64,0.60,0.56), 0.55);   // стенка из травы/песка/земли -> камень
      float warp = fbm(W.xz*1.1+W.y*0.6)*0.7;
      float yb = W.y*7.0+warp*1.6;
      float bandR = h11(floor(yb));
      float edge = fract(yb);
      vec3 cool = base*vec3(0.97,0.97,1.0);
      vec3 warm = base*vec3(1.1,1.03,0.92);
      c = mix(cool, warm, smoothstep(0.35,0.65,bandR));
      c *= 0.80+0.26*smoothstep(0.0,0.14,edge)*smoothstep(1.,0.88,edge)+0.14*vn(W.xz*7.+W.y*4.+vec2(W.x*W.z));
      float vein = smoothstep(0.08,0.0,abs(fract(yb*0.5+warp)-0.5)-0.40)*step(0.55,h11(floor(yb*0.5)+4.));
      c = mix(c, c*vec3(1.18,0.99,0.78), vein*0.5);              // тёплые прожилки
      float cr = vn(vec2((W.x+W.z)*3.2+warp*2., W.y*11.));
      c *= 1.-0.30*smoothstep(0.46,0.5,cr)*smoothstep(0.54,0.5,cr)*det;
      float up = smoothstep(0.55,0.95,Nw.y);
      c = mix(c, c*vec3(1.0,1.12,0.9)+vec3(0.0,0.025,0.0), up*0.55*smoothstep(0.35,0.7,fbm(W.xz*2.5)));
      // мох на верхней кромке стены (уровни по 0.5 от y=0.22)
      float topFr = fract((W.y-0.22)/0.5+0.001);
      float mossK = smoothstep(0.70,0.92, topFr + (vn(W.xz*9.+W.y*3.)-0.5)*0.35) * (1.-up);
      c = mix(c, vec3(0.30,0.52,0.26)*(0.8+0.4*vn(W.xz*14.)), mossK*0.8*step(0.0,W.y-0.1));
      c = mix(c, c*vec3(0.78,0.92,0.95), smoothstep(0.1,-0.4,W.y)*0.5);   // низ у воды — прохладнее, мокрее
    } else if(mg<5.5){ // COBBLE: брусчатка
      float rowH=0.15; float row=floor(g.y/rowH); float fr=fract(g.y/rowH);
      float sw=0.23; float cu=g.x/sw+h11(row)*3.; float col=floor(cu); float fc=fract(cu);
      float rnd=h21(vec2(col,row));
      c = base*(0.82+0.34*rnd)*(0.94+0.12*vn(g*30.));
      float e = min(min(fr,1.-fr)*rowH, min(fc,1.-fc)*sw);
      float mort = smoothstep(0.006,0.022,e);
      c = mix(c*vec3(0.52,0.56,0.46), c, mix(1.,mort,det));
      c *= 1.-0.12*smoothstep(0.7,1.,fr)*det;
    } else if(mg<6.5){ // FIELD: борозды
      float s = sin(g.y*37.+vn(g*3.)*1.5)*0.5+0.5;
      c = base*(0.78+0.3*mix(0.5,s,det));
      c *= 0.9+0.22*vn(vec2(g.x*55., g.y*6.));
      float sp = h21(floor(g*vec2(32.,10.))); c = mix(c, c*vec3(1.2,1.15,0.8), step(0.92,sp)*0.5*det);
    } else if(mg<7.5){ // MOSS
      c = base*(0.8+0.4*fbm(g*5.)); c = mix(c, c*vec3(0.8,1.1,0.9), vn(g*13.)*0.4);
    } else { // SEABED: светлое песочно-бирюзовое дно (видно сквозь мелководье)
      float cs = fbm(g*3.5);
      c = mix(vec3(0.80,0.84,0.66), uWater0.rgb*1.05, 0.38+0.2*cs);
      c *= 0.92+0.16*cs;
    }
  } else if(m<19.5){
    // ---------- постройки ----------
    float det = 1.-smoothstep(0.012,0.04,fw);
    if(m<9.5){ c = base; }
    else if(m<10.5){ // PLASTER
      float st = fbm(vec2(uv.x*3.2, uv.y*0.7)+2.);
      float st2 = vn(vec2(uv.x*14., uv.y*1.6));
      c = base*(1.-0.17*smoothstep(0.5,0.75,st)-0.06*st2);
      c *= 0.93+0.14*fbm(uv*5.);
      float grime = smoothstep(0.30,0.0,P.y)*0.22; c *= 1.-grime;
      c = mix(c, c*vec3(1.04,1.0,0.88), smoothstep(0.55,0.8,fbm(uv*1.7+9.))*0.5);
      float sp = h21(floor(uv*40.)); c *= 1.-step(0.97,sp)*0.08*det;
    } else if(m<11.5 || m>18.5){ // TIMBER / WOOD_DARK: волокно
      float gr = vn(vec2(uv.x*9., uv.y*70.)+vn(uv*5.)*2.);
      float gr2 = vn(vec2(uv.x*70., uv.y*9.));
      float gg = mix(gr, gr2, step(0.5, abs(nl.y)*0.0+0.5)*0.35);
      c = base*(0.82+0.34*mix(0.5,gg,det));
      c = mix(c, c*vec3(1.1,1.06,1.0), smoothstep(0.6,0.9,vn(uv*4.))*0.5);
      c *= 1.-0.08*smoothstep(0.1,0.0,fract(uv.y*3.7)-0.0)*det*0.0;
    } else if(m<14.5){ // SHINGLE / SLATE / TILE_RED: ряды
      float rowH = m<12.5 ? 0.062 : (m<13.5 ? 0.058 : 0.07);
      float tw   = m<12.5 ? 0.085 : (m<13.5 ? 0.075 : 0.07);
      float rv = uv.y/rowH; float row = floor(rv); float fr = fract(rv);
      float off = (m<13.5) ? h11(row*1.7)*0.9 : 0.5*mod(row,2.);
      float cu = uv.x/tw + off; float col = floor(cu); float fc = fract(cu);
      float rnd = h21(vec2(col,row));
      vec3 t = base*(0.74+0.4*rnd);
      t = mix(t, t*vec3(1.08,1.04,0.95), step(0.7,h21(vec2(col+3.,row)))*0.6);
      t *= mix(0.55,1.0, smoothstep(0.0,0.32,fr));
      t *= mix(0.72,1.0, smoothstep(0.0,0.07,fc)*smoothstep(0.0,0.07,1.-fc));
      if(m>13.5) t *= 0.88+0.16*sin(fc*3.1416); // черепица — выпуклая
      t *= 0.9+0.2*fbm(uv*3.+row);
      t = mix(t, t*vec3(0.78,0.98,0.8), smoothstep(0.62,0.85,fbm(uv*2.2+4.))*0.55*step(m,12.5)); // мох на дранке
      c = mix(base*0.84, t, det);
    } else if(m<16.5){ // STONE_CREAM / STONE_GRAY: кладка
      float rowH = 0.072; float rv=uv.y/rowH; float row=floor(rv); float fr=fract(rv);
      float bl = 0.19+0.08*h11(row); float cu = uv.x/bl + h11(row*3.7)*4.; float col=floor(cu); float fc=fract(cu);
      float rnd = h21(vec2(col,row));
      vec3 t = base*(0.86+0.22*rnd);
      t = mix(t, t*vec3(1.04,1.0,0.9), vn(uv*8.)*0.5);
      float e = min(min(fr,1.-fr)*rowH, min(fc,1.-fc)*bl);
      t = mix(t*0.66, t, smoothstep(0.003,0.012,e));
      t += 0.05*smoothstep(0.75,1.0,fr)*(1.-0.5*step(0.01,e*0.0));
      t *= 1.-0.12*smoothstep(0.55,0.8,fbm(vec2(uv.x*2.5,uv.y*0.6)+m));
      c = mix(base*0.88, t, det);
    } else if(m<17.5){ // IVY: листья
      vec3 dk = base*vec3(0.55,0.7,0.6), lt = base*vec3(1.25,1.25,0.85);
      vec3 r = dk*0.8;
      vec2 q1 = uv*vec2(15.,15.)+vec2(0.,P.x*0.0);
      vec2 q2 = uv*vec2(13.,13.)+vec2(7.3,3.1);
      for(int k=0;k<2;k++){
        vec2 q = k==0 ? q2 : q1; vec2 ci=floor(q); vec2 f=fract(q)-0.5;
        float rr=h21(ci+float(k)*5.); float a=rr*6.28; float ca=cos(a), sa=sin(a);
        vec2 ff = vec2(ca*f.x+sa*f.y, -sa*f.x+ca*f.y) + (vec2(h21(ci+1.),h21(ci+2.))-.5)*0.25;
        float d = length(ff/vec2(0.5,0.32));
        float inl = step(d,1.);
        vec3 tc = rr<0.33 ? dk : (rr<0.7 ? base : lt);
        tc *= 1.+0.18*smoothstep(0.1,0.0,abs(ff.y)-0.02)*0.0;
        r = mix(r, tc, inl);
      }
      c = mix(base*0.9, r, det);
    }
  }
  if(m>17.5 && m<18.5){ // PLANK: доски
    float bw = 0.07; float rv = uv.y/bw; float row=floor(rv); float fr=fract(rv);
    float flat_ = step(0.8,abs(nl.y));
    vec2 pq = mix(uv, vec2(P.x, -P.z), flat_);
    rv = pq.y/bw; row=floor(rv); fr=fract(rv);
    float rnd = h11(row*1.3+floor(pq.x*0.7+h11(row)*5.)*0.37);
    float gr = vn(vec2(pq.x*8., pq.y*90.)+rnd*20.);
    c = base*(0.78+0.3*rnd)*(0.88+0.2*gr);
    float gap = smoothstep(0.0,0.07,fr)*smoothstep(0.0,0.07,1.-fr);
    c *= mix(0.5,1.,gap);
    float seam = fract(pq.x*0.8+h11(row)*3.); c *= 1.-0.4*step(seam,0.012);
  }
  if(m>19.5){
    float det = 1.-smoothstep(0.015,0.05,fw);
    if(m<22.5){ // LEAF_PINE / OAK / BLOSSOM: живописные дабы
      vec3 Q = floor(vLp*24.)/24.;
      float sw = sin(uEye.w*0.6+vW.x*0.4)*0.0;
      float t = vn3(Q*8.+vec3(0.,sw,0.))*0.6 + vn3(Q*21.)*0.4;
      float lvl = t + (nl.y*0.5+0.1)*0.38 + vA*0.12 - 0.14;
      float tonek = step(0.34,lvl)*0.5 + step(0.62,lvl)*0.5; // 0 / .5 / 1
      vec3 dk = base*(m<20.5 ? vec3(0.55,0.72,0.84) : vec3(0.62,0.78,0.88));
      vec3 lt = m>21.5 ? mix(base, vec3(1.,0.88,0.92), 0.25)*1.0 : base*vec3(1.08,1.08,0.9)+vec3(0.01,0.015,0.0);
      c = tonek<0.25 ? dk : (tonek<0.75 ? base : lt);
      // мелкие светлые мазки + тёмные пятна (пиксельные)
      float sp = h31(floor(vLp*40.)); c = mix(c, lt*1.06, step(0.93,sp)*0.7); c = mix(c, dk*0.9, step(sp,0.05)*0.6);
      // шарообразное освещение вместо плоских граней
      Ns = normalize(Nw*0.4 + vec3(0.,0.55,0.) + (vec3(vn3(vW*3.),vn3(vW*3.+5.),vn3(vW*3.+9.))-0.5)*0.5);
      c = mix(vec3(dot(c,vec3(0.3,0.59,0.11))), c, 0.88);
    } else if(m<23.5){ // BARK
      float gr = vn(vec2(uv.x*14., uv.y*5.)+vn(uv*7.)*1.5);
      c = base*(0.7+0.5*mix(0.5,gr,det)); c *= 1.-0.3*smoothstep(0.55,0.4,vn(vec2(uv.x*22., uv.y*3.5)))*det;
    } else if(m<24.5){ // CLOTH
      float wv = sin(uv.x*90.)*sin(uv.y*90.)*0.5+0.5;
      c = base*(0.88+0.14*mix(0.5,wv,det))*(0.9+0.2*fbm(uv*4.));
    } else if(m<25.5){ // SKIN
      c = base*(0.96+0.06*vn(vW.xz*30.));
    } else if(m<26.5){ // ANIMAL: мех
      c = base*(0.85+0.3*vn3(vLp*34.)); c = mix(c, c*1.25, step(0.9,h31(floor(vLp*50.)))*0.4);
    } else if(m<27.5){ // WINDOW
      float glow = uSunDir.w;
      float fl = 0.85+0.15*sin(uEye.w*2.+vW.x*13.+vW.z*9.);
      vec3 day = mix(vec3(0.22,0.32,0.42), vec3(0.62,0.78,0.86), vn(vec2(uv.y*5.,uv.x*3.)+0.3));
      day = mix(day, base*0.5, 0.35);
      vec3 warm = vec3(1.,0.78,0.42)*(0.7+0.5*smoothstep(-0.1,0.1,uv.y*0.0+0.0))*fl;
      float vg = 0.75+0.5*h11(floor(vW.x*3.)+floor(vW.z*3.)*7.+floor(vW.y*3.)*13.);
      warm *= vg;
      c = mix(day, warm, glow); emis = glow*1.2; spec = 0.8;
    } else if(m<28.5){ // SAIL
      float sm = smoothstep(0.012,0.0,abs(fract(uv.y/0.1)-0.5)-0.47)*0.0;
      c = base*(0.94+0.08*fbm(uv*6.))*(1.-0.1*smoothstep(0.03,0.0,min(fract(uv.y/0.11),1.-fract(uv.y/0.11)))*det);
      emis = 0.05;
    } else if(m<29.5){ // GOLD
      c = base*(0.9+0.2*vn(vW.xz*20.)); spec = 1.;
    } else if(m<30.5){ // GRASS_BLADE: градиент по высоте
      c = mix(base*vec3(0.52,0.66,0.62), base*vec3(1.12,1.12,0.78)+vec3(0.04,0.05,0.0), smoothstep(0.0,1.0,vA));
      c *= 0.9+0.2*h11(floor(vW.x*31.)+floor(vW.z*37.));
      if(Ns.y<0.) Ns.y=-Ns.y; Ns = normalize(mix(Ns, vec3(0.,1.,0.), 0.65));
    } else if(m<31.5){ // FLOWER
      c = base*(0.94+0.1*vn3(vLp*40.)); c = mix(c, vec3(1.,0.86,0.4), smoothstep(0.012,0.0,length(vLp.xz)-0.01)*0.0);
    } else if(m<32.5){ // REED
      c = mix(base*vec3(0.55,0.62,0.5), base*vec3(1.1,1.08,0.8), vA)*(0.9+0.2*h11(floor(vW.x*29.)));
    } else if(m<33.5){ // STRAW
      float st = vn(vec2(uv.x*60., uv.y*7.)); c = base*(0.8+0.35*st); c *= 1.-0.15*step(0.9,h21(floor(uv*vec2(28.,50.))));
    } else if(m<34.5){ // ROOF_MOSS
      float t = fbm(g*5.+vLp.y); c = mix(base*vec3(0.7,0.78,0.6), base*vec3(1.1,1.2,0.8), smoothstep(0.35,0.7,t));
      c *= 0.9+0.2*vn(g*30.);
    } else if(m<35.5){ // WATER_FALL
      float s = vn(vec2(vLp.x*26.+vLp.z*26., vLp.y*3.-uEye.w*3.2));
      float s2 = vn(vec2(vLp.x*12.-vLp.z*12., vLp.y*7.-uEye.w*5.));
      float w = smoothstep(0.35,0.8,s*0.6+s2*0.5);
      c = mix(vec3(0.42,0.82,0.84), vec3(0.95,1.,1.), w); emis = 0.18;
    } else { // SMOKE
      c = base*(0.9+0.2*vn3(vW*4.+uEye.w*0.3));
      alpha = 0.55*(0.5+0.5*vn3(vW*5.-uEye.w*0.4));
    }
  }

  // ---------- освещение ----------
  float ndl = dot(Ns, L);
  float sh = (uFlags.x>0.5) ? shadowAt(vW, Nw, dot(Nw,L)) : 1.;
  float k = clamp(ndl,0.,1.)*sh;

/* main.js — точка входа: создаёт канвас, запускает Render, Style, Logic и главный цикл (интегратор) */
(function () {
  'use strict';
  const G = window.Game;
  G.frames = 0; G.ready = false; G.errors = [];

  function showFatal(msg) {
    const d = document.createElement('div');
    d.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#1f7fb5;color:#fff;font:18px system-ui;text-align:center;padding:24px;z-index:99';
    d.textContent = msg; document.body.appendChild(d);
  }

  window.addEventListener('error', e => { G.errors.push(String(e.message || e)); });
  window.addEventListener('unhandledrejection', e => { G.errors.push(String(e.reason)); });

  function boot() {
    const root = document.getElementById('game');
    const canvas = document.getElementById('c');
    const q = (new URLSearchParams(location.search)).get('q') || undefined;
    if (!G.Render || !G.Render.init(canvas, { quality: q })) { showFatal('Для игры нужен браузер с поддержкой WebGL2.'); return; }

    function fit() {
      const r = root.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      G.Render.resize(Math.max(1, r.width), Math.max(1, r.height), dpr);
    }
    fit(); window.addEventListener('resize', fit);

    if (G.Style && G.Style.init) G.Style.init(root);
    G.Logic.init({ container: root, canvas: canvas });
    if (G.Style && G.Style.intro) G.Style.intro();
    G.ready = true;

    let last = performance.now(), t = 0;
    function frame(now) {
      const dt = Math.min(0.05, Math.max(0.0001, (now - last) / 1000)); last = now; t += dt;
      try {
        G.Logic.update(dt, t);
        if (G.Style && G.Style.update) G.Style.update(dt, t);
        G.Render.render(t, dt);
      } catch (e) { G.errors.push(e && e.stack || String(e)); console.error(e); }
      G.frames++;
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
