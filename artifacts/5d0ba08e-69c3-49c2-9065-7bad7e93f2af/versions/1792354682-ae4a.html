      case 'erase':
        noiseBurst(t, { f0: 2400, f1: 300, q: 0.9, dur: 0.28, gain: 0.16, pan });
        pluck(noteFreq(-1), t + 0.04, { vel: 0.3, dur: 0.5, bright: 1200, pan }); break;
      case 'smooth':
        noiseBurst(t, { f0: 900, f1: 1500, q: 0.7, dur: 0.22, gain: 0.08, att: 0.06, pan }); break;
      case 'undo': pluck(noteFreq(4), t, { vel: 0.4, dur: 0.4 }); pluck(noteFreq(2), t + 0.08, { vel: 0.4, dur: 0.5 }); break;
      case 'redo': pluck(noteFreq(2), t, { vel: 0.4, dur: 0.4 }); pluck(noteFreq(4), t + 0.08, { vel: 0.4, dur: 0.5 }); break;
      case 'mood': [0, 2, 4, 6].forEach((s, i) => bell(noteFreq(s + 3), t + i * 0.07, { vel: 0.22, dur: 1.8, send: 0.8 })); break;
      case 'unlock': bell(noteFreq(7), t, { vel: 0.4, dur: 2.2 }); bell(noteFreq(9), t + 0.12, { vel: 0.3, dur: 2.4 }); break;
      case 'photo':                                          // затвор: два щелчка
        noiseBurst(t, { f0: 3500, q: 1.2, dur: 0.03, gain: 0.25, type: 'bandpass' });
        noiseBurst(t + 0.07, { f0: 2200, q: 1.2, dur: 0.04, gain: 0.2, type: 'bandpass' }); break;
      case 'milestone': {                                   // широкий аккорд: F A C D G
        const degs = [-5, -3, -1, 0, 2, 4, 5, 7];
        degs.forEach((d, i) => bell(noteFreq(d), t + i * 0.15, { vel: 0.5 - i * 0.02, dur: 3.6, send: 0.95, pan: (i % 2 ? 1 : -1) * 0.25 }));
        if (droneGain) { const c = ctx.currentTime; droneGain.gain.cancelScheduledValues(c); droneGain.gain.setTargetAtTime(0.2, c, 0.4); droneGain.gain.setTargetAtTime(BASE.drone, c + 2.2, 1.6); }
        break; }
      case 'decor': decorVoice(v, t, pan); break;
      case 'place': {                                       // мягкий «шлёп» вещи об землю; высота зависит от вида
        const base = { house: -3, tree: 2, decor: 0, forest: 2, hand: 0 }[v];
        const d = (base === undefined ? 0 : base) + Math.floor(Math.random() * 3) - 1;
        noiseBurst(t, { f0: 700, f1: 260, q: 1.1, dur: 0.09, gain: 0.14, pan });
        drop(t, 210 * Math.pow(2, d / 7), 95, 0.1, 0.3, pan);
        marimba(noteFreq(d + 2), t + 0.015, { vel: 0.3, dur: 0.28, pan }); break; }
      case 'rotate':                                        // тиканье поворота
        marimba(1750 * (0.96 + Math.random() * 0.08), t, { vel: 0.14, dur: 0.045, send: 0.05, pan }); break;
      case 'deny':                                          // глухой отказ
        drop(t, 150, 90, 0.16, 0.3, pan); noiseBurst(t, { f0: 320, f1: 200, q: 1.5, dur: 0.1, gain: 0.1, pan }); break;
      case 'grab':                                          // взять: мягкий подъём
        pluck(noteFreq(2), t, { vel: 0.22, dur: 0.22, bright: 1800, pan }); noiseBurst(t, { f0: 900, f1: 1600, q: 0.8, dur: 0.12, gain: 0.05, att: 0.05, pan }); break;
      case 'drop':                                          // отпустить: «посадка»
        drop(t, 230, 110, 0.12, 0.28, pan); marimba(noteFreq(0), t + 0.02, { vel: 0.22, dur: 0.22, pan }); break;
      case 'voice':                                          // тихая «реплика» жителя
        marimba(rnd(620, 1050), t, { vel: 0.1, dur: 0.12, send: 0.15, pan }); break;
      case 'event':                                          // праздничный перебор
        [0, 2, 4, 5, 7].forEach((d, i) => pluck(noteFreq(d + 3), t + i * 0.09, { vel: 0.4, dur: 0.9, bright: 4200, pan, send: 0.6 })); break;
      case 'season': [7, 5, 4, 2].forEach((d, i) => bell(noteFreq(d + (scene.season > 2.5 ? 3 : 0)), t + i * 0.13, { vel: 0.25, dur: 2.4, send: 0.9 })); break;
      case 'weather': marimba(noteFreq(1), t, { vel: 0.2, dur: 0.4 }); break;
      case 'click': default:
        marimba(1250, t, { vel: 0.2, dur: 0.07, send: 0.1 }); break;
    }
  }

  // украшения: у каждого свой тембр
  function decorVoice(v, t, pan) {
    switch (v) {
      case 'well': drop(t, 700, 240, 0.22, 0.25, pan); marimba(noteFreq(-2), t + 0.05, { vel: 0.3, dur: 0.5, pan }); break;
      case 'lantern': bell(noteFreq(8), t, { vel: 0.3, dur: 2.2, ratio: 2.0, idx: 0.5, pan }); bell(noteFreq(10), t + 0.12, { vel: 0.18, dur: 2.0, pan }); break;
      case 'mill': marimba(noteFreq(-4), t, { vel: 0.45, dur: 0.25, pan }); marimba(noteFreq(-3), t + 0.12, { vel: 0.4, dur: 0.25, pan }); noiseBurst(t, { f0: 1200, f1: 700, q: 1, dur: 0.3, gain: 0.07, pan }); break;
      case 'windmill': noiseBurst(t, { f0: 400, f1: 1400, q: 0.8, dur: 0.5, gain: 0.1, att: 0.15, pan }); pluck(noteFreq(3), t + 0.2, { vel: 0.3, dur: 0.7, pan }); break;
      case 'lighthouse': bell(noteFreq(-5), t, { vel: 0.6, dur: 3.6, ratio: 2.76, idx: 0.9, pan, send: 0.9 }); bell(noteFreq(0), t + 0.03, { vel: 0.25, dur: 3, pan }); break;
      case 'vineyard': [0, 1, 3].forEach((d, i) => pluck(noteFreq(d + 4), t + i * 0.06, { vel: 0.35, dur: 0.6, bright: 3000, pan })); break;
      case 'gazebo': [0, 2, 4, 7].forEach((d, i) => pluck(noteFreq(d), t + i * 0.08, { vel: 0.4, dur: 1.1, bright: 3600, pan, send: 0.6 })); break;
      case 'market': [9, 11, 10].forEach((d, i) => marimba(noteFreq(d) * (1 + i * 0.01), t + i * 0.06, { vel: 0.25, dur: 0.3, pan })); noiseBurst(t, { f0: 4500, q: 2, dur: 0.05, gain: 0.08, pan }); break;
      case 'statue': noiseBurst(t, { f0: 420, f1: 220, q: 3, dur: 0.1, gain: 0.25, pan }); bell(noteFreq(2), t + 0.04, { vel: 0.35, dur: 2.4, ratio: 2.76, idx: 0.7, pan }); break;
      case 'bench': marimba(noteFreq(-3), t, { vel: 0.45, dur: 0.3, pan }); marimba(noteFreq(0), t + 0.07, { vel: 0.3, dur: 0.3, pan }); break;
      default: pluck(noteFreq(nextDeg('decor', 0, 8)), t, { vel: 0.45, pan }); marimba(noteFreq(-3), t, { vel: 0.3, dur: 0.3, pan });
    }
  }

  /* ---------- ambient ---------- */
  function thunder() {
    const t = ctx.currentTime + 0.05, s = noiseSrc(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    f.type = 'lowpass'; f.frequency.setValueAtTime(220, t); f.frequency.exponentialRampToValueAtTime(70, t + 3);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.28, t + 0.5); g.gain.exponentialRampToValueAtTime(0.0001, t + 3.6);
    s.connect(f); f.connect(g); route(g, ambBus, rnd(-0.5, 0.5), 0.8); s.start(t, Math.random() * 2); endVoice(s, t + 3.7);
  }
  function ambientNote() {                                   // сезон меняет окраску: весна светлее, осень ниже, зима стеклянная
    const f = scene.season, spring = f < 0.5 || f > 3.5 ? 1 : 0, autumn = Math.abs(f - 2) < 0.5 ? 1 : 0, winter = Math.abs(f - 3) < 0.5 ? 1 : 0;
    const d = nextDeg('amb', autumn ? -3 : 0, spring ? 12 : 9) + (spring ? 2 : 0), t = ctx.currentTime + 0.05, p = rnd(-0.6, 0.6);
    if (winter) { bell(noteFreq(d + 3), t, { vel: 0.13, dur: 5.5, ratio: 2.0, idx: 0.3, bus: ambBus, pan: p, send: 1.2 }); return; }
    if (autumn) { marimba(noteFreq(d), t, { vel: 0.2, dur: 1.2, bus: ambBus, pan: p, send: 0.9 }); if (Math.random() < 0.4) marimba(noteFreq(d - 2), t + 0.5, { vel: 0.14, dur: 1.0, bus: ambBus, pan: p, send: 0.9 }); return; }
    if (Math.random() < 0.5) bell(noteFreq(d), t, { vel: 0.16, dur: 4.0, ratio: 2.01, idx: 0.5, bus: ambBus, pan: p, send: 1.0 });
    else pluck(noteFreq(d), t, { vel: 0.18, dur: 2.4, bright: spring ? 3600 : 2200, bus: ambBus, pan: p, send: 1.0 });
    if (Math.random() < (spring ? 0.5 : 0.3)) pluck(noteFreq(d + (Math.random() < 0.5 ? 2 : -2)), t + 0.45, { vel: 0.1, dur: 2.0, bright: 1800, bus: ambBus, pan: p, send: 1.0 });
  }
  function shiftPad() {                                      // «третий голос» дрона плавно меняется A3 / C4 / D4
    if (!padOsc) return;
    const f = [220.0, 261.63, 293.66, 196.0][Math.floor(Math.random() * 4)];
    padOsc.frequency.setTargetAtTime(f, ctx.currentTime, 3.0);
  }
  function lfo(rate, depth, target) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = rate; g.gain.value = depth; o.connect(g); g.connect(target); o.start(); return o;
  }
  function buildAmbient() {
    const t = ctx.currentTime;
    // --- дрон F3 ---
    droneGain = ctx.createGain(); droneGain.gain.value = 0.0001;
    droneGain.gain.linearRampToValueAtTime(BASE.drone, t + 6);

 * частей клетки для logic_parts, анимированные детали (колесо мельницы, крылья
 * ветряка), хэш-возраст построек (opts.age 0..1 для Models).
 *
 * Объект клетки:  { type:'decor', kind:'well'|…, rot:0..3, seed:1+rot, born:<сек игры> }
 * (seed = 1+rot нужен, чтобы подпись клетки в logic_rules менялась при повороте).
 * Всё детерминировано хэшем клетки; ничего не висит: y = высота площадки/рельефа.
 * ===================================================================== */
(function (root) {
  'use strict';
  const Game = root.Game = root.Game || {};
  const L = Game.L = Game.L || {};
  const N = Game.N || 64, NN = N * N;
  const DX = [0, 1, 0, -1], DZ = [-1, 0, 1, 0];
  const HP = Math.PI / 2;
  const Pr = L.props = {
    play: 0,                                  // секунды игры (сохраняются вместе с миром, если логика сохранения их переносит)
    ageB: new Uint8Array(NN).fill(255),       // последний применённый «ведро»-возраст клетки (0..4)
    anim: new Map(),                          // анимированные детали: key -> {obj,kind,k,...}
    AGE_SECS: 1200,                           // за сколько секунд игры здание «стареет» полностью
    scanT: 0
  };
  const hs = (i, j, s) => L.rules.hs(i, j, s);
  const q1 = v => Math.round(v * 10) / 10;
  const W = () => Game.World;

  /* ---------- каталог украшений ---------- */
  Pr.VARIANTS = ['well', 'lantern', 'mill', 'windmill', 'lighthouse', 'vineyard', 'gazebo', 'market', 'statue', 'bench'];
  Pr.NAMES = { well: 'Колодец', lantern: 'Фонарь', mill: 'Водяная мельница', windmill: 'Ветряк', lighthouse: 'Маяк', vineyard: 'Виноградник', gazebo: 'Беседка', market: 'Рынок', statue: 'Статуя', bench: 'Скамья' };
  // большие украшения стоят на ровной площадке клетки (padMask); малые — на рельефе
  Pr.PAD = { mill: 1, windmill: 1, lighthouse: 1, vineyard: 1, gazebo: 1, market: 1 };
  // fallback-модели, если Models ещё не умеет вид (мягкая деградация)
  const FALLBACK = { lighthouse: 'tower', vineyard: 'field', market: 'cart', statue: 'rock', bench: 'crate' };

  function hasModel(kind) {
    const M = Game.Models; if (!M) return false;
    if (typeof M.has === 'function') return M.has(kind);
    if (M.kinds && M.kinds.length) return M.kinds.some(e => e.kind === kind);
    return true;
  }
  Pr.hasModel = hasModel;

  /* ---------- правила видов (сущности): null — можно, иначе текст подсказки ---------- */
  const isIgn = (c, e) => !!(c && c.ignore && (c.ignore === e.id || (c.ignore.has && c.ignore.has(e.id))));
  function entWithin(x, z, r, kind, c) {
    let hit = false; const E = Game.Ents; if (!E) return false;
    E.queryFn(x, z, r, e => { if (e.kind === kind && !isIgn(c, e)) { hit = true; return false; } });
    return hit;
  }
  // c — контекст Ents.canPlace (lvl, k, slope, …) либо null (тогда считаем сами)
  Pr.checkAt = function (variant, x, z, c) {
    const w = W(), E = Game.Ents, M = Game.MAT, k = c ? c.k : E.cellOf(x, z), lv = c ? c.lvl : w.lvl[k], g = w.ground[k];
    const sand = L.rules.groundFor(k) === M.SAND, slope = c ? c.slope : E.slopeAt(x, z);
    switch (variant) {
      case 'lighthouse':
        if (!E.waterDir(x, z, 1.7) && g !== M.ROCK) return 'Маяк ставят у самой воды или на скале';
        if (entWithin(x, z, 7, 'lighthouse', c)) return 'Один маяк уже светит неподалёку';
        break;
      case 'mill':
        if (!E.waterDir(x, z, 1.15)) return 'Мельнице нужна вода рядом';
        if (lv > 2) return 'Мельницу ставят ближе к воде';
        if (entWithin(x, z, 2.2, 'mill', c)) return 'Мельницы стоят не вплотную';
        break;
      case 'windmill':
        if (lv < 2) return 'Ветряк любит холм: поднимите землю';
        if (sand) return 'Ветряку нужен луг, а не пляж';
        if (entWithin(x, z, 2.2, 'windmill', c)) return 'Ветряки стоят не вплотную';
        break;
      case 'vineyard':
        if (lv < 2 || sand) return 'Виноградник растёт на склоне луга';
        if (slope < 0.1 && lv < 3) return 'Виноградник растёт на склоне';
        break;
      case 'gazebo':
        if (sand) return 'Беседке нужен луг';
        if (lv < 2) return 'Беседку ставят на лугу';
        break;
      case 'market':
        if (sand) return 'Рынку нужна твёрдая земля';
        if (!entWithin(x, z, 2.6, 'house', c)) return 'Рынок открывают рядом с домами';
        if (entWithin(x, z, 3.2, 'market', c)) return 'Рынки стоят не вплотную';
        break;
      case 'well':
        if (entWithin(x, z, 2.2, 'well', c)) return 'Колодцы стоят не вплотную';
        break;
      case 'statue':
        if (sand) return 'Статуе нужна твёрдая земля';
        if (entWithin(x, z, 1.2, 'statue', c)) return 'Статуи стоят не вплотную';
        break;
    }
    return null;
  };
  // совместимость: проверка по клетке (центр клетки)
  Pr.check = function (variant, k) {
    const E = Game.Ents, i = k % N, j = (k / N) | 0; if (!E) return null;
    const r = E.canPlace(variant, i + 0.5, j + 0.5, 0, 1, {});
    return r.ok ? null : r.reason;
  };
  // подсказка ориентации для магнита: мельница — колесом к воде, ветряк — по ветру; null — без подсказки
  Pr.suggestRot = function (kind, x, z) {
    if (kind === 'mill') { const wd = Game.Ents.waterDir(x, z, 1.4); return wd ? wd.rot : null; }
    if (kind === 'windmill') return windRot(Math.floor(x), Math.floor(z));
    return null;
  };

  /* ---------- возраст построек (хэш клетки × время существования) ---------- */
  // время рождения хранится в боковой таблице (не в объектах мира: компактный экспорт острова не ломается);
  // в слоты сохранения уходит разрежённым списком (Pr.saveBorn / Pr.loadBorn)
  const AGING = { house: 1, castle: 1, field: 1 };
  const bornAt = Pr.bornAt = new Float32Array(NN), bornSig = Pr.bornSig = new Array(NN).fill(0);
  function bornOf(k, o) { return o && bornSig[k] === o.type ? bornAt[k] : undefined; }
  // возраст 0..1 сырой; для пирсов/мостов берём возраст ближайшего дома (2 клетки), иначе только хэш
  function rawAge(k, i, j, o, d) {
    const w = W(); let born = bornOf(k, o), h = hs(i, j, 201);
    if (born === undefined && d && (d.pier || d.bridge)) {
      let best = Infinity;
      for (let dj = -2; dj <= 2; dj++) for (let di = -2; di <= 2; di++) { const a = i + di, b = j + dj; if (a < 0 || b < 0 || a >= N || b >= N) continue; const bk = b * N + a, bb = bornOf(bk, w.obj[bk]); if (bb !== undefined && bb < best && w.obj[bk].type === 'house') best = bb; }
      if (best < Infinity) born = best;
    }
    const life = born === undefined ? 0 : Math.max(0, Pr.play - born) / Pr.AGE_SECS;
    const t = Math.min(1, life); return Math.min(1, h * 0.3 + 0.7 * t * t * (3 - 2 * t));
  }
  // «ведро» возраста: 0, .25, .5, .75, 1 (мало вариантов → кеш Models работает)
  Pr.ageQ = function (k) {
    const w = W(), i = k % N, j = (k / N) | 0, o = w.obj[k], d = w.der[k];
    const a = Math.round(rawAge(k, i, j, o, d) * 4);
    Pr.ageB[k] = a; return a / 4;
  };

  // фоновое сканирование: ставим время рождения, перестраиваем клетки при смене «ведра» возраста
  function scan() {
    const w = W(), T = L.terrain;
    for (let k = 0; k < NN; k++) {
      const o = w.obj[k], d = w.der[k];
      if (o && AGING[o.type]) {
        if (bornSig[k] !== o.type) { bornSig[k] = o.type; bornAt[k] = Math.round(Pr.play * 10) / 10; }
      } else {
        if (bornSig[k]) bornSig[k] = 0;
        if (!(d && (d.pier || d.bridge === 'anchor'))) continue;
      }
      if (Pr.ageB[k] === 255) continue;
      const i = k % N, j = (k / N) | 0, a = Math.round(rawAge(k, i, j, o, d) * 4);
      if (a !== Pr.ageB[k]) { Pr.ageB[k] = a; if (T && T.markCell) T.markCell(i, j, false, true); }
    }
  }
  // старение сущностей: при смене «ведра» возраста меш группы перестраивается
  function scanEnts() {
    const E = Game.Ents; if (!E) return;
    E.each(e => { if (!E.KINDS[e.kind].age) return; const a = Pr.entAge(e); if (a !== e._age) { if (e._age !== undefined) E.regroup(e); e._age = a; } });
  }
  Pr.scanEnts = scanEnts;
  Pr.scan = scan;
  Pr.saveBorn = function () {
    const list = []; for (let k = 0; k < NN; k++) if (bornSig[k]) list.push([k, bornAt[k]]);
    return { play: Math.round(Pr.play), born: list };
  };
  Pr.loadBorn = function (d) {
    const w = W(); bornSig.fill(0); bornAt.fill(0); Pr.play = 0;
    if (!d) return;
    if (typeof d.play === 'number' && isFinite(d.play)) Pr.play = Math.max(0, d.play);
    if (Array.isArray(d.born)) for (const e of d.born) { const k = e[0], o = w.obj[k]; if (o && AGING[o.type] && isFinite(e[1])) { bornSig[k] = o.type; bornAt[k] = e[1]; } }
  };

  Pr.update = function (dt, time) {
    Pr.play += dt; Pr.scanT -= dt;
    if (Pr.scanT <= 0) { Pr.scanT = 3; scan(); scanEnts(); }
    animate(time || 0);
  };
  Pr.reset = function () {
    Pr.ageB.fill(255); Pr.scanT = 1; bornSig.fill(0); bornAt.fill(0);
    Pr.anim.forEach(a => { const S = L.sim; if (S && S.killObj) S.killObj(a.obj); }); Pr.anim.clear();
  };

  // возраст сущности 0..1 (хэш × время существования); «ведро» кратно 0.25 — мало вариантов меша
  Pr.entAge = function (e) {
    const A = Game.Ents.KINDS[e.kind]; if (!A || !A.age) return 0;
    const h = Game.hash2(e.seed | 0, (e.seed * 3 + 5) | 0, 201), life = Math.max(0, Pr.play - (e.t0 || 0)) / Pr.AGE_SECS, t = Math.min(1, life);
    return Math.round(Math.min(1, h * 0.3 + 0.7 * t * t * (3 - 2 * t)) * 4) / 4;
  };
  // части украшения в ЛОКАЛЬНЫХ координатах (низ на y=0, перед +z); сущность задаёт позицию/поворот/масштаб
  Pr.localParts = function (e, push, sd, age) {
    const kind = e.kind, have = hasModel(kind), A = age || 0, o = (extra) => Object.assign({ age: A }, extra);
    switch (kind) {
      case 'well': push('well', o({ seed: sd }), 0, 0, 0, 0, 1); break;
      case 'lantern': push(hasModel('lanternPost') ? 'lanternPost' : 'lantern', { seed: 1 }, 0, 0, 0, 0, 1); break;
      case 'mill': push('mill', o({ wheel: false, seed: 2 }), 0, 0, 0, 0, 1); break;
      case 'windmill': push('windmill', o({ sails: false, seed: 2 }), 0, 0, 0, 0, 1); break;
      case 'lighthouse':
        if (have) push('lighthouse', o({ seed: sd }), 0, 0, 0, 0, 1);
        else push('tower', { floors: 6, ivy: false, n: false, e: false, s: false, w: false, roof: 'cone', seed: sd, age: A }, 0, 0, 0, 0, 1);
        break;
      case 'vineyard':
        if (have) push('vineyard', { seed: sd }, 0, 0, 0, 0, 1);
        else { push('field', { crop: 'green', seed: sd }, 0, 0, 0, 0, 1); push('barrel', { seed: 1 }, -0.3, 0, 0.3, 0.6, 1); push('barrel', { seed: 2 }, -0.17, 0, 0.36, 1.6, 1); }
        break;
      case 'gazebo': push('gazebo', o({ seed: sd }), 0, 0, 0, 0, 1); break;
      case 'market':
        if (have) push('market', o({ seed: sd }), 0, 0, 0, 0, 1);
        else { push('cart', { seed: 1, load: true }, -0.12, 0, 0, 0, 1); push('crate', { seed: 1 }, 0.3, 0, -0.22, 0.5, 1); push('crate', { seed: 2 }, 0.3, 0, 0.05, 1.5, 1); push('barrel', { seed: 1 }, 0.33, 0, 0.3, 0.2, 1); }
        break;
      case 'statue':
        if (have) push('statue', o({ seed: sd }), 0, 0, 0, 0, 1);
        else push('rock', { size: 0.8, kind: 'spire', seed: sd }, 0, 0, 0, 0, 1);
        break;
      case 'bench':
        if (have) push('bench', o({ seed: sd }), 0, 0, 0, 0, 1);
        else push('crate', { seed: 3 }, 0, 0, 0, 0, 1);
        break;
    }
  };

  /* ---------- описание частей клетки ---------- */
  // вызывается из logic_parts.describe для объектов type:'decor'
  Pr.describe = function (k, o, d, push) {
    const w = W(), i = k % N, j = (k / N) | 0, cx = i + 0.5, cz = j + 0.5, M = Game.MAT;
    const kind = o.kind, rot = (o.rot | 0) & 3, jit = hs(i, j, 215) - 0.5, base = rot * HP + jit * 0.5;
    const pad = Pr.PAD[kind] ? (w.baseY ? w.baseY(k) : w.hy[k]) : null;
    const ox = (hs(i, j, 216) - 0.5) * 0.22, oz = (hs(i, j, 217) - 0.5) * 0.22;
    const gy = (x, z) => w.heightAt(x, z) - 0.02;
    const sd = 1 + Math.floor(hs(i, j, 218) * 2);
    const have = hasModel(kind);
    switch (kind) {
      case 'well': push('well', { seed: sd }, cx + ox, gy(cx + ox, cz + oz), cz + oz, base, 1); break;
      case 'lantern': {            // фонарь у края клетки: смещён к ближайшей стороне, как придорожный
        const a = hs(i, j, 219) * 6.28, x = cx + Math.cos(a) * 0.3, z = cz + Math.sin(a) * 0.3;
        push(hasModel('lanternPost') ? 'lanternPost' : 'lantern', { seed: 1 }, x, gy(x, z), z, a + 3.14, 1); break;
      }
      case 'mill': {
        const dir = waterDir(i, j), rr = Math.atan2(-DZ[dir < 0 ? 1 : dir], DX[dir < 0 ? 1 : dir]);
        push('mill', { wheel: false, seed: 2 }, cx, pad, cz, rr, 1); break;
      }
      case 'windmill': push('windmill', { sails: false, seed: 2 }, cx, pad, cz, windRot(i, j), 1); break;
      case 'lighthouse':
        if (have) push('lighthouse', { seed: sd }, cx, pad, cz, base, 1);
        else push('tower', { floors: 6, ivy: false, n: false, e: false, s: false, w: false, roof: 'cone', seed: sd }, cx, pad, cz, base, 1);
        break;
      case 'vineyard':
        if (have) push('vineyard', { seed: sd }, cx, pad, cz, rot * HP, 1);
        else {
          push('field', { crop: 'green', seed: sd }, cx, pad, cz, 0, 1);
          push('barrel', { seed: 1 }, cx - 0.3, pad, cz + 0.3, base, 1); push('barrel', { seed: 2 }, cx - 0.17, pad, cz + 0.36, base + 1, 1);
        }
        break;
      case 'gazebo': push('gazebo', { seed: sd }, cx, pad, cz, base, 1); break;
      case 'market':
        if (have) push('market', { seed: sd }, cx, pad, cz, rot * HP, 1);
        else { push('cart', { seed: 1, load: true }, cx - 0.12, pad, cz, rot * HP, 1); push('crate', { seed: 1 }, cx + 0.3, pad, cz - 0.22, base, 1); push('crate', { seed: 2 }, cx + 0.3, pad, cz + 0.05, base + 1, 1); push('barrel', { seed: 1 }, cx + 0.33, pad, cz + 0.3, base, 1); }
        break;
      case 'statue':
        if (have) push('statue', { seed: sd }, cx + ox * 0.4, gy(cx, cz), cz + oz * 0.4, base, 1);
        else push('rock', { size: 0.8, kind: 'spire', seed: sd }, cx, gy(cx, cz), cz, base, 1);
        break;
      case 'bench': {
        const x = cx + ox * 0.6, z = cz + oz * 0.6;
        if (have) push('bench', { seed: sd }, x, gy(x, z), z, base, 1);
        else push('crate', { seed: 3 }, x, gy(x, z), z, base, 1);
        break;
      }
    }
  };
  // миграция сохранений v1/v3: позиция и поворот декора из клетки (как рисовал старый describe)
  Pr.legacyEnt = function (k, o) {
    const w = W(), i = k % N, j = (k / N) | 0, cx = i + 0.5, cz = j + 0.5, kind = o.kind, rot = (o.rot | 0) & 3, jit = hs(i, j, 215) - 0.5, base = rot * HP + jit * 0.5;
    const ox = (hs(i, j, 216) - 0.5) * 0.22, oz = (hs(i, j, 217) - 0.5) * 0.22;
    switch (kind) {
      case 'well': return { x: cx + ox, z: cz + oz, rot: base };
      case 'lantern': { const a = hs(i, j, 219) * 6.28; return { x: cx + Math.cos(a) * 0.3, z: cz + Math.sin(a) * 0.3, rot: a + 3.14 }; }
      case 'mill': {
        let dir = -1; const st = Math.floor(hs(i, j, 210) * 4);
        for (let n = 0; n < 4; n++) { const d = (st + n) & 3, a = i + DX[d], b = j + DZ[d]; if (a >= 0 && b >= 0 && a < N && b < N && w.lvl[b * N + a] === 0) { dir = d; break; } }
        const dd = dir < 0 ? 1 : dir; return { x: cx, z: cz, rot: Math.atan2(-DZ[dd], DX[dd]) };
      }
      case 'windmill': return { x: cx, z: cz, rot: windRot(i, j) };
      case 'vineyard': case 'market': return { x: cx, z: cz, rot: rot * HP };
      case 'statue': return { x: cx + ox * 0.4, z: cz + oz * 0.4, rot: base };
      case 'bench': return { x: cx + ox * 0.6, z: cz + oz * 0.6, rot: base };
      default: return { x: cx, z: cz, rot: base };
    }
  };
  function windRot(i, j) { return Math.floor(hs(i, j, 212) * 4) * HP + (hs(i, j, 213) - 0.5) * 0.3; }
  Pr.windRot = windRot;

  /* ---------- анимированные детали ---------- */
  // желаемые детали: колесо мельницы, крылья ветряка (отдельные Render-объекты) — по сущностям mill/windmill
  Pr.sync = function () {
    const E = Game.Ents, S = L.sim, want = new Map(); if (!E || !S) return;
    E.each(e => {
      if (e.kind !== 'mill' && e.kind !== 'windmill') return;
      const c = Math.cos(e.rot), sn = Math.sin(e.rot), s = e.s, key = 'e' + e.id;
      if (e.kind === 'mill') want.set(key, { kind: 'millwheel', id: e.id, ox: e.x + c * 0.34 * s, oy: 0.37 * s, oz: e.z - sn * 0.34 * s, y: e.y, rot: e.rot, s, ax: 'x', ph: Game.hash2(e.seed, 220, 3) * 6.28, spd: 0.9 });
      else want.set(key, { kind: 'windmillsails', id: e.id, ox: e.x + sn * 0.34 * s, oy: 0.8 * s, oz: e.z + c * 0.34 * s, y: e.y, rot: e.rot, s, ax: 'z', ph: Game.hash2(e.seed, 221, 3) * 6.28, spd: 0.7 });
    });
    Pr.anim.forEach((a, key) => { if (!want.has(key) || a.kind !== want.get(key).kind) { S.killObj(a.obj); Pr.anim.delete(key); } });
    want.forEach((v, key) => {
      if (Pr.anim.has(key)) { const a = Pr.anim.get(key); a.ox = v.ox; a.oz = v.oz; a.oy = v.oy; a.y = v.y; a.rot = v.rot; a.s = v.s; return; }
      if (!hasModel(v.kind)) return;
      const obj = S.mkObj(v.kind, { seed: 1 }); v.obj = obj; Pr.anim.set(key, v);
    });
  };
  function animate(time) {
    const S = L.sim, E = Game.Ents; if (!S || !Pr.anim.size) return;
    Pr.anim.forEach(a => {
      const e = E.get(a.id), f = e ? (e._f === undefined ? 1 : e._f) : 0, hidden = !e || f < 0.05;
      a.obj.visible = !hidden;
      if (hidden) return;
      const gust = 0.75 + 0.35 * Math.sin(time * 0.23 + a.ph) + 0.15 * Math.sin(time * 0.9 + a.ph * 2), sc = a.s * f;
      a.ang = (a.ang || a.ph) + (S.lastDt || 0.016) * a.spd * gust;
      const ox = e.x + (a.ox - e.x) * f, oz = e.z + (a.oz - e.z) * f;
      if (a.ax === 'x') S.setTRS(a.obj.matrix, ox, e.y + a.oy * f, oz, a.rot, sc, a.ang, 0);
      else S.setTRS(a.obj.matrix, ox, e.y + a.oy * f, oz, a.rot, sc, 0, a.ang);
    });
  }

  /* ---------- перечень украшений для статистики / вех ---------- */
  Pr.count = function () {
    const E = Game.Ents, c = {}; let n = 0;
    if (E) E.each(e => { if (E.KINDS[e.kind] && E.KINDS[e.kind].decor) { c[e.kind] = (c[e.kind] || 0) + 1; n++; } });
    const w = W(); for (let k = 0; k < NN; k++) { const o = w.obj[k]; if (o && o.type === 'decor') { c[o.kind] = (c[o.kind] || 0) + 1; n++; } }   // легаси-клетки
