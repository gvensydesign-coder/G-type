<script type="module">
import * as THREE from 'three';
import { WildFire, Torch, HeatPost, toonMaterial, toonMesh, SHARED, NOISE } from './firefx.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight, false);
const scene = new THREE.Scene(); scene.userData.clear = 0x16303a;
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, .1, 200);
const fire = new WildFire(scene, camera);
const post = new HeatPost(renderer, fire);

// ---------- шум для формы пала
const hs = (x, z) => { const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); };
const vn = (x, z) => { const ix = Math.floor(x), iz = Math.floor(z), fx = x - ix, fz = z - iz, u = fx * fx * (3 - 2 * fx), v = fz * fz * (3 - 2 * fz);

// ---------- небо и дальний лес (тихий фон)
{
  const sky = new THREE.Mesh(new THREE.SphereGeometry(90, 24, 12), new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { a: { value: new THREE.Color('#2e5a52') }, b: { value: new THREE.Color('#16303a') }, f: SHARED.uFog },
    vertexShader: 'varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }',

  sky.renderOrder = -10; scene.add(sky);
  const tm = toonMaterial({ color: '#0b1712', kind: 2, outline: false });
  for (let i = 0; i < 70; i++) {
    const a = i / 70 * Math.PI * 2 + hs(i, 1) * .08, r = 22 + hs(i, 2) * 10, h = 5 + hs(i, 3) * 6;
    const t = new THREE.Mesh(new THREE.ConeGeometry(h * .28, h, 6), tm); t.position.set(Math.cos(a) * r, h / 2 - .2, Math.sin(a) * r); scene.add(t);

    t.geometry.setAttribute('aChar', new THREE.BufferAttribute(new Float32Array(t.geometry.attributes.position.count), 1));
    t.geometry.setAttribute('aMix', new THREE.BufferAttribute(new Float32Array(t.geometry.attributes.position.count), 1));
  }
}

// ---------- земля
const G = 26, GS = 104;
const gGeo = new THREE.PlaneGeometry(G, G, GS, GS); gGeo.rotateX(-Math.PI / 2);
{ const P = gGeo.attributes.position, mix = new Float32Array(P.count); for (let i = 0; i < P.count; i++) mix[i] = dry(P.getX(i), P.getZ(i)); gGeo.setAttribute('aMix', new THREE.BufferAttribute(mix, 1)); }

scene.add(ground);
const outer = new THREE.Mesh(new THREE.RingGeometry(G * .7, 95, 48, 1).rotateX(-Math.PI / 2), toonMaterial({ color: '#1e3a1c', kind: 3, outline: false })); outer.position.y = -.02;
{ const n = outer.geometry.attributes.position.count; for (const k of ['aHeat', 'aChar', 'aMix']) outer.geometry.setAttribute(k, new THREE.BufferAttribute(new Float32Array(n), 1)); }
scene.add(outer);
fire.addGround(ground, dry, { spacing: .3, bounds: [-8, 2.5, -2.2, 7] });

const pickables = [ground];
const wood = (c) => toonMaterial({ color: c, kind: 0, name: 'wood' });
const add = (mesh, fuel, o) => { scene.add(mesh); pickables.push(mesh); return fire.addObject(mesh, fuel, o); };
const segs = (L, s = .16) => Math.max(1, Math.ceil(L / s));

// ---------- сарай: стена из досок (прогорев снизу, доски валятся наружу)
const plankCols = ['#5a4026', '#634629', '#523a22', '#6a4c2c'];
for (let i = 0; i < 22; i++) {
  const H = 2.5 + hs(i, 7) * .35, x = -2.85 + i * .27;
  const g = new THREE.BoxGeometry(.26, H, .07, 2, segs(H), 1); g.translate(0, H / 2, 0);

}
for (const y of [.55, 2.05]) { const g = new THREE.BoxGeometry(6.2, .14, .08, segs(6.2, .2), 1, 1); const m = toonMesh(g, wood('#4a3420')); m.position.set(0, y, -3.08); add(m, 'wood', { phys: { type: 'fall' } }); }
for (const x of [-3.15, 3.15]) { const g = new THREE.BoxGeometry(.2, 2.9, .2, 1, segs(2.9), 1); g.translate(0, 1.45, 0); const m = toonMesh(g, wood('#3e2c1a')); m.position.set(x, 0, -3.05); add(m, 'log'); }

// ---------- стог: тюки сена
const hayM = toonMaterial({ color: '#9a7a34', kind: 1, shrink: .5, name: 'hay' });
for (const [x, y, z, ry, top] of [[-1.7, .6, -1.95, .1], [-.42, .6, -2.05, -.08], [-1.05, 1.78, -2.0, .03, 1]]) {

  const m = toonMesh(g, hayM); m.position.set(x, y, z); m.rotation.y = ry; add(m, 'hay', top ? { phys: { type: 'settle', hx: .5, hz: .35 } } : {});
}

// ---------- поленница
const logM = toonMaterial({ color: '#6a4a2c', kind: 5, name: 'log' });
{ let k = 0; for (let row = 0; row < 4; row++) for (let j = 0; j < 4 - row; j++) {
  const g = new THREE.CylinderGeometry(.16, .17, 1.7, 10, 6); g.rotateX(Math.PI / 2);
  const m = toonMesh(g, logM); m.position.set(3.3 + (j - (3 - row) / 2) * .34, .17 + row * .3, .2); m.rotation.y = (hs(k++, 5) - .5) * .08; add(m, 'log'); } }

// ---------- изгородь: столбы стоят, жерди падают, когда прогорает конец
for (let i = 0; i <= 3; i++) {
  const x = -6.6 + i * 2.1; const g = new THREE.BoxGeometry(.14, 1.3, .14, 1, segs(1.3), 1); g.translate(0, .65, 0);
  const m = toonMesh(g, wood('#4e3820')); m.position.set(x, 0, 5.2); m.rotation.y = hs(i, 3) * .3; add(m, 'log');
  if (i < 3) for (const y of [.5, 1.0]) {
    const rg = new THREE.BoxGeometry(2.1, .1, .07, segs(2.1, .2), 1, 1); const r = toonMesh(rg, wood('#5e4428'));
    r.position.set(x + 1.05, y + (hs(i, y) - .5) * .06, 5.27); r.rotation.z = (hs(i * 3, y) - .5) * .05; add(r, 'wood', { phys: { type: 'fall' } });
  }
}

// ---------- костёр в кругу камней (горит с самого начала, камни калятся)
const stoneM = toonMaterial({ color: '#4a4e52', kind: 2, name: 'stone' });
const CF = new THREE.Vector3(2.4, 0, 2.6);
for (let i = 0; i < 9; i++) {
  const a = i / 9 * Math.PI * 2; const g = new THREE.IcosahedronGeometry(.2 + hs(i, 11) * .06, 1); g.scale(1, .7, 1);
  const m = toonMesh(g, stoneM); m.position.set(CF.x + Math.cos(a) * .62, .1, CF.z + Math.sin(a) * .62); add(m, null, { heatKind: 'stone' });
}
const campLogs = [];
for (let i = 0; i < 4; i++) {
  const a = i / 4 * Math.PI * 2 + .4; const g = new THREE.CylinderGeometry(.06, .08, .95, 8, 4); g.translate(0, .47, 0);
  const m = toonMesh(g, logM); m.position.set(CF.x + Math.cos(a) * .32, 0, CF.z + Math.sin(a) * .32);
  m.lookAt(CF.x, .9, CF.z); m.rotateX(Math.PI / 2); campLogs.push(add(m, 'log', { spacing: .16 }));
}
for (const ob of campLogs) for (let i = ob.n0; i < ob.n0 + ob.nN; i++) { fire.nodes[i].fuel0 *= 8; fire.nodes[i].fuel = fire.nodes[i].fuel0; }
// крупные валуны
for (const [x, z, s] of [[1.2, -1.0, .55], [-4.2, -.6, .7], [5.6, 2.6, .8], [.4, 4.6, .45]]) {
  const g = new THREE.IcosahedronGeometry(s, 2); g.scale(1.2, .75, 1); const m = toonMesh(g, stoneM); m.position.set(x, s * .45, z); m.rotation.y = x; add(m, null, { heatKind: 'stone' });
}

// ---------- факел на шесте
const torchG = new THREE.Group(); torchG.position.set(1.05, 0, -2.45); scene.add(torchG);
const poleG = new THREE.CylinderGeometry(.04, .055, 1.75, 6, 8); poleG.translate(0, .875, 0);
const pole = toonMesh(poleG, wood('#3e2c1a')); torchG.add(pole); pickables.push(pole); fire.addObject(pole, null, { heatKind: 'wood' });
const headG = new THREE.CylinderGeometry(.09, .07, .24, 10, 3); headG.translate(0, 1.85, 0);
const head = toonMesh(headG, toonMaterial({ color: '#5a4434', kind: 1, name: 'cloth' })); torchG.add(head); pickables.push(head);
const anchor = new THREE.Object3D(); anchor.position.set(0, 1.98, 0); torchG.add(anchor);
const torch = new Torch(fire, anchor, head, { size: .95 });
const isTorch = (o) => o === pole || o === head;

// ---------- флаг ветра
const flagG = new THREE.Group(); flagG.position.set(5.2, 0, -1.6); scene.add(flagG);
{ const pg = new THREE.CylinderGeometry(.04, .05, 3.2, 6, 4); pg.translate(0, 1.6, 0); const p = toonMesh(pg, wood('#3a2a1a')); flagG.add(p); fire.addObject(p, null, { heatKind: 'wood' }); }
const flagPiv = new THREE.Group(); flagPiv.position.y = 2.85; flagG.add(flagPiv);
{ const fg = new THREE.PlaneGeometry(1.1, .5, 12, 2); fg.translate(.55, -.25, 0); const f = toonMesh(fg, toonMaterial({ color: '#8a2a24', kind: 4, flag: true, doubleSide: true, outline: false })); f.geometry.scale(1 / 1.1, 1, 1); f.scale.x = 1.1; flagPiv.add(f); }

// ---------- сухая трава: кустики (сгорают в чёрную стерню, качаются по ветру)
const TUFTS = [];
{ for (let i = 0; i < 2600 && TUFTS.length < 260; i++) { const x = -8 + hs(i, 21) * 10.5, z = -2 + hs(i, 22) * 9; if (dry(x, z)) TUFTS.push([x, z, hs(i, 23)]); } }
const tuftGeo = (() => { const p = []; for (let k = 0; k < 5; k++) { const a = k / 5 * Math.PI + .3, c = Math.cos(a) * .09, s = Math.sin(a) * .09, lx = Math.cos(a * 3) * .05, lz = Math.sin(a * 2) * .05;
  p.push(-c, 0, -s, c, 0, s, lx, .42 + (k % 2) * .12, lz); } const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3)); g.computeVertexNormals(); return g; })();
const tuftMat = new THREE.ShaderMaterial({ side: THREE.DoubleSide, uniforms: { ...SHARED, cDry: { value: new THREE.Color('#7a7034') }, cTip: { value: new THREE.Color('#a8964c') } },
  vertexShader: `attribute vec2 aT; uniform vec3 uWind; uniform float uTime; varying float vY; varying vec2 vT; varying vec3 vW;
    void main(){ vec3 p = position; float ch = aT.x; p.y *= 1. - ch * .8; float t = floor(uTime * 10.) / 10.;
      vec4 w = modelMatrix * instanceMatrix * vec4(p, 1.); w.xyz += uWind * p.y * p.y * (2. + sin(t * 3. + aT.y * 20.) * .8) * (1. - ch);
      vY = position.y / .54; vT = aT; vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: `uniform vec3 cDry, cTip, cChar, uFog, uMoonCol, uAmb, cOut, cCore; uniform float uFogD; uniform vec3 uFireP[8]; uniform vec4 uFireC[8]; uniform int uFireN;
    varying float vY; varying vec2 vT; varying vec3 vW;
    void main(){ vec3 c = mix(cDry, cTip, step(.6, vY)) * (uAmb + uMoonCol * .5);
      float fs = 0.; for (int i = 0; i < 8; i++) { if (i >= uFireN) break; float d = length(uFireP[i] - vW); float a = clamp(1. - d / uFireC[i].w, 0., 1.); fs += a * a * uFireC[i].r; }
      c += cDry * vec3(1., .6, .3) * (fs > .7 ? 1. : (fs > .25 ? .55 : 0.));
      if (vT.x > .3) c = cChar * 1.4; if (vT.x > .3 && vT.x < .75 && vY > .5) c = vT.x < .5 ? cCore : cOut;
      float fk = 1. - exp(-pow(length(vW - cameraPosition) * uFogD, 2.)); gl_FragColor = vec4(mix(c, uFog, fk * .88), 1.); }` });
const tufts = new THREE.InstancedMesh(tuftGeo, tuftMat, TUFTS.length);
{ const m = new THREE.Matrix4(), q = new THREE.Quaternion(), aT = new Float32Array(TUFTS.length * 2);
  TUFTS.forEach(([x, z, r], i) => { q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), r * 6.28); m.compose(new THREE.Vector3(x, 0, z), q, new THREE.Vector3(1, .7 + r * .7, 1).multiplyScalar(.8 + r * .5)); tufts.setMatrixAt(i, m); aT[i * 2 + 1] = r; });
  tufts.geometry.setAttribute('aT', new THREE.InstancedBufferAttribute(aT, 2)); }
scene.add(tufts);
const gIdx = (x, z) => Math.round((z + G / 2) / (G / GS)) * (GS + 1) + Math.round((x + G / 2) / (G / GS));
function updateTufts() { const ch = ground.geometry.attributes.aChar.array, ht = ground.geometry.attributes.aHeat.array, a = tufts.geometry.attributes.aT;
  TUFTS.forEach(([x, z], i) => { const k = gIdx(x, z); a.array[i * 2] = Math.max(a.array[i * 2], ch[k] > .25 ? Math.min(1, ch[k] * 1.3) : 0) * (ht[k] > .5 || ch[k] > .5 ? 1 : 1); }); a.needsUpdate = true; }

// ---------- камера: стрелки и кнопки (мышь камерой не управляет)
const cam = { yaw: .5, pitch: .4, dist: 13.5, target: new THREE.Vector3(-.2, .9, .9) };
function placeCam() { const c = Math.cos(cam.pitch); camera.position.set(cam.target.x + Math.sin(cam.yaw) * c * cam.dist, cam.target.y + Math.sin(cam.pitch) * cam.dist, cam.target.z + Math.cos(cam.yaw) * c * cam.dist); camera.lookAt(cam.target); }
const held = new Set();
addEventListener('keydown', (e) => { if (e.target.tagName === 'INPUT') return; held.add(e.key); });
addEventListener('keyup', (e) => held.delete(e.key));
const hold = (id, fn) => { const b = document.getElementById(id); let t = null; const go = () => { fn(); t = setTimeout(go, 30); };
  b.addEventListener('pointerdown', (e) => { e.preventDefault(); go(); }); for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) b.addEventListener(ev, () => clearTimeout(t)); };
hold('cL', () => cam.yaw -= .03); hold('cR', () => cam.yaw += .03); hold('cIn', () => cam.dist = Math.max(5, cam.dist - .2)); hold('cOut', () => cam.dist = Math.min(24, cam.dist + .2));

// ---------- клик: поджечь / залить / факел
let mode = 'ignite';
const ray = new THREE.Raycaster(), mv = new THREE.Vector2();
canvas.addEventListener('pointerdown', (e) => {
  const r = canvas.getBoundingClientRect(); mv.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(mv, camera); const hit = ray.intersectObjects(pickables, false)[0]; if (!hit) return;
  if (isTorch(hit.object)) { torch.toggle(); syncTorch(); return; }
  if (mode === 'ignite') fire.ignite(hit.point, .5); else fire.douse(hit.point, 1.6);
});
const $ = (id) => document.getElementById(id);
function setMode(m) { mode = m; $('mIgnite').classList.toggle('on', m === 'ignite'); $('mWater').classList.toggle('on', m === 'water'); $('mWater').classList.toggle('water', m === 'water'); canvas.style.cursor = m === 'water' ? 'cell' : 'crosshair'; }
$('mIgnite').onclick = () => setMode('ignite'); $('mWater').onclick = () => setMode('water');
function syncTorch() { $('torchBtn').textContent = torch.state === 'off' || torch.state === 'out' ? 'Зажечь факел' : 'Погасить факел'; $('torchBtn').classList.toggle('on', torch.state !== 'off' && torch.state !== 'out'); }
$('torchBtn').onclick = () => { torch.toggle(); syncTorch(); };
$('toggle').onclick = () => $('ui').classList.toggle('closed');

const DIRS = ['восток', 'юго-восток', 'юг', 'юго-запад', 'запад', 'северо-запад', 'север', 'северо-восток'];
function syncWind() { const a = +$('windDir').value, s = +$('windStr').value / 100; fire.setWind(a, s); fire.wind.gusts = $('gusts').checked;
  $('oDir').textContent = `на ${DIRS[Math.round(a / 45) % 8]}`; $('oStr').textContent = s < .05 ? 'штиль' : `${Math.round(s * 12)} м/с`;
  fire.o.spread = +$('spread').value / 100; $('oSpread').textContent = `×${(+$('spread').value / 100).toFixed(1)}`;
  post.mat.uniforms.uHaze.value = $('haze').checked ? 1 : 0; fire.showNodes = $('nodes').checked; }
for (const id of ['windDir', 'windStr', 'gusts', 'spread', 'haze', 'nodes']) $(id).addEventListener('input', syncWind);
syncWind();

function lightCamp() { fire.ignite(new THREE.Vector3(CF.x, .35, CF.z), .5, 4); }
function resetAll() { fire.reset(); tufts.geometry.attributes.aT.array.forEach((v, i, a) => { if (i % 2 === 0) a[i] = 0; }); tufts.geometry.attributes.aT.needsUpdate = true; lightCamp(); }
function scenario(dir, str, pts) { resetAll(); $('windDir').value = dir; $('windStr').value = str; syncWind(); setTimeout(() => pts.forEach((p) => fire.ignite(p, .55, 3)), 150); }
$('sHay').onclick = () => scenario(270, 35, [new THREE.Vector3(-1.7, .15, -1.4)]);
$('sGrass').onclick = () => scenario(80, 60, [new THREE.Vector3(-3.4, 0, .1), new THREE.Vector3(-2.4, 0, -.1)]);
$('sWood').onclick = () => scenario(160, 30, [new THREE.Vector3(3.3, .2, .95)]);
$('sReset').onclick = () => resetAll();

// ---------- цикл
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); post.setSize(); });
lightCamp(); setTimeout(() => { if (torch.state === 'off') { torch.ignite(); syncTorch(); } }, 1200);
let last = performance.now(), fpsT = 0, frames = 0, fps = 0, tuftT = 0;
window.__fire = { fire, torch, cam, THREE, scenario, setMode };
function loop(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  if (held.has('ArrowLeft') || held.has('a')) cam.yaw -= dt * 1.1; if (held.has('ArrowRight') || held.has('d')) cam.yaw += dt * 1.1;
  if (held.has('ArrowUp') || held.has('w')) cam.dist = Math.max(5, cam.dist - dt * 6); if (held.has('ArrowDown') || held.has('s')) cam.dist = Math.min(24, cam.dist + dt * 6);
  placeCam();
  flagPiv.rotation.y = -fire.wind.angle * Math.PI / 180;
  fire.update(dt); torch.update(dt); syncTorchLazy();
  tuftT += dt; if (tuftT > 1 / 12) { tuftT = 0; updateTufts(); }
  post.render(scene, camera);
  frames++; fpsT += dt; if (fpsT > .5) { fps = Math.round(frames / fpsT); frames = 0; fpsT = 0; const s = fire.stats;
    $('stats').innerHTML = `<span>Горит узлов: <b>${s.burning}</b> · тлеет: <b>${s.smoulder}</b></span><span>Сгорело: <b>${Math.round(s.burnt / Math.max(1, s.total) * 100)}%</b> из ${s.total} узлов</span><span>Языков пламени: <b>${fire.flameCount ?? 0}</b> · ${fps} к/с</span>`; }
  requestAnimationFrame(loop);
}
let lastTorch = ''; function syncTorchLazy() { if (torch.state !== lastTorch) { lastTorch = torch.state; syncTorch(); } }
requestAnimationFrame(loop);
</script>

</body></html>
