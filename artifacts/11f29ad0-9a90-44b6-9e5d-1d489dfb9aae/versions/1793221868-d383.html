*{box-sizing:border-box;scrollbar-width:none;-ms-overflow-style:none}*::-webkit-scrollbar{display:none;width:0;height:0}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--fs-base)/var(--lh) var(--f-ui);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer}
h1,h2,h3,p{margin:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;box-shadow:0 0 0 4px var(--focus)}
.ico{display:inline-block;flex:none;width:22px;height:22px;background:currentColor;-webkit-mask:var(--ic) center/contain no-repeat;mask:var(--ic) center/contain no-repeat}
/* art tokens: generated imagery only (cover, avatar). Not UI colour. */
:root{--art-av1:#E5483A;--art-av2:#A8231A;--art-hi:#FFB199;--art-deep:#12090A;--art-wine:#5B120E;--art-red:#D9342A;--art-glow:#FF8A6B;--art-scrim:rgba(14,7,7,.62);--glass-tint:rgba(16,9,9,.34);--glass-line:rgba(255,255,255,.22);--glass-fg:#fff;--glass-fg2:rgba(255,255,255,.82)}
.page{min-height:100vh;padding:var(--pad) var(--pad) var(--s8) calc(var(--rw) + var(--pad)*2)}
.wrap{max-width:1334px}

/* rail (DS: dark pill, contextual) */
.rail{position:fixed;left:var(--pad);top:var(--pad);bottom:var(--pad);width:var(--rw);display:flex;flex-direction:column;align-items:center;gap:12px;z-index:30;pointer-events:none}
.rail>*,.rail .rb{pointer-events:auto}
.rail .logo{width:48px;height:48px;padding:0;border-radius:50%;background:var(--rail);color:var(--on-rail);font:800 var(--fs-xl)/1 var(--f-ui);letter-spacing:-.04em;display:grid;place-items:center;position:relative;flex:none}
.rail .logo::after{content:"";position:absolute;right:9px;bottom:10px;width:6px;height:6px;border-radius:50%;background:var(--accent)}

.rpill{background:var(--rail);border-radius:var(--r-pill);padding:8px;display:flex;flex-direction:column;gap:6px}
.rpill.foot{margin-top:auto}
.rb{width:46px;height:46px;border-radius:50%;background:transparent;color:var(--on-rail);display:grid;place-items:center;position:relative;transition:background var(--dur-fast)}
.rb .ico{width:22px;height:22px}
.rb:hover{background:var(--rail-2)}
.rb.on{background:var(--rail-hi);color:var(--rail)}
.rb[data-tip]::after{content:attr(data-tip);position:absolute;left:calc(100% + 16px);top:50%;transform:translate(-6px,-50%);background:var(--rail);color:var(--on-rail);border-radius:var(--r-pill);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity var(--dur-fast),transform var(--dur-fast);z-index:5;font:var(--fw-m) var(--fs-md)/1 var(--f-ui);padding:var(--s3) var(--s4);box-shadow:var(--sh-3)}
.rb[data-tip]:hover::after,.rb[data-tip]:focus-visible::after{opacity:1;transform:translate(0,-50%)}
.rb.av{padding:3px}
.rb.av.on{background:var(--rail-hi)}
.avt{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;letter-spacing:-.03em;line-height:1;overflow:hidden;position:relative;
 background:radial-gradient(90% 80% at 24% 14%,var(--art-hi) 0,transparent 58%),radial-gradient(80% 80% at 92% 100%,var(--art-deep) 0,transparent 66%),linear-gradient(145deg,var(--art-av1),var(--art-av2))}
.rb .avt{font-size:var(--fs-md)}
.avt::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)}

/* DS components used here */
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r-pill);white-space:nowrap;min-height:var(--h-md);padding:0 var(--s4);gap:var(--s2);font-size:var(--fs-base);font-weight:var(--fw-m);background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);transition:background var(--dur-fast),box-shadow var(--dur-fast),color var(--dur-fast)}

.btn.sm{min-height:var(--h-sm);padding:0 var(--s3);font-size:var(--fs-md)}

.ibtn{width:var(--h-lg);height:var(--h-lg);border-radius:50%;display:inline-grid;place-items:center;background:var(--paper);box-shadow:0 0 0 1px var(--line);flex:none;transition:background var(--dur-fast)}

.chip{display:inline-flex;align-items:center;gap:var(--s2);min-height:var(--h-md);padding:0 var(--s3);border-radius:var(--r-pill);font-size:var(--fs-md);font-weight:var(--fw-m);background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap}
.chip:hover{background:var(--surface-3)}

.seg{display:inline-flex;border-radius:var(--r-pill);padding:3px;gap:2px;background:var(--panel)}

/* specimen tile (glyph sheets stay light in both themes) */
.spec{position:relative;background:var(--canvas);color:var(--glyph);border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap}

.fcard{position:relative;padding:var(--s6);min-width:0;color:var(--ink);cursor:pointer;text-align:left;--cbg:var(--card)}
