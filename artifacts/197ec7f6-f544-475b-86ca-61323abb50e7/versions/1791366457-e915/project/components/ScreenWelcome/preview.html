<!-- @dsCard group="Launch" height=960 width=900 subtitle="Приветствие: Buddy выглядывает снизу и машет, две реплики, шары, текст и кнопки поднимаются по очереди." -->
<style>.rp { padding: 16px 16px 0; display: flex; gap: 12px; align-items: center; background: var(--bg-app); color: var(--text-muted); font: 600 12px/16px var(--font-sans); }</style>
<div class="rp"><button type="button" class="bd-btn bd-btn--soft" id="replay">Повторить</button><span>200 мс выход · 1000 и 1900 мс реплики · 2300 мс текст · 2700 мс кнопки</span></div>
<div id="stage"></div>
<script>
  var B = window.Buddy, ctrls = [];
  function run() {
    ctrls.forEach(function (c) { c.destroy(); }); ctrls = [];
    document.getElementById('stage').innerHTML = B.Stage(function () { return B.Phone(B.Welcome({}), { wash: true }); });
    Array.prototype.forEach.call(document.querySelectorAll('.bd-welcome__pat'), function (h) { ctrls.push(B.Pattern.mount(h, { state: 'idle', focus: { x: 0.5, y: 0.34 } })); });
  }
  document.getElementById('replay').addEventListener('click', run); run();
</script>
