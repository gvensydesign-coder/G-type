<!-- @dsCard group="Foundations" height=330 width=900 subtitle="Объекты-иллюстрации 64px: глянцевая заливка, мягкий блик, без контура." -->
<style>
  .og { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 12px; padding: 20px; background: var(--bg-app); color: var(--text-primary); }
  .oc { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 6px 10px; border-radius: var(--radius-lg); background: var(--bg-surface); border: 1px solid var(--bd-edge); box-shadow: var(--shadow-xs); }
  .oc span { font: 700 12px/16px var(--font-sans); color: var(--text-secondary); }
</style>
<div class="og" id="root"></div>
<script>
  var B = window.Buddy;
  document.getElementById('root').innerHTML = B.objects.map(function (n) { return '<div class="oc">' + B.object(n, { size: 56 }) + '<span>' + n + '</span></div>'; }).join('');
</script>
