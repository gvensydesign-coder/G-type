<!-- @dsCard group="Surfaces" height=220 width=620 subtitle="Базовая поверхность: стандарт, плоская, тонированная, крупная." -->
<style>.pv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;padding:20px;background:var(--bg-app);color:var(--text-primary)}.pv p{margin:0;font:700 14px/20px var(--font-sans)}.pv span{font:500 12px/16px var(--font-sans);color:var(--text-muted)}</style>
<div class="pv" id="root"></div>
<script>
  var B = window.Buddy;
  function c(v, name, r) { return B.Card({ variant: v, html: '<p>' + name + '</p><span>' + r + '</span>' }); }
  document.getElementById('root').innerHTML = c('', 'Default', 'radius-xl, shadow-sm') + c('flat', 'Flat', 'border-subtle') + c('tint', 'Tint', 'bg-surface-tint') + c('lg', 'Large', 'radius-2xl, shadow-md');
</script>
