<!-- @dsCard group="Foundations" height=520 width=900 subtitle="Узор из квадратиков реагирует на состояние ассистента: покой, раздумье, поиск, ответ, успех, сон." -->
<style>
  .tp { display: flex; flex-direction: column; gap: 16px; padding: 20px; background: var(--bg-app); color: var(--text-primary); }
  .tp__bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .tp__panels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .tp__panel { position: relative; height: 340px; border-radius: var(--radius-3xl); overflow: hidden; background: var(--bd-grad-wash); border: 1px solid var(--bd-edge); display: grid; place-items: center; }
  .tp__mid { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .tp__state { height: 32px; }
  .tp__note { margin: 0; font: 500 12px/16px var(--font-sans); color: var(--text-muted); }
</style>
<div class="tp bd-root" id="root"></div>
<script>
  var B = window.Buddy, states = B.Pattern.states, ctrls = [];
  var notes = { idle: 'idle: дыхание полутона, редкие искры', thinking: 'thinking: кольца расходятся от маскота', searching: 'searching: луч сканирует экран, находки вспыхивают', answering: 'answering: колонки «падают», как набор текста', success: 'success: одна зелёная волна и возврат в idle', sleep: 'sleep: приглушённо, офлайн или ошибка (без красного)' };
  function panel(theme) { return '<div data-theme="' + theme + '"><div class="tp__panel bd-root"><div class="tp__host"></div><div class="tp__mid">' + B.mascot('sunny-happy', { size: 112, cls: 'bd-anim-float' }) + '<div class="tp__state"></div></div></div></div>'; }
  document.getElementById('root').innerHTML = '<div class="tp__bar" id="bar">' + states.map(function (s, i) { return B.Chip({ filter: true, label: s, pressed: i === 0 }); }).join('') + '</div><div class="tp__panels">' + panel('light') + panel('dark') + '</div><p class="tp__note" id="note"></p>';
  Array.prototype.forEach.call(document.querySelectorAll('.tp__host'), function (h) { ctrls.push(B.Pattern.mount(h, { focus: { x: 0.5, y: 0.42 } })); });
  function setState(s) {
    ctrls.forEach(function (c) { c.set(s); });
    var lab = B.Pattern.label(s);
    Array.prototype.forEach.call(document.querySelectorAll('.tp__state'), function (el) { el.innerHTML = lab ? B.ThinkingIndicator({ label: lab + (s === 'success' || s === 'sleep' ? '' : '…'), ok: s === 'success' }) : ''; });
    document.getElementById('note').textContent = notes[s];
  }
  document.getElementById('bar').addEventListener('click', function (e) { var b = e.target.closest('.bd-chip--filter'); if (b) setState(b.textContent.trim()); });
  B.wire(document); setState('idle');
</script>
