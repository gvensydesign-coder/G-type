<!-- @dsCard group="Illustrations" height=560 width=900 subtitle="Цветные иллюстративные иконки в стиле эмодзи: мягкие градиенты, блик, тень. Заменяют линейные значки в тегах и самопомощи." -->
<style>
  .em { padding: 24px; background: var(--bg-app); color: var(--text-primary); font-family: var(--font-sans); }
  .em__g { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 12px; }
  .em__c { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 8px 12px; border-radius: var(--radius-xl); background: var(--bg-surface); border: 1px solid var(--border-subtle); box-shadow: var(--shadow-sm); font: 700 12px/16px var(--font-sans); }
  .em__c code { color: var(--text-muted); font: 500 12px/16px var(--font-mono); }
  .em__row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; align-items: center; }
  .em__tag { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px 0 12px; border-radius: var(--radius-pill); background: var(--bg-surface); border: 1px solid var(--border-subtle); font: 700 14px/20px var(--font-sans); box-shadow: var(--shadow-xs); }
</style>
<div class="em"><div class="em__g" id="g"></div><div class="em__row" id="r"></div></div>
<script>
  var B = window.Buddy, names = { clock: 'Круглосуточно', gift: 'Бесплатно', wallet: 'Платно', pin: 'Рядом', star: 'Рейтинг', 'car-sky': 'Выезд', 'car-orange': 'На машине', house: 'Приём', siren: 'Срочно', shield: 'Проверено', moon: 'Вечером', heart: 'Передержка', bolt: 'Первые минуты', firstaid: 'Раненое животное', stop: 'Агрессия', weather: 'Жара и холод', bowl: 'Кормление', search: 'Поиск хозяина' };
  document.getElementById('g').innerHTML = B.emojiList.map(function (n) { return '<div class="em__c">' + B.emoji(n, { size: 64 }) + '<span>' + (names[n] || n) + '</span><code>' + n + '</code></div>'; }).join('');
  document.getElementById('r').innerHTML = ['clock', 'gift', 'pin', 'star', 'shield'].map(function (n) { return '<span class="em__tag">' + B.emoji(n, { size: 28 }) + names[n] + '</span>'; }).join('');
</script>
