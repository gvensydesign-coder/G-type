    pv.onclick=()=>{stopTour();tourGo(tourIdx<0?0:tourIdx-1);};nx.onclick=()=>{stopTour();tourGo(tourIdx+1);};pl.onclick=tourPlay;
    st.append(pv,mk('span','',tourIdx<0?'Пройти по звеньям':'Звено '+(tourIdx+1)+' из '+ch.l.length),pl,nx);c.appendChild(st);
    const r=mk('div','rel');ch.l.forEach((id,i)=>{const b=chip(id,()=>{stopTour();tourGo(i);});if(i===tourIdx)b.style.borderColor=ch.c;r.appendChild(b);});c.appendChild(r);
    if(tourIdx>=0){const cur=byId[ch.l[tourIdx]];c.append(mk('div','lbl',cur.name),mk('p','',cur.text));if(cur.note)c.appendChild(mk('p','note',cur.note));if(cur.src){const a=mk('a','',cur.src[0]+' ↗');a.href=cur.src[1];a.target='_blank';a.rel='noopener noreferrer';c.appendChild(a);}}
    return;}
  if(!n){
    c.append(mk('div','k','Как читать'),mk('p','','Узел — событие, место, символ, человек или состояние меди. Цвет — сфера, размер — число связей. Клик по узлу показывает связи, двойной клик раскрывает детали, пунктирное кольцо значит «внутри есть ещё».'));
    const stt=mk('div','stats');[[MAIN.length,'узлов'],[E.length,'связей'],[CHAINS.length,'цепей']].forEach(x=>{const d=mk('div');d.append(mk('b','',String(x[0])),mk('span','',x[1]));stt.appendChild(d);});
    const bars=mk('div','bars');TK.forEach(t=>{const d=mk('div');d.append(mk('span','',TYPES[t].n));const e=mk('em');e.style.background=TYPES[t].c;e.style.width=Math.round(TCOUNT[t]/Math.max(...Object.values(TCOUNT))*100)+'%';d.append(e,mk('span','',String(TCOUNT[t])));bars.appendChild(d);});
    const hist=mk('div','hist'),bins=[];for(let y=1810;y<2026;y+=20)bins.push(0);MAIN.forEach(x=>{if(x.year)bins[Math.min(bins.length-1,Math.floor((x.year-1810)/20))]++;});const mx=Math.max(...bins);bins.forEach((v,i)=>{const e=mk('i');e.style.height=Math.max(8,v/mx*100)+'%';e.title=(1810+i*20)+'–'+(1829+i*20)+': '+v;hist.appendChild(e);});
    const hl=mk('div','hl');hl.append(mk('span','','1810'),mk('span','','события по годам'),mk('span','','2026'));
    c.append(stt,bars,hist,hl,mk('p','note','Положение узлов условное, это не география. Подсказки: Shift + клик по второму узлу строит путь, правка года внизу фильтрует время.'));return;}
  const k=mk('div','k');const dot=mk('i');dot.style.background=TYPES[n.type].c;k.append(dot,mk('span','',TYPES[n.type].n));
  const par=n.kid?byId[n.parent]:n;
  c.append(k,mk('h2','',n.name));
  const meta=mk('div','meta');if(n.year)meta.appendChild(mk('span','',String(n.year)));meta.appendChild(mk('span','','связей: '+n.deg));if(n.kid)meta.appendChild(mk('span','','часть: '+par.name));c.append(meta,mk('p','',n.text));
  const row=mk('div','row');
  if(par.kids.length){const b=mk('button','act',par.exp?'Свернуть':'Раскрыть ('+par.kids.length+')');b.onclick=()=>{toggle(par.id);renderCard();};row.appendChild(b);}
  if(!n.kid){const b=mk('button','act alt','Путь до…');b.setAttribute('aria-pressed',String(pathMode));b.onclick=()=>{pathMode=!pathMode;b.setAttribute('aria-pressed',String(pathMode));say(pathMode?'Выберите второй узел на схеме':'',0);};row.appendChild(b);}
  c.appendChild(row);
  const nb=ADJ[n.id];if(nb.length){c.append(mk('div','lbl','Связи'));const r=mk('div','rel');nb.forEach(i=>r.appendChild(chip(i)));c.appendChild(r);}
  const ch=(chainOf[n.id]||[]).map(id=>CHAINS.find(x=>x.id===id));if(ch.length){c.append(mk('div','lbl','В цепях'));const r=mk('div','rel');ch.forEach(x=>{const b=mk('button','',x.n);const d=mk('i');d.style.background=x.c;b.prepend(d);b.onclick=()=>{setChain(x.id);};r.appendChild(b);});c.appendChild(r);}
  if(n.src){const a=mk('a','',n.src[0]+' ↗');a.href=n.src[1];a.target='_blank';a.rel='noopener noreferrer';c.appendChild(a);}
  if(n.note)c.appendChild(mk('p','note',n.note));}
$('#b-in').onclick=()=>{cam.tdist=Math.max(260,cam.tdist*.8);};
$('#b-out').onclick=()=>{cam.tdist=Math.min(1900,cam.tdist*1.25);};
$('#b-spin').onclick=e=>{autoSpin=!autoSpin;e.currentTarget.setAttribute('aria-pressed',String(autoSpin));};
$('#b-spin').setAttribute('aria-pressed',String(autoSpin));
$('#b-reset').onclick=()=>{stopTour();clearPath();selected=null;setChain(null);cam.yaw=.6;cam.pitch=.35;FOC();cam.tdist=mode==='sph'?1060:mode==='net'?720:900;say('');renderCard();};
const yIn=$('#yr-in'),yEl=$('#yr'),tPlay=$('#t-play');
function setYear(y){yearLimit=y;yIn.value=y;yEl.textContent=y>=2026?'2026':y;if(selected&&byId[selected].year>y)select(null);}
yIn.addEventListener('input',()=>{playing=false;tPlay.textContent='▶';setYear(+yIn.value);});
tPlay.onclick=()=>{playing=!playing;tPlay.textContent=playing?'❚❚':'▶';if(playing&&yearLimit>=2026)setYear(1810);};
setInterval(()=>{if(playing){if(yearLimit>=2026){playing=false;tPlay.textContent='▶';}else setYear(Math.min(2026,yearLimit+2));}},60);
window.__net={setMode,select,setYear,toggle,setChain,findPath,tourGo,cam,get nodes(){return NODES;}};
setMode('net');renderCard();
})();
</script>
