<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>Живая медь: карта</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: isometric illustrated map on a paper-coloured stage (stays light in both themes), sidebar with filters, list and card. */
:root{
  --bg:#FBF6EE; --panel:#FFFFFF; --ink:#2A2320; --soft:#6B5E55; --line:#E6DCCD; --chip:#F3ECE1;
  --patina:#2F9E86; --patina-ink:#1F7A67; --copper:#BF6A45; --pill-bg:rgba(255,255,255,.94);
  --font-d:'Unbounded',system-ui,sans-serif; --font-b:'Onest',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1D1917; --panel:#2A2420; --ink:#F4ECE2; --soft:#BDAEA2; --line:#3E352F; --chip:#352D28;
  --patina:#4DBFA3; --patina-ink:#7FD9C0; --copper:#D58A6C; --pill-bg:rgba(42,36,32,.94); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1D1917; --panel:#2A2420; --ink:#F4ECE2; --soft:#BDAEA2; --line:#3E352F; --chip:#352D28;
  --patina:#4DBFA3; --patina-ink:#7FD9C0; --copper:#D58A6C; --pill-bg:rgba(42,36,32,.94); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.45;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px}
.stage{position:relative;min-width:0;min-height:0;border-radius:24px;overflow:hidden;background:#F3EDE2;border:1px solid var(--line)}
#map{display:block;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#map.drag{cursor:grabbing}
.bg,.obj{transition:opacity .5s ease,transform .5s ease}
.bg.off,.obj.off{opacity:0;transform:translateY(-16px);pointer-events:none}
.obj{cursor:pointer}
.obj:hover{transform:translateY(-3px)}
.obj.off:hover{transform:translateY(-16px)}
.obj.sel{filter:drop-shadow(0 0 5px rgba(191,106,69,.95))}
.obj.sel .plot{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.lab{cursor:pointer}
.lab text{font-family:var(--font-b);font-weight:500;fill:#2A2320;paint-order:stroke;stroke:#F3EDE2;stroke-linejoin:round}
.lab.sel text{fill:#BF6A45;font-weight:600}
.lab[display="none"]{display:none}
.sbar{position:absolute;right:14px;top:66px;display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:11px;color:#2A2320;pointer-events:none}
.sbar i{display:block;height:6px;border:2px solid #2A2320;border-top:0;transform-origin:right center;transform:skewY(-30deg)}
.stname{font-family:var(--font-b);font-weight:600;fill:#8A7C70;letter-spacing:.14em;pointer-events:none}
.title{position:absolute;left:14px;top:14px;pointer-events:none;background:#BF6A45;color:#FBF6EE;padding:10px 16px 11px;border:2px solid #BF6A45;
  outline:2px solid #BF6A45;outline-offset:3px;box-shadow:inset 0 0 0 2px #F3EDE2}
.title b{display:block;font-family:var(--font-d);font-weight:600;font-size:clamp(15px,2.3vw,24px);letter-spacing:.02em;line-height:1.1}
.title span{display:block;font-size:12px;margin-top:3px;opacity:.92}
.compass{position:absolute;right:14px;top:14px;width:44px;height:44px;pointer-events:none}
.time{position:absolute;left:14px;right:70px;bottom:14px;background:var(--pill-bg);border:1px solid var(--line);border-radius:18px;padding:10px 14px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.trow{display:flex;align-items:center;gap:12px;min-width:0}
.trow button{flex:none;width:34px;height:34px;border-radius:50%;border:0;background:var(--patina);color:#fff;font-size:14px;cursor:pointer}
.yr{flex:none;font-family:var(--font-d);font-weight:600;font-size:22px;min-width:3.2ch;font-variant-numeric:tabular-nums}
#yr-in{flex:1;min-width:0;accent-color:var(--copper)}
.ticks{display:flex;flex-wrap:wrap;gap:4px}
.ticks button{font:inherit;font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
.cap{font-size:13px;min-height:2.6em}
.cap b{color:var(--copper)}
.tools{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px}
.tools button{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:18px;cursor:pointer;display:grid;place-items:center}
button:focus-visible{outline:2px solid #5B8DEF;outline-offset:2px}
aside{min-width:0;min-height:0;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
.chip i{width:10px;height:10px;border-radius:50%;display:block}
.chip[aria-pressed="false"]{opacity:.45}
.list{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:2px;padding-right:2px}
.item{font:inherit;text-align:left;border:0;background:transparent;color:var(--ink);padding:8px 10px;border-radius:12px;display:flex;gap:10px;align-items:center;cursor:pointer;min-width:0}
.item:hover{background:var(--chip)}
.item[aria-current="true"]{background:var(--chip);box-shadow:inset 3px 0 0 var(--copper)}
.item.dim{opacity:.4;cursor:default}
.item i{flex:none;width:10px;height:10px;border-radius:50%}
.item span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:8px;max-height:46%;overflow:auto}
.card .k{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);font-weight:600}
.card h2{margin:0;font-family:var(--font-d);font-weight:500;font-size:18px;line-height:1.2;text-wrap:balance}
.card p{margin:0}
.card .why{color:var(--soft);font-size:14px}
.card a{color:var(--patina-ink);font-weight:500}
.note{font-size:12px;color:var(--soft)}
@media (max-width:820px){
  body{overflow:auto}
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:64vh auto}
  .list{max-height:220px;flex:none}
  .card{max-height:none}
}
@media (prefers-reduced-motion:reduce){.bg,.obj{transition:none}.obj.sel .plot{animation:none}}
</style>

<div class="app">
  <div class="stage" id="stage">
    <svg id="map" role="img" aria-label="Изометрическая карта Верхней Пышмы" xmlns="http://www.w3.org/2000/svg">
      <defs><clipPath id="clip"><polygon id="clip-poly" points=""/></clipPath></defs>
      <g id="slab"></g>
      <g id="ground" clip-path="url(#clip)"></g>
      <g id="roads" clip-path="url(#clip)"></g>
      <g id="stage-objs"></g>
      <g id="names"></g>
      <g id="labels"></g>
    </svg>
    <div class="title"><b>ВЕРХНЯЯ ПЫШМА</b><span>Медная столица Урала · карта по границам города</span></div>
    <svg class="compass" viewBox="-22 -22 44 44" aria-label="Север"><g transform="rotate(60)"><path d="M0-17 6 4 0 0-6 4z" fill="#BF6A45" stroke="#2A2320" stroke-width="1.6" stroke-linejoin="round"/></g><text x="12" y="-12" font-size="11" font-weight="600" fill="#2A2320" font-family="Onest,sans-serif">С</text></svg>
    <div class="sbar"><i id="sbar" style="width:62px"></i><span>1 км</span></div>
    <div class="time" id="time">
      <div class="trow"><button id="t-play" aria-label="Запустить время">▶</button><span class="yr" id="yr">2026</span><input type="range" id="yr-in" min="1850" max="2026" step="1" value="2026" aria-label="Год"></div>
      <div class="ticks" id="ticks"></div>
      <div class="cap" id="cap"></div>
    </div>
    <div class="tools">
      <button id="b-in" aria-label="Приблизить">+</button>
      <button id="b-out" aria-label="Отдалить">−</button>
      <button id="b-reset" aria-label="Сбросить вид" title="Сбросить вид">⌂</button>
    </div>
  </div>
  <aside>
    <div class="filters" id="filters"></div>
    <div class="list" id="list"></div>
    <div class="card" id="card"></div>
  </aside>
</div>

  let s=poly(L,c[1],st,sw)+poly(R,c[2],st,sw)+poly(T,c[0],st,sw);
  if(o.win){const cols=Math.max(2,Math.round(w*14)),rows=Math.max(1,Math.round(h/13));

const objLayer=$('#stage-objs'),slab=$('#slab'),ground=$('#ground'),roads=$('#roads'),names=$('#names'),labels=$('#labels'),svg=$('#map'),stageEl=$('#stage');
const PL=DATA.poly;
const sxs=PL.map(p=>P(p[0],p[1],0)[0]),sys=PL.map(p=>P(p[0],p[1],0)[1]);
const sxMin=Math.min(...sxs),sxMax=Math.max(...sxs),syMin=Math.min(...sys),syMax=Math.max(...sys);
$('#clip-poly').setAttribute('points',pts(PL.map(p=>P(p[0],p[1],0))));
(function(){
  let area=0;for(let i=0;i<PL.length;i++){const a=PL[i],b=PL[(i+1)%PL.length];area+=a[0]*b[1]-b[0]*a[1];}
  const sgn=area>0?1:-1,T=14,n=PL.length;let sides='',edge='';
  for(let i=0;i<n;i++){const a=PL[i],b=PL[(i+1)%n],ex=b[0]-a[0],ey=b[1]-a[1],L=Math.hypot(ex,ey)||1,nx=sgn*ey/L,ny=-sgn*ex/L;
    if(nx+ny>0){const fill=ny>nx?'#D8CFC0':'#C4BAA9';
      sides+='<polygon points="'+pts([P(a[0],a[1],0),P(b[0],b[1],0),P(b[0],b[1],-T),P(a[0],a[1],-T)])+'" fill="'+fill+'" stroke="'+fill+'" stroke-width=".8"/>';
      edge+='M'+pts([P(a[0],a[1],-T)]).replace(',',' ')+' L'+pts([P(b[0],b[1],-T)]).replace(',',' ')+' ';}}
  slab.innerHTML=sides+'<polygon points="'+pts(PL.map(p=>P(p[0],p[1],0)))+'" fill="#F6F1E8" stroke="'+INK+'" stroke-width="2.4" stroke-linejoin="round"/><path d="'+edge+'" fill="none" stroke="'+INK+'" stroke-width="2.4" stroke-linejoin="round"/>';
})();
const proj=a=>a.map(p=>P(p[0],p[1],0));
const pathOf=a=>'M'+proj(a).map(p=>f(p[0])+' '+f(p[1])).join(' L');
(function(){ // леса и вода
  let s='';DATA.forest.forEach(p=>{s+=poly(proj(p),'#DCEBD2','#A9CBA0',1);});
  DATA.water.forEach(p=>{s+=poly(proj(p),'#BFE8DB','#5FB9A0',1.3);});
  ground.innerHTML=s;
})();
(function(){ // дороги
  let s='';
  DATA.auto.forEach(l=>{s+='<path d="'+pathOf(l)+'" stroke="#E2D9CA" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="'+pathOf(l)+'" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>';});
  const M=DATA.main,road=(a,w,c,e)=>'<path d="'+pathOf(a)+'" stroke="'+e+'" stroke-width="'+(w+3)+'" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="'+pathOf(a)+'" stroke="'+c+'" stroke-width="'+w+'" stroke-linecap="round" stroke-linejoin="round" fill="none"/>';
  s+=road(DATA.krivo,6.5,'#FFFFFF','#D4C9B8')+road(M.svar,6.5,'#FFFFFF','#D4C9B8')+road(M.petrova,7.5,'#FFFFFF','#CFC4B3');
  [M.serov,M.ekad,M.obhod].forEach(a=>{s+=road(a,8,'#FFFFFF','#8A7C70');});
  s+='<path d="'+pathOf(M.avenue)+'" stroke="#9E5535" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="'+pathOf(M.avenue)+'" stroke="#BF6A45" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="'+pathOf(M.avenue)+'" stroke="#F4C9B3" stroke-width="1.4" stroke-dasharray="7 7" fill="none"/>';
  roads.innerHTML=s;
  // названия
  const nm=(txt,pt,ang,main,sz)=>{const p=P(pt[0],pt[1],0);const t=el('text',{x:f(p[0]),y:f(p[1]+3),'text-anchor':'middle',transform:'rotate('+ang+' '+f(p[0])+' '+f(p[1])+')','class':'stname','data-sz':sz||10,'data-main':main?1:0},txt);if(main)t.style.fill='#FBF6EE';names.appendChild(t);};
  const mid=(a,i)=>a[i];
  nm('УСПЕНСКИЙ ПРОСПЕКТ',mid(M.avenue,4),28,1,9);nm('СЕРОВСКИЙ ТРАКТ',mid(M.serov,2),-60,0,9);nm('ЕКАД',mid(M.ekad,6),-6,0,9);
  nm('ОБХОД',mid(M.obhod,1),50,0,9);nm('УЛ. ПЕТРОВА',mid(M.petrova,2),60,0,9);nm('УЛ. СВАРЩИКОВ',mid(M.svar,1),-62,0,8);nm('УЛ. КРИВОУСОВА',DATA.krivo[2],56,0,8);
  nm('болото Молебское',pxk(225,388),0,0,10);
  nm('р. Пышма',pxk(165,347),22,0,9);
})();
function pxkAdd(){}
// слой с глубиной
const items=[];
CITY.forEach(it=>{const sh=SHAPES[it.shape]();const g0=P(it.k[0],it.k[1],0);
  // форма строится вокруг (0,0); сдвигаем в точку и масштабируем
  const tx=g0[0],ty=g0[1];
  const g=el('g',{'class':'obj','data-id':it.id},'<g transform="translate('+f(tx)+' '+f(ty)+') scale('+(it.s*1.7)+')">'+sh.svg+'</g>');
  it.anchor=[tx,ty-sh.a[2]*it.s*1.7-6];it.ground=[tx,ty];
  items.push({d:it.k[0]+it.k[1]+.02,g});});
const bg=DATA.bld.map((b,i)=>{const col=b[5]<.16?['#FBEAE0','#EBCDBB','#D9B39B']:COL.bgc;
  const g=el('g',{'class':'bg off'},box(b[0],b[1],b[2],b[3],b[4]*.4,0,col,{st:'#A89D90',sw:.8}));items.push({d:b[0]+b[1]+(b[2]+b[3])/2,g});return {g,fr:b[5]};});
DATA.trees.forEach(t=>{const g=el('g',{'class':'tr'},tree(t[0],t[1],t[2]*.42,'#9ED3A0',1.2));items.push({d:t[0]+t[1],g});});
items.sort((a,b)=>a.d-b.d).forEach(i=>objLayer.appendChild(i.g));

/* ---------- подписи ---------- */
const labEls={};
function wrap(t){const w=t.split(' '),out=[];let c='';w.forEach(x=>{if((c+' '+x).trim().length>17&&c){out.push(c);c=x;}else c=(c+' '+x).trim();});if(c)out.push(c);return out;}
CITY.forEach(it=>{
  const g=el('g',{'class':'lab','data-id':it.id,display:'none'});
  g.appendChild(el('path',{fill:'none',stroke:'#2A2320','stroke-width':1.3,'stroke-dasharray':'4 4'}));
  g.appendChild(el('circle',{fill:'#2A2320'}));
  g.appendChild(el('g',{fill:CATS[it.cat].css,'class':'ico'},ICON[it.cat]));
  const tl=el('text',{});wrap(it.name).forEach(ln=>tl.appendChild(el('tspan',{},ln)));g.appendChild(tl);
  labels.appendChild(g);labEls[it.id]=g;});

/* ---------- вид ---------- */
const slabW=sxMax-sxMin;
let view={cx:(sxMin+sxMax)/2,cy:(syMin+syMax)/2,w:1700},goal=null,scale=1,layoutQ=false,firstRO=true;
function rect(){return stageEl.getBoundingClientRect();}
function defaultView(){const r=rect(),cx=(sxMin+sxMax)/2,cy=(syMin+syMax)/2+20;
  if(r.width<640){const sc=(r.width-24)/slabW;return {cx,cy,w:r.width/sc};}
  const sc=Math.min(.9,Math.max(.3,(r.width-2*225)/slabW));return {cx,cy,w:r.width/sc};}
function applyView(){const r=rect(),h=view.w*r.height/r.width;
  svg.setAttribute('viewBox',f(view.cx-view.w/2)+' '+f(view.cy-h/2)+' '+f(view.w)+' '+f(h));scale=r.width/view.w;scheduleLayout();
  const sb=$('#sbar');if(sb){const L=K*scale;sb.style.width=f(L)+'px';}}
function scheduleLayout(){if(layoutQ)return;layoutQ=true;requestAnimationFrame(()=>{layoutQ=false;layout();});}
function zoomAt(f2,px,py){const r=rect(),h=view.w*r.height/r.width,wx=view.cx-view.w/2+px/scale,wy=view.cy-h/2+py/scale;
  const nw=Math.min(3200,Math.max(260,view.w*f2)),ns=r.width/nw,nh=nw*r.height/r.width;
  view.w=nw;view.cx=wx-px/ns+nw/2;view.cy=wy-py/ns+nh/2;goal=null;applyView();}
const ptrs=new Map();let moved=0,pinch=0;
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;pinch=0;svg.classList.add('drag');});
svg.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
  if(ptrs.size===2){const a=[...ptrs.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),r=rect();if(pinch)zoomAt(pinch/d,(a[0].x+a[1].x)/2-r.left,(a[0].y+a[1].y)/2-r.top);pinch=d;return;}
  if(moved>4){view.cx-=dx/scale;view.cy-=dy/scale;goal=null;applyView();}});
function endp(e){ptrs.delete(e.pointerId);svg.classList.remove('drag');pinch=0;
  if(e.type==='pointerup'&&moved<6){const t=document.elementFromPoint(e.clientX,e.clientY),n=t&&t.closest&&t.closest('[data-id]');if(n)select(n.getAttribute('data-id'));}}
svg.addEventListener('pointerup',endp);svg.addEventListener('pointercancel',endp);
svg.addEventListener('wheel',e=>{e.preventDefault();const r=rect();zoomAt(Math.exp(e.deltaY*.0012),e.clientX-r.left,e.clientY-r.top);},{passive:false});
new ResizeObserver(()=>{if(firstRO){firstRO=false;view=defaultView();}applyView();}).observe(stageEl);
function animTick(){if(goal){const k=reduce?1:.16;view.cx+=(goal.cx-view.cx)*k;view.cy+=(goal.cy-view.cy)*k;view.w+=(goal.w-view.w)*k;applyView();
  if(Math.abs(goal.cx-view.cx)+Math.abs(goal.cy-view.cy)+Math.abs(goal.w-view.w)<1)goal=null;}requestAnimationFrame(animTick);}
requestAnimationFrame(animTick);

function layout(){
  const u=1/scale,showAll=rect().width>=640&&scale>=.36;
  const vis=CITY.filter(it=>it.alive!==false&&filt[it.cat]&&(showAll||it.id===selected));
  CITY.forEach(it=>{if(!vis.includes(it))labEls[it.id].setAttribute('display','none');});
  const gap=31*u,rows={L:[],R:[]},XL=sxMin-20*u,XR=sxMax+20*u,lo=syMin-60,hi=syMax+10;
  vis.forEach(it=>{const a=it.anchor;rows[a[0]<(sxMin+sxMax)/2?'L':'R'].push({it,ax:a[0],ay:a[1]});});
  ['L','R'].forEach(side=>{const rs=rows[side].sort((p,q)=>p.ay-q.ay);let prev=-1e9;
    rs.forEach(r=>{r.ly=Math.max(r.ay-10*u,prev+gap,lo);prev=r.ly;});
    if(rs.length&&rs[rs.length-1].ly>hi){const sh=rs[rs.length-1].ly-hi;rs.forEach(r=>r.ly-=sh);let t=lo;rs.forEach(r=>{if(r.ly<t)r.ly=t;t=r.ly+gap;});}
    rs.forEach(r=>{const g=labEls[r.it.id],sg=side==='L'?-1:1,lx=sg>0?XR:XL,ico=22*u;
      g.removeAttribute('display');g.classList.toggle('sel',r.it.id===selected);
      const path=g.querySelector('path'),dot=g.querySelector('circle'),icn=g.querySelector('.ico'),tx=g.querySelector('text');
      path.setAttribute('d','M'+f(r.ax)+','+f(r.ay)+' C'+f(r.ax)+','+f((r.ay+r.ly)/2)+' '+f(lx-sg*60*u)+','+f(r.ly)+' '+f(lx)+','+f(r.ly));
      path.setAttribute('stroke-width',1.3*u);path.setAttribute('stroke-dasharray',(4*u)+' '+(4*u));
      dot.setAttribute('cx',f(r.ax));dot.setAttribute('cy',f(r.ay));dot.setAttribute('r',3.2*u);
      icn.setAttribute('transform','translate('+f(sg>0?lx+6*u:lx-6*u-ico)+','+f(r.ly-ico/2)+') scale('+(ico/24)+')');
      const tsx=f(sg>0?lx+6*u+ico+7*u:lx-6*u-ico-7*u),spans=tx.querySelectorAll('tspan');tx.setAttribute('x',tsx);tx.setAttribute('y',f(r.ly+5*u-(spans.length-1)*7.5*u));
      spans.forEach((sp,i)=>{sp.setAttribute('x',tsx);sp.setAttribute('dy',i?14*u:0);});
      tx.setAttribute('text-anchor',sg>0?'start':'end');tx.setAttribute('font-size',12.5*u);tx.setAttribute('stroke-width',3.4*u);});});
  names.querySelectorAll('text').forEach(t=>{const sz=+t.getAttribute('data-sz');t.setAttribute('font-size',sz*Math.max(u,1.3)*.9);t.style.display=scale<.3?'none':'';});
}

/* ---------- интерфейс ---------- */
const filt={cu:true,faith:true,nat:true,cult:true};let selected=null,year=2026,playing=false,playAcc=0;
const fEl=$('#filters'),lEl=$('#list'),cEl=$('#card');
Object.keys(CATS).forEach(k=>{const b=document.createElement('button');b.className='chip';b.setAttribute('aria-pressed','true');
  b.innerHTML='<i style="background:'+CATS[k].css+'"></i>'+CATS[k].n;
  b.onclick=()=>{filt[k]=!filt[k];b.setAttribute('aria-pressed',String(filt[k]));refresh();};fEl.appendChild(b);});
function mk(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x)e.textContent=x;return e;}
function refresh(){
  CITY.forEach(it=>{const g=objLayer.querySelector('[data-id="'+it.id+'"]');const on=filt[it.cat]&&it.alive!==false;g.classList.toggle('off',!on);g.classList.toggle('sel',on&&it.id===selected);});
  lEl.innerHTML='';
  CITY.forEach(it=>{if(!filt[it.cat])return;const ok=it.alive!==false,b=mk('button','item'+(ok?'':' dim'));if(!ok)b.disabled=true;
    b.innerHTML='<i style="background:'+CATS[it.cat].css+'"></i><span></span>';b.querySelector('span').textContent=it.name;
    b.onclick=()=>select(it.id);if(it.id===selected)b.setAttribute('aria-current','true');lEl.appendChild(b);});
  layout();}
function renderCard(it){cEl.innerHTML='';
  if(!it){cEl.append(mk('div','k','Как читать карту'),mk('p','','Граница города, леса, водоёмы и главные улицы сняты со скриншота Яндекс.Карт. Объекты стоят по координатам из каталога. Здания придуманы: они показывают рост города по годам, а не реальные дома.'),mk('p','note','Масштаб оценён по двум ориентирам, точность около 5–10%. Положение улиц ±200–300 м. Масштабная линейка вверху справа.'));return;}
  const a=mk('a','',it.src[0]+' ↗');a.href=it.src[1];a.target='_blank';a.rel='noopener noreferrer';
  cEl.append(mk('div','k',CATS[it.cat].n),mk('h2','',it.name),mk('p','',it.text),mk('p','why','Для визуала: '+it.why),a);
  const a2=mk('a','','Показать в сети связей ↗');a2.href='https://claude.ai/artifact/9oxfdcVzhiECgLDgdUcj3L#'+it.id;a2.target='_blank';a2.rel='noopener noreferrer';a2.addEventListener('click',ev=>{if(parent!==window){ev.preventDefault();parent.postMessage({vp:'goto',tab:'net',id:it.id},'*');}});cEl.appendChild(a2);
  if(it.note)cEl.appendChild(mk('p','note',it.note));}
function select(id){const it=CITY.find(x=>x.id===id);if(!it||it.alive===false)return;selected=id;renderCard(it);refresh();
  goal={cx:it.ground[0],cy:it.ground[1]-20,w:Math.min(view.w,950)};
  const c=lEl.querySelector('[aria-current="true"]');if(c)c.scrollIntoView({block:'nearest'});}
function resetView(){selected=null;renderCard(null);goal=defaultView();refresh();}
$('#b-in').onclick=()=>{const r=rect();zoomAt(.75,r.width/2,r.height/2);};
$('#b-out').onclick=()=>{const r=rect();zoomAt(1.33,r.width/2,r.height/2);};
$('#b-reset').onclick=resetView;

const yIn=$('#yr-in'),yEl=$('#yr'),capEl=$('#cap'),tPlay=$('#t-play'),tk=$('#ticks');
[1854,1934,1946,2000,2025].forEach(y=>{const b=mk('button','',String(y));b.onclick=()=>{stop();setYear(y);};tk.appendChild(b);});
function stop(){playing=false;tPlay.textContent='▶';}
function frac(y){for(let i=1;i<NBF.length;i++){if(y<=NBF[i][0]){const a=NBF[i-1],b=NBF[i];return a[1]+(b[1]-a[1])*(y-a[0])/(b[0]-a[0]);}}return 1;}
function setYear(y){year=Math.round(y);yIn.value=year;yEl.textContent=year;
  const fr=frac(year);bg.forEach(b=>b.g.classList.toggle('off',!(b.fr<fr)));
  let ev=EVENTS[0];EVENTS.forEach(e=>{if(e[0]<=year)ev=e;});capEl.innerHTML='<b>'+ev[0]+'</b> · '+ev[1];
  let ch=false;CITY.forEach(it=>{const a=year>=it.year;if((it.alive!==false)!==a){it.alive=a;ch=true;}});
  if(ch){const so=CITY.find(x=>x.id===selected);if(so&&so.alive===false){selected=null;renderCard(null);}refresh();}}
yIn.addEventListener('input',()=>{stop();setYear(+yIn.value);});
tPlay.onclick=()=>{playing=!playing;tPlay.textContent=playing?'❚❚':'▶';if(playing&&year>=2026)setYear(1850);};
let t0=performance.now();
(function loop(now){const dt=Math.min(.05,(now-t0)/1000);t0=now;
  if(playing){playAcc+=dt*14;if(playAcc>=1){const st=Math.floor(playAcc);playAcc-=st;if(year>=2026)stop();else setYear(Math.min(2026,year+st));}}
  requestAnimationFrame(loop);})(t0);
CITY.forEach(it=>{it.alive=true;});
view=defaultView();applyView();setYear(2026);renderCard(null);refresh();
function fromHash(){let id='';try{id=decodeURIComponent((location.hash||'').slice(1));}catch(e){}if(CITY.find(x=>x.id===id)){setYear(2026);select(id);}}
addEventListener('hashchange',fromHash);addEventListener('message',e=>{const d=e.data;if(d&&d.vp==='select'){location.hash=d.id;fromHash();}});setTimeout(fromHash,80);
})();

</script>
