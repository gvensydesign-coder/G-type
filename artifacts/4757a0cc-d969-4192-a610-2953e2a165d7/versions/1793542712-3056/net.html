}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --patina:#4DBFA3; --patina-ink:#7FD9C0; --copper:#D58A6C; --pill-bg:rgba(42,36,32,.88);

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.45;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px}
.stage{position:relative;min-width:0;min-height:0;border-radius:24px;overflow:hidden;border:1px solid var(--line);

.title{background:#BF6A45;color:#FBF6EE;padding:8px 14px 9px;border-radius:14px}

.seg button{font:inherit;font-size:13px;font-weight:500;border:0;background:transparent;color:var(--ink);padding:7px 14px;border-radius:12px;cursor:pointer;transition:background .2s,color .2s}

.status.on{opacity:1}
.tip{position:absolute;pointer-events:none;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:8px 11px;font-size:12.5px;max-width:230px;box-shadow:0 6px 20px var(--shadow);opacity:0;transition:opacity .12s;z-index:3}

.tip span{color:var(--soft)}

button:focus-visible,input:focus-visible{outline:2px solid #5B8DEF;outline-offset:2px}
aside{min-width:0;min-height:0;display:flex;flex-direction:column;gap:14px;overflow:auto;scrollbar-width:none}

.lbl{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);font-weight:600;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center}

.results{display:flex;flex-direction:column;gap:2px;margin-top:6px}

.card .k i{width:10px;height:10px;border-radius:50%}
.card h2{margin:0;font-family:var(--font-d);font-weight:500;font-size:17px;line-height:1.22;text-wrap:balance}
.card p{margin:0}

.meta{display:flex;flex-wrap:wrap;gap:6px}

.row{display:flex;gap:8px;flex-wrap:wrap}
.act{font:inherit;font-size:13px;font-weight:600;border:0;border-radius:12px;padding:8px 13px;background:var(--copper);color:#fff;cursor:pointer}

.step{display:flex;align-items:center;gap:8px}

.show small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.show b{display:block;font:600 17px/1.25 Unbounded,Onest,sans-serif;margin:4px 0}
.show p{margin:0;font-size:13.5px;line-height:1.45;opacity:.92}

.show .bar i{display:block;height:100%;width:0;background:var(--accent,#4DBFA3)}
.show button{position:absolute;right:10px;top:8px;background:none;border:0;color:inherit;font-size:12px;opacity:.8;cursor:pointer;padding:6px}
.cond{position:absolute;left:16px;bottom:74px;font-size:11.5px;color:var(--soft);pointer-events:none}
.imgslot img{width:100%;border-radius:12px;display:block;margin-bottom:8px}
.drop{display:grid;place-items:center;border:1.5px dashed var(--line);border-radius:14px;padding:13px;color:var(--soft);font-size:13px;cursor:pointer;text-align:center}
.drop:hover,.drop.over{border-color:var(--patina);color:var(--patina-ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--chip);border-radius:14px;padding:9px 10px}
.stats b{display:block;font-family:var(--font-d);font-weight:600;font-size:20px}
.stats span{font-size:11.5px;color:var(--soft)}
.bars{display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.bars div{display:grid;grid-template-columns:128px 1fr 22px;gap:8px;align-items:center}
.bars span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars em{display:block;height:7px;border-radius:4px}
.hist{display:flex;align-items:flex-end;gap:3px;height:42px}
.hist i{flex:1;background:#5B8DEF;border-radius:3px 3px 0 0;min-height:3px;opacity:.85}
.hl{display:flex;justify-content:space-between;font-size:11px;color:var(--soft)}
@media (max-width:820px){
  body{overflow:auto}
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:68vh auto}
  aside{overflow:visible}
  .title span{display:none}
  .seg button{padding:7px 10px}
  .status{top:112px}
  .spreadbox{top:112px}
}

    ctx.fillStyle=g;ctx.beginPath();ctx.arc(pc.x,pc.y,r*pc.s,0,6.2832);ctx.fill();
    ctx.strokeStyle=rgba(col,.45);ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(pc.x,pc.y,r*pc.s,0,6.2832);ctx.stroke();

    const top=proj([c[0],c[1]+r+18,c[2]]);if(top)pill(TYPES[t].n.toUpperCase()+' · '+TCOUNT[t],top.x,top.y,col,true);});}

    const ang=chainA(ci)-.45,lp=proj([Math.cos(ang)*(CH_R+34),y,Math.sin(ang)*(CH_R+34)]);if(lp&&(!chainSel||chainSel===c.id))pill(c.n,lp.x,lp.y,c.c,true);});}
function labels(list,hs){
  const cand=[];const hl=selected||hover,tn=tourNodeId();
  list.forEach(n=>{if(n.alpha<.5||n.type==='time')return;let pr=0;
    if(n.id===selected||n.id===tn)pr=100;else if(n.id===hover)pr=90;else if(pathIds&&hs.has(n.id))pr=80;else if(hs&&hs.has(n.id)&&(hl||chainSel||qSet||dispOn))pr=60;
    else if(hs)return;
    else if(n.type==='mat'||n.type==='code')pr=40;else if(n.deg>=4)pr=30;else pr=10;
    if(pr===10&&n.p.s<1.12)return;
    cand.push([pr,n]);});
  cand.sort((a,b)=>b[0]-a[0]||b[1].deg-a[1].deg||a[1].p.d-b[1].p.d);
  const boxes=[];let cnt=0;
  // занимаем место под годовые пилюли
  list.forEach(n=>{if(n.type==='time'&&n.p&&n.alpha>.5&&(!hs||hs.has(n.id)))boxes.push([n.p.x-n.hw,n.p.y-9,n.p.x+n.hw,n.p.y+9]);});
  cand.forEach(([pr,n])=>{if(cnt>(hl||chainSel||qSet||dispOn||pathIds?48:26))return;const q=n.p,fs=Math.round(Math.max(11,Math.min(14,12.5*Math.sqrt(q.s))));ctx.font=(pr>=30?'600 ':'500 ')+fs+'px Onest,system-ui,sans-serif';
    const tw=ctx.measureText(n.name).width,r=(n.hw||nodeR(n)*q.s),x=q.x+r+7,y=q.y+4,bx=[x-2,y-fs,x+tw+2,y+4];
    if(pr<90&&boxes.some(b=>!(bx[2]<b[0]||bx[0]>b[2]||bx[3]<b[1]||bx[1]>b[3])))return;
    boxes.push(bx);cnt++;ctx.globalAlpha=Math.min(1,n.alpha)*(pr<=10?Math.max(.45,fog(q.d)):1);
    ctx.lineWidth=4;ctx.strokeStyle=css['--halo'];ctx.lineJoin='round';ctx.strokeText(n.name,x,y);ctx.fillStyle=(n.id===selected||n.id===tn)?css['--copper']:css['--ink'];ctx.fillText(n.name,x,y);ctx.globalAlpha=1;});}

  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);lastInput=performance.now();

  if(moved>3){cam.yaw+=dx*.008;cam.pitch=Math.max(-1.45,Math.min(1.45,cam.pitch+dy*.008));cam.vy=dx*.0016;cam.vp=dy*.0016;}});
function endp(e){const had=ptrs.has(e.pointerId);ptrs.delete(e.pointerId);cv.classList.remove('drag');pinch=0;
  if(had&&e.type==='pointerup'&&moved<6&&ptrs.size===0){const [x,y]=rel(e),h=pick(x,y);cam.vy=cam.vp=0;
    if(h){if(pathMode&&selected&&h.id!==selected&&!h.kid&&!byId[selected].kid)findPath(selected,h.id);else if(e.shiftKey&&selected&&h.id!==selected)findPath(selected,h.id);else select(h.id);}

  c.appendChild(row);
  const nb=ADJ[n.id];if(nb.length){c.append(mk('div','lbl','Связи · пунктир — моя гипотеза'));const r=mk('div','rel');nb.forEach(i=>{const c2=chip(i);if(EK[n.id+'|'+i]==='h'){c2.style.borderStyle='dashed';c2.title='Связь — моя гипотеза';}r.appendChild(c2);});c.appendChild(r);}
  const ch=(chainOf[n.id]||[]).map(id=>CHAINS.find(x=>x.id===id));if(ch.length){c.append(mk('div','lbl','В цепях'));const r=mk('div','rel');ch.forEach(x=>{const b=mk('button','',x.n);const d=mk('i');d.style.background=x.c;b.prepend(d);b.onclick=()=>{setChain(x.id);};r.appendChild(b);});c.appendChild(r);}
  if(n.src){const a=mk('a','',n.src[0]+' ↗');a.href=n.src[1];a.target='_blank';a.rel='noopener noreferrer';c.appendChild(a);}
  if(MAPIDS.has(n.id)){const a2=mk('a','','Показать на карте ↗');a2.href=MAPURL+'#'+n.id;a2.target='_blank';a2.rel='noopener noreferrer';a2.addEventListener('click',ev=>{if(parent!==window){ev.preventDefault();parent.postMessage({vp:'goto',tab:'map',id:n.id},'*');}});c.appendChild(a2);}
  if(n.note)c.appendChild(mk('p','note',n.note));
  c.appendChild(imgSlot(n));}
const MAPURL='https://claude.ai/artifact/GsqNQFzgZYtFvB6vgTwUor';
const MAPIDS=new Set(['plant','museum','agri','mosque','hram','dk','sport','stela','park','miners','square','complex','theatrum','uralredmet','loco','rowan']);
function imgKey(id){return 'vpnet:img:'+id;}
function imgGet(id){try{return localStorage.getItem(imgKey(id));}catch(e){return null;}}
function imgSet(id,v){try{if(v)localStorage.setItem(imgKey(id),v);else localStorage.removeItem(imgKey(id));return true;}catch(e){return false;}}
function imgSlot(n){const w=mk('div','imgslot'),cur=imgGet(n.id);
  if(cur){const im=document.createElement('img');im.src=cur;im.alt='Ваше изображение: '+n.name;const rm=mk('button','act alt','Убрать фото');rm.onclick=()=>{imgSet(n.id,null);renderCard();};w.append(im,rm);return w;}
  const lab=document.createElement('label');lab.className='drop';lab.append(mk('span','','Добавить своё фото или эскиз'));const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.hidden=true;lab.appendChild(inp);
  const take=f=>{if(!f)return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,560/im.width),cc=document.createElement('canvas');cc.width=Math.round(im.width*k);cc.height=Math.round(im.height*k);cc.getContext('2d').drawImage(im,0,0,cc.width,cc.height);if(!imgSet(n.id,cc.toDataURL('image/jpeg',.82)))say('Не удалось сохранить: нет места в браузере',3000);renderCard();};im.src=fr.result;};fr.readAsDataURL(f);};
  inp.onchange=()=>take(inp.files[0]);
  ['dragover','dragenter'].forEach(ev=>lab.addEventListener(ev,e=>{e.preventDefault();lab.classList.add('over');}));
  ['dragleave','drop'].forEach(ev=>lab.addEventListener(ev,e=>{e.preventDefault();lab.classList.remove('over');if(ev==='drop')take(e.dataTransfer.files[0]);}));
  w.append(lab,mk('p','note','Фото хранится только в вашем браузере и не попадает к другим.'));return w;}
$('#b-in').onclick=()=>{cam.tdist=Math.max(260,cam.tdist*.8);};
$('#b-out').onclick=()=>{cam.tdist=Math.min(1900,cam.tdist*1.25);};
$('#b-spin').onclick=e=>{autoSpin=!autoSpin;e.currentTarget.setAttribute('aria-pressed',String(autoSpin));};
$('#b-spin').setAttribute('aria-pressed',String(autoSpin));
$('#b-reset').onclick=()=>{stopTour();clearPath();selected=null;setChain(null);cam.yaw=.6;cam.pitch=.35;FOC();cam.tdist=mode==='sph'?1060:mode==='net'?720:900;say('');renderCard();};
const yIn=$('#yr-in'),yEl=$('#yr'),tPlay=$('#t-play');
function setYear(y){yearLimit=y;yIn.value=y;yEl.textContent=y>=2026?'2026':y;if(selected&&byId[selected].year>y)select(null);}
yIn.addEventListener('input',()=>{playing=false;tPlay.textContent='▶';setYear(+yIn.value);});
tPlay.onclick=()=>{playing=!playing;tPlay.textContent=playing?'❚❚':'▶';if(playing&&yearLimit>=2026)setYear(1810);};
setInterval(()=>{if(playing){if(yearLimit>=2026){playing=false;tPlay.textContent='▶';}else setYear(Math.min(2026,yearLimit+2));}},60);

/* ---------- Показ ---------- */
let showOn=false,showT=0,showSeq=[],showI=0,showStart=0,showStepMs=2300;
function firstSent(t){const m=t.match(/^.*?[.!?](\s|$)/);return (m?m[0]:t).trim();}
function showBuild(){showSeq=[];CHAINS.forEach(c=>c.l.forEach((id,i)=>showSeq.push({c,id,i,len:c.l.length})));}
function showStep(){
  if(showI>=showSeq.length){showStop(true);return;}
  const st=showSeq[showI],n=byId[st.id];
  if(showI===0||showSeq[showI-1].c!==st.c){if(mode!=='chn')setModeQuiet('chn');setChainQuiet(st.c.id);}
  cam.yaw+=.5;focusOn(n);cam.tdist=Math.min(cam.tdist,560);
  $('#shS').textContent='Цепь '+(CHAINS.indexOf(st.c)+1)+' из '+CHAINS.length+' · '+st.c.n+' · '+(st.i+1)+'/'+st.len;
  $('#shT').textContent=n.name+(n.year?' · '+n.year:'');
  $('#shP').textContent=firstSent(n.text);
  $('#show').style.setProperty('--accent',st.c.c);
  showStart=performance.now();
  clearTimeout(showT);showT=setTimeout(()=>{showI++;showStep();},showStepMs);
}
function setModeQuiet(m){const t=showOn;showOn=false;setMode(m);showOn=t;}
function setChainQuiet(id){const t=showOn;showOn=false;setChain(id);showOn=t;}
function showStart_(){showOn=true;showBuild();showI=0;selected=null;clearPath();$('#b-show').setAttribute('aria-pressed','true');$('#show').classList.add('on');spin0=autoSpin;autoSpin=false;showStep();}
let spin0=true;
function showStop(done){if(!showOn)return;showOn=false;clearTimeout(showT);$('#b-show').setAttribute('aria-pressed','false');$('#show').classList.remove('on');autoSpin=spin0;if(done){setMode('net');say('Показ окончен. Крутите схему или выберите цепь.',4000);}}
$('#b-show').onclick=()=>{showOn?showStop(false):showStart_();};
$('#showX').onclick=()=>showStop(false);
addEventListener('keydown',e=>{if(e.key==='Escape'&&showOn)showStop(false);});
['pointerdown','wheel'].forEach(ev=>cv.addEventListener(ev,()=>{if(showOn)showStop(false);},{passive:true}));
(function barLoop(){if(showOn)$('#shB').style.width=Math.min(100,(performance.now()-showStart)/showStepMs*100)+'%';requestAnimationFrame(barLoop);})();
/* ---------- клавиатура и список для скринридера ---------- */
const srEl=$('#srList');
MAIN.slice().sort((a,b)=>a.name.localeCompare(b.name,'ru')).forEach(n=>{const li=document.createElement('li'),b=document.createElement('button');b.textContent=n.name+(n.year?', '+n.year:'')+'. '+firstSent(n.text);b.onclick=()=>select(n.id);li.appendChild(b);srEl.appendChild(li);});
cv.setAttribute('tabindex','0');cv.setAttribute('role','application');cv.setAttribute('aria-label','Объёмная схема связей. Стрелки вращают, плюс и минус приближают, Tab-подобные клавиши: ] следующий узел, [ предыдущий, Enter раскрывает, Esc снимает выбор');
cv.addEventListener('keydown',e=>{
  if(e.key===']'||e.key==='['){const v=MAIN.filter(n=>n.vis).sort((a,b)=>a.name.localeCompare(b.name,'ru'));if(!v.length)return;let i=v.findIndex(n=>n.id===selected);i=e.key===']'?(i+1)%v.length:(i<=0?v.length-1:i-1);select(v[i].id);say(v[i].name+(v[i].year?', '+v[i].year:''),2500);e.preventDefault();}
  if(e.key==='Enter'&&selected&&byId[selected].kids.length){toggle(selected);renderCard();e.preventDefault();}
});

window.__net={showStart:showStart_,showStop,setMode,select,setYear,toggle,setChain,findPath,tourGo,cam,get nodes(){return NODES;}};
setMode('net');renderCard();
function fromHash(){let id='';try{id=decodeURIComponent((location.hash||'').slice(1));}catch(e){}const n=byId[id];if(n){if(n.kid&&!byId[n.parent].exp)toggle(n.parent);select(id);}}
addEventListener('hashchange',fromHash);addEventListener('message',e=>{const d=e.data;if(d&&d.vp==='select'){const k=byId[d.id];if(k){if(k.kid&&!byId[k.parent].exp)toggle(k.parent);select(d.id);}}});setTimeout(fromHash,60);
})();
