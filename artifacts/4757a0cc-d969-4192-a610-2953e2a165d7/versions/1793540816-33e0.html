<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* 3D-граф города: узлы в пространстве, шесть сфер, цепи, время. Свой движок на canvas. */
:root{
  --bg:#FBF6EE; --panel:#FFFFFF; --ink:#2A2320; --soft:#6B5E55; --line:#E6DCCD; --chip:#F3ECE1;
  --patina:#2F9E86; --patina-ink:#1F7A67; --copper:#BF6A45; --pill-bg:rgba(255,255,255,.94);
  --stage-a:#FFFFFF; --stage-b:#F1E8DA; --halo:#FBF6EE; --grid:rgba(42,35,32,.10);
  --font-d:'Unbounded',system-ui,sans-serif; --font-b:'Onest',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1D1917; --panel:#2A2420; --ink:#F4ECE2; --soft:#BDAEA2; --line:#3E352F; --chip:#352D28;
  --patina:#4DBFA3; --patina-ink:#7FD9C0; --copper:#D58A6C; --pill-bg:rgba(42,36,32,.94);
  --stage-a:#2E2723; --stage-b:#171311; --halo:#1D1917; --grid:rgba(244,236,226,.12); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1D1917; --panel:#2A2420; --ink:#F4ECE2; --soft:#BDAEA2; --line:#3E352F; --chip:#352D28;
  --patina:#4DBFA3; --patina-ink:#7FD9C0; --copper:#D58A6C; --pill-bg:rgba(42,36,32,.94);
  --stage-a:#2E2723; --stage-b:#171311; --halo:#1D1917; --grid:rgba(244,236,226,.12); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.45;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px}
.stage{position:relative;min-width:0;min-height:0;border-radius:24px;overflow:hidden;border:1px solid var(--line);
  background:radial-gradient(ellipse at 50% 42%,var(--stage-a),var(--stage-b))}
#cv{display:block;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;outline:none}

.title{position:absolute;left:14px;top:14px;pointer-events:none;background:#BF6A45;color:#FBF6EE;padding:8px 14px 9px;border-radius:14px}

.title span{display:block;font-size:11.5px;margin-top:2px;opacity:.92}
.hint{position:absolute;left:14px;top:74px;font-size:12px;color:var(--soft);pointer-events:none;max-width:230px}
.time{position:absolute;left:14px;right:70px;bottom:14px;background:var(--pill-bg);border:1px solid var(--line);border-radius:18px;padding:9px 14px;display:flex;align-items:center;gap:12px;min-width:0}
.time button{flex:none;width:34px;height:34px;border-radius:50%;border:0;background:var(--patina);color:#fff;font-size:14px;cursor:pointer}
.yr{flex:none;font-family:var(--font-d);font-weight:600;font-size:18px;min-width:6.4ch;font-variant-numeric:tabular-nums}
.yr small{font-family:var(--font-b);font-weight:500;font-size:11px;color:var(--soft);display:block;margin-top:-2px}
#yr-in{flex:1;min-width:0;accent-color:var(--copper)}
.tools{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px}
.tools button{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:17px;cursor:pointer;display:grid;place-items:center}
.tools button[aria-pressed="true"]{background:var(--patina);color:#fff;border-color:var(--patina)}
button:focus-visible{outline:2px solid #5B8DEF;outline-offset:2px}
aside{min-width:0;min-height:0;display:flex;flex-direction:column;gap:12px;overflow:auto;scrollbar-width:none}
aside::-webkit-scrollbar{display:none}
.lbl{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);font-weight:600;margin-bottom:6px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--chip);padding:4px;border-radius:14px}
.seg button{font:inherit;font-size:13px;font-weight:500;border:0;background:transparent;color:var(--ink);padding:7px 4px;border-radius:10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.spread{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--soft);margin-top:8px}
.spread[hidden]{display:none}
.spread input{flex:1;min-width:0;accent-color:var(--copper)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
.chip i{width:10px;height:10px;border-radius:50%;display:block}
.chip[aria-pressed="false"]{opacity:.42}
.chip b{font-weight:600;color:var(--soft)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:15px 16px 14px;display:flex;flex-direction:column;gap:8px}
.card .k{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);font-weight:600;display:flex;gap:8px;align-items:center}
.card .k i{width:10px;height:10px;border-radius:50%}
.card h2{margin:0;font-family:var(--font-d);font-weight:500;font-size:17px;line-height:1.2;text-wrap:balance}
.card p{margin:0}
.card a{color:var(--patina-ink);font-weight:500}
.note{font-size:12px;color:var(--soft)}
.rel{display:flex;flex-wrap:wrap;gap:5px}
.rel button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:3px 9px;cursor:pointer}
.act{font:inherit;font-size:13px;font-weight:600;border:0;border-radius:12px;padding:8px 12px;background:var(--copper);color:#fff;cursor:pointer;align-self:flex-start}
.bars{display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.bars div{display:grid;grid-template-columns:120px 1fr 24px;gap:8px;align-items:center}
.bars span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars em{display:block;height:7px;border-radius:4px}
.hist{display:flex;align-items:flex-end;gap:3px;height:44px}
.hist i{flex:1;background:#5B8DEF;border-radius:3px 3px 0 0;min-height:2px}
.hl{display:flex;justify-content:space-between;font-size:11px;color:var(--soft)}
@media (max-width:820px){
  body{overflow:auto}
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:66vh auto}
  aside{overflow:visible}
  .hint{display:none}
}
</style>

<div class="app">

  TK.forEach(t=>{const c=sphereCenter(t,spread),r=shellR(t)*1.22,pc=proj(c);if(!pc)return;
    ctx.strokeStyle=hexA(TYPES[t].c,.35);ctx.lineWidth=1.2;
    [[0,1,2],[1,2,0],[2,0,1]].forEach(ax=>{ctx.beginPath();let first=true;for(let i=0;i<=40;i++){const th=i/40*6.2832,v=[0,0,0];v[ax[0]]=Math.cos(th)*r;v[ax[1]]=Math.sin(th)*r;const p=proj([c[0]+v[0],c[1]+v[1],c[2]+v[2]]);if(!p)continue;ctx[first?'moveTo':'lineTo'](p.x,p.y);first=false;}ctx.stroke();});
    ctx.fillStyle=hexA(TYPES[t].c,.06);ctx.beginPath();ctx.arc(pc.x,pc.y,r*pc.s,0,6.2832);ctx.fill();
    const top=proj([c[0],c[1]+r+16,c[2]]);if(top){ctx.fillStyle=TYPES[t].c;ctx.font='600 12px Onest,system-ui,sans-serif';ctx.textAlign='center';ctx.fillText(TYPES[t].n.toUpperCase(),top.x,top.y);ctx.textAlign='start';}});}
function labels(list,nb,cs){
  const cand=[];const hi=selected||hover;
  list.forEach(n=>{if(n.alpha<.5)return;let pr=0;
    if(n.id===selected)pr=100;else if(n.id===hover)pr=90;else if(nb&&nb.has(n.id))pr=60;else if(cs&&cs.has(n.id))pr=55;
    else if(n.type==='mat'||n.type==='code')pr=40;else if(!nb&&!cs)pr=10;
    if(nb&&!nb.has(n.id)&&n.id!==hi)return;if(cs&&!cs.has(n.id)&&pr<90)return;
    if(pr===10&&n.p.s<.95&&n.kid)return;
    cand.push([pr,n]);});
  cand.sort((a,b)=>b[0]-a[0]||a[1].p.d-b[1].p.d);
  const boxes=[];let cnt=0;
  cand.forEach(([pr,n])=>{if(cnt>46)return;const q=n.p,fs=Math.round(Math.max(11,Math.min(14,12.5*Math.sqrt(q.s))));ctx.font=(pr>=60?'600 ':'500 ')+fs+'px Onest,system-ui,sans-serif';
    const tw=ctx.measureText(n.name).width,r=(n.kid?BASE[n.type]*.55:BASE[n.type])*q.s,x=q.x+r+6,y=q.y+4,bx=[x-2,y-fs,x+tw+2,y+4];
    if(pr<90&&boxes.some(b=>!(bx[2]<b[0]||bx[0]>b[2]||bx[3]<b[1]||bx[1]>b[3])))return;
    boxes.push(bx);cnt++;ctx.globalAlpha=Math.min(1,n.alpha)*(pr===10?Math.max(.4,Math.min(1,1.5-q.d/1400)):1);
    ctx.lineWidth=3.5;ctx.strokeStyle=css['--halo'];ctx.lineJoin='round';ctx.strokeText(n.name,x,y);ctx.fillStyle=n.id===selected?css['--copper']:css['--ink'];ctx.fillText(n.name,x,y);ctx.globalAlpha=1;});}
requestAnimationFrame(draw);

/* ---------- ввод ---------- */
const ptrs=new Map();let moved=0,pinch=0;
function pick(x,y){let best=null,bd=1e9;NODES.forEach(n=>{if(!n.p||n.alpha<.4)return;const r=Math.max(9,(n.kid?BASE[n.type]*.55:BASE[n.type])*n.p.s*1.3)+4,d=Math.hypot(n.p.x-x,n.p.y-y);if(d<r&&d-r<bd){bd=d-r;best=n;}});return best;}
function rel(e){const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;pinch=0;cv.classList.add('drag');lastInput=performance.now();cam.tpitch=null;});
cv.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);
  if(!p){const [x,y]=rel(e),h=pick(x,y);hover=h?h.id:null;cv.classList.toggle('hov',!!h);return;}
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);lastInput=performance.now();
  if(ptrs.size===2){const a=[...ptrs.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinch)cam.tdist=cam.dist=Math.max(260,Math.min(1900,cam.dist*pinch/d));pinch=d;return;}
  if(moved>3){cam.yaw+=dx*.008;cam.pitch=Math.max(-1.45,Math.min(1.45,cam.pitch+dy*.008));}});
function endp(e){const had=ptrs.has(e.pointerId);ptrs.delete(e.pointerId);cv.classList.remove('drag');pinch=0;
  if(had&&e.type==='pointerup'&&moved<6&&ptrs.size===0){const [x,y]=rel(e),h=pick(x,y);if(h)select(h.id);else if(selected)select(null);}}
cv.addEventListener('pointerup',endp);cv.addEventListener('pointercancel',endp);
cv.addEventListener('pointerleave',()=>{hover=null;});
cv.addEventListener('dblclick',e=>{const [x,y]=rel(e),h=pick(x,y);if(h){const t=h.kid?byId[h.parent]:h;if(t.kids.length){toggle(t.id);select(t.id);}}});
cv.addEventListener('wheel',e=>{e.preventDefault();lastInput=performance.now();cam.tdist=Math.max(260,Math.min(1900,cam.tdist*Math.exp(e.deltaY*.0011)));},{passive:false});
cv.addEventListener('keydown',e=>{const m={ArrowLeft:[-.12,0],ArrowRight:[.12,0],ArrowUp:[0,-.1],ArrowDown:[0,.1]}[e.key];if(m){cam.yaw+=m[0];cam.pitch=Math.max(-1.45,Math.min(1.45,cam.pitch+m[1]));lastInput=performance.now();e.preventDefault();}});

/* ---------- интерфейс ---------- */
function mk(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}
const MODES=[['net','Сеть'],['sph','Сферы'],['time','Время'],['chn','Цепи']];
const mEl=$('#modes');MODES.forEach(([id,n])=>{const b=mk('button','',n);b.dataset.m=id;b.onclick=()=>setMode(id);mEl.appendChild(b);});
function setMode(m){mode=m;mEl.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.m===m)));$('#spreadRow').hidden=m!=='sph';applyTargets();
  cam.tfx=cam.tfy=cam.tfz=0;cam.tdist=m==='sph'?(spread>1.2?1300:1060):m==='time'?980:m==='chn'?900:720;cam.tpitch=m==='chn'?.55:m==='time'?.22:.35;selected=null;renderCard();syncChips();}
const tEl=$('#types');TK.forEach(t=>{const b=mk('button','chip');b.setAttribute('aria-pressed','true');b.innerHTML='<i style="background:'+TYPES[t].c+'"></i>'+TYPES[t].n+' <b>'+TCOUNT[t]+'</b>';b.onclick=()=>{typeOn[t]=!typeOn[t];b.setAttribute('aria-pressed',String(typeOn[t]));if(selected&&!typeOn[byId[selected].type])select(null);};tEl.appendChild(b);});
const cEl=$('#chains');CHAINS.forEach(c=>{const b=mk('button','chip');b.setAttribute('aria-pressed','false');b.dataset.c=c.id;b.innerHTML='<i style="background:'+c.c+'"></i>'+c.n;
  b.onclick=()=>{chainSel=chainSel===c.id?null:c.id;if(chainSel&&selected)select(null);syncChips();renderCard();};cEl.appendChild(b);});
function syncChips(){cEl.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.c===chainSel)));}
$('#spread').addEventListener('input',e=>{spread=+e.target.value;applyTargets();cam.tdist=spread>1.2?1300:1060;});
function toggle(id){const n=byId[id];n.exp=!n.exp;NODES.filter(k=>k.parent===id).forEach(k=>{if(n.exp)k.pos=n.pos.slice();});refreshAllBtn();}
function refreshAllBtn(){const all=MAIN.filter(n=>n.kids.length).every(n=>n.exp);$('#b-all').setAttribute('aria-pressed',String(all));}
$('#b-all').onclick=()=>{const all=MAIN.filter(n=>n.kids.length).every(n=>n.exp);MAIN.filter(n=>n.kids.length).forEach(n=>{if(n.exp===all)toggle(n.id);});refreshAllBtn();renderCard();};
function select(id){selected=id;if(id){const n=byId[id];chainSel=null;syncChips();cam.tfx=n.tgt[0];cam.tfy=n.tgt[1];cam.tfz=n.tgt[2];cam.tdist=Math.min(cam.tdist,620);}else{cam.tfx=cam.tfy=cam.tfz=0;}renderCard();}
function renderCard(){const c=$('#card');c.innerHTML='';const n=selected&&byId[selected];
  if(!n){
    if(chainSel){const ch=CHAINS.find(x=>x.id===chainSel);c.append(mk('div','k','Цепь'),mk('h2','',ch.n));const p=mk('div','rel');ch.l.forEach(id=>{const b=mk('button','',byId[id].name);b.onclick=()=>select(id);p.appendChild(b);});c.append(p,mk('p','note','Цепь показывает порядок смысла: от первого звена к последнему.'));return;}
    c.append(mk('div','k','Как читать'),mk('p','','Каждый узел — событие, место, символ, человек или состояние меди. Линии — связи. Шесть сфер делят город на слои, цепи рассказывают одну историю. Узлы с пунктирным кольцом раскрываются двойным кликом.'));
    const bars=mk('div','bars');TK.forEach(t=>{const d=mk('div');d.append(mk('span','',TYPES[t].n));const e=mk('em');e.style.background=TYPES[t].c;e.style.width=Math.round(TCOUNT[t]/Math.max(...Object.values(TCOUNT))*100)+'%';d.append(e,mk('span','',String(TCOUNT[t])));bars.appendChild(d);});
    const hist=mk('div','hist'),bins=[];for(let y=1810;y<2026;y+=20)bins.push(0);MAIN.forEach(x=>{if(x.year)bins[Math.min(bins.length-1,Math.floor((x.year-1810)/20))]++;});const mx=Math.max(...bins);bins.forEach(v=>{const i=mk('i');i.style.height=Math.max(5,v/mx*100)+'%';hist.appendChild(i);});
    const hl=mk('div','hl');hl.append(mk('span','','1810'),mk('span','','плотность событий'),mk('span','','2026'));
    c.append(bars,hist,hl,mk('p','note',MAIN.length+' узлов, '+E.length+' связей, '+CHAINS.length+' цепей. Положения в пространстве условные.'));return;}
  const k=mk('div','k');const dot=mk('i');dot.style.background=TYPES[n.type].c;k.append(dot,mk('span','',TYPES[n.type].n+(n.year?' · '+n.year:'')));
  c.append(k,mk('h2','',n.name),mk('p','',n.text));
  const kidsOf=n.kid?byId[n.parent]:n;
  if(kidsOf.kids.length){const b=mk('button','act',kidsOf.exp?'Свернуть':'Раскрыть ('+kidsOf.kids.length+')');b.onclick=()=>{toggle(kidsOf.id);renderCard();};c.appendChild(b);}
  const rl=ADJ[n.id].filter(i=>!byId[i].kid||true);if(rl.length){c.append(mk('div','lbl','Связи'));const r=mk('div','rel');rl.forEach(i=>{const b=mk('button','',byId[i].name);b.onclick=()=>{if(!byId[i].vis&&byId[i].kid){toggle(byId[i].parent);}select(i);};r.appendChild(b);});c.appendChild(r);}
  const ch=(chainOf[n.id]||[]).map(id=>CHAINS.find(x=>x.id===id));if(ch.length){c.append(mk('div','lbl','В цепях'));const r=mk('div','rel');ch.forEach(x=>{const b=mk('button','',x.n);b.onclick=()=>{chainSel=x.id;select(null);syncChips();renderCard();};r.appendChild(b);});c.appendChild(r);}
  if(n.src){const a=mk('a','',n.src[0]+' ↗');a.href=n.src[1];a.target='_blank';a.rel='noopener noreferrer';c.appendChild(a);}
  if(n.note)c.appendChild(mk('p','note',n.note));}
$('#b-in').onclick=()=>{cam.tdist=Math.max(260,cam.tdist*.8);};
$('#b-out').onclick=()=>{cam.tdist=Math.min(1900,cam.tdist*1.25);};
$('#b-spin').onclick=e=>{autoSpin=!autoSpin;e.currentTarget.setAttribute('aria-pressed',String(autoSpin));};
$('#b-spin').setAttribute('aria-pressed',String(autoSpin));
$('#b-reset').onclick=()=>{selected=null;chainSel=null;syncChips();cam.yaw=.6;cam.pitch=.35;cam.tfx=cam.tfy=cam.tfz=0;cam.tdist=mode==='sph'?1060:mode==='net'?720:900;renderCard();};
const yIn=$('#yr-in'),yEl=$('#yr'),tPlay=$('#t-play');
function setYear(y){yearLimit=y;yIn.value=y;yEl.textContent=y>=2026?'2026':y;if(selected&&!byId[selected].vis&&byId[selected].year>y)select(null);}
yIn.addEventListener('input',()=>{playing=false;tPlay.textContent='▶';setYear(+yIn.value);});
tPlay.onclick=()=>{playing=!playing;tPlay.textContent=playing?'❚❚':'▶';if(playing&&yearLimit>=2026)setYear(1810);};
setInterval(()=>{if(playing){if(yearLimit>=2026){playing=false;tPlay.textContent='▶';}else setYear(Math.min(2026,yearLimit+2));}},60);
window.__net={setMode,select,setYear,toggle,cam,get nodes(){return NODES;},set chain(v){chainSel=v;syncChips();renderCard();}};
setMode('net');renderCard();
})();
</script>
