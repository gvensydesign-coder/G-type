<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>Верхняя Пышма: карта и сеть</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#FBF6EE;--fg:#2A2320;--soft:#6B5E55;--line:#E6DACB;--acc:#2F9E86;--tab:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1815;--fg:#F3EBDF;--soft:#B5A89B;--line:#3a312b;--acc:#4DBFA3;--tab:#2a2320;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1815;--fg:#F3EBDF;--soft:#B5A89B;--line:#3a312b;--acc:#4DBFA3;--tab:#2a2320;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px Onest,system-ui,sans-serif;display:flex;flex-direction:column;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
:root{padding:0}
nav{display:flex;gap:6px;align-items:center;padding:8px max(16px,env(safe-area-inset-left,0px));padding-top:max(8px,env(safe-area-inset-top,0px));border-bottom:1px solid var(--line)}
nav b{font:600 13px Unbounded,Onest,sans-serif;margin-right:auto;letter-spacing:.02em}
nav button{border:1px solid var(--line);background:var(--tab);color:var(--fg);border-radius:999px;padding:7px 16px;font:inherit;cursor:pointer}
nav button[aria-selected=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
nav button:focus-visible{outline:2px solid #5B8DEF;outline-offset:2px}
main{flex:1;position:relative;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
iframe[hidden]{display:none}
@media(max-width:520px){nav b{display:none}nav{justify-content:center}}
</style>
<nav role="tablist" aria-label="Режим"><b>ВЕРХНЯЯ ПЫШМА</b>
<button role="tab" id="t-map" aria-selected="true" aria-controls="f-map">Карта</button>
<button role="tab" id="t-net" aria-selected="false" aria-controls="f-net">Сеть связей</button></nav>
<main><iframe id="f-map" title="Карта города" src="map.html"></iframe><iframe id="f-net" title="Сеть связей" src="net.html" hidden></iframe></main>
<script>
const T={map:document.getElementById('f-map'),net:document.getElementById('f-net')};
function show(t,id){for(const k in T){T[k].hidden=k!==t;document.getElementById('t-'+k).setAttribute('aria-selected',String(k===t));}
 try{history.replaceState(null,'','#'+t);}catch(e){}
 if(id){const w=T[t].contentWindow;const send=()=>w.postMessage({vp:'select',id},'*');send();setTimeout(send,400);}
 setTimeout(()=>{try{T[t].contentWindow.dispatchEvent(new Event('resize'));}catch(e){}},50);}
for(const k in T)document.getElementById('t-'+k).onclick=()=>show(k);
addEventListener('message',e=>{const d=e.data;if(d&&d.vp==='goto'&&T[d.tab])show(d.tab,d.id);});
{const h=decodeURIComponent(location.hash.slice(1));if(h==='net')show('net');else if(h&&h!=='map')show('net',h);}
</script>
</body></html>
