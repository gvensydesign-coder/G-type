.mod-m4 .vc{background:var(--paper);border-radius:var(--r-md);box-shadow:inset 0 0 0 1px var(--line);padding:var(--s2);display:grid;gap:var(--s2);min-width:0;cursor:pointer;transition:box-shadow var(--dur-fast)}
.mod-m4 .vc:hover{box-shadow:inset 0 0 0 1px var(--line-strong)}
.mod-m4 .vc.on{box-shadow:inset 0 0 0 2px var(--ink)}
.mod-m4 .vc-h{min-height:var(--h-sm);display:flex;align-items:center;gap:var(--s2);min-width:0;font-size:var(--fs-md);font-weight:var(--fw-sb)}
.mod-m4 .vc-h span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mod-m4 .vc-th{background:var(--canvas);border:0;padding:0;width:100%;border-radius:var(--r-sm);aspect-ratio:1;display:grid;place-items:center;overflow:hidden;cursor:pointer}
.mod-m4 .vc-th svg{width:84%;height:84%;fill:var(--glyph)}
.mod-m4 .vc-a{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s1);min-width:0}
.mod-m4 .vc-a .sp{min-width:0}
.mod-m4 .vc-meta{font-size:var(--fs-sm);color:var(--text-2);min-height:calc(var(--fs-sm) * 1.45);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mod-m4 .addrow{display:flex;gap:var(--s2);flex-wrap:wrap}
.mod-m4 .drawbar{display:grid;gap:var(--s3);padding:var(--s3);background:var(--paper);border-radius:var(--r-md);box-shadow:var(--sh-1)}
.mod-m4 .pv-box{background:var(--canvas);border-radius:var(--r-md);box-shadow:inset 0 0 0 1px var(--line);padding:var(--s4);min-width:0;overflow:hidden;color:var(--glyph)}
.mod-m4 .pv-box svg{display:block;width:100%;fill:var(--glyph)}
.mod-m4 .pv-box.live{font-family:'M4Live',sans-serif;font-size:48px;line-height:1.3;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--glyph);font-feature-settings:"calt" 1}
.mod-m4 .pv-box.live.nocalt{font-feature-settings:"calt" 0}
.mod-m4 .pv-ctl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s4);margin-top:var(--s3);align-items:end}
.mod-m4 .pv-l{display:grid;gap:var(--s3);margin-top:var(--s3)}
.mod-m4 .vchips{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s2);padding-top:var(--s2)}
.mod-m4 .vch{display:inline-flex;align-items:center;gap:var(--s1);min-height:var(--h-sm);padding:0 var(--s2);border-radius:var(--r-pill);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);font-size:var(--fs-sm);font-weight:var(--fw-m)}
.mod-m4 .vch b{font-weight:var(--fw-b)}
.mod-m4 .miss{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
.mod-m4 .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:var(--s2);margin:0}
.mod-m4 .stats div{background:var(--paper);border-radius:var(--r-md);padding:var(--s3);box-shadow:inset 0 0 0 1px var(--line)}
.mod-m4 .stats dt{font-size:var(--fs-sm);color:var(--text-2);margin:0}
.mod-m4 .stats dd{margin:0;font:var(--fw-b) var(--fs-xl)/1.2 var(--f-ui)}
.mod-m4 .note{background:var(--surface-2);border-radius:var(--r-md);padding:var(--s4);display:grid;gap:var(--s2);font-size:var(--fs-md);box-shadow:inset 0 0 0 1px var(--line)}
.mod-m4 .note b{font-weight:var(--fw-sb)}
.mod-m4 .note ul{margin:0;padding-left:var(--s5);display:grid;gap:var(--s1)}
.mod-m4 .exgrid>.stack{align-content:start}
.mod-m4 .exgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s4)}
.mod-m4 .fld{display:grid;gap:var(--s1);min-width:0}
.mod-m4 .fld>span{font-size:var(--fs-md);font-weight:var(--fw-m)}
@media (max-width:1100px){.mod-m4 .ed{grid-template-columns:minmax(0,1fr)}
.mod-m4 .cv{max-width:420px}}
@media (max-width:900px){.mod-m4 .cols{grid-template-columns:minmax(0,1fr)}}
@media (max-width:720px){.mod-m4 .exgrid,.mod-m4 .pv-ctl{grid-template-columns:minmax(0,1fr)}
.mod-m4 .card{padding:var(--s3)}
.mod-m4 .pv-box{padding:var(--s3)}}
.mod-m4 .is-empty .cols{display:none}
.mod-m4 .mod-empty,.mod-m4 #m4-empty{display:none}
.mod-m4 .is-empty #m4-empty{display:grid;gap:var(--s3)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<symbol id="i-up" viewBox="0 0 24 24"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v12M6 10l6 6 6-6M4 20h16"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 7v6M12 17h.01"/></symbol>
<symbol id="i-prev" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
<symbol id="i-next" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
<symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></symbol>
<symbol id="i-cam" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4zM12 17a4 4 0 100-8 4 4 0 000 8z"/></symbol>

<symbol id="i-sun" viewBox="0 0 24 24"><path d="M12 16a4 4 0 100-8 4 4 0 000 8zM12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></symbol>
</defs></svg>
<header class="proto" id="proto">
  <div class="proto-row"><span class="proto-logo" aria-hidden="true">G<i>.</i></span>
   <p class="proto-note"><b>Прототип.</b> Ничего не сохраняется.</p>
   <button type="button" class="ibtn" id="theme-btn" aria-label="Тёмная тема"></button></div>
  <nav class="seg proto-nav" id="proto-nav" aria-label="Части прототипа"><a href="#route">Весь путь</a><a href="#strokes">Рисование</a><a href="#paper">Бумага</a><a href="#variants">Варианты</a></nav>
</header>
<div class="wrap shell" id="app"></div>
<div class="wrap shell" id="bench" hidden></div>
<div id="stash" hidden>
<template id="tpl-m1"><div class="m1-app">
  <section class="card stage" aria-label="Рисование">
    <div class="gbar" id="gset" role="group" aria-label="Знак"></div>
    <div class="cvbox">
      <canvas id="s-cv" aria-label="Холст: рисуйте штрих пальцем, мышью или пером"></canvas>
      <div class="zoom"><button class="ibtn tip" id="zOut" type="button" data-tip="Меньше" aria-label="Уменьшить"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button><button class="ibtn tip" id="zFit" type="button" data-tip="Вписать" aria-label="Вписать"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button><button class="ibtn tip" id="zIn" type="button" data-tip="Больше" aria-label="Увеличить"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div>
      <div class="cvhint" id="s-hint">Рисуйте линию. Alt: без склейки.</div>
    </div>
    <div class="vh" id="stat" aria-live="polite"></div>
    <div class="sbar">
      <button class="ibtn tip" id="bUndo" type="button" data-tip="Отменить (Ctrl+Z)" aria-label="Отменить"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button class="ibtn tip" id="bRedo" type="button" data-tip="Вернуть (Ctrl+Shift+Z)" aria-label="Вернуть"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
      <button class="btn tip" id="bSplit" type="button" data-tip="Разъединить выбранный стык (J)" disabled>Разъединить</button>
      <button class="btn ghost" id="bClear" type="button">Очистить знак</button>
      <span class="grow"></span>
      <label class="tgl tip" data-tip="Показать скелет (S)"><input type="checkbox" id="tSkel" role="switch" checked><span>Скелет</span></label>
      <label class="tgl tip" data-tip="Направляющие (G)"><input type="checkbox" id="tGuides" role="switch" checked><span>Направляющие</span></label>
    </div>
  </section>
  <section class="card word" aria-label="Слово">
    <div class="wrow"><label class="tgl"><input type="checkbox" id="tConnect" role="switch" checked><span>Соединять буквы</span></label>
      <input class="inp pill" id="wIn" type="text" value="мама" aria-label="Слово для проверки" autocomplete="off" spellcheck="false">
      <button class="chip" data-word="мама" type="button">мама</button><button class="chip" data-word="лиса" type="button">лиса</button><button class="chip" data-word="hello" type="button">hello</button></div>
    <div class="wbox"><canvas id="wcv" aria-label="Слово, набранное нарисованными знаками"></canvas></div>
    <div class="gt-note" id="wstat" aria-live="polite"></div>
  </section>
  <aside class="side" aria-label="Настройки штрихов">
    <section class="pane" data-key="m1-pen" data-open="1"><button class="pane-h" type="button" aria-expanded="true"><span class="pane-t">Перо и концы</span><span class="pane-m"></span><i class="pane-chev"></i></button><div class="pane-b"><div class="ctl"><label for="r-thick"><span>Толщина</span><output id="o-thick"></output></label><input type="range" id="r-thick" min="20" max="140" step="1"></div><div class="ctl"><label for="r-smooth"><span>Сглаживание</span><output id="o-smooth"></output></label><input type="range" id="r-smooth" min="0" max="100" step="1"></div><div class="ctl"><label><span>Перо</span></label><div class="seg" id="sPen" role="group" aria-label="Форма пера"><button type="button">Круглое</button><button type="button">Широкое</button></div></div><div class="ctl"><label for="r-nib"><span>Угол пера</span><output id="o-nib"></output></label><input type="range" id="r-nib" min="0" max="90" step="1"></div><div class="ctl"><label><span>Концы штрихов</span></label><div class="seg" id="sEnd" role="group" aria-label="Концы штрихов"><button type="button" title="Круглые">Круглые</button><button type="button" title="Срез под углом пера">Срез</button><button type="button" title="Заострённые">Острые</button><button type="button" title="С засечкой">Засечка</button></div></div></div></section>
    <section class="pane" data-key="m1-join" data-open="1"><button class="pane-h" type="button" aria-expanded="true"><span class="pane-t">Склейка штрихов</span><span class="pane-m"></span><i class="pane-chev"></i></button><div class="pane-b"><label class="tgl"><input type="checkbox" id="tJoin" role="switch" checked><span>Автосклейка</span></label><div class="ctl"><label for="r-snapR"><span>Радиус склейки</span><output id="o-snapR"></output></label><input type="range" id="r-snapR" min="60" max="120" step="5"></div><div class="ctl"><label for="r-fillet"><span>Скругление стыков</span><output id="o-fillet"></output></label><input type="range" id="r-fillet" min="0" max="50" step="1"></div><p class="small">Alt при отпускании: без склейки.</p></div></section>
    <section class="pane" data-key="m1-conn" data-open="1"><button class="pane-h" type="button" aria-expanded="true"><span class="pane-t">Входы и выходы знака</span><span class="pane-m"></span><i class="pane-chev"></i></button><div class="pane-b"><div class="two"><div class="ctl"><label for="sEntry"><span>Вход</span></label><select class="sel" id="sEntry"><option value="auto">Авто</option><option value="off">Нет</option><option value="base">Внизу</option><option value="xh">Вверху</option></select></div><div class="ctl"><label for="sExit"><span>Выход</span></label><select class="sel" id="sExit"><option value="auto">Авто</option><option value="off">Нет</option><option value="base">Внизу</option><option value="xh">Вверху</option></select></div></div><p class="small" id="connInfo" hidden></p><div class="ctl"><label for="r-connExt"><span>Длина соединения</span><output id="o-connExt"></output></label><input type="range" id="r-connExt" min="0" max="160" step="1"></div><div class="ctl"><label for="r-tracking"><span>Просвет между буквами</span><output id="o-tracking"></output></label><input type="range" id="r-tracking" min="-40" max="80" step="1"></div><p class="small">Соединяются пары, где выход и вход на одной высоте.</p></div></section>
    <section class="pane" data-key="m1-exp" data-open="0"><button class="pane-h" type="button" aria-expanded="true"><span class="pane-t">Выгрузка</span><span class="pane-m"></span><i class="pane-chev"></i></button><div class="pane-b"><label class="tgl"><input type="checkbox" id="xConn" role="switch" checked><span>Соединения в SVG</span></label><div class="sbtns"><button class="btn" id="xSvg" type="button">SVG для плоттера (слово)</button><button class="btn" id="xNit" type="button">SVG скелета «Нить»</button><button class="btn" id="xJson" type="button">Сохранить знаки (JSON)</button><button class="btn" id="xTtf" type="button">Скачать шрифт целиком</button></div></div></section>
  </aside>
</div></template>
<template id="tpl-m2">
<div class="m2-app">
<nav class="seg steps" id="steps" aria-label="Шаги работы с бумагой">
  <button type="button" data-v="tpl" class="on"><span class="n">1</span>Бланк</button>
  <button type="button" data-v="photo"><span class="n">2</span>Фото</button>
  <button type="button" data-v="check"><span class="n">3</span>Проверка</button>
  <button type="button" data-v="font"><span class="n">4</span>В шрифт</button>
</nav>

<!-- 1. Бланк -->
<section class="view" id="v-tpl">
 <div class="cols">
  <div class="stack">
   <div class="card">
    <h2>Бланк для письма</h2>
    <p class="lead">Распечатайте на A4 и впишите каждую букву в ячейку.</p>
    <p class="note"><span id="t-count">66 знаков</span> · <span id="t-pages">1 страница</span></p>
    <label class="tgl" style="margin-top:var(--s4)"><input type="checkbox" id="m2-hint" checked><span>Подпись буквы в углу ячейки</span></label>
    <hr class="divider">
    <div class="btns">
      <button class="btn pri" id="dl-pdf"><svg class="ico"><use href="#i-down"/></svg>Скачать PDF</button>
      <button class="btn" id="dl-png"><svg class="ico"><use href="#i-down"/></svg>Скачать PNG</button>
    </div>
   </div>
   <div class="card">
    <h3>Как печатать и снимать</h3>
    <ul class="tips">
      <li><svg class="ico"><use href="#i-pen"/></svg><span><b>Фломастер 0,5–1 мм</b>, чёрный или тёмно-синий</span></li>
      <li><svg class="ico"><use href="#i-sun"/></svg><span><b>Ровный свет</b>, без теней</span></li>
      <li><svg class="ico"><use href="#i-cam"/></svg><span><b>Снимайте сверху</b>, четыре чёрных квадрата в кадре</span></li>
      <li><svg class="ico"><use href="#i-check"/></svg><span><b>Печать 100%</b>, без «по размеру страницы»</span></li>
    </ul>
   </div>
  </div>
  <div class="card">
    <div class="sheet-wrap"><canvas id="tpl-cv" aria-label="Предпросмотр бланка"></canvas></div>
    <div class="pager"><button class="ibtn sm" id="pg-prev" aria-label="Предыдущая страница"><svg class="ico"><use href="#i-prev"/></svg></button><span id="pg-lab">Страница 1 из 1</span><button class="ibtn sm" id="pg-next" aria-label="Следующая страница"><svg class="ico"><use href="#i-next"/></svg></button></div>
  </div>
 </div>
</section>

<!-- 2. Фото -->
<section class="view" id="v-photo" hidden>
 <div class="card">
  <div class="row sb" style="margin-bottom:var(--s3)">
    <h2 style="margin:0">Фото</h2>
    <div class="seg" id="src-seg"><button class="on" data-s="tpl">По бланку</button><button data-s="sheet">Чистый лист</button></div>
  </div>
  <div id="src-tpl" class="stack">
        <label class="drop" id="drop" tabindex="0"><svg class="ico" style="width:28px;height:28px"><use href="#i-up"/></svg><b>Выберите фото или сканы</b><span>Можно перетащить, страниц может быть несколько</span><input type="file" id="file" accept="image/*" multiple hidden></label>
    <div class="pgs" id="pgs"></div>
    <div class="two">
      <div class="ctl"><label for="sharp"><span>Чёткость</span><output id="sharp-o">50</output></label><input type="range" id="sharp" min="0" max="100" value="50"></div>
    </div>
    <div class="row sb"><span class="note" id="ph-sum">Страниц загружено: 0</span><button class="btn pri" id="to-check" disabled>Проверить буквы</button></div>
  </div>
  <div id="src-sheet" class="stack" hidden>
        <label class="drop" id="drop2" tabindex="0"><svg class="ico" style="width:28px;height:28px"><use href="#i-up"/></svg><b>Выберите фото с текстом</b><span>Буквы не должны слипаться</span><input type="file" id="file2" accept="image/*" hidden></label>
    <div class="stack" id="lines"></div>
    <div class="row sb"><span class="note" id="sh-sum">Строк найдено: 0</span><span class="btns"><button class="btn" id="sh-run" disabled>Разобрать строки</button><button class="btn pri" id="sh-next" disabled>Проверить буквы</button></span></div>
  </div>
 </div>
</section>

<!-- 3. Проверка -->
<section class="view" id="v-check" hidden>
 <div class="cols chk">
  <div class="card">
    <h2>Проверьте буквы</h2>
    <div class="prog"><span class="t" id="prog-t">готово 0 из 0</span><span class="track"><i id="prog-b"></i></span></div>
    <div class="cmpbar" id="filters">
      <button class="chip on" data-f="all">Все<span class="c" id="c-all">0</span></button>
      <button class="chip" data-f="warn">Сомнительные<span class="c" id="c-warn">0</span></button>
      <button class="chip" data-f="empty">Пусто<span class="c" id="c-empty">0</span></button>
      <button class="chip" data-f="off">Исключены<span class="c" id="c-off">0</span></button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="row sb" style="margin-top:var(--s5)"><span></span><button class="btn pri" id="to-font">Собрать шрифт</button></div>
  </div>
  <div class="card detail" id="detail">
    <h3>Буква</h3>
    <p class="note" id="d-empty">Выберите букву.</p>
    <div id="d-body" hidden>
      <canvas id="d-cv" width="320" height="320"></canvas>
      <div class="row sb"><div class="big" id="d-ch">А</div><span class="tag" id="d-st">готово</span></div>
      <div class="reason" id="d-why"></div>
      <div class="stack" style="gap:var(--s3)">
        <div class="ctl"><label for="d-thr"><span>Чёткость этой буквы</span><output id="d-thr-o">0</output></label><input type="range" id="d-thr" min="-40" max="40" value="0"></div>
        <div class="fld"><span>Это буква</span><select class="sel" id="d-re"></select></div>
        <div class="fld" id="d-alt-w" hidden><span>Источник</span><select class="sel" id="d-alt"></select></div>
        <div class="btns"><button class="btn" id="d-off">Исключить</button><button class="btn" id="d-retake">Переснять ячейку</button><input type="file" id="d-file" accept="image/*" hidden></div>
        <p class="note" id="d-info"></p>
      </div>
    </div>
  </div>
 </div>
</section>

<!-- 4. Шрифт -->
<section class="view" id="v-font" hidden>
 <div class="cols chk">
  <div class="card">
    <h2>Ваш почерк</h2>
    <div class="prev"><canvas id="pv-cv"></canvas></div>
    <div class="fld" style="margin-top:var(--s3)"><span>Ваш текст</span><textarea class="inp" id="pv-txt" rows="2">Съешь же ещё этих мягких французских булок, да выпей чаю. 0123456789</textarea></div>
  </div>
  <div class="stack">
   <div class="card">
    <h3>Настройки</h3>
    <div class="stack" style="gap:var(--s3)">
      <div class="ctl"><label for="s-smooth"><span>Сглаживание</span><output id="s-smooth-o">40</output></label><input type="range" id="s-smooth" min="0" max="100" value="40"></div>
      <div class="ctl"><label for="s-sp"><span>Автоинтервал</span><output id="s-sp-o">90</output></label><input type="range" id="s-sp" min="40" max="180" value="90"></div>
      <div class="ctl"><label for="s-size"><span>Размер</span><output id="s-size-o">64</output></label><input type="range" id="s-size" min="24" max="140" value="64"></div>
      <label class="tgl"><input type="checkbox" id="s-kern" checked><span>Кернинг ключевых пар</span></label>

/* ---------- PDF (images, no dependencies) ---------- */
async function buildPDF(canvases){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const push=b=>{if(typeof b==='string')b=enc.encode(b);parts.push(b);len+=b.length;};
  const obj=(n,body)=>{offs[n]=len;push(`${n} 0 obj\n`);push(body);push('\nendobj\n');};
  const jpgs=[];
  for(const cv of canvases){const bl=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.92));jpgs.push(new Uint8Array(await bl.arrayBuffer()));}
  const n=canvases.length;push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,`<< /Type /Pages /Count ${n} /Kids [${canvases.map((_,i)=>`${3+i*3} 0 R`).join(' ')}] >>`);
  for(let i=0;i<n;i++){
    const pg=3+i*3,ct=pg+1,im=pg+2;
    obj(pg,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.276 841.89] /Resources << /XObject << /Im0 ${im} 0 R >> >> /Contents ${ct} 0 R >>`);
    const cs=`q 595.276 0 0 841.89 0 0 cm /Im0 Do Q`;
    obj(ct,`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
    offs[im]=len;push(`${im} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${canvases[i].width} /Height ${canvases[i].height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpgs[i].length} >>\nstream\n`);push(jpgs[i]);push('\nendstream\nendobj\n');}
  const xo=len,tot=3+n*3;push(`xref\n0 ${tot}\n0000000000 65535 f \n`);
  for(let i=1;i<tot;i++)push(String(offs[i]).padStart(10,'0')+' 00000 n \n');
  push(`trailer\n<< /Size ${tot} /Root 1 0 R >>\nstartxref\n${xo}\n%%EOF`);
  const out=new Uint8Array(len);let p=0;for(const b of parts){out.set(b,p);p+=b.length;}
  return new Blob([out],{type:'application/pdf'});}

  return cv.toDataURL('image/jpeg',0.7);}

  const tx=t.getContext('2d'),id=tx.createImageData(CW,CH);for(let i=0;i<CW*CH;i++){id.data[4*i]=id.data[4*i+1]=id.data[4*i+2]=n[i];id.data[4*i+3]=255;}tx.putImageData(id,0,0);

   <div class="slotbox" id="slot-mount" data-method="${S.method}"><div class="in"><div class="gl" aria-hidden="true">${ic(M.ic)}</div><b>${what}</b><span class="mut sm">В прототипе недоступно.</span><button type="button" class="btn ink" data-act="method2" data-method="draw">Нарисовать пером</button></div></div></div>`;

function sampleText(n){
  const d=chars().filter(c=>GT.has(c)&&c!==' ');if(!d.length)return '';
  const words=['НОВОСТЬ','НОТА','ТОН','КОТ','НОС','РОТ','ОКНО','ТЕСТО','носок','тесто','нота','ворот','сено','ветер','тон','кот','нос','рот','оно','ноги','Ольга','Тоня'];
  const ok=words.filter(w=>[...w].every(c=>GT.has(c)));
  if(ok.length){const out=[];let len=0;for(const w of ok){if(len+w.length>n+2&&out.length)break;out.push(w);len+=w.length+1}return out.join(' ')}
  return d.slice(0,n).join('');
}

     <div class="cv" id="gc-line1"><span class="lab">${kind[0]+kind[0]}[${esc(ch)}]${kind[0]+kind[0]}</span>${mk(kind[0])}</div><div class="cv" id="gc-line2"><span class="lab">${kind[1]+kind[1]}[${esc(ch)}]${kind[1]+kind[1]}</span>${mk(kind[1])}</div></div></div>

function composeBlock(){

let FIX={};
function kernSample(){const base=sampleText(14);if(kernHits(base))return base;const w=GT.kern.filter(k=>GT.has(k.l)&&GT.has(k.r)).slice(0,5).map(k=>k.l+k.r);return w.length?w.join(' '):base}
function kernHits(t){const km=KM();let p=null;for(const ch of t){if(ch===' '){p=null;continue}if(p&&km.get(p+ch))return true;p=ch}return false}
function fixOver(text){const o={};[...text].forEach((ch,i)=>{if(FIX[ch])o[i]={bl:-FIX[ch],sc:metrics(ch).sc}});return o}

  const c=counts(),warns=chars().filter(ch=>stOf(ch)==='warn');

  const recs=GT.chars().map(GT.rec),nb=recs.filter(r=>r.base).length,nt=recs.filter(r=>r.twin).length;
  const sm=GTX.summary(),nAlt=sm.alts||0,nConn=sm.forms||0;

   {k:c.empty?'warn':'ok',t:'Набор знаков',d:`Нарисовано ${c.drawn} из ${c.total}${c.empty?`, пустых ${c.empty}`:''}`,btn:c.empty?['К знакам','to2']:null,id:'chk-set'},
   {k:warns.length?'bad':'ok',t:'Контуры',d:warns.length?`Замечания: ${warns.map(esc).join(', ')}`:'Замечаний нет',btn:warns.length?['Исправить','to2w']:null,id:'chk-out'},
   {k:'ok',t:'Поля и кернинг',d:kp?`Подобрано пар: ${kp}`:'Не понадобился',id:'chk-kern'},
   {k:'ok',t:'Базовая линия и высота',d:fixN?`Выровнено знаков: ${fixN}`:'Все знаки на линии',id:'chk-fix'},
   ...(nb||nt?[{k:'ok',t:'Составные и связанные',d:`Составных: ${nb}, связанных: ${nt}`,id:'chk-comp'}]:[]),
   {k:'ok',t:'Соединения и варианты',d:`Соединённых форм: ${nConn}, вариантов букв: ${nAlt}`,id:'chk-conn'}];
  const heat=chars().map(ch=>`<i data-s="${stOf(ch)}" title="${esc(ch)}"></i>`).join('');
  const smp=sampleText(14),smp2=sampleText(10);
  const smpK=kernSample();
  const kern=(raw)=>smpK?lineSVG(smpK,{kern:!raw,top:-900,bot:200,label:raw?'До: без кернинга':'После: кернинг'}):'';
  const fix=(raw)=>smp2?lineSVG(smp2,{top:-900,bot:200,over:raw?fixOver(smp2):null,label:raw?'До: как нарисовано':'После: выровнено'}):'';
  const none=`<p class="mut sm">Нарисуйте несколько знаков.</p>`;
  return `<div class="s3" id="s3"><div class="stack"><h1 class="h2" tabindex="-1" id="step-h">Проверяем</h1>
   <div class="checks" id="checks">${rows.map(r=>`<div class="chk-row" data-k="${r.k}" id="${r.id}"><span class="st">${ic(r.k==='ok'?'check':'alert','sm')}</span><div><b>${r.t}</b><div class="d">${r.d}</div></div>${r.btn?`<button type="button" class="btn sm" data-act="${r.btn[1]}">${r.btn[0]}</button>`:''}</div>`).join('')}</div>
   <div class="card stack"><h2 class="h3">Карта знаков</h2>
    <div class="heat" role="img" aria-label="Карта знаков: ${c.done} готовы, ${c.warn} с замечанием, ${c.empty} пустых">${heat}</div>
    <div class="legend"><span><i class="sw done"></i>готов</span><span><i class="sw warn"></i>замечание</span><span><i class="sw empty"></i>пусто</span></div></div>

   <div class="stack"><div class="card stack"><h2 class="h3">До и после</h2>
    <div class="stack" style="gap:var(--s2)"><h3 class="sec-h">Кернинг</h3>${!smpK?none:kernHits(smpK)?holdBlock('hv-kern',kern(false),kern(true),'После кернинга','Оригинал: без кернинга'):`<div class="cv">${kern(true)}</div><p class="mut sm" id="kern-none">Кернинг не понадобился.</p>`}</div>
    <div class="stack" style="gap:var(--s2)"><h3 class="sec-h">Базовая линия</h3>${smp2?holdBlock('hv-fix',fix(false),fix(true),'После выравнивания','Оригинал: как нарисовано'):none}</div>

}
function fontPreview(){
  const host=$('#fp');if(!host)return;
  const text=sampleText(24)||'';
  if(!GT.chars().length){host.innerHTML='<p class="mut sm">Нарисуйте несколько знаков.</p>';return}
  GT.warm(true).then(ok=>{if(!ok||!host.isConnected)return;fontPreview2(host,text)})
}
function fontPreview2(host,text){
  let r;try{r=GTX.build()}catch(e){host.innerHTML='<p class="mut sm">Просмотр недоступен, скачать можно.</p>';return}
  const name='GTprev'+(fontPreview.n=(fontPreview.n||0)+1);
  const ff=new FontFace(name,r.bytes.slice().buffer);
  ff.load().then(f=>{document.fonts.add(f);if(!host.isConnected)return;
    const box=(feat)=>`<div class="fp-line" style="font-family:'${name}',Onest,sans-serif;font-feature-settings:${feat}" lang="ru">${esc(text)}</div>`;
    host.innerHTML=holdBlock('hv-conn',box('"calt" 1'),box('"calt" 0'),'Как в шрифте','Оригинал: без подстановок');
  }).catch(()=>{host.innerHTML='<p class="mut sm">Просмотр недоступен, скачать можно.</p>'});

let own=0;                                   /* set while this file changes the store, so its own events do not re-render */
const mute=f=>{own++;try{return f()}finally{own--}};
function mountSlot(){

function enter(){const m=$('#step-body')||$('main');if(!m)return;m.classList.remove('enter');void m.offsetWidth;m.classList.add('enter')}
function go(step,focusH){

/* step 3 prepares: kerning from outlines (unless the paper module supplied its own), baseline fixes, preview font */
function prep3(){

  if(cs.length>1&&GT.st.kernSrc!=='paper'){const k=autoKern(cs);if(JSON.stringify(k)!==JSON.stringify(GT.kern))mute(()=>GT.setKern(k,'auto'))}
  if(S.autofix)applyFix(cs);
}
function applyFix(cs){
  cs.forEach(c=>{const f=GT.final(c,false);if(!f||!f.cs.length||FIX[c]!=null)return;const bb=GTO.bbox(f.cs),y=bb[1];
    if(Math.abs(y)>14&&Math.abs(y)<60){FIX[c]=-Math.round(y);const m=GT.metricsOf(c);mute(()=>GT.setMetrics(c,{bl:m.bl+FIX[c]}))}});
}
function mountM4(){const h=$('#m4-host');if(h)GT.mount('m4',h)}
function patchProgress(){
  const c=counts(),pct=c.total?Math.round(c.drawn/c.total*100):0;

  set('#cs-prog-text',`Нарисовано ${c.drawn} из ${c.total}`);set('#cs-pct',pct+'%');
  const lg=$('#cs-legend');if(lg)lg.innerHTML=`<span><i class="sw done"></i>готов ${c.done}</span><span><i class="sw warn"></i>есть замечание ${c.warn}</span><span><i class="sw empty"></i>пусто ${c.empty}</span>`;
  const pb=$('#cs .mini');if(pb){pb.setAttribute('aria-valuenow',c.drawn);pb.setAttribute('aria-valuemax',c.total);pb.firstElementChild.style.width=pct+'%'}

/* cheap update of the grid after the store changed (no re-render of the slot) */

function refresh2(keepFocus){ /* re-render the parts of step 2 that depend on the glyph set; the slot stays */

function selectGlyph(ch,focus){

  $$('#cs .gc').forEach(b=>{const on=b.dataset.ch===ch;b.setAttribute('aria-pressed',on);b.tabIndex=on?0:-1});

function nextEmpty(){
  const o=order(),emp=o.filter(c=>stOf(c)==='empty');if(!emp.length)return null;
  const pos=o.indexOf(GT.cur);const after=emp.find(c=>o.indexOf(c)>pos);return after||emp[0];

function applyMetric(ch,k,v){
  mute(()=>{GT.setMetrics(ch,{[k]:v});const r=GT.rec(ch);const tw=r&&r.twin?r.twin:(TW[ch]&&GT.rec(TW[ch])&&GT.rec(TW[ch]).twin===ch?TW[ch]:null);if(tw)GT.setMetrics(tw,{[k]:v})});

function updateGlyphLive(ch){
  const m=metrics(ch);
  const pairs=[['g-lsb',Math.round(m.lsb),''],['g-rsb',Math.round(m.rsb),''],['g-sc',m.sc,'%']];
  pairs.forEach(([id,v,u])=>{const r=$('#'+id),n=$('#'+id+'-n'),o=$('#'+id+'-o');if(!r)return;const lo=+r.min,hi=+r.max;v=Math.max(lo,Math.min(hi,v));r.value=v;if(n&&document.activeElement!==n)n.value=v;o.textContent=v+u;
    r.style.setProperty('--p',((v-lo)/(hi-lo)*100)+'%');o.classList.toggle('clamp',v<=lo||v>=hi)});
  const bo=$('#g-bl-o');if(bo)bo.textContent=(m.bl>0?'+':'')+m.bl;

  const mk=a=>lineSVG(a+a+ch+a+a,{hl:ch,hlAt:2,label:`Предпросмотр: ${a+a}${ch}${a+a}`,top:-900,bot:200});

/* hold-to-compare */
const inMod=e=>e.target.closest&&e.target.closest('.mod');
function holdOn(btn,on){const f=btn.closest('.hv');if(!f)return;f.dataset.hold=on?'1':'0';btn.setAttribute('aria-pressed',on?'true':'false')}
const hb=e=>{const b=e.target.closest&&e.target.closest('.hv-btn');return b&&root.contains(b)?b:null};
document.addEventListener('pointerdown',e=>{const b=hb(e);if(!b)return;e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(x){}holdOn(b,true)});
['pointerup','pointercancel','lostpointercapture'].forEach(t=>document.addEventListener(t,e=>{const b=hb(e);if(b)holdOn(b,false)}));
document.addEventListener('keydown',e=>{const b=hb(e);if(b&&(e.key===' '||e.key==='Enter')){e.preventDefault();if(!e.repeat)holdOn(b,true)}});
document.addEventListener('keyup',e=>{const b=hb(e);if(b&&(e.key===' '||e.key==='Enter'))holdOn(b,false)});
document.addEventListener('focusout',e=>{const b=hb(e);if(b)holdOn(b,false)});
document.addEventListener('contextmenu',e=>{if(hb(e))e.preventDefault()});

/* clicks: one delegated handler for the shell views and the bench bar; module events are ignored */
function onClick(e){
  if(inMod(e))return;
  const t=e.target.closest('[data-act],[data-step],.pane-h');if(!t||!(root.contains(t)||bench.contains(t)))return;
  if(t.classList.contains('pane-h')){
    const p=t.parentElement,open=t.getAttribute('aria-expanded')!=='true',acc=t.closest('#acc');
    if(acc&&open)$$('.pane-h',acc).forEach(h=>{if(h!==t){h.setAttribute('aria-expanded','false');h.nextElementSibling.hidden=true;paneOpen[h.parentElement.dataset.key]=false}});
    t.setAttribute('aria-expanded',open);t.nextElementSibling.hidden=!open;paneOpen[p.dataset.key]=open;if(acc&&open){S.next=p.dataset.key.replace('nx-','');save()}
    if(p.dataset.key==='m4pane'){open?mountM4():GT.unmount('m4')}
    return;
  }
  if(t.dataset.step){go(+t.dataset.step);return}
  const a=t.dataset.act;
  switch(a){
   case 'start':S.method=t.dataset.method;S.step=1;S.view='flow';S.max=Math.max(S.max,1);save();render();enter();$('#step-h').focus({preventScroll:true});window.scrollTo(0,0);break;
   case 'resume':S.view='flow';save();render();enter();$('#step-h')&&$('#step-h').focus({preventScroll:true});window.scrollTo(0,0);break;
   case 'reset':{if(t.dataset.arm!=='1'){t.dataset.arm='1';t.textContent='Удалить буквы?';t.classList.add('danger');t.classList.remove('ghost');setTimeout(()=>{if(t.isConnected){t.dataset.arm='0';t.textContent='Начать заново';t.classList.remove('danger');t.classList.add('ghost')}},4000)}else{FIX={};GT.clear();S.step=1;S.max=1;S.view='home';save();render()}break}
   case 'home':S.view='home';save();render();enter();window.scrollTo(0,0);break;
   case 'back':if(S.step>1)go(S.step-1);else{S.view='home';save();render()}break;
   case 'next':{const n=S.step+1;S.max=Math.max(S.max,n);save();go(n);break}
   case 'method':S.method=t.dataset.method;save();render(`#s1 [data-method=${S.method}]`);break;
   case 'method2':{S.method=t.dataset.method;save();GT.unmountAll();$('.a-slot').innerHTML=slotHTML();$('.s2').className='s2 m-'+S.method;mountSlot();const h=$('.a-hint');const nh=hint(S.method);const old=$('.hint',h);if(old)old.remove();if(nh)h.insertAdjacentHTML('beforeend',nh);const b=$(`[data-act=method2][data-method="${S.method}"]`);b&&b.focus({preventScroll:true});break}
   case 'preset':{S.preset=t.dataset.preset;if(S.preset==='custom'&&!S.groups.length)S.groups=['ruU','ruL'];afterSet(`[data-preset="${S.preset}"]`);break}
   case 'grp':{const k=t.dataset.grp;S.groups=S.groups.includes(k)?S.groups.filter(x=>x!==k):[...S.groups,k];if(!S.groups.length)S.groups=[k];afterSet(`[data-grp="${k}"]`);break}
   case 'hint-x':S.hints[t.dataset.id]=true;save();{const h=t.closest('.hint');h.remove();if(!$('.hints-off')){const p=document.createElement('p');p.className='hints-off';p.style.marginTop='var(--s4)';p.innerHTML=`<button type="button" class="linkbtn" data-act="hints-reset">Показать подсказки снова</button> `;$('#bar').after(p)}else $('.hints-off').innerHTML=`<button type="button" class="linkbtn" data-act="hints-reset">Показать подсказки</button>`;const nxt=$('#btn-next');nxt&&nxt.focus({preventScroll:true})}break;
   case 'hints-reset':S.hints={};save();render();break;
   case 'sel':selectGlyph(t.dataset.ch,false);break;
   case 'nextempty':{const n=nextEmpty();if(n){selectGlyph(n,false);const b=$(`#cs .gc[data-ch="${CSS.escape(n)}"]`);b&&b.scrollIntoView({block:'nearest'});const nb=$('#btn-nextempty');nb&&nb.focus({preventScroll:true})}break}
   case 'gprev':case 'gnext':{const cs=chars(),i=cs.indexOf(GT.cur);const n=cs[(i+(a==='gnext'?1:-1)+cs.length)%cs.length];selectGlyph(n,false);break}
   case 'bl':{const ch=GT.cur;if(stOf(ch)==='empty')break;const v=Math.max(-100,Math.min(100,metrics(ch).bl+(+t.dataset.d)));applyMetric(ch,'bl',v);updateGlyphLive(ch);break}
   case 'greset':{const ch=GT.cur;mute(()=>{GT.resetMetrics(ch);const r=GT.rec(ch);if(r&&r.twin)GT.resetMetrics(r.twin)});delete FIX[ch];updateGlyphLive(ch);break}
   case 'link-tgl':{const ch=GT.cur,tw=TW[ch];const [c,l]=isCyr(ch)?[ch,tw]:[tw,ch];mute(()=>linkPair(c,l,t.checked));refresh2(true);break}
   case 'link':{const c=t.dataset.pair,l=TW[c];mute(()=>linkPair(c,l,!isLinked(l)));refresh2(true);break}
   case 'link-all':{mute(()=>TWINS.forEach(([c,l])=>{if(chars().includes(l)&&stOf(c)!=='empty'&&!isLinked(l))linkPair(c,l,true)}));refresh2(false);break}
   case 'compose':mute(()=>composeGlyph(t.dataset.ch));selectGlyph(t.dataset.ch,false);refresh2(false);break;
   case 'compose-all':mute(()=>Object.keys(COMPOSE).forEach(c=>{if(chars().includes(c)&&stOf(c)==='empty'&&stOf(COMPOSE[c][0])!=='empty')composeGlyph(c)}));refresh2(false);break;
   case 'uncomp':{const ch=GT.cur,f=GT.final(ch,false);mute(()=>{if(f)GT.put(ch,{src:'copy',adv:f.adv,cs:GTO.clone(f.cs)})});refresh2(false);break}
   case 'to2':go(2);break;

   case 'peek':peek=true;render();break;

  }
}
async function dl(){

document.addEventListener('click',onClick);
root.addEventListener('change',e=>{

  if(mm){if(t.value==='')return;const lo=+t.min,hi=+t.max;const v=Math.max(lo,Math.min(hi,Math.round(+t.value)));const ch=GT.cur;if(!ch||stOf(ch)==='empty')return;applyMetric(ch,mm[1],v);updateGlyphLive(ch);scheduleLive()}

/* roving focus in the glyph grid */
root.addEventListener('keydown',e=>{
  if(inMod(e))return;
  const b=e.target.closest&&e.target.closest('#cs .gc');if(!b)return;
  const keys={ArrowRight:1,ArrowLeft:-1,ArrowDown:'d',ArrowUp:'u',Home:'h',End:'e'};if(!(e.key in keys))return;
  const all=$$('#cs .gc'),i=all.indexOf(b);let n=i;
  if(e.key==='ArrowRight')n=i+1;else if(e.key==='ArrowLeft')n=i-1;else if(e.key==='Home')n=0;else if(e.key==='End')n=all.length-1;
  else{const r=b.getBoundingClientRect();const dir=e.key==='ArrowDown'?1:-1;let best=null;all.forEach((o,j)=>{const q=o.getBoundingClientRect();const dy=(q.top-r.top)*dir;if(dy>4&&(best===null||dy<best.dy-2||(Math.abs(dy-best.dy)<=2&&Math.abs(q.left-r.left)<Math.abs(all[best.j].getBoundingClientRect().left-r.left))))best={dy,j}});if(best)n=best.j}
  n=Math.max(0,Math.min(all.length-1,n));if(n===i)return;e.preventDefault();$$('#cs .gc').forEach(o=>o.tabIndex=-1);all[n].tabIndex=0;all[n].focus();

/* the store changed from a module: refresh the shell parts that show it (debounced, never the slot) */
let liveT=0;
function scheduleLive(){clearTimeout(liveT);liveT=setTimeout(live,160)}

  const gc=$('#gcard');if(gc&&!gc.contains(document.activeElement)){const ch=GT.cur;if(ch){const m=GT.rec(ch)?1:0;if(gc.dataset.ch!==ch||gc.dataset.has!==String(m)){$('.a-gcard').innerHTML=glyphCard();const g=$('#gcard');if(g)g.dataset.has=String(m)}else updateGlyphLive(ch)}}
  const cp=$('.a-compose'),lk=$('.a-links');if(cp&&!cp.contains(document.activeElement))cp.innerHTML=composeBlock();if(lk&&!lk.contains(document.activeElement))lk.innerHTML=linksBlock();
}
GT.charsFn=chars;
GT.on((type,d)=>{
  if(own&&type!=='cur')return;
  if(type==='cur'){if(own)return;if(S.view==='flow'&&S.step===2&&root.isConnected){const ch=GT.cur;$$('#cs .gc').forEach(b=>{const on=b.dataset.ch===ch;b.setAttribute('aria-pressed',on);b.tabIndex=on?0:-1});const g=$('.a-gcard');if(g&&!g.contains(document.activeElement))g.innerHTML=glyphCard()}return}
